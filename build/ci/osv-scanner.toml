#
# OSV-Scanner's configuration for the manifests in this directory, requirements.txt
# and cli-packages-requirements.txt: OSV-Scanner reads the osv-scanner.toml in the
# directory of each file it scans. It is read where OpenSSF Scorecard's
# Vulnerabilities check scans a checkout of the tree: scorecard.dev's runs and
# .github/workflows/scorecard.yml's over the copy on GitHub, and a run with --local.
# GitLab's scorecard job (.gitlab/ci/scorecard.yml) does not read it: Scorecard's
# GitLab client gives that check no local path (clients/gitlabrepo/client.go, whose
# LocalPath returns ""), so there OSV-Scanner is asked about the commit alone and
# reads no manifest. No job of the project's reads it: the dependency-scan job and the
# merge requests' dependency check (build/ci/dependency-scan.py,
# build/ci/mr-dependency-check.py) take their dismissals from the VEX document.
#
# The project's record of each decision is its statement in the OpenVEX document,
# .gitlab/hmailserver.openvex.json (SECURITY.md, "Declaring a finding not
# exploitable"); an entry here only carries that decision to OSV-Scanner, which
# Scorecard runs with no VEX document. Every entry names, by its id or an alias, an advisory that has a
# not_affected statement there, a package version that statement covers is pinned by
# a manifest in this directory, and its ignoreUntil is still to come:
# build/check-osv-ignores.py, which the checkers job runs, fails the tree otherwise.
# When the package moves past the affected version, the entry goes, and so does the
# statement once nothing pins that version.

[[IgnoredVulns]]
# CVE-2026-59951: mcp 1.29.0's Streamable HTTP server keeps every session's state.
# Its statement was read on 19 October 2026, and this entry made on 20 October, each by
# an AI agent and read again by others trying to refute it, under the owner's delegation
# and not line by line by the owner, who delegated the reading (SECURITY.md, "Who
# reviews").
id = "GHSA-84m7-p3x7-pcfv"
ignoreUntil = 2027-01-20
reason = "mcp 1.29.0 is installed only into the semgrep CI job's own virtual environment, as a dependency of semgrep 1.181.0, which pins it, and the job never starts Semgrep's MCP server (the not_affected statement in .gitlab/hmailserver.openvex.json); the entry goes when a semgrep release allows mcp 1.30.0 or later."

[[IgnoredVulns]]
# CVE-2026-114603: opentelemetry-api 1.37.0's TraceState.from_header takes time quadratic in a tracestate's length.
# The entry and its statement were read on 23 October 2026 by an AI agent and read and
# measured again by a second trying to refute them, under the owner's delegation and not
# line by line by the owner, who delegated the reading (SECURITY.md, "Who reviews").
id = "GHSA-xcq7-p3pf-p88h"
ignoreUntil = 2027-01-23
reason = "opentelemetry-api 1.37.0 is installed only into the semgrep CI job's own virtual environment, as a dependency of semgrep 1.181.0, which requires opentelemetry-api~=1.37.0, and the job never parses a tracestate header: TraceState.from_header runs only when the trace-context propagator is given a carrier that holds one, and Semgrep's one such call, made only under --trace, which the job does not pass, gives it a traceparent alone (the not_affected statement in .gitlab/hmailserver.openvex.json); the entry goes when a semgrep release allows opentelemetry-api 1.45.1 or later."
