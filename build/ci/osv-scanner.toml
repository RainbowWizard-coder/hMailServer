#
# OSV-Scanner's configuration for the manifests in this directory, requirements.txt
# and cli-packages-requirements.txt: OSV-Scanner reads the osv-scanner.toml in the
# directory of each file it scans. It is read by OSV-Scanner as OpenSSF Scorecard's
# Vulnerabilities check runs it - over the copy on GitHub, in scorecard.dev's runs and
# .github/workflows/scorecard.yml's, and over the GitLab project in the scorecard job
# (.gitlab/ci/scorecard.yml). No other job reads it: the dependency-scan job and the
# merge requests' dependency check (build/ci/dependency-scan.py,
# build/ci/mr-dependency-check.py) take their dismissals from the VEX document.
#
# The project's record of each decision is its statement in the OpenVEX document,
# .gitlab/hmailserver.openvex.json (SECURITY.md, "Declaring a finding not
# exploitable"); an entry here only carries that decision to OSV-Scanner, which
# Scorecard runs with no VEX document. Every entry names, by its id or an alias, an advisory that has a
# not_affected statement there, a package version that statement covers is pinned by
# a manifest in this directory, and its ignoreUntil is still to come:
# build/check-osv-ignores.py, which the checkers job runs, fails the tree otherwise.
# When the package moves past the affected version, the entry goes, and so does the
# statement once nothing pins that version.

[[IgnoredVulns]]
# CVE-2026-59951: mcp 1.29.0's Streamable HTTP server keeps every session's state.
id = "GHSA-84m7-p3x7-pcfv"
ignoreUntil = 2027-01-20
reason = "mcp 1.29.0 is installed only into the semgrep CI job's own virtual environment, as a dependency of semgrep 1.181.0, which pins it, and the job never starts Semgrep's MCP server (the not_affected statement in .gitlab/hmailserver.openvex.json); the entry goes when a semgrep release allows mcp 1.30.0 or later."
