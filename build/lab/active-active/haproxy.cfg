#
# The active-active lab's balancer (aa-lab.sh balancer): TCP, round robin, the
# client's address passed to all three listeners with the PROXY protocol, version 2.
# Until unit AA-23 of the build plan only the SMTP listener read the header
# (TCPServer.cpp called SetProxyProtocolExpected for STSMTP alone), and behind this
# balancer every IMAP and POP3 client had the balancer's address; the nodes now trust
# the front network for IMAP and POP3 as well (node.sh). With AA_PROXY_MAIL=0, for a
# tree before AA-23, aa-lab.sh leaves send-proxy-v2 off the IMAP and POP3 lines. The
# health check is a plain TCP connect, which closes before a header is due; the
# design's /readyz needs the metrics listener, which the lab's nodes do not open.
# aa-lab.sh writes the node lines below from the nodes it started.

global
    log stdout format raw local0 info
    maxconn 4096

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 10m
    timeout server 10m

frontend smtp
    bind :25
    default_backend smtp_nodes

frontend imap
    bind :143
    default_backend imap_nodes

frontend pop3
    bind :110
    default_backend pop3_nodes

backend smtp_nodes
    balance roundrobin
    # NODES smtp 2525 send-proxy-v2 check

backend imap_nodes
    balance roundrobin
    # NODES imap 1143 send-proxy-v2 check

backend pop3_nodes
    balance roundrobin
    # NODES pop3 1110 send-proxy-v2 check
