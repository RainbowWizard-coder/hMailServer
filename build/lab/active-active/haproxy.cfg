#
# The active-active lab's balancer (aa-lab.sh balancer): TCP, round robin, the
# client's address passed to SMTP with the PROXY protocol, version 2. IMAP and POP3
# are passed without it, because on 74aed9ab8 only the SMTP listener reads the header
# (TCPServer.cpp: SetProxyProtocolExpected is called for STSMTP alone) - so behind
# this balancer every IMAP and POP3 client has the balancer's address, which is what
# unit AA-23 of the build plan changes (ActiveActive.md, "The order of the work"). The health check is a plain TCP connect; the
# design's /readyz needs the metrics listener, which the lab's nodes do not open.
# aa-lab.sh writes the node lines below from the nodes it started.

global
    log stdout format raw local0 info
    maxconn 4096

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 10m
    timeout server 10m

frontend smtp
    bind :25
    default_backend smtp_nodes

frontend imap
    bind :143
    default_backend imap_nodes

frontend pop3
    bind :110
    default_backend pop3_nodes

backend smtp_nodes
    balance roundrobin
    # NODES smtp 2525 send-proxy-v2 check

backend imap_nodes
    balance roundrobin
    # NODES imap 1143 check

backend pop3_nodes
    balance roundrobin
    # NODES pop3 1110 check
