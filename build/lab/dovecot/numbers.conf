# Dovecot as the published numbers measure it (build/lab/docker-compose.yml,
# service numbers-dovecot; hmailserver/docs/PublishedNumbers.md). Added to the
# dovecot/dovecot image's own configuration, which takes any user name with the
# one password in USER_PASSWORD and keeps mail under /srv/vmail/<user>.
# lab.sh numbers records `doveconf -n` beside every result, so what Dovecot ran
# with is on the record whatever this file says.

# Postfix delivers numbers.test here over plain LMTP (the image has LMTP over TLS
# only, on 31024), as it does for the peers.
service lmtp {
  inet_listener lmtp {
    port = 31025
  }
}

# The generator logs in over plain IMAP on the lab network, as it does to the
# served hMailServer's plain port. Never in production.
auth_allow_cleartext = yes

# One message a file, in Maildir: the format nearest to hMailServer's store, which
# keeps each message as its own .eml file (with its index in the database, where
# Dovecot keeps dovecot.index files beside the Maildir).
mail_driver = maildir
mail_path = ~/Maildir

# Durability: Dovecot's default, stated rather than assumed. "optimized" fsyncs
# a message's file when it is saved and its index when it is committed, and not
# for every change of a flag; the fair counterpart of hMailServer with
# MessageStoreFsync=1 and a database that flushes its log at every commit.
mail_fsync = optimized

# Enough processes and connections for the most sessions a run opens. Dovecot's
# defaults (100 processes a service, 10 connections a user from one address)
# would end a run at the configuration, not at the server; hMailServer's IMAP has
# no connection cap by default (MaxIMAPConnections 0).
default_process_limit = 5000
default_client_limit = 10000
protocol imap {
  mail_max_userip_connections = 10000
}
