# The test lab's additions to the dovecot/dovecot image's own configuration
# (build/lab/docker-compose.yml, service dovecot). The image already takes any
# user name with the one password in USER_PASSWORD and keeps mail under
# /srv/vmail/<user>; this adds what a peer in a lab needs.

# Postfix delivers peer.test here. The image has LMTP over TLS only (31024), and
# runs as vmail, so nothing below 1024.
service lmtp {
  inet_listener lmtp {
    port = 31025
  }
}

# The lab's clients - the bench container's curl, mbsync and the hMailServer under
# test itself - log in over plain IMAP on a private network. Never in production.
auth_allow_cleartext = yes
