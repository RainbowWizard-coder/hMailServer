/* ---------- Reports ----------
   What happened on this server, per domain and per day. One request draws the
   whole page - GET /api/v1/reports/summary - because seven requests for seven
   tables of the same window is seven chances for them to disagree about what
   the window was.

   Every table is drawn from the server's own columns and rows rather than from
   a shape written here: the route answers a list of column names and a list of
   row objects, so a section that gains a column gains it in this page without
   an edit. The headings are looked up in REPORT_COLUMNS and shown in the
   server's own word when the table has no translation for one, which is the
   same rule the rest of this page follows for a value it did not write.

   The notes are the server's sentences, shown as they come. They are the part
   of a report that keeps it honest - "the message trace is switched off, so
   this section is empty" is not the same statement as an empty table, and a
   page that quietly drew the empty table would be lying by omission.

   The CSV is a link and not a button: it is the same route with format=csv, a
   same-origin navigation that carries the session cookie, so the file an
   administrator opens in a spreadsheet is written by the server from the very
   rows this page drew rather than by this page from what it happens to hold. */
const REPORT_SECTIONS=[
  {id:"traffic",title:K("Traffic"),chart:true},
  {id:"failures",title:K("Delivery failures")},
  {id:"senders",title:K("Top senders")},
  {id:"recipients",title:K("Top recipients")},
  {id:"mailboxes",title:K("Largest mailboxes")},
  {id:"quota",title:K("Near their quota")},
  {id:"volume",title:K("Volume")},
  {id:"storage",title:K("Storage"),chart:true},
  {id:"countries",title:K("Country refusals")}
];
const REPORT_COLUMNS={day:K("Day"),domain:K("Domain"),incoming:K("Incoming"),outgoing:K("Outgoing"),
  failed_incoming:K("Failed incoming"),failed_outgoing:K("Failed outgoing"),status:K("Status"),reason:K("Reason"),
  total:K("Total"),sender:K("Sender"),recipient:K("Recipient"),messages:K("Messages"),failed:K("Failed"),
  address:K("Address"),bytes:K("Bytes"),megabytes:K("Megabytes"),processed:K("Processed"),delivered:K("Delivered"),
  deferred:K("Deferred"),bounced:K("Bounced"),spam:K("Spam"),viruses:K("Viruses"),mailboxes:K("Mailboxes"),
  refused:K("Refused"),country:K("Country"),quota_megabytes:K("Quota (MB)"),percent:K("Percent used"),
  warns_at:K("Warns at (%)"),sending_stops_at:K("Sending stops at (%)"),state:K("State")};
let report={from:"",to:"",domain:"",top:10};
function reportQuery(extra){
  const parts=[];
  if(report.from)parts.push("from="+encodeURIComponent(report.from));
  if(report.to)parts.push("to="+encodeURIComponent(report.to));
  if(report.domain)parts.push("domain="+encodeURIComponent(report.domain));
  parts.push("top="+encodeURIComponent(report.top));
  if(extra)parts.push(extra);
  return parts.join("&");
}
/* A day string moved by whole days, in UTC, so that a browser in a zone with
   a daylight-saving change cannot turn "seven days back" into six or eight. */
function reportShiftDay(day,by){
  const parts=String(day||"").split("-");
  if(parts.length!==3)return day;
  const at=Date.UTC(Number(parts[0]),Number(parts[1])-1,Number(parts[2]));
  const moved=new Date(at+by*86400000);
  const pad=n=>(n<10?"0":"")+n;
  return moved.getUTCFullYear()+"-"+pad(moved.getUTCMonth()+1)+"-"+pad(moved.getUTCDate());
}
function reportColumnName(key){
  return REPORT_COLUMNS[key]?t(REPORT_COLUMNS[key]):key;
}
/* Grouped bars, drawn as SVG in the page itself: no library, nothing fetched,
   and a value under the pointer. A chart is here because a month of daily
   counts is the one thing in this report that a table genuinely does not
   show - the shape of it - and not because a chart is decorative. */
function reportChartHtml(labels,series){
  if(!labels.length)return "";
  const W=880,H=190,L=54,R=10,T=12,B=30;
  let max=0;
  series.forEach(s=>s.values.forEach(v=>{if(v>max)max=v;}));
  if(max<=0)max=1;
  const plotW=W-L-R,plotH=H-T-B;
  const group=plotW/labels.length,bw=Math.max(1.5,(group-4)/series.length);
  let bars="";
  labels.forEach((label,i)=>{
    series.forEach((s,j)=>{
      const value=Number(s.values[i])||0;
      const h=Math.max(value>0?1:0,Math.round(value/max*plotH));
      const x=L+i*group+2+j*bw,y=T+plotH-h;
      bars+='<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+bw.toFixed(1)+'" height="'+h+'" fill="'+s.colour+'">'+
            '<title>'+escHtml(label+" "+t(s.label)+": "+value)+'</title></rect>';
    });
  });
  let ticks="";
  [0,Math.round(labels.length/2)-1,labels.length-1].forEach(i=>{
    if(i<0||i>=labels.length)return;
    ticks+='<text x="'+(L+i*group+group/2).toFixed(1)+'" y="'+(H-10)+'" font-size="10" fill="#8b949e" text-anchor="middle">'+escHtml(labels[i])+'</text>';
  });
  const legend=series.map(s=>'<span class="muted" style="margin-right:14px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+s.colour+';margin-right:6px"></span>'+escHtml(t(s.label))+'</span>').join("");
  return '<div class="tablewrap"><svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" aria-label="'+escHtml(t("Messages per day"))+'">'+
    '<line x1="'+L+'" y1="'+(T+plotH)+'" x2="'+(W-R)+'" y2="'+(T+plotH)+'" stroke="#8b949e" stroke-width="0.5"></line>'+
    '<text x="'+(L-8)+'" y="'+(T+8)+'" font-size="10" fill="#8b949e" text-anchor="end">'+escHtml(String(max))+'</text>'+
    '<text x="'+(L-8)+'" y="'+(T+plotH)+'" font-size="10" fill="#8b949e" text-anchor="end">0</text>'+
    bars+ticks+'</svg></div><div class="row" style="margin-top:8px">'+legend+'</div>';
}
function reportSectionChart(id,answer){
  const rows=answer.rows||[];
  if(!rows.length)return "";
  if(id==="traffic"){
    /* One bar per day, so a domain picked apart across several rows of the same
       day is added up first - the chart is of the window, not of the rows. */
    const byDay={},order=[];
    rows.forEach(r=>{
      if(!byDay[r.day]){byDay[r.day]={i:0,o:0};order.push(r.day);}
      byDay[r.day].i+=Number(r.incoming)||0;
      byDay[r.day].o+=Number(r.outgoing)||0;
    });
    return reportChartHtml(order,[
      {label:K("Incoming"),colour:"#36c2ff",values:order.map(d=>byDay[d].i)},
      {label:K("Outgoing"),colour:"#7c5cff",values:order.map(d=>byDay[d].o)}
    ]);
  }
  return reportChartHtml(rows.map(r=>r.day),[
    {label:K("Megabytes"),colour:"#3fb950",values:rows.map(r=>Number(r.megabytes)||0)}
  ]);
}
function reportSectionHtml(section,answer){
  if(!answer)return "";
  const columns=answer.columns||[],rows=answer.rows||[];
  const head=columns.map(c=>"<th>"+escHtml(reportColumnName(c))+"</th>").join("");
  const body=rows.map(r=>"<tr>"+columns.map(c=>"<td>"+escHtml(r[c]===undefined||r[c]===null?"—":r[c])+"</td>").join("")+"</tr>").join("");
  const badge=answer.enabled?"":'<span class="badge warn">'+t("Not recorded")+"</span>";
  const truncated=answer.truncated?'<span class="badge warn">'+t("Partial")+"</span>":"";
  const csv="/api/v1/reports/"+encodeURIComponent(section.id)+"?"+reportQuery("format=csv");
  return '<div class="sect"><h2>'+escHtml(t(section.title))+' <code class="muted">GET /api/v1/reports/'+escHtml(section.id)+"</code> "+badge+truncated+
    '<span class="sp"></span><a class="btn ghost sm" id="csv_'+escHtml(section.id)+'" href="'+escHtml(csv)+'" download>'+t("CSV")+"</a></h2>"+
    '<div class="card flat"><p class="note">'+escHtml(answer.note||"")+"</p>"+
    (section.chart?reportSectionChart(section.id,answer):"")+
    '<div class="tablewrap"><table><thead><tr>'+head+"</tr></thead><tbody>"+
    (body||'<tr><td colspan="'+Math.max(1,columns.length)+'" class="empty">'+t("Nothing in this range.")+"</td></tr>")+
    "</tbody></table></div>"+reportByCountryHtml(answer)+"</div></div>";
}
/* The countries section carries a second table the others do not: the refusals
   split by country. It is drawn separately because it is a different period -
   the counters as they stand since the server started, not the window above -
   and the section's own note from the server says so. */
function reportByCountryHtml(answer){
  const rows=answer.by_country||[];

  const answer=await api("/api/v1/reports/summary?"+reportQuery());
  const sections=answer.sections||{};
  const omitted=(answer.omitted||[]).map(o=>"<li>"+escHtml(o.section+" — "+o.reason)+"</li>").join("");

      "<label>"+t("Rows")+' <input id="repTop" type="number" min="1" max="200" value="'+escHtml(String(report.top))+'"></label>'+
      '<button class="btn" data-act="repshow">'+t("Show")+"</button>"+
      '<button class="btn ghost sm" data-act="repdays" data-days="7">'+t("Last 7 days")+"</button>"+
      '<button class="btn ghost sm" data-act="repdays" data-days="30">'+t("Last 30 days")+"</button>"+
      '<button class="btn ghost sm" data-act="repdays" data-days="90">'+t("Last 90 days")+"</button>"+
      '<div class="err" id="err_reports"></div></div></div>'+
    '<div class="sect"><h2>'+t("What this server keeps")+' <code class="muted">GET /api/v1/reports</code></h2>'+

      t("Retention")+"</th><th>"+t("Oldest")+"</th></tr></thead><tbody>"+

      "</tbody></table></div>"+
      '<p class="note" style="margin-top:14px"><b>'+t("What cannot be answered")+"</b></p><ul class=\"note\">"+notAnswerable+omitted+"</ul></div></div>"+
    REPORT_SECTIONS.map(s=>reportSectionHtml(s,sections[s.id])).join("")+
    "</div>";
}
function reportShow(){
  const from=document.getElementById("repFrom"),to=document.getElementById("repTo");
  const domain=document.getElementById("repDomain"),top=document.getElementById("repTop");
  if(from)report.from=from.value;
  if(to)report.to=to.value;
  if(domain)report.domain=domain.value;
  if(top){const n=Number(top.value);report.top=n>=1&&n<=200?Math.round(n):10;}
  render();
}
function reportLastDays(days){
  report.to=report.to||"";
  report.from=reportShiftDay(report.to,-(Number(days)-1));
  render();
}

async function assignRole(){
  setErr("err_roles","");
  const address=($("#roleAddress").value||"").trim();
  if(!address){setErr("err_roles",t("An account address is required."));return;}
  try{
    await api("/api/v1/role-assignments/"+encodeURIComponent(address),{method:"PUT",body:JSON.stringify({role:$("#roleName").value,domains:($("#roleDomains").value||"").trim()})});
    await render();
  }catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_roles",e.message);}
}
async function unassignRole(address){
  setErr("err_roles","");
  try{
    await api("/api/v1/role-assignments/"+encodeURIComponent(address),{method:"DELETE"});
    await render();
  }catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_roles",e.message);}
}
/* A custom role nobody holds is deleted. One somebody holds is refused by the
   server - deleting it would hand each holder what its admin level gives - with
   a sentence saying how many accounts hold it, shown here beside who holds what. */

  setErr("err_roles","");

  try{
    await api("/api/v1/roles/"+encodeURIComponent(name),{method:"DELETE"});
    await render();
  }catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_roles",e.message);}

/* ---------- Devices ----------

   use, and the one press that ends what one of them holds. The list is read for
   an address the administrator types, because there is no server-wide listing:
   a device belongs to an account, and a page that showed every client on the
   server would be a page about traffic rather than about people. */
var devicesFor="";
async function renderDevices(){
  const shown=escHtml(devicesFor);
  const form=`<div class="card flat">
    <p class="note">${t("Every client that has signed in to an account: what it speaks, where from, which of the account's credentials it used, and when it was first and last seen. Revoking one ends the session it holds now - its browser session, and its live IMAP, POP3 and SMTP connections - and can disable the app password behind it. It is not a ban: the client can sign in again with a credential that still works.")}</p>

        <td>${escHtml(d.last_seen||"")}</td>
        <td>${Number(d.sign_ins||0)}</td>
        <td>${d.revoked?'<span class="badge warn">'+t("Revoked")+"</span>":""}</td>
        <td style="text-align:right;white-space:nowrap">${may("manage_accounts")?`<button class="btn danger sm" data-act="devrevoke" data-id="${escHtml(d.id)}">${t("Revoke")}</button>`:""}</td></tr>`).join("");

function fmtBytes(n){n=Number(n)||0;if(n>=1048576)return (n/1048576).toFixed(1)+" MB";if(n>=1024)return (n/1024).toFixed(1)+" KB";return n+" B";}
/* ---------- Audit trail ----------
   Who changed what, when, from where, and over which interface. The rows are
   written below the interfaces (see AuditTrail.h in the server), so a change
   made over COM by the Control Panel and the same change made here appear side
   by side with only the interface column telling them apart.

   The page reads and never writes: the record is append-only, and a page that
   could edit it would be the first thing to use. */
let auditOffset=0;
const AUDIT_PAGE=50;
function auditWhen(seconds){
  const value=Number(seconds)||0;
  if(!value)return "—";
  return new Date(value*1000).toISOString().replace("T"," ").replace(/\.\d+Z$/,"Z");
}
/* ---------- Changed from stock ----------
   Every setting whose value is not the one this version ships with, with the
   shipped value beside it. One route answers the whole page and the page holds
   no opinion of its own about what a difference is: the server decides, from
   the defaults its own source was built with, and COM's
   Settings.GetChangedFromDefault is given the same document - so the Deck, the
   Control Panel and hmctl cannot describe the same server differently.

   It reads and never writes. A setting is changed where it is set, which is the
   Settings view and the pages of the thing it belongs to; a page that could
   edit from here would be a second place to do it and a second set of rules
   about who may.

   The route answers the administrator password alone, as GET
   /api/v1/settings/ini does, so the button carries data-admin rather than a
   permission and a role account is not offered a page it would be refused. */
async function renderChanged(){
  const answer=await api("/api/v1/settings/changed");
  const settings=answer.settings||[];
  const considered=Number(answer.considered)||0;
  const rows=settings.map(s=>`
    <tr><td>${escHtml(s.store||"")}</td><td>${escHtml(s.name||"")}</td>
        <td>${escHtml(s.value||"")}${s.overridden?' <span class="note">'+t("Forced from [SettingsOverride] in hMailServer.ini")+'</span>':''}</td>
        <td>${s.known===false?'<span class="note">'+t("This server has no default for it")+'</span>':escHtml(s.default||"")}</td></tr>`).join("");
  $("#content").innerHTML=`<div class="card view">
    <p class="note">${t("Every setting whose value is not the one this version of the server ships with. It is the first thing to look at when a server behaves oddly, and the first thing to put in a support message. A setting whose value is a secret is named here and never shown.")}</p>
    <div class="tablewrap"><table><thead><tr><th>${t("Store")}</th><th>${t("Setting")}</th><th>${t("Value")}</th><th>${t("Shipped default")}</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="4" class="empty">'+t("Nothing has been changed. Every setting on this server is what this version ships with.")+'</td></tr>'}</tbody></table></div>
    <p class="note" style="margin-top:12px">${tf("{0} of {1} settings are not what this version ships with.",settings.length,considered)}</p></div>`;
}

async function renderAudit(){
  const filter=(auditFilter||"").trim();
  const query="?limit="+AUDIT_PAGE+"&offset="+auditOffset+(filter?"&actor="+encodeURIComponent(filter):"");
  const answer=await api("/api/v1/audit"+query);
  const entries=answer.entries||[];
  const total=Number(answer.total)||0;
  // A setting's change carries the value it had, so it can be put back - by
  // a credential that may change settings, as one more row in the trail.
  const canPutBack=e=>e.object_type==="setting"&&(e.action==="updated"||e.action==="deleted")&&may("manage_settings");
  const rows=entries.map(e=>`
    <tr><td>${escHtml(auditWhen(e.time))}</td><td>${escHtml(e.actor||"—")}</td><td>${escHtml(e.interface||"—")}</td>
        <td>${escHtml(e.address||"—")}</td><td>${escHtml(e.object_type||"—")}</td><td>${escHtml(e.object||"—")}</td>
        <td>${escHtml(e.action||"—")}</td><td>${escHtml(e.detail||"")}</td>
        <td>${canPutBack(e)?'<button class="btn ghost sm" data-act="auditrevert" data-id="'+escHtml(e.id)+'">'+t("Put back")+"</button>":""}</td></tr>`).join("");
  $("#content").innerHTML=`<div class="card view">
    <div class="row" style="gap:10px;align-items:center;margin-bottom:12px">
      <input id="auditFilter" placeholder="${t("Filter by administrator or API key")}" value="${escHtml(filter)}" style="flex:1">
      <button class="btn ghost sm" data-act="auditverify">${t("Verify the chain")}</button>
      <button class="btn ghost sm" data-act="auditpage" data-by="-${AUDIT_PAGE}">${t("Newer")}</button>
      <button class="btn ghost sm" data-act="auditpage" data-by="${AUDIT_PAGE}">${t("Older")}</button>
    </div>
    <div class="err" id="err_audit"></div>
    <div class="tablewrap"><table><thead><tr><th>${t("When")}</th><th>${t("Who")}</th><th>${t("Interface")}</th><th>${t("From")}</th>
      <th>${t("Object")}</th><th>${t("Name")}</th><th>${t("Action")}</th><th>${t("Detail")}</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan="9" class="empty">'+t("Nothing has been recorded yet. Every administrative change appears here.")+'</td></tr>'}</tbody></table></div>
    <p class="note" style="margin-top:12px">${tf("{0} to {1} of {2}",total?auditOffset+1:0,auditOffset+entries.length,total)}</p></div>`;
  const box=$("#auditFilter");
  if(box)box.onchange=e=>{auditFilter=e.target.value;auditOffset=0;render();};
}
let auditFilter="";
async function revertAuditedChange(id){
  setErr("err_audit","");
  try{
    const answer=await api("/api/v1/audit/"+encodeURIComponent(id)+"/revert",{method:"POST",body:"{}"});
    toast(tf("Put back: {0} is {1} again.",answer.setting||"",answer.value||""));
    render();
  }catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_audit",refusalText(e));}
}
async function verifyAuditChain(){
  setErr("err_audit","");
  try{
    const answer=await api("/api/v1/audit/verify");
    if(answer.intact)toast(tf("The chain is intact. {0} row(s) checked.",Number(answer.rows_checked)||0));
    else setErr("err_audit",tf("The chain is broken at row {0}. {1}",Number(answer.first_broken_id)||0,answer.reason||""));
  }catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_audit",e.message);}
}
/* ---------- Outbound reputation ----------
   The addresses this server sends from, against the DNS block lists other
   servers use. The page decides nothing: the API answers listed as true, false
   or null, and the third one - the list did not say, because it refused the
   query, was not answering, or could not be reached - is drawn as its own thing
   rather than as clean. A page that drew "nobody answered" the way it draws
   "not listed" would be the reason somebody believed a check that never ran.

   What is checked, and which lists, are settings (reputation_watch_addresses,
   reputation_watch_lists) and so live on the Settings page with every other one;
   this view is the answer and the button that asks again. */
/* The first-hour checklist: eight items the server judges itself (SetupChecklist.cpp).
   Every finding carries a code and its arguments beside the server's English
   sentence, so the sentence is rendered from the catalogue here and the server's
   own is the fallback for a code this page does not know. */
const CHECKLIST_TITLE={domain:K("A domain"),account:K("An account"),submission:K("TLS on the submission port"),
  spf:K("An SPF record"),dkim:K("DKIM signing"),dmarc:K("A DMARC record"),backup:K("A backup destination"),
  second_factor:K("A second factor for the administrator")};
const CHECKLIST_PURPOSE={
  domain:K("Mail is addressed to a domain, so the server needs one before it can receive anything."),
  account:K("An account is a mailbox in a domain: the address people write to, and what a client signs in as."),
  submission:K("Mail clients send through the submission port, and without TLS their passwords cross the network in the clear."),
  spf:K("SPF tells receivers which servers may send this domain's mail; without it the mail is more likely to be refused or filed as spam."),
  dkim:K("DKIM signs outgoing mail so receivers can verify it left this domain unchanged; the public key has to be published in DNS."),
  dmarc:K("DMARC tells receivers what to do with mail that fails SPF and DKIM, and where to report it."),
  backup:K("The backup writes the database and the message store to a folder; until one is set there is no backup."),
  second_factor:K("The administrator password opens everything; a one-time code beside it keeps a leaked password from being enough.")};
const CHECKLIST_STATE={done:K("Done"),action_needed:K("Action needed"),cannot_tell:K("Cannot tell"),not_needed:K("Not needed")};
const CHECKLIST_TEXT={
  domain_none:K("No domain has been added yet."),
  domain_none_active:K("{0} domains, none of them active."),
  domain_count:K("Active domains: {0} of {1}."),
  account_none:K("No account has been added in any domain."),
  account_count:K("Accounts: {0}."),
  submission_none:K("No port takes message submission, so mail clients cannot send through this server."),
  submission_plain:K("Port {0} takes submission without TLS, so passwords and mail would cross the network in the clear."),
  submission_no_certificate:K("Port {0} is set to TLS but has no certificate, so TLS cannot start."),
  submission_tls:K("Port {0} offers TLS with the certificate {1}."),
  no_active_domain:K("No active domain, so there is nothing to publish yet."),
  record_published:K("{0}: the {1} record at {2} is published."),
  record_missing:K("{0}: no {1} record at {2}."),
  record_not_looked_up:K("{0}: the {1} record at {2} was not looked up."),
  lookup_failed:K("{0}: the lookup for {2} failed, which says nothing about the {1} record."),
  domains_not_looked_up:K("{0} more active domains were not looked up."),
  dkim_off:K("{0}: signing is off, so receivers cannot verify the mail as this domain's."),
  dkim_no_selector:K("{0}: signing is on but no selector is set."),
  dkim_key_missing:K("{0}: signing is on but the key file {1} was not found."),
  backup_none:K("No backup destination is set."),
  backup_folder_missing:K("The backup destination {0} does not exist on the server."),
  backup_set:K("Backups go to {0}."),
  second_factor_on:K("The administrator's password is backed by a one-time code."),
  second_factor_off:K("The administrator signs in with a password alone.")};
function checklistLevel(state){
  if(state==="done")return "good";
  if(state==="action_needed")return "warn";
  return "info";
}
function checklistPill(state){
  const level=state==="not_needed"?"":' data-level="'+checklistLevel(state)+'"';
  return '<span class="pill"'+level+'><span class="mark">●</span>'+escHtml(t(CHECKLIST_STATE[state]||state))+"</span>";
}
function checklistText(finding){
  const key=CHECKLIST_TEXT[finding.code];
  return key?tf(key,...(finding.args||[])):(finding.text||finding.code||"");
}
async function renderChecklist(){
  const answer=await api("/api/v1/setup/checklist");
  const items=answer.items||[];
  const cards=items.map(item=>{
    const findings=(item.findings||[]).map(f=>'<li>'+checklistPill(f.state)+' '+escHtml(checklistText(f))+'</li>').join("");
    return `<div class="card flat checkitem" data-key="${escHtml(item.key)}">
      <div class="row" style="gap:10px;align-items:center">${checklistPill(item.state)}<b>${escHtml(t(CHECKLIST_TITLE[item.key]||item.key))}</b></div>
      <p class="note">${escHtml(t(CHECKLIST_PURPOSE[item.key]||""))}</p>
      <ul class="findings">${findings}</ul></div>`;
  });
  const summary=tf("{0} done, {1} need action, {2} cannot be told, {3} not needed.",
    Number(answer.done)||0,Number(answer.action_needed)||0,Number(answer.cannot_tell)||0,Number(answer.not_needed)||0);
  $("#content").innerHTML=`<div class="view">
    <div class="card flat">
      <p class="note">${t("The first hour: what this server still needs before it is a mail server anybody can use, judged by the server itself. The record items look SPF, DKIM and DMARC up in DNS for every active domain.")}</p>
      <div class="row" style="gap:10px;align-items:center;flex-wrap:wrap">
        <span class="muted" id="checklistSummary">${escHtml(summary)}</span>
        <span class="muted">${escHtml(answer.generated?tf("Checked {0}",auditWhen(answer.generated)):"")}</span>
        <button class="btn ghost sm" data-act="checklistagain">${t("Check again")}</button>
      </div>
    </div>
    ${cards.join("")}</div>`;
}

const REPUTATION_STATUS={listed:K("Listed"),not_listed:K("Not listed"),refused:K("Refused"),
  lookup_failed:K("Lookup failed"),unexpected_answer:K("Unexpected answer"),
  list_not_answering:K("List not answering"),list_lists_everything:K("List lists everything"),
  not_applicable:K("Not covered"),not_checked:K("Not checked yet")};
function reputationLevel(status){
  if(status==="listed")return "bad";
  if(status==="not_listed")return "good";
  if(status==="not_applicable"||status==="not_checked")return "info";
  return "warn";
}
async function renderReputation(){
  const answer=await api("/api/v1/reputation");
  const addresses=answer.addresses||[];
  const skipped=answer.skipped||[];
  const rows=[];
  addresses.forEach(a=>{
    const sources=(a.sources||[]).join(", ");
    (a.results||[]).forEach(r=>{
      rows.push(`<tr><td><b>${escHtml(a.address)}</b><div class="hint muted">${escHtml(sources)}</div></td>
        <td>${escHtml(r.list)}</td>
        <td><span class="pill" data-level="${reputationLevel(r.status)}"><span class="mark">●</span>${escHtml(t(REPUTATION_STATUS[r.status]||r.status))}</span>
          ${r.listed_since?'<div class="hint muted">'+escHtml(tf("listed since {0}",auditWhen(r.listed_since)))+'</div>':""}</td>
        <td>${escHtml(r.code||"—")}</td>
        <td>${escHtml(r.reason||"")}</td>
        <td>${escHtml(r.checked?auditWhen(r.checked):"—")}</td></tr>`);
    });
  });
  const skippedRows=skipped.map(s=>`<tr><td><b>${escHtml(s.address)}</b></td><td>${escHtml(s.source)}</td>
    <td>${escHtml(s.detail||s.reason)}</td></tr>`).join("");
  const when=answer.last_checked?tf("Last checked {0}, next {1}",auditWhen(answer.last_checked),
    answer.next_check?auditWhen(answer.next_check):"—"):t("Not checked yet");
  $("#content").innerHTML=`<div class="view">
    <div class="card flat">
      <p class="note">${t("The addresses this server sends from, checked once a day against the DNS block lists other servers use. Which addresses, and which lists, are on the Settings page.")}</p>
      ${answer.enabled?"":'<p class="note">'+t("The watch is off. reputation_watch_enabled on the Settings page turns it on.")+"</p>"}
      <div class="row" style="gap:10px;align-items:center">
        <span class="muted">${escHtml(when)}</span>
        ${may("manage_server")?'<button class="btn ghost sm" data-act="repwatchcheck">'+t("Check now")+"</button>":""}
      </div>
      <div class="err" id="err_repwatch">${escHtml(answer.lists_problem||"")}</div>
    </div>
    <div class="tablewrap"><table><thead><tr><th>${t("Address")}</th><th>${t("List")}</th><th>${t("Status")}</th>
      <th>${t("Answer")}</th><th>${t("Reason")}</th><th>${t("When")}</th></tr></thead>
    <tbody>${rows.join("")||'<tr><td colspan="6" class="empty">'+t("No outbound address is configured, so nothing is checked: set the delivery bind address, or name this server\'s public address in reputation_watch_addresses on the Settings page.")+"</td></tr>"}</tbody></table></div>
    ${skippedRows?'<div class="sect"><h2>'+t("Not looked up")+'</h2><div class="card flat"><div class="tablewrap"><table><thead><tr><th>'+t("Address")+"</th><th>"+t("Source")+"</th><th>"+t("Detail")+'</th></tr></thead><tbody>'+skippedRows+"</tbody></table></div></div></div>":""}
    </div>`;
}
async function runReputationCheck(){
  setErr("err_repwatch","");
  try{
    const answer=await api("/api/v1/reputation/check",{method:"POST",body:"{}"});
    const run=answer.run||{};
    toast(tf("Checked {0} address(es) against {1} list(s)",Number(run.addresses)||0,Number(run.lists)||0));
    await render();
  }catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_repwatch",e.message);}
}
async function showLog(name,lines){
  setErr("err_log","");
  try{
    const answer=await api("/api/v1/logs/"+encodeURIComponent(name)+"?lines="+encodeURIComponent(lines||200));
    const pre=$("#logPre");if(!pre)return;
    pre.hidden=false;
    pre.textContent=(answer.lines||[]).join("\n")||t("(empty)");
    pre.scrollTop=pre.scrollHeight;
  }catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_log",tf("Could not read {0}: {1}",name,e.message));}
}


/* ---------- Webhooks ----------
   Which other programs are told what this server's mail does. A subscription is
   an endpoint, a shared secret, the events it wants and the domains and
   addresses it is confined to; the queue below the list is what has been sent to
   them and what is still owed.

   The editor is built from the schema of POST /api/v1/webhooks, as the routes'
   and the ports' are, so a field the record gains appears here without a change
   to this page - and the secret is drawn as a write-only box because the schema
   marks it writeOnly, which is also why leaving it empty on a change keeps the
   one that is set.

   Two buttons do what an administrator does next after configuring one: raise a
   test event through the same path a real one takes, and run a delivery pass
   rather than waiting up to a minute for the scheduled one. */
const WEBHOOK_DELIVERIES=25;
function webhookStateWord(word){
  if(word==="delivered")return t("delivered");
  if(word==="dead-lettered")return t("dead-lettered");
  return t("pending");
}
function webhookQueueText(w){
  const parts=[];
  if(Number(w.pending))parts.push(tf("{0} waiting",Number(w.pending)));
  if(Number(w.delivered))parts.push(tf("{0} sent",Number(w.delivered)));
  if(Number(w.dead_lettered))parts.push(tf("{0} dead-lettered",Number(w.dead_lettered)));
  if(Number(w.dropped))parts.push(tf("{0} dropped",Number(w.dropped)));
  return parts.length?parts.join(", "):t("nothing yet");
}
async function renderWebhooks(){
  await loadSpec();
  const answer=await api("/api/v1/webhooks");
  cache.webhooks=asList(answer,"webhooks");
  if(editing&&editing.kind==="webhook"){renderWebhookEditor();return;}
  const queue=asList(await api("/api/v1/webhooks/deliveries?limit="+WEBHOOK_DELIVERIES),"deliveries");
  const rows=cache.webhooks.map(w=>`
    <tr><td><b>${escHtml(w.name)}</b>${w.enabled?"":' <span class="badge warn">'+t("Off")+'</span>'}
            <div class="hint muted"><code>${escHtml(w.url)}</code></div></td>
        <td>${escHtml(w.events||t("every event"))}</td>
        <td>${escHtml(w.domains||t("every domain"))}${w.addresses?'<div class="hint muted">'+escHtml(w.addresses)+'</div>':""}</td>
        <td>${escHtml(webhookQueueText(w))}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn ghost sm" data-act="hookedit" data-id="${escHtml(w.name)}">${t("Edit")}</button>
          <button class="btn danger sm" data-act="hookdel" data-id="${escHtml(w.name)}">${t("Delete")}</button>
          <div class="err" id="err_hook_${escHtml(w.name)}"></div></td></tr>`).join("");
  const queueRows=queue.map(d=>`
    <tr><td>${escHtml(auditWhen(d.created))}</td><td>${escHtml(d.webhook||"—")}</td><td><code>${escHtml(d.event)}</code></td>
        <td>${escHtml(webhookStateWord(d.state))}</td><td>${escHtml(String(d.attempts||0))}</td>
        <td>${escHtml(d.error||"")}</td></tr>`).join("");
  $("#content").innerHTML=`<div class="view">
    <div class="card flat">
      <p class="note">${escHtml(operation("/api/v1/webhooks","get").description||"")}</p>
      <div class="tablewrap"><table><thead><tr><th>${t("Name")}</th><th>${t("Events")}</th><th>${t("Scope")}</th><th>${t("Queue")}</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5" class="empty">'+t("No subscriptions are configured, so no mail event leaves this server.")+'</td></tr>'}</tbody></table></div>
      <div class="row" style="margin-top:16px">
        <button class="btn" data-act="hooknew">${t("Add a subscription")}</button>
        <button class="btn ghost" data-act="hooktest">${t("Send a test event")}</button>
        <button class="btn ghost" data-act="hookrun">${t("Run a delivery pass")}</button>
        <div class="err" id="err_hooks"></div>
      </div>
    </div>
    <div class="sect"><h2>${t("Recent deliveries")}</h2>
      <div class="card flat">
        <div class="tablewrap"><table><thead><tr><th>${t("When")}</th><th>${t("Subscription")}</th><th>${t("Event")}</th>
          <th>${t("State")}</th><th>${t("Attempts")}</th><th>${t("Error")}</th></tr></thead>
        <tbody>${queueRows||'<tr><td colspan="6" class="empty">'+t("Nothing has been queued yet.")+'</td></tr>'}</tbody></table></div>
      </div></div></div>`;
}
function openWebhook(name){
  const existing=cache.webhooks.filter(w=>w.name===name)[0];
  const values=existing
    ? JSON.parse(JSON.stringify(existing))
    : documentedDefaults("/api/v1/webhooks","post",properties("/api/v1/webhooks","post"));
  editing={kind:"webhook",id:name||"",values:values};
  renderWebhookEditor();
}
function webhookFormOptions(){
  return {required:requiredOf("/api/v1/webhooks","post"),
          skip:editing.id?["name"]:[],
          passwordHint:t("left unchanged unless filled")};
}
function renderWebhookEditor(){
  const props=properties("/api/v1/webhooks","post");
  $("#content").innerHTML=`<div class="view">
    <button class="btn ghost sm" data-act="cancel">${t("‹ All subscriptions")}</button>
    <div class="sect"><h2>${editing.id?tf("Edit the subscription {0}",escHtml(editing.id)):t("New subscription")}</h2>
      <div class="card flat">
        <p class="note">${escHtml(operation(editing.id?"/api/v1/webhooks/{name}":"/api/v1/webhooks",editing.id?"put":"post").description||"")}</p>
        <div class="form">${formHtml("hook",props,editing.values,webhookFormOptions())}</div>
        <div class="row" style="margin-top:18px">
          <button class="btn" data-act="hooksave">${t("Save the subscription")}</button>
          <button class="btn ghost" data-act="cancel">${t("Cancel")}</button>
          <div class="err" id="err_hookedit"></div>
        </div>
      </div></div></div>`;
}
async function saveWebhook(){
  setErr("err_hookedit","");
  const props=properties("/api/v1/webhooks","post");
  let body;
  try{body=readForm("hook",props,webhookFormOptions());}catch(e){setErr("err_hookedit",e.message);return;}
  try{
    if(editing.id)await api("/api/v1/webhooks/"+encodeURIComponent(editing.id),{method:"PUT",body:JSON.stringify(body)});
    else await api("/api/v1/webhooks",{method:"POST",body:JSON.stringify(body)});
    editing=null;toast(t("Subscription saved"));await render();
  }catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_hookedit",e.message);}
}
async function deleteWebhook(name){
  if(!confirm(tf("Delete the subscription {0}?",name)))return;
  setErr("err_hook_"+name,"");
  try{await api("/api/v1/webhooks/"+encodeURIComponent(name),{method:"DELETE"});toast(t("Subscription deleted"));await render();}
  catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_hook_"+name,e.message);}
}
async function runWebhookPass(){
  setErr("err_hooks","");
  try{
    const answer=await api("/api/v1/webhooks/run",{method:"POST",body:"{}"});
    toast(tf("{0} delivered, {1} removed",Number(answer.delivered)||0,Number(answer.removed)||0));
    await render();
  }catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_hooks",e.message);}
}
async function sendTestWebhook(){
  setErr("err_hooks","");
  try{
    const answer=await api("/api/v1/webhooks/test",{method:"POST",body:"{}"});
    toast(tf("The test event was queued for {0} subscription(s).",Number(answer.queued)||0));
    await render();
  }catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_hooks",e.message);}
}

/* ---------- Boot ----------
   No credential is stored, so the only question at load is whether the browser
   still holds a live session cookie - and that is asked only when this tab has
   signed in before. Asking unconditionally would mean a request answered 401 on
   every first visit, and a 401 from this API carries WWW-Authenticate: Basic,
   which is the browser's cue to put its own password box on the screen in front
   of the page's. */
let resumed=false;
try{resumed=sessionStorage.getItem("hmsSession")==="1";}catch(_){}
if(resumed)startDeck().catch(()=>{signedOut(t("The session ended. Sign in again."));});
/* The language: the one this browser remembers, else the browser's own. English
   is the page as it stands and asks the server for nothing. */
let rememberedLanguage=null;
try{rememberedLanguage=knownLanguage(localStorage.getItem("hmsLang"));}catch(_){}
loadLanguage(rememberedLanguage||browserLanguage());
</script>
