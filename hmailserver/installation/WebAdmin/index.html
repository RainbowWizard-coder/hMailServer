<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hMailServer — Control Deck</title>
<style>
/* ======================================================================
   The Deck's look is the webmail's. Every colour, every step of the
   spacing scale, every radius and every size of the type ramp is a custom
   property declared once here and nowhere else in the page: the palette is
   the one hmailserver/source/Server/Common/Util/Portal.html declares, value
   for value, so that the two pages a person meets on this server are one
   design and not two, and the scale, the radii and the ramp are the desktop
   console's (hmailserver/docs/ControlPanelDesign.md), so that the
   administrator who uses both meets one vocabulary: a command bar, a
   navigation column, a content area, cards, a grid, a form row, an empty
   state, a notice and a status pill.

   The theme is the body's data-theme attribute. Light is the page as it
   stands; [data-theme="dark"] redeclares the tokens the webmail's dark
   theme redeclares and nothing else. The choice is this browser's - light,
   dark, or the system's, which is prefers-color-scheme asked through
   matchMedia and followed as it changes - and it is remembered in
   localStorage under a name that is not a secret.

   The rule the harness holds this file to: no literal colour outside the
   two blocks below. A page whose fifth card paints its own grey is a page
   that has two themes, one of which nobody maintains.
   ====================================================================== */
:root{
  --bg:#f6f8fc; --surface:#fff; --surface-2:#f1f3f4; --surface-3:#e8eaed; --line:#e0e3e8; --line-2:#c9ced6;
  --text:#1f1f1f; --text-2:#444746; --muted:#5f6368;
  --accent:#1a73e8; --accent-2:#174ea6; --accent-soft:#e8f0fe; --accent-text:#0b57d0; --on-accent:#fff; --on-danger:#fff;
  --cursor:#e8f0fe; --selected:#c2dbff;
  --danger:#d93025; --danger-soft:#fce8e6; --good:#188038; --good-soft:#e6f4ea; --warn:#b06000; --warn-soft:#fef7e0;
  --shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --shadow-2:0 4px 8px 3px rgba(60,64,67,.15),0 1px 3px rgba(60,64,67,.3);
  --scrim:rgba(32,33,36,.55);
  /* The console's six steps. A margin, a padding or a gap is one of them. */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  /* Its three radii: a control, a card, a capsule. */
  --radius-control:4px; --radius:8px; --pill:999px;
  /* Its type ramp: caption, body, subtitle, title. */
  --fs-caption:12px; --fs-body:14px; --fs-subtitle:20px; --fs-title:28px;
  /* Its frame: the command bar, the navigation column and its rail, a row. */
  --cmdbar:48px; --nav:256px; --rail:56px; --row:34px; --form:760px;
  --font:system-ui,'Segoe UI Variable','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,monospace;
}
[data-theme="dark"]{
  --bg:#111418; --surface:#1b1f24; --surface-2:#262b31; --surface-3:#30363d; --line:#2e343b; --line-2:#3f464e;
  --text:#e8eaed; --text-2:#c4c7c5; --muted:#9aa0a6;
  --accent:#8ab4f8; --accent-2:#aecbfa; --accent-soft:#283142; --accent-text:#8ab4f8; --on-accent:#062e6f; --on-danger:#111418;
  --cursor:#283142; --selected:#33456b;
  --danger:#f28b82; --danger-soft:#3c2422; --good:#81c995; --good-soft:#1e3325; --warn:#fdd663; --warn-soft:#3a3120;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 1px 3px 1px rgba(0,0,0,.3);
  --shadow-2:0 4px 8px 3px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.65);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);font-size:var(--fs-body);line-height:1.45;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
::selection{background:var(--selected)}
/* The ring the keyboard leaves behind it, on everything that takes focus. */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-control)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:var(--s2);z-index:70;background:var(--surface);color:var(--accent-text);
  padding:var(--s2) var(--s3);border-radius:var(--radius);box-shadow:var(--shadow-2);text-decoration:none}
.skip:focus{left:var(--s2)}
a{color:var(--accent-text)}
button{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:var(--fs-caption)}
.muted{color:var(--muted)}

.app{display:flex;flex-direction:column;height:100%}
.shell{flex:1;display:flex;min-height:0}

/* ---------- The command bar ---------- */
.cmdbar{height:var(--cmdbar);flex:none;display:flex;align-items:center;gap:var(--s2);
  padding:0 var(--s4);background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:var(--s2);min-width:0}
.brand .logo{width:28px;height:28px;border-radius:var(--radius-control);display:grid;place-items:center;
  font-weight:600;font-size:var(--fs-caption);background:var(--accent);color:var(--on-accent);flex:none}
.brand b{font-size:var(--fs-body);font-weight:600;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.2px;text-transform:uppercase}
.cmdbar h1{font-size:var(--fs-body);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding-inline-start:var(--s3);margin-inline-start:var(--s2);border-inline-start:1px solid var(--line)}
.cmdbar .sp{flex:1}
.cmdbar select{padding:4px var(--s2);font-size:var(--fs-caption);border-radius:var(--radius-control)}
.search{position:relative;display:flex;align-items:center;flex:0 1 300px;min-width:120px}
.search input{width:100%;height:32px;padding:0 var(--s6) 0 var(--s3);border-radius:var(--pill);
  background:var(--surface-2);border:1px solid transparent;font-size:var(--fs-body)}
.search input:focus{background:var(--surface);border-color:var(--accent)}
.search kbd{position:absolute;right:var(--s2);pointer-events:none}
kbd{font-family:var(--mono);font-size:var(--fs-caption);background:var(--surface-2);border:1px solid var(--line-2);
  border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--text-2);white-space:nowrap}

/* ---------- The status pill ---------- */
.pill{display:inline-flex;align-items:center;gap:var(--s1);padding:2px 10px;border-radius:var(--pill);
  font-size:var(--fs-caption);background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.pill .mark{font-size:10px;line-height:1}
.pill[data-level="good"]{background:var(--good-soft);color:var(--good)}
.pill[data-level="warn"]{background:var(--warn-soft);color:var(--warn)}
.pill[data-level="bad"]{background:var(--danger-soft);color:var(--danger)}
.pill[data-level="info"]{background:var(--accent-soft);color:var(--accent-text)}
.checkitem ul.findings{margin:var(--s2) 0 0;padding-left:0;list-style:none}
.checkitem ul.findings li{margin:var(--s1) 0;display:flex;gap:var(--s2);align-items:baseline;flex-wrap:wrap}

/* ---------- The navigation column, and its rail ---------- */
.side{width:var(--nav);flex:none;display:flex;flex-direction:column;padding:var(--s2);gap:var(--s1);
  background:var(--surface);border-inline-end:1px solid var(--line);overflow:auto}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:var(--s3);height:var(--row);
  padding:0 var(--s3);border-radius:var(--radius-control);color:var(--text-2);font-size:var(--fs-body);cursor:pointer}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nav button.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav .ico{width:18px;text-align:center;flex:none}
.side .foot{margin-top:auto;padding:var(--s3) var(--s3) var(--s2);color:var(--muted);font-size:var(--fs-caption)}
@media (max-width:900px){
  .side{width:var(--rail);padding:var(--s2) var(--s1)}
  .nav button{justify-content:center;padding:0}
  .nav button span:not(.ico),.side .foot,.brand div{display:none}
}

/* ---------- The content area ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.content{flex:1;overflow:auto;padding:var(--s5) var(--s5) var(--s5)}
.view{animation:rise .2s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Cards, sections, grids ---------- */
.grid{display:grid;gap:var(--s3)}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--s4) var(--s5)}
.card.flat{background:var(--surface)}
.kpi{padding:var(--s4) var(--s5) var(--s5)}
.kpi .v{font-size:var(--fs-title);font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.kpi .l{color:var(--muted);font-size:var(--fs-caption);margin-top:var(--s1)}
.kpi .bar{height:3px;border-radius:2px;margin-top:var(--s3);background:var(--accent-soft)}
h2{font-size:var(--fs-subtitle);font-weight:600}
.sect{margin-top:var(--s5)}
.sect h2{font-size:var(--fs-body);font-weight:600;color:var(--text);margin-bottom:var(--s3);
  display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.sect h2 code{color:var(--muted);font-weight:400}

table{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
th{color:var(--muted);text-align:start;font-weight:600;font-size:var(--fs-caption);
  padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
/* The row the keyboard is on. Arrows move it, Enter opens it. */
tbody tr.cur{background:var(--cursor);box-shadow:inset 2px 0 0 var(--accent)}
.tablewrap{overflow-x:auto}

.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  height:32px;padding:0 var(--s4);border-radius:var(--radius-control);font-size:var(--fs-body);font-weight:600;
  background:var(--accent);color:var(--on-accent);white-space:nowrap}
.btn:hover{box-shadow:var(--shadow)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--accent-text);font-weight:500}
.btn.ghost:hover{background:var(--accent-soft);box-shadow:none}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.sm{height:26px;padding:0 var(--s3);font-size:var(--fs-caption)}
.iconbtn{all:unset;box-sizing:border-box;cursor:pointer;width:32px;height:32px;display:inline-flex;align-items:center;
  justify-content:center;border-radius:50%;color:var(--text-2);flex:none;font-size:15px}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

input,select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-control);
  color:var(--text);padding:6px var(--s3);font-size:var(--fs-body);font-family:var(--font);outline:none;max-width:100%}
textarea{font-family:var(--mono);font-size:13px;line-height:1.6;resize:vertical;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0;cursor:pointer}
option{background:var(--surface);color:var(--text)}

.badge{display:inline-flex;align-items:center;gap:var(--s1);padding:1px 8px;border-radius:var(--pill);
  font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--text-2)}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--danger-soft);color:var(--danger)}
.badge.info{background:var(--accent-soft);color:var(--accent-text)}

/* ---------- The empty state and the notice ---------- */
.empty{color:var(--muted);padding:var(--s6);text-align:center;font-size:var(--fs-body)}
.notice{display:flex;align-items:flex-start;gap:var(--s2);padding:var(--s3) var(--s4);margin-bottom:var(--s3);
  border:1px solid var(--line-2);border-radius:var(--radius-control);font-size:var(--fs-body);line-height:1.55;
  background:var(--surface-2);color:var(--text)}
.notice .mark{flex:none;font-size:var(--fs-caption);line-height:1.6}
.notice b{font-weight:600;margin-inline-end:var(--s1)}
.notice[data-level="info"]{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.notice[data-level="info"] .mark,.notice[data-level="info"] b{color:var(--accent-text)}
.notice[data-level="warn"]{background:var(--warn-soft);border-color:var(--warn)}
.notice[data-level="warn"] .mark,.notice[data-level="warn"] b{color:var(--warn)}
.notice[data-level="bad"]{background:var(--danger-soft);border-color:var(--danger)}
.notice[data-level="bad"] .mark,.notice[data-level="bad"] b{color:var(--danger)}

pre{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-control);padding:var(--s4);
  font-size:var(--fs-caption);overflow:auto;line-height:1.7;color:var(--text)}
.toast{position:fixed;bottom:var(--s5);inset-inline-end:var(--s5);background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--radius);padding:var(--s3) var(--s4);font-size:var(--fs-body);box-shadow:var(--shadow-2);
  opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:none}

/* ---------- The form row ---------- */
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.form{display:flex;flex-direction:column;max-width:var(--form)}
.fr{display:grid;grid-template-columns:minmax(210px,1fr) minmax(210px,1.1fr);gap:var(--s1) var(--s5);
  padding:var(--s3) 0;border-bottom:1px solid var(--line);align-items:start}
.fr:last-child{border-bottom:none}
.fr .lab b{font-size:var(--fs-body);font-weight:600;display:inline-block;margin-inline-end:var(--s2)}
.fr .lab code{color:var(--muted)}
.hint{color:var(--muted);font-size:var(--fs-caption);line-height:1.5}
.fr .hint{margin-top:var(--s1)}
.fr .ctl input[type=text],.fr .ctl input[type=password],.fr .ctl input[type=number],.fr .ctl select{width:100%}
.fr .ctl .ro{display:inline-block;padding:6px 0;word-break:break-all}
.erow{padding:var(--s2) 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.erow:last-of-type{border-bottom:none}
.err{color:var(--danger);font-size:var(--fs-caption);line-height:1.5}
.err:empty{display:none}
.note{color:var(--muted);font-size:var(--fs-caption);line-height:1.6;margin-bottom:var(--s3)}

/* ---------- The sign-in gate ---------- */
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);padding:var(--s4);overflow:auto}
.login{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:var(--s6);box-shadow:var(--shadow)}
.login .logo{width:48px;height:48px;border-radius:var(--radius);display:grid;place-items:center;font-weight:600;
  font-size:var(--fs-subtitle);background:var(--accent);color:var(--on-accent);margin:0 auto var(--s4)}
.login h1{font-size:var(--fs-subtitle);font-weight:600;text-align:center;margin-bottom:var(--s1)}
.login p{color:var(--muted);font-size:13px;margin-bottom:var(--s5);text-align:center}
.login input{width:100%;margin-bottom:var(--s3);padding:var(--s2) var(--s3)}
.login .btn{width:100%;margin-top:var(--s1)}
.login .err{min-height:18px;margin-top:var(--s3)}
.login select{padding:5px var(--s2);font-size:var(--fs-caption);border-radius:var(--radius-control)}
.login .langrow{display:flex;justify-content:flex-end;margin-top:var(--s3)}

/* ---------- The shortcut list ---------- */
.overlay{position:fixed;inset:0;z-index:65;display:grid;place-items:center;background:var(--scrim);padding:var(--s4)}
.sheet{width:100%;max-width:520px;max-height:80vh;overflow:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:var(--s5);box-shadow:var(--shadow-2)}
.sheet h2{margin-bottom:var(--s4)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s4);align-items:baseline;margin-bottom:var(--s5)}
.keys dt{white-space:nowrap}
.keys dd{color:var(--text-2);font-size:13px}
/* ---------- The tour ----------
   A ring round the thing being talked about and a card beside it. Neither is
   a dialog: the ring takes no pointer events at all and the card is the only
   thing on this layer that does, so every control under it - including the one
   being pointed at - stays usable while a tour runs. The ring is an outline in
   the accent AND a dashed inset, because a highlight that is only a colour is
   no highlight in greyscale, in high contrast, or to a reader who does not see
   this blue. */
.tourring{position:fixed;z-index:70;pointer-events:none;border-radius:var(--radius);
  outline:2px solid var(--accent);outline-offset:2px}
.tourring::after{content:"";position:absolute;inset:3px;border:1px dashed var(--text);
  border-radius:var(--radius-control);opacity:.75}
.tourcard{position:fixed;z-index:71;width:330px;max-width:calc(100vw - var(--s6));background:var(--surface);
  border:1px solid var(--accent);border-radius:var(--radius);padding:var(--s4) var(--s5);box-shadow:var(--shadow-2)}
.tourcard .head{display:flex;justify-content:space-between;gap:var(--s2);color:var(--muted);
  font-size:var(--fs-caption);letter-spacing:.4px;text-transform:uppercase}
.tourcard p{font-size:var(--fs-body);line-height:1.6;margin:var(--s3) 0 var(--s4)}
.tourcard .row{gap:var(--s2)}
</style>
</head>
<body>
<a class="skip" href="#content">Skip to the content</a>

<!-- The sign-in gate -->
<div class="gate" id="gate">
  <form class="login" id="loginForm">
    <div class="logo">hM</div>
    <h1>Control Deck</h1>
    <p>Sign in with the hMailServer administrator credential. The password is exchanged once for a session cookie and is never kept by this page.</p>
    <input id="user" placeholder="Username" value="Administrator" autocomplete="username">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <input id="otp" placeholder="One-time code" inputmode="numeric" autocomplete="one-time-code" hidden>
    <button class="btn" type="submit">Connect</button>
    <div class="err" id="loginErr"></div>
    <div class="langrow"><select data-lang id="langSelGate" aria-label="Language" title="Language"></select></div>
  </form>
</div>

<!-- The shell: a command bar across the top, then the navigation column
     beside the content area, which is the frame the desktop console has. -->
<div class="app" id="app" style="display:none">
  <header class="cmdbar">
    <div class="brand"><div class="logo">hM</div><div><b>hMailServer</b><small>Control Deck</small></div></div>
    <h1 id="viewTitle">Dashboard</h1>
    <div class="sp"></div>
    <div class="search"><input id="deckSearch" type="search" placeholder="Search this view" aria-label="Search this view"><kbd>/</kbd></div>
    <span class="pill" id="connPill" data-level="good"><span class="mark" id="connMark" aria-hidden="true">■</span><span id="connState">Connected</span></span>
    <select data-lang id="langSel" aria-label="Language" title="Language"></select>
    <button class="iconbtn" id="themeBtn" data-nowalk>◐</button>
    <button class="iconbtn" id="tourBtn" title="Show me around" aria-label="Show me around">◎</button>
    <button class="iconbtn" id="keysBtn" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">?</button>
    <button class="iconbtn" id="logoutBtn" title="Sign out" aria-label="Sign out">⏻</button>
  </header>
  <div class="shell">
    <aside class="side">
      <nav class="nav" id="nav">
        <button data-view="dash" data-needs="view_configuration" class="on" title="Dashboard"><span class="ico">◈</span><span>Dashboard</span></button>
        <button data-view="checklist" data-serverwide="1" data-needs="view_configuration" title="Checklist"><span class="ico">☑</span><span>Checklist</span></button>
        <button data-view="domains" data-needs="view_accounts" title="Domains"><span class="ico">⌂</span><span>Domains</span></button>
        <button data-view="groups" data-serverwide="1" data-needs="view_accounts" title="Groups"><span class="ico">⚇</span><span>Groups</span></button>
        <button data-view="ipranges" data-serverwide="1" data-needs="view_configuration" title="IP ranges"><span class="ico">⌗</span><span>IP ranges</span></button>
        <button data-view="fetch" data-needs="view_accounts" title="Fetch accounts"><span class="ico">⇓</span><span>Fetch accounts</span></button>
        <button data-view="lists" data-needs="view_accounts" title="Lists"><span class="ico">≣</span><span>Lists</span></button>

     by the script from one table, so the key names stay as they are printed
     on the keyboard and only what each one does is translated. -->

<!-- The tour. Outside the app shell so that the ring can sit over any part of
     it, hidden until a tour runs, and polite rather than assertive: a step
     that interrupted whatever a screen reader was saying would be exactly the
     interruption a tour promises not to be. -->
<div class="tourring" id="tourRing" hidden></div>

  <div class="head"><span id="tourName"></span><span id="tourStep"></span></div>
  <p id="tourText"></p>
  <div class="row">
    <button class="btn ghost sm" id="tourBack">Back</button>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
let view="dash", pollTimer=null;

/* ---------- Language ----------
   English is the key. A catalogue - one object, English to translation, in
   WebAdmin/languages/<code>.json beside this page on the server's disk and
   served at /deck-lang/<code>.json - maps every text of the page to one
   language. The sentences the script builds go through t() and tf(); the
   tables of hints, titles and captions mark their texts with K() and the code
   that draws them looks each one up; the static markup - the sign-in card, the
   sidebar, the top bar - is walked once a catalogue is known, each text node
   and attribute keeping its English so the walk can be undone. A view is drawn
   afresh with the new texts, as a navigation draws it, so an edit in progress
   is lost to a change of language as it is to a change of view. The language
   is the choice this browser remembers, else the browser's own, else English;
   a text the catalogue lacks is shown in English. A translation is inserted
   where the English stood, in text and in markup alike, which is why
   build/check-deck-languages.py refuses one carrying a character HTML would
   read. */
const LANGUAGES=[["en","English"],["cs","Čeština"],["da","Dansk"],["de","Deutsch"],["el","Ελληνικά"],["es","Español"],["fi","Suomi"],["fr","Français"],["it","Italiano"],["ja","日本語"],["ko","한국어"],["nb","Norsk bokmål"],["nl","Nederlands"],["pl","Polski"],["pt-BR","Português (Brasil)"],["pt-PT","Português (Portugal)"],["ru","Русский"],["sv","Svenska"],["tr","Türkçe"],["uk","Українська"],["zh-Hans","简体中文"]];
let catalogue={}, language="en";
/* Marks a text a table holds for a later t(); the identity. The checker reads
   the page's keys out of t(), tf() and K(). */
const K=s=>s;
function catalogueHas(key){return Object.prototype.hasOwnProperty.call(catalogue,key)&&typeof catalogue[key]==="string"&&catalogue[key]!=="";}
function t(key){return catalogueHas(key)?catalogue[key]:key;}
function tf(key,...args){let s=t(key);args.forEach((a,i)=>{s=s.split("{"+i+"}").join(String(a));});return s;}
const LOCALISED_ATTRIBUTES=["placeholder","aria-label","title","alt"];
/* The static markup, translated in place and back again: a text node or an
   attribute that is a key keeps its English on the node. The content area is
   skipped - its views are drawn from t() and hold the server's own values,
   and a domain that happened to be named like a key must not be translated -
   and so is anything marked data-nowalk, which is the markup the script draws
   and repaints itself: the shortcut list and the theme button's name. Walking
   those would set them from an English that was already replaced. */
function localiseTree(root){
  Array.from(root.childNodes).forEach(n=>{
    if(n.nodeType===3){
      const original=n.__en!==undefined?n.__en:String(n.nodeValue||"");
      const trimmed=original.trim();
      if(trimmed&&(catalogueHas(trimmed)||n.__en!==undefined)){
        if(n.__en===undefined)n.__en=original;
        n.nodeValue=original.replace(trimmed,()=>t(trimmed));
      }
    }else if(n.nodeType===1){
      if(n.tagName==="SCRIPT"||n.tagName==="STYLE"||n.id==="content"||n.hasAttribute("data-nowalk"))return;
      LOCALISED_ATTRIBUTES.forEach(name=>{
        if(!n.hasAttribute(name))return;
        const key="__en_"+name;
        const given=n[key]!==undefined?n[key]:n.getAttribute(name);
        if(catalogueHas(given)||n[key]!==undefined){n[key]=given;n.setAttribute(name,t(given));}
      });
      localiseTree(n);
    }
  });
}
function knownLanguage(code){
  const lower=String(code||"").toLowerCase();
  const hit=LANGUAGES.filter(p=>p[0].toLowerCase()===lower)[0];
  return hit?hit[0]:null;
}
/* The browser's languages in its order of preference: the first that is one
   here, by its exact tag or by its primary subtag - Portuguese to pt-BR,
   Chinese to zh-Hans, Norwegian of either kind to nb. */
function browserLanguage(){
  const nav=typeof navigator==="undefined"?{}:navigator;
  const wanted=nav.languages&&nav.languages.length?nav.languages:[nav.language||"en"];
  for(const w of wanted){
    const tag=String(w||"");
    const exact=knownLanguage(tag);if(exact)return exact;
    const primary=tag.split("-")[0].toLowerCase();
    if(primary==="pt")return "pt-BR";
    if(primary==="zh")return "zh-Hans";
    if(primary==="no"||primary==="nn")return "nb";
    const byPrimary=knownLanguage(primary);if(byPrimary)return byPrimary;
  }
  return "en";
}
function languageSelects(){return Array.from(document.querySelectorAll("select[data-lang]"));}
function applyCatalogue(code,data){
  catalogue=data||{};language=code;
  try{if(code==="en")localStorage.removeItem("hmsLang");else localStorage.setItem("hmsLang",code);}catch(_){}
  document.documentElement.setAttribute("lang",code);
  localiseTree(document.body);
  paintTheme();
  languageSelects().forEach(s=>{s.value=code;});
  if($("#app").style.display!=="none")render();
}
/* A catalogue the server does not have, or cannot be reached for, leaves the
   page in the language it was in, and the switch says so. */
async function loadLanguage(code){
  if(code===language)return true;
  if(code==="en"){applyCatalogue("en",{});return true;}
  let data=null;
  try{
    const res=await fetch("/deck-lang/"+encodeURIComponent(code)+".json",{credentials:"same-origin",cache:"no-store"});
    if(res.ok)data=await res.json();
  }catch(_){data=null;}
  if(!data||typeof data!=="object"){languageSelects().forEach(s=>{s.value=language;});return false;}
  applyCatalogue(code,data);
  return true;
}
languageSelects().forEach(sel=>{
  LANGUAGES.forEach(p=>{const o=document.createElement("option");o.setAttribute("value",p[0]);o.textContent=p[1];sel.appendChild(o);});
  sel.onchange=()=>loadLanguage(sel.value);
});

/* The server's own OpenAPI document, fetched once per sign-in. Every form on
   this page - which keys a settings group has, what type each one is, which
   words an enumeration takes, which key is write-only and which is read-only -
   is built from it, so a key added to the API appears here without this file
   being touched. */
let spec=null;

/* The last listing each view read, so that an editor can be opened on a row
   without asking again. Never written to instead of re-reading: every write is
   followed by a fresh GET. */
const cache={certificates:[],ports:[],routes:[],rules:[],domains:[],groups:[],ranges:[],lists:[],collections:{},messages:[],remotedomains:[],webhooks:[],
  /* The fetch view's chosen domain and account, kept across its re-reads. */
  fetch:{domain:"",address:"",accounts:[],items:[]}};

/* The editor a view has open, if any: {kind, id, values} - id 0 is a new one. */
let editing=null;

/* Per settings group: the schema it was built from and the values it was built
   with, so that Save can send only what changed. */
const settingsState={};

/* ---------- API ----------
   One entry point for every request. A write carries X-Requested-With, which
   is what the server demands of a request authenticated by the session cookie
   (its own cross-site protection, on top of the cookie's SameSite=Strict), and
   the cookie itself travels because the request is same-origin. Nothing here
   holds a credential: after sign-in the page has no secret at all. */
async function api(path,opts){
  opts=opts||{};
  const method=(opts.method||"GET").toUpperCase();
  const headers=Object.assign({},opts.headers||{});
  if(method!=="GET"&&method!=="HEAD")headers["X-Requested-With"]="hMailServer";
  if(opts.body!==undefined)headers["Content-Type"]="application/json";
  const res=await fetch(path,{method:method,body:opts.body,headers:headers,credentials:"same-origin"});
  if(res.status===401)throw new Error("auth");
  if(!res.ok){
    // A refused request answers {"error":"<a sentence written for the administrator>"};
    // that sentence is the message, and it is what the page shows beside the
    // control that caused it. The whole exchange goes to the console for diagnosis.
    // Some refusals carry a reason word beside the sentence - the breach check's
    // do - and a page that knows the word shows the refusal in its reader's
    // language (refusalText) rather than in the server's English.
    let body="";
    try{body=await res.text();}catch(_){}
    let message="",reason="";
    try{const parsed=JSON.parse(body);message=String(parsed.error||"");reason=String(parsed.reason||"");}catch(_){}
    console.error("API request failed",{path:path,status:res.status,body:body});
    const err=new Error(message||("HTTP "+res.status));
    err.status=res.status;
    err.reason=reason;
    throw err;
  }
  const text=await res.text();
  return text?JSON.parse(text):{};
}
/* The refusals the page translates, by the reason word the server sends beside
   its sentence; any other refusal is shown in the server's own words. */
const REFUSAL_REASONS={
  breached:K("This password appears in a published data breach, so it would be among the first tried against this account. Choose a different one."),
  breach_check_unavailable:K("The password could not be checked against published data breaches just now, and this server is set to refuse a change it cannot check. Try again later.")
};
function refusalText(e){
  if(e&&e.reason&&Object.prototype.hasOwnProperty.call(REFUSAL_REASONS,e.reason))return t(REFUSAL_REASONS[e.reason]);
  return e?e.message:"";
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);}

/* Server-provided values (domain names, addresses, queue entries, TLSA records,
   and every word of the OpenAPI document) are rendered into HTML, so every one
   of them goes through this first. */
function escHtml(v){
  return String(v===undefined||v===null?"":v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}
/* The server's sentence, shown where the request came from. */
function setErr(id,message){const e=document.getElementById(id);if(e)e.textContent=message||"";}
function asList(x,key){return Array.isArray(x)?x:((x&&x[key])||[]);}

/* ---------- The theme ----------
   The webmail's, which is three choices and not two: light, dark, and the
   system's, which is prefers-color-scheme asked through matchMedia and
   followed as the reader changes it in their desktop. A reader who says
   light or dark overrules the system until they say otherwise. The choice
   is what this browser remembers, under a name that is not a secret, and a
   browser that keeps nothing is still a browser. One button cycles the
   three and carries the name of the one it is on, in the reader's language,
   which is why it is marked data-nowalk and painted from here. */
const THEMES=[["system",K("Theme: the system's choice"),"◐"],["light",K("Theme: light"),"☀"],["dark",K("Theme: dark"),"☾"]];
const systemDark=typeof matchMedia==="function"?matchMedia("(prefers-color-scheme: dark)"):null;
let themeChoice="system";
function storedTheme(){
  try{const kept=localStorage.getItem("hmsTheme");return kept==="light"||kept==="dark"?kept:"system";}catch(_){return "system";}
}
function paintTheme(){
  const entry=THEMES.filter(x=>x[0]===themeChoice)[0]||THEMES[0];
  const button=$("#themeBtn");
  if(!button)return;
  button.textContent=entry[2];
  button.setAttribute("title",t(entry[1]));
  button.setAttribute("aria-label",t(entry[1]));
}
function applyTheme(choice){
  themeChoice=choice==="light"||choice==="dark"?choice:"system";
  document.body.dataset.theme=themeChoice==="system"?((systemDark&&!systemDark.matches)?"light":"dark"):themeChoice;
  try{localStorage.setItem("hmsTheme",themeChoice);}catch(_){}
  paintTheme();
}
if(systemDark&&systemDark.addEventListener)systemDark.addEventListener("change",()=>{if(themeChoice==="system")applyTheme("system");});
$("#themeBtn").onclick=()=>{
  const order=THEMES.map(x=>x[0]);
  applyTheme(order[(order.indexOf(themeChoice)+1)%order.length]);
};
applyTheme(storedTheme());

/* ---------- The status pill ----------
   The state of the link to the server, as the desktop console shows it: a
   colour, a mark and a word, never a colour alone. */
function connection(level,key){
  const pill=$("#connPill"),mark=$("#connMark"),word=$("#connState");
  if(pill)pill.setAttribute("data-level",level);
  if(mark)mark.textContent=level==="good"?"■":"▲";
  if(word)word.textContent=t(key);
}

/* ---------- The notice ----------
   A statement in the flow of a page at one of the desktop console's levels:
   the mark, the severity word and the sentence. The word is there because a
   status carried by colour alone is a status half the readers cannot see. */
const NOTICE_WORDS={info:K("Information"),warn:K("Warning"),bad:K("Error")};
const NOTICE_MARKS={info:"◆",warn:"▲",bad:"✕"};
function noticeHtml(level,text){
  if(!text)return "";
  return '<div class="notice" data-level="'+level+'"><span class="mark" aria-hidden="true">'+NOTICE_MARKS[level]+'</span>'+
         '<div><b>'+escHtml(t(NOTICE_WORDS[level]))+'</b>'+escHtml(text)+'</div></div>';
}

/* ---------- Sign in, sign out ----------
   The password is presented once, to POST /api/v1/session, and the server
   answers with an HttpOnly cookie; the page never reads it and never stores a
   credential of its own. When a second factor is enrolled on the administrator
   credential the server answers 401 with second_factor "required", and the
   code field appears. */
function basicCredential(user,password){
  return "Basic "+btoa(unescape(encodeURIComponent(user+":"+password)));
}
$("#loginForm").onsubmit=async e=>{
  e.preventDefault();
  const code=$("#otp").value.trim();
  const headers={"Authorization":basicCredential($("#user").value,$("#pass").value),
                 "X-Requested-With":"hMailServer"};
  if(code)headers["X-hMailServer-OTP"]=code;
  $("#loginErr").textContent="";
  let res;
  try{res=await fetch("/api/v1/session",{method:"POST",headers:headers,credentials:"same-origin"});}
  catch(_){$("#loginErr").textContent=t("Could not reach the server.");return;}
  let body={};
  try{body=JSON.parse(await res.text());}catch(_){}
  if(res.status===201){
    $("#pass").value="";$("#otp").value="";$("#otp").hidden=true;
    // Not a credential and not a secret: a mark saying this tab has a session,
    // so that a reload asks the server whether it is still live instead of
    // showing the sign-in card over a working session. A first visit sets
    // nothing, and so never makes a request the server answers 401 - which is
    // what would put the browser's own password box on the screen.
    try{sessionStorage.setItem("hmsSession","1");}catch(_){}
    try{await startDeck();}
    catch(err){$("#loginErr").textContent=tf("Signed in, but the server did not answer: {0}",err.message);}
    return;
  }
  if(res.status===401&&(body.second_factor==="required"||res.headers.get("X-hMailServer-OTP")==="required")){
    $("#otp").hidden=false;$("#otp").focus();
    $("#loginErr").textContent=t("A one-time code is needed. Enter the code from your authenticator app.");
    return;
  }
  $("#loginErr").textContent=body.error?body.error:t("Authentication failed. Check the password.");
};
$("#logoutBtn").onclick=async()=>{
  try{await api("/api/v1/session",{method:"DELETE"});}catch(_){}
  signedOut(t("Signed out."));
};
function signedOut(message){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  spec=null;editing=null;
  try{sessionStorage.removeItem("hmsSession");}catch(_){}
  $("#app").style.display="none";
  $("#gate").style.display="grid";
  $("#loginErr").textContent=message||"";
  $("#pass").focus();
}
/* What the signed-in credential may do. Read once, at sign-in, from the server's
   own answer - never inferred here - and used for one thing: leaving out a page
   this role may not use, rather than showing one whose every button answers 403.
   It is not a security boundary and is not treated as one; the server refuses
   the request whatever this page shows, which is why a whoami that cannot be
   read leaves every view in place rather than hiding the Deck from somebody
   whose credential is perfectly good. */
let permissions=null;
/* True when the credential is confined to named domains. A view whose data is
   the whole server's - the settings, the queue, the logs - is refused to such a
   credential whatever permission it holds, so it is left out for it too. */
let confined=false;
/* True when the credential is the administrator password itself rather than an
   account holding a role. A few routes answer to it alone and consult no
   permission at all - the api keys, the [Settings] section of hMailServer.ini,
   and the Changed from stock list, which is those settings' values seen from
   another angle - so a view of one of them says data-admin rather than naming a
   permission: view_configuration would put it in front of an auditor whose every
   request it refuses. It starts true, as the permissions start unknown, so that
   a whoami that could not be read never hides a page from the credential that
   may use it. */
let administrator=true;
/* administer_server is the whole of it, as it is in RoleManager::Allows. */
function may(permission){return !permissions||!permission||permissions.indexOf("administer_server")>=0||permissions.indexOf(permission)>=0;}
/* A view that needs more than one permission names them all in data-needs,
   separated by spaces, and is shown only when every one is held - the reports
   need view_configuration and view_message_trace, as the server decides in
   RestApiServer::SecondPermissionFor_, because their senders and recipients
   are who mails whom. */
function mayAll(needs){return String(needs||"").split(" ").filter(Boolean).every(may);}
/* Whether a view is in the navigation for this credential. The tour and the
   keyboard ask this rather than walking into a view applyPermissions left out. */
function viewShown(name){
  const b=Array.from(document.querySelectorAll("#nav button[data-view]")).filter(x=>x.dataset.view===name)[0];
  return !!b&&!b.hidden;
}
function applyPermissions(){
  const buttons=Array.from(document.querySelectorAll("#nav button[data-view]"));
  let visible=null;
  buttons.forEach(b=>{
    const allowed=mayAll(b.dataset.needs)&&!(confined&&b.dataset.serverwide)&&!(b.dataset.admin&&!administrator);
    b.hidden=!allowed;
    if(allowed&&!visible)visible=b.dataset.view;
  });
  if(!visible){view=null;return;}
  if(!buttons.some(b=>b.dataset.view===view&&!b.hidden)){
    view=visible;
    buttons.forEach(b=>b.classList.toggle("on",b.dataset.view===view));
  }
}
async function readSession(){
  permissions=null;confined=false;administrator=true;
  try{
    const who=await api("/api/v1/session");
    if(who&&Array.isArray(who.permissions))permissions=who.permissions;
    confined=!!(who&&Array.isArray(who.domains)&&who.domains.length>0);
    if(who&&who.credential)administrator=who.credential==="administrator";
  }catch(_){/* an older server, or a request that did not arrive: show everything */}
  applyPermissions();
}
/* What happens after a session exists: the credential's permissions first,
   then the status for the version in the footer - but only for a role that may
   read it. A help desk may not, and asking would answer 403 and leave it
   standing at the sign-in card with a working session. */
async function startDeck(){
  await readSession();
  const status=may("view_configuration")?await api("/api/v1/status"):{};
  enter(status);
}

/* ---------- Tours ----------
   Teaching a view while somebody uses it. One mechanism, the same shape as the
   desktop Control Panel's and the webmail's: a step is an element (by id or by
   a stable selector), one sentence, an optional condition that ends the step
   when the thing has happened, and what to do when the element is not there -
   skip it, or end the tour saying so. A tour is an ordered list of those with a
   name and a version.

   Four properties of it are the feature rather than decoration, and each is
   checked by build/deck-script-test.js:

     * it is never modal - the ring takes no pointer events and the card is the
       only thing on its layer that does, so every control underneath, the one
       being pointed at included, stays usable;
     * it never takes the keyboard - nothing is focused when a step opens, and
       the card's three buttons are ordinary tab stops;
     * a step whose element is not on the view is skipped rather than waited on,
       because a view draws what the server has and a server without a domain
       has no domain row to point at;
     * where it got to is remembered, so leaving a tour is not losing it.

   Every sentence goes through the catalogues like every other text on this
   page: K() marks it here and t() looks it up when it is drawn. */
const TOURS=[{
  id:"firstrun",
  name:K("Show me around"),
  version:1,
  steps:[
    {view:"domains",sel:"#newDomain",until:"domain-exists",
     text:K("Start with a domain: the part after the @ that this server accepts mail for. Add yours here.")},
    {view:"domains",sel:"#content .tablewrap",
     text:K("Your domains live in this list. Opening one gives you its accounts, aliases and distribution lists.")},
    {view:"domains",sel:'#content button[data-act="accounts"]',
     text:K("Now a mailbox. An account is an address somebody signs in to and receives mail at.")},
    {view:"ports",sel:"#content .tablewrap",missing:"end",
     text:K("These are the ports the server listens on. The submission port, 587, is the one your own people send through.")},
    {view:"ports",sel:'#content button[data-act="portnew"]',until:"tls-listener",
     text:K("A listener wants a certificate and STARTTLS, so that no password crosses the network in the clear.")},
    {view:"certs",sel:"#content .tablewrap",
     text:K("Certificates a listener can present are kept here, and ACME can renew them for you.")},
    {view:"dash",sel:"#kpiState",
     text:K("And this is the server's own verdict on what you have built. It is the page to come back to.")}
  ]}];
/* What a step can wait for. Answered from what the view has just read rather
   than from the words on the screen: a table cell says "Starttls optional" in
   English only, and a condition that stopped working in German would be a
   defect nobody here would ever see. */
const TOUR_CONDITIONS={
  "domain-exists":()=>cache.domains.length>0,
  "tls-listener":()=>cache.ports.some(p=>String(p.connection_security||"none")!=="none")
};
function tourFind(id){return TOURS.filter(x=>x.id===id)[0]||null;}
/* Which tours this browser has finished, and where it stopped in one it left.
   One line, finished then resume points - "firstrun=1|firstrun@3v1" - which is
   the form the Control Panel keeps in the registry, so the two surfaces can be
   read with one explanation. Every kind of damage is survivable and silent:
   the worst it can cost is being offered a tour twice. */
function tourProgress(){
  const out={finished:{},stopped:{}};
  let raw="";
  try{raw=localStorage.getItem("hmsTours")||"";}catch(_){raw="";}
  const halves=String(raw).split("|");
  halves[0].split(",").forEach(pair=>{
    const at=pair.indexOf("=");if(at<=0)return;
    const version=parseInt(pair.slice(at+1),10);
    if(version>0)out.finished[pair.slice(0,at).trim()]=version;
  });
  (halves[1]||"").split(",").forEach(pair=>{
    const at=pair.indexOf("@");if(at<=0)return;
    const rest=pair.slice(at+1),mark=rest.indexOf("v");if(mark<=0)return;
    const step=parseInt(rest.slice(0,mark),10),version=parseInt(rest.slice(mark+1),10);
    if(step>0&&version>0)out.stopped[pair.slice(0,at).trim()]={step:step,version:version};
  });
  return out;
}
function tourSaveProgress(p){
  const finished=Object.keys(p.finished).sort().map(id=>id+"="+p.finished[id]).join(",");
  const stopped=Object.keys(p.stopped).sort().map(id=>id+"@"+p.stopped[id].step+"v"+p.stopped[id].version).join(",");
  try{localStorage.setItem("hmsTours",finished+"|"+stopped);}catch(_){}
}
function tourFinished(t0){const p=tourProgress();return !!t0&&(p.finished[t0.id]||0)>=t0.version;}
function tourResumeAt(t0){
  const stop=tourProgress().stopped[t0.id];
  return stop&&stop.version===t0.version&&stop.step<t0.steps.length?stop.step:0;
}
/* The tour running now: the tour, the step it is on, and what its condition
   said when the step opened. That last one is why a step does not vanish in
   front of somebody who already has a domain - it is the CHANGE that ends a
   step, not the state. */
let tourNow=null;
let tourTimer=null;
function tourCondition(step){
  const test=step&&step.until?TOUR_CONDITIONS[step.until]:null;
  try{return !!test&&!!test();}catch(_){return false;}
}
/* The element a step points at, with the view it is on opened first: a control
   on a view nobody has drawn is in no document to be found in. */
async function tourElement(step){
  if(step.view&&!viewShown(step.view))return null;
  if(step.view&&step.view!==view){
    view=step.view;editing=null;
    document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.view===view));
    await render();
  }
  return $(step.sel);
}
/* From this step onwards, the first one that can be shown. A step whose element
   is missing is skipped; a step marked missing:"end" stops the tour instead,
   which is for the one whose absence makes the rest meaningless. */
async function tourSettle(from){
  for(let at=from;at<tourNow.tour.steps.length;at++){
    const step=tourNow.tour.steps[at];
    if(await tourElement(step)){tourNow.at=at;tourNow.entry=tourCondition(step);return true;}
    if(step.missing==="end"){tourNow.at=at;tourEnd("missing");return false;}
  }
  tourEnd("finished");
  return false;
}
async function tourStart(id,at){
  const t0=tourFind(id);
  if(!t0||$("#app").style.display==="none")return;
  tourNow={tour:t0,at:0,entry:false};
  const from=typeof at==="number"&&at>=0?Math.min(at,t0.steps.length-1):tourResumeAt(t0);
  if(!await tourSettle(from))return;
  tourDraw();
  if(!tourTimer)tourTimer=setInterval(tourTick,400);
}
function tourDraw(){
  const step=tourNow.tour.steps[tourNow.at];
  $("#tourName").textContent=t(tourNow.tour.name);
  $("#tourStep").textContent=tf("Step {0} of {1}",tourNow.at+1,tourNow.tour.steps.length);
  $("#tourText").textContent=t(step.text);
  $("#tourBack").hidden=tourNow.at===0;
  $("#tourNext").textContent=tourNow.at===tourNow.tour.steps.length-1?t("Finish"):t("Next");
  $("#tourCard").hidden=false;
  tourPlace();
}
/* The ring put back where the element is. The view under a tour goes on living
   - it scrolls, it redraws itself every three seconds on the dashboard - and a
   ring left where the element used to be is worse than no ring. An element that
   has gone takes the ring with it and leaves the card, because the sentence is
   still the sentence. */
function tourPlace(){
  if(!tourNow)return;
  const step=tourNow.tour.steps[tourNow.at];
  const el=$(step.sel);
  const ring=$("#tourRing"),card=$("#tourCard");
  if(!el||!el.getBoundingClientRect){ring.hidden=true;return;}
  const at=el.getBoundingClientRect();
  if(!at.width&&!at.height){ring.hidden=true;return;}
  ring.hidden=false;
  ring.style.left=at.left+"px";ring.style.top=at.top+"px";
  ring.style.width=at.width+"px";ring.style.height=at.height+"px";
  const height=card.offsetHeight||190;
  const room=typeof innerHeight==="number"?innerHeight:900;
  const wide=typeof innerWidth==="number"?innerWidth:1280;
  let top=at.bottom+12;
  if(top+height>room)top=Math.max(8,at.top-12-height);
  card.style.top=Math.max(8,Math.min(top,Math.max(8,room-height-8)))+"px";
  card.style.left=Math.max(8,Math.min(at.left,Math.max(8,wide-346)))+"px";
}
function tourTick(){
  if(!tourNow){if(tourTimer){clearInterval(tourTimer);tourTimer=null;}return;}
  tourPlace();
  const step=tourNow.tour.steps[tourNow.at];
  if(step.until&&!tourNow.entry&&tourCondition(step))tourNext();
}
async function tourNext(){
  if(!tourNow)return;
  if(tourNow.at+1>=tourNow.tour.steps.length){tourEnd("finished");return;}
  if(await tourSettle(tourNow.at+1))tourDraw();
}
async function tourBack(){
  if(!tourNow)return;
  for(let at=tourNow.at-1;at>=0;at--){
    if(await tourElement(tourNow.tour.steps[at])){
      tourNow.at=at;tourNow.entry=tourCondition(tourNow.tour.steps[at]);tourDraw();return;
    }
  }
  // Nowhere to go back to is standing still, never closing the tour: Back is
  // how somebody re-reads a sentence, and a Back that ended it would be a trap.
  tourDraw();
}
/* Every ending says something. Silence after a tour that stopped on its own is
   how somebody decides the feature is broken. */
function tourEnd(why){
  if(!tourNow)return;
  const walk=tourNow.tour,at=tourNow.at;
  const progress=tourProgress();
  if(why==="finished"){progress.finished[walk.id]=Math.max(progress.finished[walk.id]||0,walk.version);delete progress.stopped[walk.id];}
  else if(why==="left"&&at>0)progress.stopped[walk.id]={step:at,version:walk.version};
  else delete progress.stopped[walk.id];
  tourSaveProgress(progress);
  tourNow=null;
  if(tourTimer){clearInterval(tourTimer);tourTimer=null;}
  $("#tourCard").hidden=true;$("#tourRing").hidden=true;
  if(why==="finished")toast(tf("That is the end of {0}. You can start it again whenever you like.",t(walk.name)));
  else if(why==="missing")toast(tf("{0} stops here: the next thing it points at is not on this screen.",t(walk.name)));
  else toast(tf("{0} closed. It picks up where you left off.",t(walk.name)));
}
/* The header's entry point. It starts the tour that visits the view showing, at
   its first stop there, so the button teaches THIS view; on a view no tour
   visits it starts at the beginning. */
$("#tourBtn").onclick=()=>{
  if(tourNow){tourEnd("left");return;}
  for(const walk of TOURS){
    for(let at=0;at<walk.steps.length;at++)
      if(walk.steps[at].view===view)return tourStart(walk.id,at);
  }
  if(TOURS.length)tourStart(TOURS[0].id,-1);
};
$("#tourNext").onclick=()=>tourNext();
$("#tourBack").onclick=()=>tourBack();
$("#tourSkip").onclick=()=>tourEnd("left");
/* Escape leaves the tour only when the keyboard is already inside its card.
   Everywhere else Escape still belongs to the page, and a tour that ate it
   would be exactly the "in the way of the keyboard" this promises not to be. */
document.addEventListener("keydown",e=>{

/* ---------- The keyboard ----------
   The webmail's, as far as an administration page has the same things to do:
   / puts the keyboard in the search box, ? opens the list of the shortcuts
   themselves, Escape closes what is open or leaves the search box, the arrows
   move a cursor down the rows of whatever table the view has drawn and Enter
   opens the row it is on, and the arrows move between the views while the
   keyboard is in the navigation column. Every control the page draws is a
   button, a field or a link, reached with Tab and ringed while it holds the
   keyboard, which is what the rest of this rests on: the page is usable with
   no pointer at all.

   The key names are literals rather than texts, because Esc and Tab are what
   is printed on the keyboard in front of the reader; what each one does is a
   text, and the list is drawn afresh every time it is opened so that it is
   drawn in the language the page is in. */
const SHORTCUTS=[
  ["/",K("Search this view")],
  ["?",K("Show or hide this list")],
  ["Esc",K("Close this list, or leave the search box")],
  ["↑ ↓",K("Move through the rows of a table, or the views while the keyboard is in the navigation column")],
  ["Enter",K("Open the row the cursor is on")],
  ["Tab",K("Move to the next control; the one holding the keyboard is ringed")]
];
function keysOpen(){return $("#keysOverlay").hidden===false;}
function openKeys(){
  $("#keysList").innerHTML=SHORTCUTS.map(pair=>'<dt><kbd>'+escHtml(pair[0])+'</kbd></dt><dd>'+escHtml(t(pair[1]))+'</dd>').join("");
  $("#keysOverlay").hidden=false;
  $("#keysClose").focus();
}
function closeKeys(){$("#keysOverlay").hidden=true;$("#keysBtn").focus();}
$("#keysBtn").onclick=()=>{if(keysOpen())closeKeys();else openKeys();};
$("#keysClose").onclick=closeKeys;
$("#keysOverlay").onclick=e=>{if(e.target===$("#keysOverlay"))closeKeys();};

/* The row the keyboard is on: an index into the rows the drawn view has, the
   ones the search has hidden left out. A view drawn afresh has none. */
let rowCursor=-1;
function cursorRows(){
  return Array.from(document.querySelectorAll("#content tbody tr")).filter(r=>!r.hidden&&!r.querySelector("td.empty"));
}
function markRow(at){
  const rows=cursorRows();
  if(!rows.length){rowCursor=-1;return;}
  rowCursor=Math.max(0,Math.min(rows.length-1,at));
  rows.forEach((r,i)=>r.classList.toggle("cur",i===rowCursor));
  rows[rowCursor].scrollIntoView();
}
/* Enter presses the row's first button that is not a destructive one, which
   is the one that opens it: Accounts on a domain, Edit on a rule, Last 200
   on a log file. A row whose only button deletes it - a certificate's - is a
   row Enter leaves alone, because a keyboard that deletes what an arrow key
   landed on is a keyboard nobody uses twice. */
function openRow(){
  const rows=cursorRows();
  if(rowCursor<0||!rows[rowCursor])return;
  const button=Array.from(rows[rowCursor].querySelectorAll("button[data-act]")).filter(b=>!b.classList.contains("danger"))[0];
  if(button)button.click();
}

/* One search for every view. It hides the rows of a table and the rows of a
   form that do not carry what was typed, which is what the desktop console's
   toolbar does to a grid. Two views have a filter of their own - the settings
   page and the server messages - and both are read here, so a row has to
   answer to both boxes rather than to whichever was typed in last. */
function filterRows(){
  const box=$("#deckSearch");
  const wide=box?String(box.value||"").trim().toLowerCase():"";
  const own=document.getElementById("setFilter")||document.getElementById("msgFilter");
  const narrow=own?String(own.value||"").trim().toLowerCase():"";
  const keeps=text=>(!wide||text.indexOf(wide)>=0)&&(!narrow||text.indexOf(narrow)>=0);
  document.querySelectorAll("#content tbody tr").forEach(r=>{
    if(r.querySelector("td.empty"))return;
    r.hidden=!keeps(r.textContent.toLowerCase());
  });
  document.querySelectorAll("#content .fr").forEach(r=>{
    r.hidden=!keeps(r.dataset.k||r.textContent.toLowerCase());
  });
  if(rowCursor>=0)markRow(rowCursor);
}
$("#deckSearch").oninput=filterRows;

document.addEventListener("keydown",e=>{
  // The sign-in card owns the keyboard until there is a session.
  if($("#app").style.display==="none")return;
  const tag=(e.target&&e.target.tagName)||"";
  if(e.key==="Escape"){
    if(keysOpen()){e.preventDefault();closeKeys();return;}
    if(e.target===$("#deckSearch")){
      e.preventDefault();
      $("#deckSearch").value="";filterRows();$("#deckSearch").blur();$("#content").focus();
    }
    return;
  }
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="?"){e.preventDefault();if(keysOpen())closeKeys();else openKeys();return;}
  // The shortcut list has one control, so keeping Tab on it is the whole trap:
  // the keyboard cannot wander behind an open sheet and act on what it hides.
  if(keysOpen()){if(e.key==="Tab"){e.preventDefault();$("#keysClose").focus();}return;}
  if(e.key==="/"){e.preventDefault();$("#deckSearch").focus();$("#deckSearch").select();return;}
  const inNav=e.target&&e.target.closest?e.target.closest("#nav"):null;
  if(inNav){
    if(e.key!=="ArrowDown"&&e.key!=="ArrowUp")return;
    const buttons=Array.from(document.querySelectorAll("#nav button")).filter(b=>!b.hidden);
    const at=buttons.indexOf(e.target.closest("button"));
    const next=buttons[(at+(e.key==="ArrowDown"?1:buttons.length-1))%buttons.length];
    if(next){e.preventDefault();next.focus();}
    return;
  }
  if(e.key==="ArrowDown"){e.preventDefault();markRow(rowCursor<0?0:rowCursor+1);return;}
  if(e.key==="ArrowUp"){e.preventDefault();markRow(rowCursor<0?0:rowCursor-1);return;}
  if(e.key==="Enter"&&rowCursor>=0){e.preventDefault();openRow();}
});

/* ---------- The OpenAPI document ---------- */
async function loadSpec(){
  if(!spec)spec=await api("/api/v1/openapi.json");
  return spec;
}
function operation(path,method){
  const p=((spec||{}).paths||{})[path];
  return (p&&p[method])||{};
}
function bodySchema(path,method){
  const c=((operation(path,method).requestBody||{}).content||{})["application/json"]||{};
  return c.schema||{};
}
function properties(path,method){return bodySchema(path,method).properties||{};}
function requiredOf(path,method){return bodySchema(path,method).required||[];}
/* The sentences of a description that mention a word, so that what the page
   tells the administrator about (say) restarting is the server's own wording
   and not a copy of it that can drift. */
function sentencesWith(text,word){
  return String(text||"").split(". ")
    .filter(s=>s.toLowerCase().indexOf(word)>=0)
    .map(s=>s.replace(/\.$/,"")+".").join(" ");
}
/* The defaults a create route states in prose - "all_addresses (default true)"
   for a route, "connection_security to none" for a port - so that a new record's
   form starts where the server would put it rather than at blank and false. A
   key the description does not mention simply keeps the empty control. */
function documentedDefaults(path,method,props){
  const text=operation(path,method).description||"";
  const out={};
  Object.keys(props).forEach(key=>{
    // The gap between the key and its "(default …)" may name the key's other
    // spelling but must not cross a bracket: without that, "addresses (an array
    // of e-mail addresses) and connection_security (default none)" hands the
    // address list the word "none".
    const parenthesised=new RegExp("\\b"+key+"\\b[^.;()]{0,40}?\\(default ([^),:]*)[),:]").exec(text);
    // "connection_security (none, starttls_optional, starttls_required, tls;
    // default none)" and "server_type (pop3, the default, or imap)": the
    // words listed first, the default named among them.
    const listed=new RegExp("\\b"+key+"\\b \\([^)]*;\\s*default ([^)]*)\\)").exec(text);
    const theDefault=new RegExp("\\b"+key+"\\b \\(([A-Za-z0-9_.:]+), the default").exec(text);
    const prose=new RegExp("\\b"+key+"\\b (?:defaults to|to) ([A-Za-z0-9_.:]+)").exec(text);
    const match=parenthesised||listed||theDefault||prose;
    if(!match)return;
    const raw=String(match[1]).trim();
    const type=props[key].type||"string";
    if(type==="boolean"){if(raw==="true"||raw==="false")out[key]=raw==="true";return;}
    if(type==="integer"){const n=Number(raw);if(isFinite(n))out[key]=n;return;}
    // "mode (...; default public, and any other word is refused)": for a key
    // with words, the first word of the match that is one of them.
    if(props[key]["enum"]){
      const word=raw.split(/[^A-Za-z0-9_]+/).filter(w=>props[key]["enum"].indexOf(w)>=0)[0];
      if(word)out[key]=word;
      return;
    }
    out[key]=raw;
  });
  return out;
}

/* ---------- Building a control from a schema property ---------- */
const ACRONYMS={smtp:"SMTP",imap:"IMAP",pop3:"POP3",tls:"TLS",ssl:"SSL",starttls:"STARTTLS",sasl:"SASL",
  acl:"ACL",ip:"IP",ipv6:"IPv6",kb:"KB",mb:"MB",mx:"MX",ptr:"PTR",spf:"SPF",dkim:"DKIM",dmarc:"DMARC",arc:"ARC",
  dane:"DANE",tlsa:"TLSA",ca:"CA",id:"ID",url:"URL",tcpip:"TCP/IP",csa:"CSA",sql:"SQL",dns:"DNS",helo:"HELO"};
function humanise(key){
  const words=String(key).split("_");
  return words.map((w,i)=>ACRONYMS[w]||(i===0?w.charAt(0).toUpperCase()+w.slice(1):w)).join(" ");
}
function optionsHtml(values,selected){
  return values.map(v=>{
    const value=(v&&typeof v==="object")?v.value:v;
    const label=(v&&typeof v==="object")?v.label:humanise(v);
    return '<option value="'+escHtml(value)+'"'+(String(value)===String(selected===undefined?"":selected)?" selected":"")+'>'+escHtml(label)+'</option>';
  }).join("");
}
function isPassword(key,prop){return !!prop.writeOnly||/password$/.test(key);}
function controlHtml(prefix,key,prop,value,opts){
  const id=prefix+"_"+key;
  const type=prop.type||"string";
  if(prop.readOnly)
    return '<code class="ro">'+escHtml(value===undefined||value===null||value===""?"—":value)+'</code>';
  if(opts.choices&&opts.choices[key])
    return '<select id="'+id+'">'+optionsHtml(opts.choices[key],value)+'</select>';
  if(prop["enum"])
    return '<select id="'+id+'">'+optionsHtml(prop["enum"],value)+'</select>';
  if(type==="boolean")
    return '<input type="checkbox" id="'+id+'"'+(value?" checked":"")+'>';
  if(type==="integer")
    return '<input type="number" id="'+id+'" value="'+escHtml(value===undefined||value===null?"":value)+'">';
  if(type==="array")
    return '<textarea id="'+id+'" rows="4" placeholder="'+escHtml(t("One per line"))+'">'+escHtml((Array.isArray(value)?value:[]).join("\n"))+'</textarea>';
  if(prop.format==="multiline")
    return '<textarea id="'+id+'" rows="5">'+escHtml(value===undefined||value===null?"":value)+'</textarea>';
  if(isPassword(key,prop))
    return '<input type="password" id="'+id+'" value="" autocomplete="new-password" placeholder="'+escHtml(opts.passwordHint||t("left unchanged unless filled"))+'">';
  return '<input type="text" id="'+id+'" value="'+escHtml(value===undefined||value===null?"":value)+'">';
}
function formHtml(prefix,props,values,opts){
  opts=opts||{};
  const required=opts.required||[];
  return Object.keys(props).map(key=>{
    if(opts.skip&&opts.skip.indexOf(key)>=0)return "";
    const prop=props[key];
    const value=values?values[key]:undefined;
    const caption=humanise(key);
    // A hint this page wrote is a key and comes back in the reader's language;
    // a sentence from the server's document is not one and comes back as it is.
    const description=prop.description?t(prop.description):"";
    const restart=/takes effect when the server restarts/i.test(prop.description||"");
    const flags=(required.indexOf(key)>=0?'<span class="badge info">'+t("required")+'</span> ':"")+
                (prop.readOnly?'<span class="badge info">'+t("read-only")+'</span> ':"")+
                (isPassword(key,prop)?'<span class="badge info">'+t("write-only")+'</span> ':"")+
                (restart?'<span class="badge warn">'+t("restart")+'</span>':"");
    const search=(key+" "+caption+" "+description).toLowerCase();
    return '<div class="fr" data-k="'+escHtml(search)+'">'+
             '<div class="lab"><b>'+escHtml(caption)+'</b><code>'+escHtml(key)+'</code> '+flags+
               (description?'<div class="hint">'+escHtml(description)+'</div>':"")+'</div>'+
             '<div class="ctl">'+controlHtml(prefix,key,prop,value,opts)+'</div>'+
           '</div>';
  }).join("");
}
/* Reads a form back into a plain object of the schema's types. An empty number
   is left out rather than sent as 0: on a create that lets the server apply its
   own default, and on a settings save it means "unchanged". */
function readForm(prefix,props,opts){
  opts=opts||{};
  const out={};
  Object.keys(props).forEach(key=>{
    const prop=props[key];
    if(prop.readOnly)return;
    if(opts.skip&&opts.skip.indexOf(key)>=0)return;
    const el=document.getElementById(prefix+"_"+key);
    if(!el)return;
    const type=prop.type||"string";
    if(isPassword(key,prop)){if(el.value!=="")out[key]=el.value;return;}
    if(type==="boolean"){out[key]=el.checked;return;}
    if(type==="integer"){
      const raw=String(el.value).trim();
      if(raw==="")return;
      const n=Number(raw);
      if(!isFinite(n)||Math.floor(n)!==n)throw new Error(tf("{0} must be a whole number.",humanise(key)));
      out[key]=n;return;
    }
    if(type==="array"){out[key]=el.value.split("\n").map(s=>s.trim()).filter(Boolean);return;}
    out[key]=el.value;
  });
  return out;
}

/* ---------- Dashboard ---------- */
function animateNum(el,target){
  const start=parseInt(el.dataset.v||"0",10),diff=target-start;if(!diff){el.textContent=target.toLocaleString();return}
  const t0=performance.now();
  (function step(t){const k=Math.min(1,(t-t0)/600),e=1-Math.pow(1-k,3);
    el.textContent=Math.round(start+diff*e).toLocaleString();
    if(k<1)requestAnimationFrame(step);else el.dataset.v=target})(t0);
}

/* ---------- Domains and accounts ----------
   The domain's editor holds every field PUT /api/v1/domains/{domain} takes,

   is write-only are as the handler reads them. The handler refuses a key it

async function createDomain(){
  setErr("err_domainnew","");
  const name=$("#newDomain").value.trim(),postmaster=$("#newPostmaster").value.trim(),active=$("#newDomainActive").checked;
  if(!name){setErr("err_domainnew",t("A domain name is required."));return;}
  try{
    await api("/api/v1/domains",{method:"POST",body:JSON.stringify({name:name,active:active,postmaster:postmaster})});
    toast(tf("Domain created: {0}",name));
    // Read back, and then straight into the editor of the domain as the
    // server holds it, where the rest of its settings are.
    cache.domains=asList(await api("/api/v1/domains"),"domains");
    if(cache.domains.some(d=>d.name===name))await openDomain(name);else await render();
  }catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_domainnew",e.message);}
}
async function openDomain(name){
  const existing=cache.domains.filter(d=>d.name===name)[0];
  if(!existing)return;
  editing={kind:"domain",name:name,values:JSON.parse(JSON.stringify(existing)),aliases:[],aliasError:"",senders:[],senderError:"",traps:[],trapHits:[],trapError:"",rotation:null,rotationError:""};
  try{await reloadDomainAliases();}
  catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}editing.aliasError=e.message;}
  // The domain's own allow and block list, read with the domain rather than
  // through the Lists view: it belongs to this domain the way its other names
  // do, and a domain administrator whose key is scoped to it has no other way in.
  try{await reloadDomainSenders();}
  catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}editing.senderError=e.message;}
  // The domain's spam traps, and what has addressed them: read with the domain,
  // because a trap is a property of the domain as its other names are, and a
  // domain administrator confined to it has no other way in.
  try{await reloadDomainTraps();}
  catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}editing.trapError=e.message;}
  try{await reloadRotation();}
  catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}editing.rotationError=e.message;}
  renderDomainEditor();
}

function renderDomainEditor(){
  const cards=DOMAIN_GROUPS.map(g=>`
    <div class="sect"><h2>${escHtml(t(g.title))}</h2>
      <div class="card flat"><div class="form">${formHtml("dom",g.props,editing.values,{required:["active"]})}</div></div></div>`);
  // The names the domain answers to, between General and Limits as the
  // desktop dialog has them; drawn into their own box so that adding or
  // removing one redraws the box and not the edits in the other groups.
  cards.splice(1,0,`<div class="sect"><h2>${t("Names")}</h2><div class="card flat" id="domainNames">${domainNamesHtml()}</div></div>`);
  // The allow and block list sits after the digest, the other half of the same
  // question: who decides that a message is wanted, and how a person sees what
  // was held. +2: one for Names above, one to come after the digest group.
  const digestAt=DOMAIN_GROUPS.findIndex(g=>g.title==="Quarantine digest");
  cards.splice(digestAt>=0?digestAt+2:cards.length,0,`<div class="sect"><h2>${t("Allow and block list")}</h2><div class="card flat" id="domainSenders">${domainSendersHtml()}</div></div>`);
  // The key rotation under the DKIM group it belongs to, in a box of its own so
  // that an action redraws the rotation and not the edits in the groups above.
  // The traps after the allow and block list: both are this domain saying which
  // mail it does not want, one by naming senders and one by naming addresses
  // that were never real.
  cards.splice(digestAt>=0?digestAt+3:cards.length,0,`<div class="sect"><h2>${t("Spam traps")}</h2><div class="card flat" id="domainTraps">${domainTrapsHtml()}</div></div>`);
  cards.push(`<div class="sect"><h2>${t("DKIM key rotation")}</h2><div class="card flat" id="dkimRotation">${rotationHtml()}</div></div>`);
  $("#content").innerHTML=`<div class="view">
    <button class="btn ghost sm" data-act="cancel">${t("‹ All domains")}</button>
    <div class="sect"><h2>${tf("Domain {0}",escHtml(editing.name))}</h2>
      <div class="card flat"><p class="note">${escHtml(operation("/api/v1/domains/{domain}","put").description||"")}</p></div></div>
    ${cards.join("")}

      <div class="err" id="err_domainedit"></div>
    </div></div>
  </div>`;
}
async function saveDomain(){
  setErr("err_domainedit","");
  const props=domainProps();
  let all;
  try{all=readForm("dom",props,{});}catch(e){setErr("err_domainedit",e.message);return;}
  const body={active:!!all.active};
  Object.keys(all).forEach(k=>{
    if(k==="active"||all[k]===undefined)return;
    if(isPassword(k,props[k])){body[k]=all[k];return;}
    if(all[k]!==editing.values[k])body[k]=all[k];
  });
  if(Object.keys(body).length===1&&body.active===!!editing.values.active){toast(t("Nothing changed"));return;}
  const oldName=editing.name;
  try{
    await api("/api/v1/domains/"+encodeURIComponent(oldName),{method:"PUT",body:JSON.stringify(body)});
    // The domain as the server holds it now, read back rather than taken
    // from the answer, and the editor redrawn from that - under its new name
    // when it was renamed.
    cache.domains=asList(await api("/api/v1/domains"),"domains");
    const newName=body.name!==undefined?body.name:oldName;
    const fresh=cache.domains.filter(d=>d.name===newName)[0]||cache.domains.filter(d=>d.name===oldName)[0];
    if(!fresh){editing=null;toast(t("Domain saved"));await render();return;}
    editing.name=fresh.name;editing.values=JSON.parse(JSON.stringify(fresh));
    // A policy saved above can change what the rotation is waiting for.
    try{await reloadRotation();editing.rotationError="";}catch(e){if(e.message==="auth")throw e;editing.rotationError=e.message;}
    toast(fresh.name!==oldName?tf("Domain renamed to {0}",fresh.name):t("Domain saved"));
    renderDomainEditor();
  }catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_domainedit",e.message);}
}
/* ---------- DKIM key rotation ----------
   The domain's rotation as GET /api/v1/domains/{domain}/dkim/rotation answers it:
   the phase, the current, next, retiring and retired selectors with the records
   to publish, keep or remove, the last check of each from the server's own
   resolver as a pill (colour, mark and word), and what is waiting and until when.
   The server decides everything; the page draws the document and posts the five
   operations, and a refusal is shown in the server's own words. The records'
   hosts and values are the server's and go through escHtml like everything else
   it says. The policy is five keys of the domain itself, in the DKIM group above. */
const ROTATION_PHASES={off:K("Off"),idle:K("Idle"),awaiting_dns:K("Waiting for the DNS record"),propagating:K("Propagating"),
  ready:K("Ready to switch"),waiting_for_retiring_slot:K("Waiting for the old selector to retire")};
const ROTATION_CHECKS={unchecked:["info",K("Not checked")],matches:["good",K("Matches")],not_found:["warn",K("Not found")],
  different:["bad",K("Different")],lookup_failed:["warn",K("Lookup failed")],key_unreadable:["bad",K("Key unreadable")]};
const ROTATION_MARKS={good:"■",info:"◆",warn:"▲",bad:"✕"};
const ROTATION_ACTIONS={publish:K("Publish"),keep:K("Keep"),remove:K("Remove")};
const ROTATION_WAITS={
  not_scheduled:K("No rotation is scheduled. Rotate now to start one."),
  domain_inactive:K("The domain is inactive, so the schedule starts no rotation."),
  interval:K("The next rotation starts when the interval has passed."),
  unchecked:K("The new key's record has not been checked yet."),
  record_not_found:K("The new key's record was not found. Publish it."),
  record_differs:K("The published record does not carry the new key. Correct it."),
  lookup_failed:K("The DNS lookup failed. It is tried again on the next pass."),
  key_unreadable:K("The new key's file could not be read."),
  propagation:K("The record is propagating."),
  retiring_slot:K("Waiting for the old selector to be retired."),
  retention:K("The old selector is kept for mail still on its way.")};
function rotationPath(action){return "/api/v1/domains/"+encodeURIComponent(editing.name)+"/dkim/rotation"+(action||"");}
async function reloadDomainTraps(){
  // Both paths written out where they are fetched, as every other reload
  // function writes its own. build/check-deck-parity.py reads those calls to
  // census which routes this page uses, and it can only read a literal: a path
  // held in a variable is credited to every collection the page knows, and a
  // path built by concatenating one is credited to none.
  editing.traps=asList(await api("/api/v1/domains/"+encodeURIComponent(editing.name)+"/spam-traps"),"spam_traps");
  // The hits are the other half of the answer to "is this doing anything", and
  // they are the domain's own: the server-wide list is a view of its own.
  try{editing.trapHits=asList(await api("/api/v1/domains/"+encodeURIComponent(editing.name)+"/spam-traps/hits?limit=10"),"items");}
  catch(e){editing.trapHits=[];}
}

  const table=hits?`<div class="tablewrap"><table><thead><tr><th>${t("When")}</th><th>${t("Trap")}</th><th>${t("Connecting address")}</th><th>${t("Sender")}</th><th>${t("What was done")}</th></tr></thead><tbody>${hits}</tbody></table></div>`

function rotationHtml(){
  const s=editing.rotation;
  if(!s)return noticeHtml("bad",editing.rotationError||t("The rotation could not be read."));
  const when=v=>auditWhen(v);
  const current=s.current?rotationSlotHtml("current",K("Current key"),s.current,[
    s.current.key_file?tf("Key file: {0}",s.current.key_file):"",
    s.current.since?tf("Since {0}",when(s.current.since)):"",
    s.current.next_rotation_due?tf("Next rotation due {0}",when(s.current.next_rotation_due)):""]):'<div class="note">'+t("The domain has no signing key yet.")+'</div>';
  const next=rotationSlotHtml("next",K("Next key"),s.next,s.next?[
    tf("Key file: {0}",s.next.key_file),
    s.next.created?tf("Created {0}",when(s.next.created)):"",
    s.next.first_seen?tf("First seen {0}",when(s.next.first_seen)):"",
    s.next.switch_due?tf("Switch due {0}",when(s.next.switch_due)):""]:[]);
  const retiring=rotationSlotHtml("retiring",K("Retiring key"),s.retiring,s.retiring?[
    tf("Since {0}",when(s.retiring.since)),

  const retired=s.retired?rotationSlotHtml("retired",K("Retired key"),s.retired,[
    tf("Retired {0}",when(s.retired.at)),

  const waiting=(s.waiting||[]).map(w=>'<li>'+escHtml(t(ROTATION_WAITS[w.reason]||w.reason))+
    (w.until?' <span class="muted">'+escHtml(tf("until {0}",when(w.until)))+'</span>':"")+
    (w.detail&&w.reason!=="retiring_slot"?' <code>'+escHtml(w.detail)+'</code>':"")+'</li>').join("");
  const error=s.last_error?noticeHtml("warn",tf("The last attempt failed at {0}: {1}",when(s.last_error.time),s.last_error.text)):"";
  const staged=!!s.next;
  const buttons=
    (staged?"":'<input id="dkimrot_selector" placeholder="'+escHtml(t("Selector (optional)"))+'" aria-label="'+escHtml(t("Selector (optional)"))+'" style="min-width:160px">'+
      '<button class="btn ghost sm" data-act="dkimrotstart">'+t("Rotate now")+'</button>')+
    '<button class="btn ghost sm" data-act="dkimrotcheck">'+t("Check DNS now")+'</button>'+
    (staged?'<label class="row" style="gap:7px"><input type="checkbox" id="dkimrot_force"> '+t("Skip the propagation period")+'</label>'+
      '<button class="btn ghost sm" data-act="dkimrotswitch">'+t("Switch now")+'</button>'+
      '<button class="btn danger sm" data-act="dkimrotcancel">'+t("Cancel the next key")+'</button>':"")+
    (s.retiring?'<button class="btn ghost sm" data-act="dkimrotretire">'+t("Retire the old selector now")+'</button>':"");
  return '<p class="note">'+escHtml(tf("Phase: {0}",t(ROTATION_PHASES[s.phase]||s.phase)))+'</p>'+error+current+next+retiring+retired+
    (waiting?'<ul class="hint">'+waiting+'</ul>':"")+
    '<div class="row" style="margin-top:14px" data-enter="dkimrotstart">'+buttons+'<div class="err" id="err_dkimrot">'+escHtml(editing.rotationError||"")+'</div></div>';
