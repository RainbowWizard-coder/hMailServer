# The key of an RPM channel, Copr's or the Build Service's, fetched from the channel
# and imported only as gpg's own export of the one key it is held to. rpm_key alone
# takes a file in which the fingerprint it is given is one key among several, and
# imports every key in it; and rpm imports every armour block it finds in a file,
# wherever its "-----BEGIN PGP " starts, while gpg reads a block only where that
# starts a line. So the file fetched must hold one armour block that gpg reads as the
# one key named, and what rpm is given is not that file but gpg's export of that key
# from a keyring of its own. hmailserver_rpm_key_url and
# hmailserver_rpm_key_fingerprint name the key; the folder it is fetched and read in
# is a temporary one, removed again, and gpg starts no agent there.
---
- name: Install what the key's check needs
  ansible.builtin.package:
    name: "{{ 'gpg2' if ansible_facts['os_family'] == 'Suse' else 'gnupg2' }}"
    state: present

- name: Fetch, check and import the key
  block:
    - name: Make a folder to fetch and read the key in
      ansible.builtin.tempfile:
        state: directory
        suffix: .hmailserver-key
      register: hmailserver_rpm_key_work
      changed_when: false

    - name: Fetch the key from the channel
      ansible.builtin.get_url:
        url: "{{ hmailserver_rpm_key_url }}"
        dest: "{{ hmailserver_rpm_key_work.path }}/fetched.asc"
        mode: "0600"
        force: true
      changed_when: false

    - name: Read the fetched file
      ansible.builtin.slurp:
        src: "{{ hmailserver_rpm_key_work.path }}/fetched.asc"
      register: hmailserver_rpm_key_fetched

    - name: Read the fetched key's fingerprint
      ansible.builtin.command:
        argv: [gpg, --batch, --no-autostart, --homedir, "{{ hmailserver_rpm_key_work.path }}", --show-keys, --with-colons,
               "{{ hmailserver_rpm_key_work.path }}/fetched.asc"]
      register: hmailserver_rpm_key_read
      changed_when: false

    - name: Refuse a file that is not the channel's key alone
      ansible.builtin.assert:
        that:
          - (hmailserver_rpm_key_fetched.content | b64decode | regex_findall('-----BEGIN PGP ') | length) == 1
          - (hmailserver_rpm_key_read.stdout | regex_findall('(?m)^pub:') | length) == 1
          - >-
            (hmailserver_rpm_key_read.stdout | regex_findall('(?m)^fpr:+([0-9A-F]{40}):') | first | default(''))
            == hmailserver_rpm_key_fingerprint
        fail_msg: >-
          The key file fetched from {{ hmailserver_rpm_key_url }} is not the channel's key
          alone, {{ hmailserver_rpm_key_fingerprint }}, in one armour block (it holds
          {{ hmailserver_rpm_key_fetched.content | b64decode | regex_findall('-----BEGIN PGP ') | length }}
          "-----BEGIN PGP ", and gpg read
          {{ hmailserver_rpm_key_read.stdout_lines | select('match', '^(pub|fpr):') | join(' ') }}):
          nothing was imported.
        quiet: true

    - name: Put the key in a keyring of its own
      ansible.builtin.command:
        argv: [gpg, --batch, --no-autostart, --homedir, "{{ hmailserver_rpm_key_work.path }}", --import,
               "{{ hmailserver_rpm_key_work.path }}/fetched.asc"]
      changed_when: false

    - name: Export that key alone
      ansible.builtin.command:
        argv: [gpg, --batch, --no-autostart, --homedir, "{{ hmailserver_rpm_key_work.path }}", --armor, --output,
               "{{ hmailserver_rpm_key_work.path }}/key.asc", --export, "{{ hmailserver_rpm_key_fingerprint }}"]
      changed_when: false

    - name: Read the exported key
      ansible.builtin.slurp:
        src: "{{ hmailserver_rpm_key_work.path }}/key.asc"
      register: hmailserver_rpm_key_exported

    - name: Read the exported key's fingerprint
      ansible.builtin.command:
        argv: [gpg, --batch, --no-autostart, --homedir, "{{ hmailserver_rpm_key_work.path }}", --show-keys, --with-colons,
               "{{ hmailserver_rpm_key_work.path }}/key.asc"]
      register: hmailserver_rpm_key_export_read
      changed_when: false

    - name: Refuse an export that is not the channel's key alone
      ansible.builtin.assert:
        that:
          - (hmailserver_rpm_key_exported.content | b64decode | regex_findall('-----BEGIN PGP ') | length) == 1
          - (hmailserver_rpm_key_export_read.stdout | regex_findall('(?m)^pub:') | length) == 1
          - >-
            (hmailserver_rpm_key_export_read.stdout | regex_findall('(?m)^fpr:+([0-9A-F]{40}):') | first | default(''))
            == hmailserver_rpm_key_fingerprint
        fail_msg: >-
          gpg's export of {{ hmailserver_rpm_key_fingerprint }} is not that key alone
          (gpg read {{ hmailserver_rpm_key_export_read.stdout_lines | select('match', '^(pub|fpr):') | join(' ') }}):
          nothing was imported.
        quiet: true

    - name: Import the key, held to its fingerprint
      ansible.builtin.rpm_key:
        key: "{{ hmailserver_rpm_key_work.path }}/key.asc"
        fingerprint: "{{ hmailserver_rpm_key_fingerprint }}"
        state: present

  always:
    - name: Remove the folder the key was read in
      ansible.builtin.file:
        path: "{{ hmailserver_rpm_key_work.path }}"
        state: absent
      when: hmailserver_rpm_key_work.path is defined
      changed_when: false
