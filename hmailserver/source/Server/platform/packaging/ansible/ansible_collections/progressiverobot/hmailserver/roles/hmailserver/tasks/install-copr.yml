# Fedora and Enterprise Linux 10: Copr's progressiverobot/hmailserver, whose
# packages dnf verifies against the project's Copr key, imported only when the file
# Copr serves is that one key, at the fingerprint vars/main.yml names (rpm-key.yml).
---
- name: Name the Copr chroot for this machine
  ansible.builtin.set_fact:
    hmailserver_copr_chroot: >-
      {{ ('fedora-' ~ ansible_facts['distribution_major_version'])
         if ansible_facts['distribution'] == 'Fedora'
         else ('epel-' ~ ansible_facts['distribution_major_version']) }}

- name: Refuse a release or architecture Copr does not build for
  ansible.builtin.assert:
    that:
      - hmailserver_copr_chroot in hmailserver_copr_chroots
      - ansible_facts['architecture'] in hmailserver_copr_architectures
    fail_msg: >-
      Copr builds the project for {{ hmailserver_copr_chroots | join(', ') }} on
      {{ hmailserver_copr_architectures | join(' and ') }}, not
      {{ hmailserver_copr_chroot }} on {{ ansible_facts['architecture'] }}.
    quiet: true

- name: Import Copr's key for the project, held to its fingerprint
  ansible.builtin.include_tasks: rpm-key.yml
  vars:
    hmailserver_rpm_key_url: "{{ hmailserver_copr_base }}/pubkey.gpg"
    hmailserver_rpm_key_fingerprint: "{{ hmailserver_copr_fingerprint }}"

# No gpgkey: the key is imported already, and a gpgkey would let dnf import whatever
# else the address serves.
- name: Name the Copr repository, its packages checked against that key
  ansible.builtin.yum_repository:
    name: copr_progressiverobot_hmailserver
    description: Progressive Robot's fork of hMailServer (Copr progressiverobot/hmailserver)
    baseurl: "{{ hmailserver_copr_base }}/{{ hmailserver_copr_chroot }}-$basearch/"
    gpgcheck: true
    repo_gpgcheck: false
    skip_if_unavailable: false
    enabled: true
    owner: root
    group: root
    mode: "0644"

- name: Install hmailserver from Copr
  ansible.builtin.package:
    name: "{{ 'hmailserver' if hmailserver_version == '' else 'hmailserver-' ~ hmailserver_version }}"
    state: "{{ hmailserver_package_state if hmailserver_version == '' else 'present' }}"
