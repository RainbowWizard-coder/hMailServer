---
# Only a service that was running before the role changed its configuration: one
# that was not is started once, by tasks/service.yml, with the configuration whole.
- name: Restart hmailserver
  ansible.builtin.systemd_service:
    name: hmailserver.service
    state: restarted
  when:
    - hmailserver_was_active.rc | default(1) == 0
    - hmailserver_service_state in ['started', 'restarted']
