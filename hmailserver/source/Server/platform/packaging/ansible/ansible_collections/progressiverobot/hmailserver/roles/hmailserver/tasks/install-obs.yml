# openSUSE: the Build Service's home:progressiverobot, whose repository and packages
# zypper verifies against the project's key there, imported only when the file the
# Build Service serves is that one key, at the fingerprint vars/main.yml names
# (rpm-key.yml).
---
- name: Name the Build Service repository for this machine
  ansible.builtin.set_fact:
    hmailserver_obs_repository: >-
      {{ 'openSUSE_Tumbleweed' if 'Tumbleweed' in ansible_facts['distribution']
         else ansible_facts['distribution_version'] }}

- name: Refuse an openSUSE release or architecture the Build Service does not build for
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in ['openSUSE Leap', 'openSUSE Tumbleweed']
      - hmailserver_obs_repository in hmailserver_obs_builds
      - ansible_facts['architecture'] in hmailserver_obs_builds[hmailserver_obs_repository] | default([])
    fail_msg: >-
      The Build Service builds for openSUSE Leap 16.0 on
      {{ hmailserver_obs_builds['16.0'] | join(' and ') }} and Tumbleweed on
      {{ hmailserver_obs_builds['openSUSE_Tumbleweed'] | join(' and ') }}, not
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} on
      {{ ansible_facts['architecture'] }}.
    quiet: true

- name: Import the Build Service's key for the project, held to its fingerprint
  ansible.builtin.include_tasks: rpm-key.yml
  vars:
    hmailserver_rpm_key_url: "{{ hmailserver_obs_base }}/{{ hmailserver_obs_repository }}/repodata/repomd.xml.key"
    hmailserver_rpm_key_fingerprint: "{{ hmailserver_obs_fingerprint }}"

# No gpgkey: the key is imported already, and a gpgkey would let zypper import
# whatever else the address serves.
- name: Name the Build Service repository, its metadata and packages checked against that key
  ansible.builtin.yum_repository:
    name: home_progressiverobot
    description: Progressive Robot's fork of hMailServer (openSUSE Build Service home:progressiverobot)
    baseurl: "{{ hmailserver_obs_base }}/{{ hmailserver_obs_repository }}/"
    gpgcheck: true
    repo_gpgcheck: true
    enabled: true
    reposdir: /etc/zypp/repos.d
    owner: root
    group: root
    mode: "0644"

# zypper installs a version asked for even when it is older than the one installed
# (community.general.zypper gives it --oldpackage whenever a version is named), and
# a server older than its database's schema does not run: such a version is refused,
# as apt refuses it on Debian and Ubuntu.
- name: Ask rpm for the version installed
  ansible.builtin.command:
    argv: [rpm, --query, "--queryformat=%{VERSION}", hmailserver]
  register: hmailserver_obs_installed
  changed_when: false
  failed_when: false
  when: hmailserver_version != ''

- name: Refuse a version older than the one installed
  ansible.builtin.assert:
    that:
      - hmailserver_obs_installed.rc != 0 or hmailserver_obs_installed.stdout is version(hmailserver_version | regex_replace('-.*$', ''), '<=')
    fail_msg: >-
      hmailserver {{ hmailserver_obs_installed.stdout }} is installed, and
      {{ hmailserver_version }} is older: the role does not go back to an older version.
    quiet: true
  when: hmailserver_version != ''

- name: Install hmailserver from the Build Service
  community.general.zypper:
    name: "{{ 'hmailserver' if hmailserver_version == '' else 'hmailserver=' ~ hmailserver_version }}"
    state: "{{ hmailserver_package_state if hmailserver_version == '' else 'present' }}"
    update_cache: true
