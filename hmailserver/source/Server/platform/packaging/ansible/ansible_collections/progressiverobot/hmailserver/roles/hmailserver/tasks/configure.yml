# The configuration, the database and the secrets, with the server's own commands:
# steps 3 to 5 and 7 of the packaging guide (platform/packaging/README.md).
---
- name: Ask whether the service runs already
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, hmailserver.service]
  register: hmailserver_was_active
  changed_when: false
  failed_when: false

- name: Point the configuration at the database
  community.general.ini_file:
    path: "{{ hmailserver_config }}"
    section: Database
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    create: false
    owner: root
    group: "{{ hmailserver_user }}"
    mode: "0640"
  loop:
    - option: Type
      value: "{{ hmailserver_database_type }}"
    - option: Server
      value: "{{ hmailserver_database_host }}"
    - option: Port
      value: >-
        {{ (hmailserver_database_port | int) if (hmailserver_database_port | int) > 0
           else (5432 if hmailserver_database_type == 'PostgreSQL' else 3306) }}
    - option: Database
      value: "{{ hmailserver_database_name }}"
    - option: Username
      value: "{{ hmailserver_database_user }}"
    - option: Passwordencryption
      value: "0"
  loop_control:
    label: "{{ item.option }}={{ item.value }}"
  notify: Restart hmailserver

- name: Give the configuration the database's password
  community.general.ini_file:
    path: "{{ hmailserver_config }}"
    section: Database
    option: Password
    value: "{{ hmailserver_database_password }}"
    no_extra_spaces: true
    create: false
    owner: root
    group: "{{ hmailserver_user }}"
    mode: "0640"
  no_log: true
  notify: Restart hmailserver

- name: Read the configuration, to see whether it has an administrator password
  ansible.builtin.slurp:
    src: "{{ hmailserver_config }}"
  register: hmailserver_config_read
  no_log: true

- name: Note whether it has one
  ansible.builtin.set_fact:
    hmailserver_admin_password_present: "{{ hmailserver_config_read.content | b64decode is search('(?m)^AdministratorPassword=\\S') }}"
  no_log: true

- name: Set the administrator password, as a PBKDF2 hash
  ansible.builtin.command:
    argv: [hmailserver, --set-admin-password]
    stdin: "{{ hmailserver_admin_password }}"
  when: hmailserver_admin_password_update == 'always' or not hmailserver_admin_password_present
  changed_when: true
  no_log: true
  notify: Restart hmailserver

- name: Check the configuration as the service reads it
  ansible.builtin.command:
    argv: [runuser, -u, "{{ hmailserver_user }}", --, hmailserver, --check-config]
  register: hmailserver_check_config
  changed_when: false

# --check-config says what it read and exits 0 whatever that was: a file the service's
# user cannot read, or a [Database] Type the server does not take, reads as type 0 and
# no data directory.
- name: Refuse a configuration the service does not read as written
  ansible.builtin.assert:
    that:
      - hmailserver_check_config.stdout is search('(?m)^Database type:[ ]+' ~ hmailserver_database_type_number ~ '$')
      - hmailserver_check_config.stdout is search('(?m)^Data directory:[ ]+\S')
    fail_msg: >-
      Run as {{ hmailserver_user }}, hmailserver --check-config does not read
      {{ hmailserver_config }} as the role wrote it (database type
      {{ hmailserver_database_type_number }}, a data directory):
      {{ hmailserver_check_config.stdout_lines | join(' | ') }}
    quiet: true
  vars:
    hmailserver_database_type_number: "{{ 3 if hmailserver_database_type == 'PostgreSQL' else 1 }}"

- name: Create the database, or fill an empty one, as the service's user
  ansible.builtin.command:
    argv: [runuser, -u, "{{ hmailserver_user }}", --, hmailserver, --create-database]
  register: hmailserver_create_database
  changed_when: >-
    'created on' in hmailserver_create_database.stdout or
    'creating the schema' in hmailserver_create_database.stdout
  when: hmailserver_database_create

- name: Upgrade the database's schema to the package's
  ansible.builtin.command:
    argv: [runuser, -u, "{{ hmailserver_user }}", --, hmailserver, --upgrade-database]
  register: hmailserver_upgrade_database
  changed_when: "'Nothing to do.' not in hmailserver_upgrade_database.stdout"
  when:
    - hmailserver_database_upgrade
    - not hmailserver_database_create or '--upgrade-database brings it forward' in hmailserver_create_database.stdout
  notify: Restart hmailserver

- name: Make the stored-secrets key
  ansible.builtin.command:
    argv: [hmailserver, --create-stored-secrets-key]
  register: hmailserver_secrets_key
  changed_when: "'Made the stored-secrets key' in hmailserver_secrets_key.stdout"
  when: hmailserver_stored_secrets_key
  notify: Restart hmailserver

- name: Export the stored-secrets key, once
  ansible.builtin.command:
    argv: [hmailserver, --export-stored-secrets-key, "{{ hmailserver_stored_secrets_key_export }}"]
    creates: "{{ hmailserver_stored_secrets_key_export }}"
  when:
    - hmailserver_stored_secrets_key
    - hmailserver_stored_secrets_key_export | length > 0

# Each value on standard input, never on the command line, where the process list
# would show it: the server takes every setting so, a secret's too, and prints no
# secret back. The task is not logged, since its loop item carries the value; a
# refusal is said by the next task, in the server's words, which never repeat a value.
# An empty value, which clears a setting and discloses nothing, is NAME= on the command
# line, the one way the server takes it; the server trims a value, so one of white
# space alone is empty.
- name: Read the configuration's settings before they are stored
  ansible.builtin.slurp:
    src: "{{ hmailserver_config }}"
  register: hmailserver_config_before_settings
  when: hmailserver_settings | length > 0
  no_log: true

# A setting is changed unless what the server says it held, or for the keys it keeps
# in the file alone (PasswordPepper and the live update's trust, whose line says only
# NAME=VALUE written to the file) what [Settings] held before, is the value given,
# trimmed as the server trims it. The server says "empty" for an empty value it held,
# and "(set)" for a secret's, so a secret it holds is reported changed on every run.
- name: Store the settings
  ansible.builtin.command:
    argv:
      - hmailserver
      - --set-setting
      - "{{ item.key if (item.value | string | trim | length) > 0 else item.key ~ '=' }}"
    stdin: "{{ item.value | string }}"
  loop: "{{ hmailserver_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: hmailserver_setting
  failed_when: false
  changed_when: >-
    hmailserver_setting.rc == 0 and
    ('where it was ' ~ ((item.value | string | trim) or 'empty') ~ ', and written to') not in hmailserver_setting.stdout and
    not ('stored in the database' not in hmailserver_setting.stdout and
         hmailserver_settings_before is search('(?m)^(?i:' ~ (item.key | regex_escape) ~ ')=' ~
                                               (item.value | string | trim | regex_escape) ~ '[ \t]*\r?$'))
  vars:
    # The [Settings] section as it was, to the next section's header.
    hmailserver_settings_before: >-
      {{ (hmailserver_config_before_settings.content | b64decode
          | regex_search('(?ms)^\[Settings\][^\n]*\n(.*?)(?=^\[|\Z)', '\1') or ['']) | first }}
  no_log: true
  notify: Restart hmailserver

- name: Refuse a setting the server did not store
  ansible.builtin.fail:
    msg: >-
      hmailserver --set-setting stored nothing for
      {{ hmailserver_setting.results | rejectattr('rc', 'eq', 0) | map(attribute='item.key') | join(', ') }}:
      {{ hmailserver_setting.results | rejectattr('rc', 'eq', 0) | map(attribute='stderr') | join(' ') }}
  when: hmailserver_setting.results | default([]) | rejectattr('rc', 'eq', 0) | list | length > 0
