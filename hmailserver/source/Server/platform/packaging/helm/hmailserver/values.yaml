#
# Every value the chart reads, with what it does. The database is not in the
# chart and never will be: point database.* at a PostgreSQL or MariaDB server
# (the Bitnami charts, a managed instance, or one you run). The two secrets -
# the database password and the administrator password - go into a Secret the
# chart makes from these values, or into one you made (existingSecret), whose
# keys are named below.

image:
  repository: ghcr.io/progressiverobot/hmailserver
  # The tag's own image; pin what you deployed. Empty means the chart's
  # appVersion, which is "latest" - the current stable release, never an alpha.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1

database:
  # PostgreSQL or MySQL (the MariaDB Connector/C speaks to MariaDB).
  type: PostgreSQL
  host: ""
  port: 5432
  name: hmailserver
  user: hmailserver
  # Used only when existingSecret is empty.
  password: ""
  # Create the database on first start if it does not exist (a no-op after),
  # and upgrade the schema when it is behind (a no-op when current).
  create: true
  upgrade: true

administrator:
  # Used only when existingSecret is empty. The entrypoint writes a PBKDF2 hash
  # of it through the server's own --set-admin-password; the file never holds
  # the password.
  password: ""

# A Secret you made, with the two keys named here; leaves the chart's own
# Secret out.
existingSecret: ""
existingSecretKeys:
  databasePassword: database-password
  administratorPassword: administrator-password

rest:
  # The REST API, the Control Deck and the webmail, on one listener. Off
  # loopback the server requires TLS, so a certificate is needed: a Secret of
  # type kubernetes.io/tls (tls.crt, tls.key), from cert-manager or your own.
  enabled: true
  port: 8045
  bindAddress: 0.0.0.0
  tlsSecretName: ""

# Every other setting, from the environment (docs/EnvironmentConfiguration.md).
# settings are [Settings] keys, by the name build/ini-settings-baseline.txt gives
# them, rendered as HM_SETTING_<key>; properties are hm_settings rows, by the
# name SettingsDefaults.h gives them, rendered as HM_PROPERTY_<name>. The
# entrypoint stores them at every start with the server's own
# --apply-environment, checks every one first, and does not start the server
# when one is wrong (kubectl logs says which, and why). The environment wins at
# every start, so the Control Deck and the REST API refuse a change to a setting
# named here - it would last only until the pod restarted - and show it as set
# by the environment; take it out of these values to manage it there again. A
# value is text, as the environment has no other kind; a whole number may be
# left unquoted. A switch is 1 or 0 for a [Settings] key, which the server
# reads as a number; true and false, yes and no, on and off are taken as well
# for a setting whose REST settings row is a switch. Neither prefix names the
# two [SendingLimits] keys, which stay in hMailServer.ini.
settings: {}
#  MaxSubmissionsPerIPPerMinute: "30"
properties: {}
#  maxmessagesize: "20480"
#  hostname: mail.example.com

# Settings whose value is a secret, from the keys of Secrets you made: each key
# is mounted as a file under /run/secrets/hmailserver-settings and named to the
# entrypoint through HM_SETTING_<key>_FILE or HM_PROPERTY_<name>_FILE, so the
# value is in no environment variable, no rendered manifest and no log line.
# Each entry names the Secret, its key, and either a setting (a [Settings] key)
# or a property (an hm_settings row).
settingsFrom: []
#  - secretName: mail-relay
#    key: password
#    property: smtprelayerpassword

service:
  # LoadBalancer is what a mail server needs: the SMTP, IMAP and POP3 ports on
  # an address the world reaches. ClusterIP for a server behind something else.
  type: LoadBalancer
  loadBalancerIP: ""
  annotations: {}
  # externalTrafficPolicy Local keeps the client's address, which the server's
  # auto-ban, greylisting and Received headers all want; it also pins traffic
  # to the node the pod is on, which for one replica is no loss.
  externalTrafficPolicy: Local
  ports:
    smtp: 25
    submission: 587
    smtps: 465
    imap: 143
    imaps: 993
    pop3: 110
    pop3s: 995
    managesieve: 4190

persistence:
  # Three volumes, as the image declares them: the message store, the logs and
  # the configuration (hMailServer.ini, rewritten from the environment on every
  # start where a value is set, so these values are the truth).
  storageClassName: ""
  data:
    size: 50Gi
  logs:
    size: 5Gi
  config:
    size: 100Mi

probes:
  # The image's own health is port 25 accepting a connection; the probes here
  # do the same. The metrics listener, when it is on, serves /livez and /readyz
  # without authentication - set http.enabled and its port to use them, and
  # readiness then reports the database as well.
  http:
    enabled: false
    port: 9110
  startupSeconds: 60

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

podSecurityContext:
  # The image runs as its own user; the volumes are owned by it through fsGroup.
  fsGroup: 1000
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
    # The binary carries cap_net_bind_service as a file capability; the
    # container must be allowed to keep it for the ports below 1024.
    add: ["NET_BIND_SERVICE"]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
extraEnv: []
