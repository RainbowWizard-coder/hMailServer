apiVersion: v2
name: hmailserver
# Says what the chart is, as every listing of the project does: Artifact Hub, and
# packages.ecosyste.ms, which copies Artifact Hub, show this text. The original
# hMailServer, Martin Knafve's, is developed separately, and a chart called
# hmailserver that did not say so would read as the original's.
description: >-
  Progressive Robot's fork of hMailServer, not the original hMailServer by Martin
  Knafve: SMTP, IMAP and POP3 with a REST API, the Control Deck and the webmail on
  one listener, as a StatefulSet beside the PostgreSQL or MariaDB it keeps its data
  in. The database is not in the chart: point database.host at one.
type: application
# The chart's version and the application's are the release's, and neither is
# written here: a version spelled out in the tree would be one more place to
# stamp at a release and one more to forget, which is what
# build/check-linux-version-stamp.sh refuses. The release's helm-chart-package job
# (.gitlab/ci/helm-chart.yml, build/ci/helm-chart-package.sh) packages the chart
# with helm package --version <v> --app-version <v> from the tag, and names the
# release's image in artifacthub.io/images below by that version. From a checkout
# the chart is 0.1.0 and installs "latest" - the image tag it defaults to
# (values.yaml, image.tag), the current stable release, never an alpha.
version: 0.1.0
appVersion: "latest"
home: https://gitlab.com/hmailserver/hmailserver
# The fork's icon, which Artifact Hub shows: the Control Panel's 256 by 256 frame,
# platform/packaging/hmailserver.png, on master, as the image's logo-url label and
# the Chocolatey package name it (build/check-package-texts.py holds all of them to
# that one address). master, not a release's tag: the tags of the releases made
# before the icon was added have no such file.
icon: https://gitlab.com/hmailserver/hmailserver/-/raw/master/hmailserver/source/Server/platform/packaging/hmailserver.png
sources:
  - https://gitlab.com/hmailserver/hmailserver
keywords:
  - mail
  - mail-server
  - smtp
  - imap
  - pop3
maintainers:
  - name: Progressive Robot Ltd
    url: https://www.progressiverobot.com
# What Artifact Hub reads (hmailserver/docs/ContainerImage.md, "Artifact Hub").
# The image line names :latest here and the release's version in a packaged
# chart; its platforms are the two the release's image index holds, which
# container-image-push.sh refuses to push without (build/ci/helm-chart-package.sh
# holds the packaged chart to both); prerelease is "true" in the package of a
# release whose version has a suffix. The chart is signed with Sigstore like
# every file of the release, not with Helm's own PGP provenance, so no
# artifacthub.io/signKey is given.
annotations:
  artifacthub.io/license: AGPL-3.0-or-later
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: hmailserver
      image: registry.gitlab.com/hmailserver/hmailserver:latest
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Source
      url: https://gitlab.com/hmailserver/hmailserver
    - name: The container image and the chart
      url: https://gitlab.com/hmailserver/hmailserver/-/blob/master/hmailserver/docs/ContainerImage.md
    - name: Support forum
      url: https://www.hmailserver.co.uk/category/8/general-support
