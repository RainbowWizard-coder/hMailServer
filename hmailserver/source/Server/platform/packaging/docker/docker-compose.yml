#
# hMailServer beside the PostgreSQL it keeps its data in, the way the image's
# own smoke test runs it: the two passwords come from files (Compose secrets),
# never from the environment; the REST API - the administration, on Linux -
# is bound off loopback and therefore over TLS, with a certificate and key
# mounted in from ./certs (rest.pem, rest.key; a self-signed pair does for a
# start: openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes
# -keyout certs/rest.key -out certs/rest.pem -subj /CN=mail -days 365).
#
#   printf '%s' 'a database password' > secrets/db_password
#   printf '%s' 'the administrator password' > secrets/admin_password
#   docker compose up -d
#   # then https://<host>:8045/ is the Control Deck, Administrator and that password
#
# The image is the release's own, from the project's GitLab registry once one is
# published there (the image: line below says when); pin the version you deployed. Every
# variable the entrypoint reads is listed in docker-entrypoint.sh beside this
# file. The packaged hMailServer.ini holds the database connection and the
# administrator password, kept in the hm-etc volume and rewritten from the
# environment on every start where a variable is set; every other setting is in
# the database, which the environment's HM_SETTING_* and HM_PROPERTY_* variables
# are stored into on every start.
name: hmailserver

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hmailserver
      POSTGRES_DB: hmailserver
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - hm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmailserver -d hmailserver"]
      interval: 10s
      timeout: 5s
      retries: 12

  hmailserver:
    # :latest is a stable release and never an alpha. Pin the version you
    # deploy in your own copy of this file - this one carries no version,
    # because a literal here goes stale the release after it is written and
    # the packaging check refuses one for that reason. The name below is the
    # project's GitLab container registry at its present path, where no image
    # is to be pushed: the image is published from the first release GitLab CI
    # makes once the owner turns its publishing on, after the project's move to
    # the group hmailserver, at registry.gitlab.com/hmailserver/hmailserver,
    # signed with Sigstore (the releases built by hand have none), and this line
    # names that address from the move. Until then, build one from the
    # Dockerfile beside this file and name your own tag here.
    image: registry.gitlab.com/progressiverobot/hmailserver:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HM_DB_TYPE: PostgreSQL
      HM_DB_HOST: db
      HM_DB_PORT: "5432"
      HM_DB_NAME: hmailserver
      HM_DB_USER: hmailserver
      HM_DB_PASSWORD_FILE: /run/secrets/db_password
      HM_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      HM_REST_PORT: "8045"
      HM_REST_BIND_ADDRESS: 0.0.0.0
      HM_REST_CERTIFICATE_FILE: /certs/rest.pem
      HM_REST_PRIVATE_KEY_FILE: /certs/rest.key
      # Every other setting, from the environment (docs/EnvironmentConfiguration.md):
      # HM_SETTING_<key> for a [Settings] key, HM_PROPERTY_<name> for an
      # hm_settings row, and _FILE after either to read the value from a secret.
      # Stored at every start, checked first - a wrong one keeps the container
      # from starting, and `docker compose logs hmailserver` says why - and
      # refused to the Control Deck and the REST API while it is set here.
      # HM_SETTING_MaxSubmissionsPerIPPerMinute: "30"
      # HM_PROPERTY_maxmessagesize: "20480"
      # HM_PROPERTY_smtprelayerpassword_FILE: /run/secrets/relay_password
      # A setting profile, applied once at the first start (docs/Profiles.md):
      # office, gateway, relay or sender, or none to record that no profile is
      # wanted. One that closes a listener, trusts an address range, turns a filter
      # or a check off or weakens it, or shortens a window of days in force - relay
      # and sender close IMAP and POP3, gateway turns greylisting off and trusts
      # XCLIENT and ARC - needs HM_PROFILE_CONFIRM: "yes".
      # HM_PROFILE: office
      # HM_PROFILE_CONFIRM: "yes"
    secrets:
      - db_password
      - admin_password
      # - relay_password
    ports:
      - "25:25"       # SMTP
      - "587:587"     # submission
      - "465:465"     # submission over TLS
      - "143:143"     # IMAP
      - "993:993"     # IMAP over TLS
      - "110:110"     # POP3
      - "995:995"     # POP3 over TLS
      - "4190:4190"   # ManageSieve
      - "8045:8045"   # the REST API, the Control Deck and the webmail
    volumes:
      - hm-data:/var/lib/hmailserver
      - hm-logs:/var/log/hmailserver
      - hm-etc:/etc/hmailserver
      - ./certs:/certs:ro
    # The image carries its own HEALTHCHECK (port 25 accepts a connection);
    # nothing to add here.

secrets:
  db_password:
    file: ./secrets/db_password
  admin_password:
    file: ./secrets/admin_password
  # relay_password:
  #   file: ./secrets/relay_password

volumes:
  hm-db:
  hm-data:
  hm-logs:
  hm-etc:
