#
# hMailServer beside the PostgreSQL it keeps its data in, the way the image's
# own smoke test runs it: the two passwords come from files (Compose secrets),
# never from the environment; the first start secures the new installation as
# the packaged service's first start does (docs/SecureDefaults.md) - a
# self-signed certificate, STARTTLS on 25, 587, 110 and 143, and no password
# taken in the clear from another address until TLS is up; and the REST API -
# the administration, on Linux - is bound off loopback and therefore over TLS,
# with that certificate until you give it one of your own (below).
#
#   mkdir -p secrets
#   printf '%s' 'a database password' > secrets/db_password
#   printf '%s' 'the administrator password' > secrets/admin_password
#   docker compose up -d
#   # then https://<host>:8045/ is the Control Deck, Administrator and that password
#
# The server runs as the image's own user, 999, which must be able to read
# every file mounted in for it: the two secrets (printf under the usual umask,
# 022, makes them so) and a certificate's key of your own.
#
# For MariaDB instead, run it as db - MariaDB's image, with MARIADB_USER,
# MARIADB_DATABASE, MARIADB_PASSWORD_FILE and a root password of its own,
# without which the image will not initialise its data
# (MARIADB_ROOT_PASSWORD_FILE from a secret of its own, or
# MARIADB_RANDOM_ROOT_PASSWORD: "1", which prints the password it makes to
# db's log), its data at /var/lib/mysql and a health check of its own (the
# image's healthcheck.sh --connect) - and give hmailserver HM_DB_TYPE: MySQL
# and HM_DB_PORT: "3306". The images carry the client for both from the
# release that added MariaDB's, and their start test runs them beside each; an
# older image carries PostgreSQL's alone (hmailserver/docs/ContainerImage.md
# says which).
#
# The image is the release's own, from the project's GitLab registry (the image:
# line below says from when); pin the version you deployed. Every
# variable the entrypoint reads is listed in docker-entrypoint.sh beside this
# file. The packaged hMailServer.ini holds the database connection and the
# administrator password, kept in the hm-etc volume and rewritten from the
# environment on every start where a variable is set; every other setting is in
# the database, which the environment's HM_SETTING_* and HM_PROPERTY_* variables
# are stored into on every start.
name: hmailserver

services:
  db:
    # PostgreSQL 18, which keeps its data in a directory named for its major
    # version, /var/lib/postgresql/18/docker, under one volume at
    # /var/lib/postgresql. A deployment made from this file while it named
    # PostgreSQL 16 has 16's data at the top of hm-db: 18 does not open it and stops at
    # each start ("Error: in 18+ ..." in `docker compose logs db`), and the server
    # waits for it, 16's data left as it was. hmailserver/docs/ContainerImage.md,
    # "Updates", moves the database to 18: a dump taken on 16, loaded into 18.
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      POSTGRES_USER: hmailserver
      POSTGRES_DB: hmailserver
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - hm-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmailserver -d hmailserver"]
      interval: 10s
      timeout: 5s
      retries: 12

  hmailserver:
    # :latest is a stable release and never an alpha. Pin the version you
    # deploy in your own copy of this file - this one carries no version,
    # because a literal here goes stale the release after it is written and
    # the packaging check refuses one for that reason. The name below is the
    # project's GitLab container registry in the group hmailserver, the image's
    # lasting address, where each release GitLab CI makes pushes its image,
    # signed with Sigstore, from that path, the project's since 29 September
    # 2026 (the releases built by hand have none; hmailserver/docs/
    # ContainerImage.md says which have one).
    # Until one does, build it from the Dockerfile beside this file and name
    # your own tag here.
    image: registry.gitlab.com/hmailserver/hmailserver:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # After the entrypoint (the database created or upgraded, the settings below
    # stored), the new installation is secured, and then the server runs. The
    # first start's --create-database says that nothing will secure it, which is
    # true of the image alone: this is what does. --if-marked acts only on a
    # database --create-database made, within a day, and does nothing at any later
    # start; a failure is forgiven, as the systemd unit's ExecStartPre=- forgives
    # it, and the server starts all the same.
    command: ["bash", "-c", "hmailserver --config /etc/hmailserver/hMailServer.ini --apply-new-install-defaults --if-marked; exec hmailserver --config /etc/hmailserver/hMailServer.ini --foreground"]
    environment:
      HM_DB_TYPE: PostgreSQL
      HM_DB_HOST: db
      HM_DB_PORT: "5432"
      HM_DB_NAME: hmailserver
      HM_DB_USER: hmailserver
      HM_DB_PASSWORD_FILE: /run/secrets/db_password
      HM_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      HM_REST_PORT: "8045"
      HM_REST_BIND_ADDRESS: 0.0.0.0
      # The pair the first start makes, in the hm-data volume. For one of your
      # own, put it in ./certs (rest.pem and rest.key, the key readable by the
      # image's user, 999: sudo chown 999 certs/rest.key), mount ./certs below
      # and name /certs/rest.pem and /certs/rest.key here. A deployment made from
      # this file while it named those by default has no such pair: keep them.
      HM_REST_CERTIFICATE_FILE: /var/lib/hmailserver/Certificates/self-signed-certificate.pem
      HM_REST_PRIVATE_KEY_FILE: /var/lib/hmailserver/Certificates/self-signed-key.pem
      # Every other setting, from the environment (docs/EnvironmentConfiguration.md):
      # HM_SETTING_<key> for a [Settings] key, HM_PROPERTY_<name> for an
      # hm_settings row, and _FILE after either to read the value from a secret.
      # Stored at every start, checked first - a wrong one keeps the container
      # from starting, and `docker compose logs hmailserver` says why - and
      # refused to the Control Deck and the REST API while it is set here.
      # HM_SETTING_MaxSubmissionsPerIPPerMinute: "30"
      # HM_PROPERTY_maxmessagesize: "20480"
      # HM_PROPERTY_smtprelayerpassword_FILE: /run/secrets/relay_password
      # A setting profile, applied once at the first start (docs/Profiles.md):
      # office, gateway, relay or sender, or none to record that no profile is
      # wanted. One that closes a listener, trusts an address range, turns a filter
      # or a check off or weakens it, or shortens a window of days in force - relay
      # and sender close IMAP and POP3, gateway turns greylisting off and trusts
      # XCLIENT and ARC - needs HM_PROFILE_CONFIRM: "yes".
      # HM_PROFILE: office
      # HM_PROFILE_CONFIRM: "yes"
    secrets:
      - db_password
      - admin_password
      # - relay_password
    ports:
      - "25:25"       # SMTP
      - "587:587"     # submission
      - "465:465"     # submission over TLS
      - "143:143"     # IMAP
      - "993:993"     # IMAP over TLS
      - "110:110"     # POP3
      - "995:995"     # POP3 over TLS
      - "4190:4190"   # ManageSieve
      - "8045:8045"   # the REST API, the Control Deck and the webmail
    volumes:
      - hm-data:/var/lib/hmailserver
      - hm-logs:/var/log/hmailserver
      - hm-etc:/etc/hmailserver
      # - ./certs:/certs:ro
    # The image carries its own HEALTHCHECK (port 25 accepts a connection);
    # nothing to add here.

secrets:
  db_password:
    file: ./secrets/db_password
  admin_password:
    file: ./secrets/admin_password
  # relay_password:
  #   file: ./secrets/relay_password

volumes:
  hm-db:
  hm-data:
  hm-logs:
  hm-etc:
