#
# Artifact Hub's metadata for the container image's repository,
# oci://registry.gitlab.com/hmailserver/hmailserver (hmailserver/docs/ContainerImage.md,
# "Artifact Hub"). build/ci/container-image-artifacthub.sh pushes this file, as it is,
# to that repository under the tag artifacthub.io, where Artifact Hub looks for it.
#
# repositoryID is the ID Artifact Hub gives the repository when a maintainer adds it
# to the organization hmailserver (Control Panel, Repositories, Add, kind Container
# images, URL oci://registry.gitlab.com/hmailserver/hmailserver), and it gives the
# listing its Verified publisher label. It is written here, on a line of its own,
# as "repositoryID: <the ID>"; until it is, nothing is pushed. It is not the Helm
# chart's ID, which is another repository's (ARTIFACTHUB_REPOSITORY_ID in
# build/ci/helm-repo.py). Nothing but comments, blank lines and that one line may be
# here: the script refuses anything else.
