# SonarQube Cloud's automatic analysis of this project (organization hmailserver,
# docs/ContinuousIntegration.md, "SonarQube Cloud"): what it reads as the server's
# own code, what it reads as tests, and what it leaves alone. Automatic analysis
# reads this file from the default branch, and a value here replaces the same
# setting made in the project's Administration > Analysis Scope. The project,
# hmailserver_hmailserver, has been analysed with it since 6 October 2026.
#
# The rules the values follow (SonarQube Cloud's "Setting initial scope" and
# "Excluding based on path-matching patterns", read 28 September 2026):
#   sonar.sources and sonar.tests are comma-separated plain paths, directories or
#     files, relative to the root: no wildcards - automatic analysis's own page says
#     "Wildcard patterns are not allowed", and the scope page says that of these two;
#   sonar.exclusions, sonar.test.exclusions and sonar.cpd.exclusions are
#     comma-separated path-matching patterns (* ** ?);
#   a file must not be both a source and a test, or the analysis stops: every test
#     path below is excluded from the sources by a pattern as well.
# What automatic analysis does with them here: the tree has .csproj files, so it
# runs the SonarScanner for .NET, which ignores sonar.sources and sonar.tests - the
# analysis says so in its own warning (api/ce/analysis_status for the branch) - and
# computes both from the repository: every file it reads is a source but for the
# .NET test projects' files, which are its tests (883 on master at 6fb8164c6, all
# of them in ControlPanel.Tests, DBSetup.Tests, ImportTool.Tests, RegressionTests,
# LinuxRegressionTests and StressTest). sonar.exclusions and the other patterns
# are read. So of what the exclusions leave out as tests, only those projects'
# files are analysed, as tests: the fuzz harness, the two page harnesses,
# build/fixtures and hmailserver/test's other files are not analysed at all.
# sonar.sources and sonar.tests are kept for a scanner that reads them. The C#
# analyzer also leaves out what it takes as generated
# (sonar.cs.analyzeGeneratedCode is false): HelpWikiPages.g.cs, which no pattern
# named, is not in the analysis of master at 6fb8164c6; the **/*.g.cs pattern
# below names it.

sonar.sourceEncoding=UTF-8

# The whole tree is the server's, but for what is excluded next.
sonar.sources=.

# Not the project's code:
#   libraries/                          the Windows build's third-party headers (SQL
#                                       Server Compact 4.0's), the icon library and the
#                                       library build scripts, which are PowerShell;
#   hmailserver/source/Server/quickjs/  QuickJS, vendored as released
#                                       (docs/ThirdPartyBinaries.md);
#   hmailserver/source/Server/zlib/     zlib, vendored as released;
#   Common/AntiSpam/whatwg/             the HTML standard's named character
#                                       references, entities.json, as the WHATWG
#                                       publishes it;
#   Common/Idna/ucd/                    Unicode's data files for UTS 46;
#   SMTP/SPF/Conformance/rfc7208-tests.*
#                                       the RFC 7208 test suite
#                                       (docs/SourceTarball.md's table of the
#                                       third parties' code names all three).
#   The third parties' code that hMailServer has changed - Common/Mime,
#   Common/Util/StdString.h, Common/Scripting/ScriptSite.h, which the same table
#   names - is the server's code now, and is analysed.
# Text the pages and the server show:
#   Common/Util/PortalLanguages/, installation/WebAdmin/languages/
#                                       the webmail's and the Control Deck's
#                                       translation catalogues, JSON whose values
#                                       are sentences: on master at 6fb8164c6 all
#                                       246 findings in them were json:S2068 on
#                                       the word "password" or "passphrase" in a
#                                       message.
# Records and fixtures, kept unchanged:
#   build/perf/runs/                    the measurements of recorded benchmark
#                                       runs, as the tools wrote them;
#   build/db-upgrade-6029/              the create scripts as they were at schema
#                                       6029, the upgrade test's starting point
#                                       (build/db-upgrade-gate.sh).
# Generated, and committed for the build's convenience - their generators are the
# code, and are read:
#   Common/Util/HelpPagesData.cpp       the documents (build/generate-help-pages.py);
#   Common/Util/PortalPageData.cpp      the webmail (build/generate-portal-page.py);
#   Common/Util/PortalLanguagesData.cpp, PortalSmimeData.cpp, PortalOpenPgpData.cpp
#                                       the webmail's translations and modules
#                                       (build/generate-portal-*.py);
#   Common/Application/ProfilesData.*, SettingsDefaults.h
#                                       build/generate-profiles.py and
#                                       generate-settings-defaults.py;
#   Common/Application/IniSettingsBaseline.h
#                                       the hMailServer.ini keys' baseline
#                                       (build/check-ini-coverage.py
#                                       --write-baseline);
#   Common/AntiSpam/DMARC/PublicSuffixListData.h
#                                       the Public Suffix List
#                                       (build/generate-public-suffix-list.ps1);
#   Common/Idna/IdnaTables.cpp, IdnaTestData.cpp
#                                       UTS 46's tables and Unicode's test lines
#                                       (build/generate-idna-tables.py);
#   Common/AntiSpam/HtmlReferencesData.cpp
#                                       HTML's named character references
#                                       (build/generate-html-references.py);
#   SMTP/SPF/Conformance/SPFConformanceSuite.cpp
#                                       the RFC 7208 suite as a C++ table
#                                       (Generate-SPFConformanceSuite.py beside
#                                       it): 259 findings on master at 6fb8164c6,
#                                       every one cpp:S1313 on the suite's
#                                       addresses;
#   hMailServer/dlldata.c               MIDL's;
#   *.g.cs                              the Control Panel's search index
#                                       (build/generate-settings-index.ps1) and
#                                       its help pages
#                                       (build/generate-help-pages.py);
#   *.Designer.cs, *.designer.cs        the WinForms designer's (the patterns match
#                                       case-sensitively, and two in Tools/Shared/
#                                       Dialogs are named in lower case);
#   packages.arm64.lock.json            NuGet's lock files of the ARM64 publish
#                                       (build/build-tools.ps1 -Platform ARM64);
#                                       SonarQube Cloud's own
#                                       sonar.json.exclusions leaves out the x64
#                                       packages.lock.json.
#   hMailServer/resource.h stays: the resource editor began it, but it is edited
#   by hand with each COM class's resource ids, and it carries the project's
#   header.
# And the test trees named in sonar.tests below (of which only the .NET test
# projects' files are analysed, as tests).
sonar.exclusions=libraries/**,\
  hmailserver/source/Server/quickjs/**,\
  hmailserver/source/Server/zlib/**,\
  hmailserver/source/Server/Common/AntiSpam/whatwg/**,\
  hmailserver/source/Server/Common/Idna/ucd/**,\
  hmailserver/source/Server/SMTP/SPF/Conformance/rfc7208-tests.*,\
  hmailserver/source/Server/Common/Util/PortalLanguages/**,\
  hmailserver/installation/WebAdmin/languages/**,\
  build/perf/runs/**,\
  build/db-upgrade-6029/**,\
  hmailserver/source/Server/SMTP/SPF/Conformance/SPFConformanceSuite.cpp,\
  hmailserver/source/Server/hMailServer/dlldata.c,\
  hmailserver/source/Server/Common/Util/HelpPagesData.cpp,\
  hmailserver/source/Server/Common/Util/PortalPageData.cpp,\
  hmailserver/source/Server/Common/Util/PortalLanguagesData.cpp,\
  hmailserver/source/Server/Common/Util/PortalSmimeData.cpp,\
  hmailserver/source/Server/Common/Util/PortalOpenPgpData.cpp,\
  hmailserver/source/Server/Common/Application/ProfilesData.cpp,\
  hmailserver/source/Server/Common/Application/ProfilesData.h,\
  hmailserver/source/Server/Common/Application/SettingsDefaults.h,\
  hmailserver/source/Server/Common/Application/IniSettingsBaseline.h,\
  hmailserver/source/Server/Common/AntiSpam/DMARC/PublicSuffixListData.h,\
  hmailserver/source/Server/Common/Idna/IdnaTables.cpp,\
  hmailserver/source/Server/Common/Idna/IdnaTestData.cpp,\
  hmailserver/source/Server/Common/AntiSpam/HtmlReferencesData.cpp,\
  **/*.g.cs,\
  **/*.Designer.cs,\
  **/*.designer.cs,\
  **/packages.arm64.lock.json,\
  hmailserver/test/**,\
  hmailserver/source/Tools/ControlPanel.Tests/**,\
  hmailserver/source/Tools/ImportTool.Tests/**,\
  hmailserver/source/Tools/DBSetup.Tests/**,\
  fuzz/**,\
  build/fixtures/**,\
  build/deck-script-test.js,\
  build/portal-script-test.js

# The tests: the two regression suites and the test tools, the Control Panel's, the
# import tool's and DBSetup's unit tests, the fuzz harness, and the two page harnesses.
# Automatic analysis ignores this (above); build/trusted-types-test.js and
# build/testdata are named neither here nor in the exclusions, and are analysed as
# sources.
sonar.tests=hmailserver/test,\
  hmailserver/source/Tools/ControlPanel.Tests,\
  hmailserver/source/Tools/ImportTool.Tests,\
  hmailserver/source/Tools/DBSetup.Tests,\
  fuzz,\
  build/deck-script-test.js,\
  build/portal-script-test.js

# Duplication is not counted in what the suites' fixtures repeat on purpose.
sonar.cpd.exclusions=hmailserver/test/**

# The build and CI scripts' Python: the CI images' 3.14.
sonar.python.version=3.14

# The standard every file the two builds share must compile to: the Visual Studio
# projects name no LanguageStandard, so MSVC compiles them as its default, C++14,
# while the Linux build asks CMake for C++20. A rule that suggests a C++17 or C++20
# form would suggest what the Windows build cannot compile.
sonar.cfamily.reportingCppStandardOverride=c++14
