#
# SonarQube Cloud's automatic analysis of this project (organization hmailserver,
# docs/ContinuousIntegration.md, "SonarQube Cloud"): what it reads as the server's
# own code, what it reads as tests, and what it leaves alone. Automatic analysis
# reads this file from the default branch only, and a value here replaces the same
# setting made in the project's Administration > Analysis Scope; until this file is
# on master the same values are set there (docs/ContinuousIntegration.md says how).
#
# The rules the values follow (SonarQube Cloud's "Setting initial scope" and
# "Excluding based on path-matching patterns", read 28 September 2026):
#   sonar.sources and sonar.tests are comma-separated plain paths, directories or
#     files, relative to the root: no wildcards - automatic analysis's own page says
#     "Wildcard patterns are not allowed", and the scope page says that of these two;
#   sonar.exclusions, sonar.test.exclusions and sonar.cpd.exclusions are
#     comma-separated path-matching patterns (* ** ?);
#   a file must not be both a source and a test, or the analysis stops: every test
#     path below is excluded from the sources by a pattern as well.
# The C and C++ analyzer does not read sonar.tests; the fuzz harness and any C++
# under the test trees are simply not analysed.

sonar.sourceEncoding=UTF-8

# The whole tree is the server's, but for what is excluded next.
sonar.sources=.

# Not the project's code:
#   libraries/                          the Windows build's third-party headers (SQL
#                                       Server Compact 3.5), the icon library and the
#                                       library build scripts, which are PowerShell;
#   hmailserver/source/Server/quickjs/  QuickJS, vendored as released
#                                       (docs/ThirdPartyBinaries.md);
#   hmailserver/source/Server/zlib/     zlib, vendored as released.
# Generated, and committed for the build's convenience - their generators are the
# code, and are read:
#   Common/Util/HelpPagesData.cpp       the documents (build/generate-help-pages.py);
#   Common/Util/PortalPageData.cpp      the webmail (build/generate-portal-page.py);
#   Common/Util/PortalLanguagesData.cpp, PortalSmimeData.cpp, PortalOpenPgpData.cpp
#                                       the webmail's translations and modules
#                                       (build/generate-portal-*.py);
#   Common/Application/ProfilesData.*, SettingsDefaults.h
#                                       build/generate-profiles.py and
#                                       generate-settings-defaults.py;
#   Common/AntiSpam/DMARC/PublicSuffixListData.h
#                                       the Public Suffix List
#                                       (build/generate-public-suffix-list.ps1);
#   Tools/ControlPanel/Services/SettingsSearchIndex.g.cs
#                                       the Control Panel's search index;
#   *.Designer.cs, *.designer.cs        the WinForms designer's (the patterns match
#                                       case-sensitively, and two in Tools/Shared/
#                                       Dialogs are named in lower case).
# And the tests, which are read as tests below.
sonar.exclusions=libraries/**,\
  hmailserver/source/Server/quickjs/**,\
  hmailserver/source/Server/zlib/**,\
  hmailserver/source/Server/Common/Util/HelpPagesData.cpp,\
  hmailserver/source/Server/Common/Util/PortalPageData.cpp,\
  hmailserver/source/Server/Common/Util/PortalLanguagesData.cpp,\
  hmailserver/source/Server/Common/Util/PortalSmimeData.cpp,\
  hmailserver/source/Server/Common/Util/PortalOpenPgpData.cpp,\
  hmailserver/source/Server/Common/Application/ProfilesData.cpp,\
  hmailserver/source/Server/Common/Application/ProfilesData.h,\
  hmailserver/source/Server/Common/Application/SettingsDefaults.h,\
  hmailserver/source/Server/Common/AntiSpam/DMARC/PublicSuffixListData.h,\
  hmailserver/source/Tools/ControlPanel/Services/SettingsSearchIndex.g.cs,\
  **/*.Designer.cs,\
  **/*.designer.cs,\
  hmailserver/test/**,\
  hmailserver/source/Tools/ControlPanel.Tests/**,\
  hmailserver/source/Tools/ImportTool.Tests/**,\
  fuzz/**,\
  build/fixtures/**,\
  build/deck-script-test.js,\
  build/portal-script-test.js

# The tests: the two regression suites and the test tools, the Control Panel's and
# the import tool's unit tests, the fuzz harness, and the two page harnesses.
sonar.tests=hmailserver/test,\
  hmailserver/source/Tools/ControlPanel.Tests,\
  hmailserver/source/Tools/ImportTool.Tests,\
  fuzz,\
  build/deck-script-test.js,\
  build/portal-script-test.js

# Duplication is not counted in what the suites' fixtures repeat on purpose.
sonar.cpd.exclusions=hmailserver/test/**

# The build and CI scripts' Python: the CI images' 3.13.
sonar.python.version=3.13

# The standard every file the two builds share must compile to: the Visual Studio
# projects name no LanguageStandard, so MSVC compiles them as its default, C++14,
# while the Linux build asks CMake for C++20. A rule that suggests a C++17 or C++20
# form would suggest what the Windows build cannot compile.
sonar.cfamily.reportingCppStandardOverride=c++14
