# The checks GitLab runs on a push, on a merge request and on a release tag.
#
# Every job runs on the project's own runners - bench150 and S1-WINBENCH, the Windows
# benches, linix's second entry linix-systemd, and linix, server2 or s1-linux, which
# share the tag linix, server2 with kvm beside it - in every pipeline for a protected
# ref that is not a merge request's: master, a batch* branch, a v* tag and the
# schedules on master, unless the owner sends a class of them to GitLab's hosted
# runners (below). None goes to GitLab's shared runners by itself: their compute
# minutes ran out on 9 October 2026 and left batch46's change gate without a runner
# (docs/ContinuousIntegration.md, "Every job on the project's own runners"). A job that
# names no runner itself takes default:'s tags, [$HM_RUNNER]: linix (variables:, below)
# in such a pipeline, and GitLab's hosted runner in any other - a merge request's, an
# unprotected branch's - where its workflow rule says so, since the project's runners,
# registered ref_protected, take nothing of that pipeline.
#
# GitLab's hosted runners beside the project's, since the group's open-source plan of
# 13 October 2026 (50,000 compute minutes a month): a class of the jobs on the
# project's runners that need nothing of the project's - the builds and checks, the
# package builds and their install jobs, the jobs in an arm64 container, the two
# suites - takes its tags from a switch, a variable below that is linix here, and that
# a protected project CI/CD variable of the same name, which the owner sets, sends to
# one of GitLab's hosted Linux machines in a pipeline of a protected ref (variables:,
# HM_RUNNER_BUILD and the rest). The jobs that hold a credential or sign, the
# release's, the Windows ones, the privileged systemd ones, nix (KVM: server2, by the
# tag kvm), the lab's and those that keep a runner's own cache stay on the project's
# runners whatever a switch says. hosted-runners and compute-quota
# (.gitlab/ci/hosted-runners.yml) check the switches, what a job there is given and the
# namespace's minutes in every pipeline of master or a batch* branch a switch is set for
# (docs/ContinuousIntegration.md, "GitLab's hosted runners beside the project's").
# build/check-release-chain.py holds
# every job of the CI files to a runner of the project's in a protected ref's pipeline -
# or to its class's switch - and to one that takes it in any other, and each class to
# its jobs.
#
# In every pipeline:
#
#   checkers    every build/check-*.py that needs nothing but Python and git, the
#               self-tests, the generators' --check, and the two that rewrite a
#               committed file (check-deck-parity.py and generate-portal-languages.py)
#               held to the file staying as it was committed;
#   harnesses   the Control Deck's and the webmail's scripts run in Node against a
#               small DOM and a recorded server, and the webmail's S/MIME and OpenPGP
#               modules against OpenSSL and GnuPG;
#   sign-off    on every merge request, and on a batch* branch, which stands for its
#               merge request, every commit carries a Signed-off-by trailer naming
#               its author (build/sign-off.py; CONTRIBUTING.md, "Sign-off");
#   editorconfig          every text file against .editorconfig;
#   chart-and-compose     the Helm chart and the Compose file, when they change;
#   update-helper         the live update's Linux apply step against fakes, and the
#                         units, when they change;
#   package-templates     the winget and Chocolatey templates render, when they change;
#   coverage-cobertura    linux-coverage's Cobertura converter against samples of its
#                         own, when it changes.
#
# And these, each on the runner it names, for a protected ref only - master, a batch*
# branch, a v* tag - and never for a merge request (linix, for a job of a class, is
# where its switch leaves it: variables:, below):
#
#   linux-build   linix: the Linux server with clang, its tester programs, the
#                 OpenPGP writer against GnuPG, and the .deb and the .rpm
#                 (build/ci/linux-build.sh);
#   linux-suite   linix: the whole of LinuxRegressionTests against that server on
#                 PostgreSQL (build/ci/linux-suite.sh);
#   linux-cross, linux-sanitize, linux-db-upgrade-pgsql, linux-db-upgrade-mysql,
#   linux-package-deb, linux-package-rpm, linux-image, linux-sbom
#                 linix: what the old GitHub workflows ran beside the build (the
#                 block "ported from GitHub Actions" below);
#   linux-image-arm64     linix: the container image for linux/arm64, beside
#                 linux-image's linux/amd64 one (.gitlab/ci/container-image.yml);
#   linux-repro   linix: linux-build's server and packages made a second time, from
#                 another path, and compared byte for byte (build/ci/linux-repro.sh);
#   windows-gate  bench150: the Windows suite but for six namespaces, in the bench's
#                 own checkout, which its hMailServer service runs from
#                 (build/ci/windows-gate.ps1);
#   windows-gate-s1vm  S1-WINBENCH, at the same time: those six - Security,
#                 Infrastructure, SMTP, AntiVirus, SSL and ExternalAccounts - the same
#                 way, in that bench's own checkout;
#   windows-dotnet  bench150: the Control Panel and the tools built, tested and held
#                 to dotnet format (build/ci/windows-dotnet.ps1);
#
# And for a v* tag, the release (docs/ContinuousIntegration.md, "The release"):
#
#   windows-installer     bench150: the x64 Windows installer, built in the bench's checkout
#                         after both halves of the Windows suite, windows-gate and
#                         windows-gate-s1vm (build/ci/windows-installer.ps1); the ARM64 one is
#                         windows-packages-arm64's (.gitlab/ci/packages-windows.yml);
#   release               by hand: the tag, the version stamp and the settings checked, the
#                         security scans' reports read (build/ci/security-gate.py), and
#                         every file the release carries collected (build/ci/release-chain.py);
#   release-authenticode  bench150: the two installers and the PowerShell module Authenticode-signed
#                         through Azure Artifact Signing with the job's ID token
#                         (build/ci/windows-authenticode.ps1);
#   release-sbom          each signed installer's own SBOM, <installer>.cdx.json; the x86-64 .deb's
#                         and .rpm's are linux-build's, and the AArch64 ones' their SBOM jobs'
#                         (.gitlab/ci/packages-*.yml; build/asset-sbom.py, build/ci/release-chain.py);
#   release-sign          every file signed with Sigstore as this pipeline (build/ci/release-sign.sh);
#   release-verify        linix: every bundle checked with the server's own verifier
#                         (build/ci/release-verify.sh);
#   release-publish       by hand: the files uploaded to the package registry and the GitLab
#                         release created (build/ci/release-chain.py);
#   pages, package-repos  after release-publish, in the tag's own pipeline: the update feed
#                         rendered with the new release in it and the site deployed.
#
# And each in a pipeline of its own, from the pipeline schedule whose description is
# the word given (the owner makes each; docs/ContinuousIntegration.md says how):
#
#   linux-fuzz        "fuzz", nightly: linix, the MIME harnesses under libFuzzer
#                     (build/ci/linux-fuzz.sh);
#   linux-coverage    "coverage", weekly: linix, the native server's line, region and
#                     branch coverage under the Linux suite (build/ci/linux-coverage.sh);
#   renovate          "renovate", daily: linix, Renovate's dependency updates;
#   scorecard         "scorecard", weekly: linix, OpenSSF Scorecard, whose result pages
#                     and package-repos then publish (.gitlab/ci/scorecard.yml);
#   secret_detection  "security", run once by hand: GitLab's secret detection over
#                     the whole history (.gitlab/ci/gitlab-security.yml).
#
# Any other schedule on master - the update feed's - runs pages alone.
#
# Why protected refs only: the runners are registered ref_protected, so GitLab gives
# them no job for anything else; the rules below do not even create one of these jobs
# for anything else, and the workflow's rules send every other job of such a pipeline
# to GitLab's hosted runner. A merge request - above all one from a fork - runs code
# nobody has reviewed, and none of it reaches a machine of the project's
# (docs/ContinuousIntegration.md).
#
# What is still run by hand (CONTRIBUTING.md, "The checkers"): check-package-manifests.py
# against a released installer, the PowerShell checks (check-schema-versions.ps1,
# check-db-scripts.ps1, which needs SQL Server Compact, check-roadmap.ps1), and the
# builds and both suites for any branch that is not protected, and the installer smoke
# test (below).
#
# Every script is started through python3, node, bash or PowerShell, never by its
# shebang. The tree checks out CRLF on every platform (.gitattributes, but for
# build/ci/*.sh and the Dockerfile), and a shebang line ending in a carriage return
# names an interpreter that does not exist.

# Jobs kept in files of their own under .gitlab/ci/, one line each, and nothing else:
# build/check-release-chain.py reads the CI files of .gitlab/ci/ named <name>.yml, and
# refuses an include here of any other file, which GitLab would merge into the jobs
# unread (ci_override_problems).
include:
  # GitLab's SAST and secret detection, from GitLab's templates (the file says what they add).
  - local: .gitlab/ci/gitlab-security.yml
  - local: .gitlab/ci/container-image.yml
  # The Helm chart packaged as a file of the release (hmailserver/docs/ContainerImage.md).
  - local: .gitlab/ci/helm-chart.yml
  # The signed apt and dnf repositories, added to the feed's site; it turns pages' own deployment off.
  - local: .gitlab/ci/package-repos.yml
  # The weekly export of what a push mirror does not carry, on linix (docs/Mirroring.md).
  - local: .gitlab/ci/forge-export.yml
  # The package builds for every distribution and architecture, a file each
  # (docs/PackagesDeb.md and its siblings).
  - local: .gitlab/ci/packages-deb.yml
  - local: .gitlab/ci/packages-appimage.yml
  - local: .gitlab/ci/packages-rpm.yml
  - local: .gitlab/ci/packages-windows.yml
  # The source tarball the Linux build and suite run from and a release carries (docs/SourceTarball.md).
  - local: .gitlab/ci/source-tarball.yml
  # The Debian source package and the RPM spec, built from the tarball with the network
  # refused, linted, installed and started; batch* and master only (docs/SourcePackages.md).
  - local: .gitlab/ci/source-packages.yml
  # What a release carries from the package jobs besides the generic packages - each
  # distribution release's .deb and .rpm, the AppImages and the source tarball -
  # gathered with each one's SBOM, for release and its rehearsal (docs/ContinuousIntegration.md).
  - local: .gitlab/ci/release-packages.yml
  # The release rehearsed on a protected batch* branch: collected, signed as the branch
  # and verified, published nowhere (docs/ContinuousIntegration.md, "The release rehearsal").
  - local: .gitlab/ci/release-rehearsal.yml
  # The live update off, and aware of where it runs (docs/LiveUpdateKinds.md).
  - local: .gitlab/ci/live-update.yml
  # hmctl on PyPI and the PowerShell module on the Gallery: their checks, and the two
  # publish jobs, dormant until each account exists (docs/CommandLinePackages.md).
  - local: .gitlab/ci/cli-packages.yml
  # GitHub's hosts kept out of a job whose image or runner does not keep them out (docs/ContinuousIntegration.md, "Nothing from GitHub, in the job").
  - local: .gitlab/ci/no-github.yml
  # What every change - a merge request, or a protected batch* branch - must pass beyond the checks: semgrep-sast's findings in what it changes, and the dependency versions it adds or pins (docs/ContinuousIntegration.md, "Change checks").
  - local: .gitlab/ci/mr-checks.yml
  # The server and its testers built with GCC too, on master and batch* (docs/ContinuousIntegration.md, "The GCC build").
  - local: .gitlab/ci/gcc.yml
  # OpenSSF Scorecard, weekly, published on the feed's site; dormant without GITLAB_AUTH_TOKEN (docs/ContinuousIntegration.md, "OpenSSF Scorecard").
  - local: .gitlab/ci/scorecard.yml
  # The project's Nix flake built and its NixOS test run, on master and batch* (docs/Nix.md).
  - local: .gitlab/ci/nix.yml
  # The server built with musl on Alpine by its APKBUILD, installed and started with OpenRC, and the Linux suite run there, on master and batch* (docs/Alpine.md).
  - local: .gitlab/ci/alpine.yml
  # The release channels: a signed release published to Docker Hub, Quay, ECR Public, the AUR, a Launchpad PPA, Copr, OBS, Chocolatey and the Snap Store, by hand on master, each dormant until its account exists (docs/Channels.md).
  - local: .gitlab/ci/channels.yml
  # The .deb and the Fedora 44 .rpm started under their own systemd unit, systemd as PID 1, on linix's privileged runner entry (docs/PackagesDeb.md, "Started under systemd").
  - local: .gitlab/ci/package-systemd.yml
  # The snap, from the Ubuntu 24.04 .debs, built on linix for amd64 and arm64 with snapcraft from the Snap Store; batch* and master (docs/Snap.md).
  - local: .gitlab/ci/snap.yml
  # The two checks of a pipeline in which a switch sends a class of jobs to GitLab's hosted runners: the switches and the credentials a job there is given, and the namespace's compute minutes (docs/ContinuousIntegration.md, "GitLab's hosted runners beside the project's").
  - local: .gitlab/ci/hosted-runners.yml

stages:
  - check
  - build
  - test
  - release

# One pipeline per change. A protected branch of this project (master, batch*) always
# runs its own branch pipeline, which is the one with the builds and the suites, and a
# merge request from a protected batch* branch of this project runs none beside it:
# that branch's pipeline runs the change gates (.gitlab/ci/mr-checks.yml), and GitLab
# holds its merge request to it. Every other merge request runs a pipeline of its own -
# one from a fork's branch, protected there or not, whose source project is not the
# merge request's own (in the fork's pipeline CI_PROJECT_ID is the fork's, so it is
# compared with the merge request's project, not with that), and one from another
# protected branch here, whose branch pipeline runs no gate. Any other branch runs a
# merge request's pipeline while it has an open merge request, and its own branch
# pipeline otherwise. A v* tag runs one; any other tag none. build/check-release-chain.py
# holds the first rule to the gates' rules for a batch* branch.
#
# And the runner. A rule that makes a pipeline for a protected ref that is not a merge
# request's leaves HM_RUNNER as variables: has it, linix, so that every job of it runs
# on the project's runners. Every other rule that makes a pipeline - a merge request's,
# a v* tag's or a branch's that is not protected - sets it to saas-linux-small-amd64,
# the tag of GitLab's hosted small Linux runner: the project's runners, registered
# ref_protected, take nothing of such a pipeline, and none of its code reaches them. So
# a merge request's checks run on GitLab's runners - a fork's in the fork, on the
# fork's minutes - and every pipeline of a protected ref that is not a merge request's
# on the project's own. The rules are those before, each that makes a pipeline split in
# two: for a protected ref, then for the rest. build/check-release-chain.py tries every
# kind of pipeline against them, and build/ci/repo-hygiene.py reads them as the guard
# of every job that takes default:'s tags (Token-Permissions).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_MERGE_REQUEST_PROJECT_ID && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^batch/ && $CI_MERGE_REQUEST_SOURCE_BRANCH_PROTECTED == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        HM_RUNNER: saas-linux-small-amd64
    - if: $CI_COMMIT_TAG =~ /^v/ && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_TAG =~ /^v/
      variables:
        HM_RUNNER: saas-linux-small-amd64
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_BRANCH
      variables:
        HM_RUNNER: saas-linux-small-amd64

default:
  # A newer push to the same branch makes this pipeline's answer moot. The long gates,
  # linux-suite and the Windows suite's two halves, windows-gate and windows-gate-s1vm,
  # say interruptible: false (as do linux-fuzz, renovate and the release jobs), and
  # once one of them has started GitLab cancels nothing of the pipeline: a gate is not
  # cut off half-way, and the pipeline that started it keeps its answer.
  interruptible: true
  # Where every job runs that names no runner of its own - GitLab's templates' jobs among
  # them: HM_RUNNER, which is linix for a protected ref that is not a merge request's
  # and GitLab's hosted runner for any other pipeline (variables: and workflow:).
  tags: [$HM_RUNNER]

variables:
  # The runner of every job that names none of its own (default:, above): the tag
  # linix, which linix, server2 and s1-linux carry. The workflow's rules set it to
  # saas-linux-small-amd64, GitLab's hosted small Linux runner, for a merge request's
  # pipeline and an unprotected ref's, and nothing else in the CI files sets it
  # (build/check-release-chain.py). A project CI/CD variable of this name would stand
  # above both: none is made.
  HM_RUNNER: linix
  # The switches: where each class of the jobs on the project's own runners that need
  # nothing of the project's runs, as a runner tag. Each is linix here - the jobs run
  # where they always have - and a PROTECTED project CI/CD variable of the same name,
  # which only the owner sets (Settings, CI/CD, Variables), stands above this line and
  # sends the class to GitLab's hosted runners in a pipeline of a protected ref: a merge
  # request's pipeline has none of these jobs, and is given no protected variable. A lane
  # is the resource group that keeps a class's jobs one at a time on the project's
  # machines; a class sent to GitLab's runners, whose every job has a machine of its own,
  # is given a lane of its own per job by its variable (hosted-$CI_JOB_NAME). Nothing
  # else in the CI files sets them (build/check-release-chain.py, which holds each class
  # to its jobs); docs/ContinuousIntegration.md, "GitLab's hosted runners beside the
  # project's", says which jobs each takes, what a job there is given, what each costs,
  # and how the switch is set back. hosted-runners and compute-quota, below, check them
  # in every pipeline of master or a batch* branch a switch is set for.
  #   HM_RUNNER_BUILD     the builds and checks in the CI image or a distribution's own
  #                       (linux-build, the scans, linux-repro, ...): saas-linux-large-amd64
  #   HM_RUNNER_PACKAGES  the package builds and their install jobs in amd64 containers,
  #                       with their lane HM_LANE_PACKAGES: saas-linux-large-amd64
  #   HM_RUNNER_ARM64     the jobs in an arm64 container, which linix, server2 and
  #                       s1-linux run under qemu-user: natively on
  #                       saas-linux-medium-arm64
  #   HM_RUNNER_SUITE     linux-suite and alpine-suite, with their lane HM_LANE_SUITE
  HM_RUNNER_BUILD: linix
  HM_RUNNER_PACKAGES: linix
  HM_LANE_PACKAGES: linix-package-build
  HM_RUNNER_ARM64: linix
  HM_RUNNER_SUITE: linix
  HM_LANE_SUITE: linix-suite
  # None of the checks reads history; the sign-off job asks for all of it.
  GIT_DEPTH: "1"
  # The image release-sign runs cosign in: cosign's own, from Google's registry (never
  # ghcr.io or GitHub), the -dev tag for its busybox shell, pinned by digest - the
  # digest of the tag's multi-platform index, as docker inspect gave it on linix on 26
  # September 2026. cosign 2.6.5, the last release of the 2 line the release scripts
  # were written for. The image has no /bin/sh: its shell is /busybox/sh, which is on
  # its PATH as sh, which is how GitLab's runner starts a job's script in it
  # (docs/ContinuousIntegration.md, "The release").
  HM_COSIGN_IMAGE: "gcr.io/projectsigstore/cosign:v2.6.5-dev@sha256:76029a0246bcfde96caa72469a62a1094f6e0978dc3f537f5cafd4c5f6c6a417"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

# Every scheduled pipeline runs one job, chosen by the schedule's description
# ($CI_PIPELINE_SCHEDULE_DESCRIPTION): "fuzz" linux-fuzz, "coverage" linux-coverage, "renovate" renovate
# with image-pins beside it,
# "export" forge-export (.gitlab/ci/forge-export.yml), "security" secret_detection,
# "scorecard" scorecard (.gitlab/ci/scorecard.yml) with pages and package-repos, which
# publish its result,
# and any other - the update feed's - pages (with package-repos). So the checks
# take these rules, and .own-runners below begins with the same refusal. It
# refuses a downstream pipeline too (source "pipeline"): none of this project's
# jobs starts one - the release's feed is deployed in the tag's own
# pipeline (pages, below) - and one another project's trigger or a job token's call
# of the trigger API started on master would run pages alone. A schedule is chosen
# by its description and not by a variable because the project refuses pipeline
# variables (ci_pipeline_variables_minimum_override_role no_one_allowed), and GitLab
# counts a schedule's variables as pipeline variables: it would not save one. The
# description is a predefined variable, which that does not touch.
.not-a-fuzz-pipeline:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - when: on_success

checkers:
  stage: check
  # Docker Hub's Python and Node images, by the digest Docker Hub served for the tag
  # on 26 September 2026 (docker pull on linix); Renovate moves tag and digest
  # together (renovate.json, pinDigests).
  image: python:3.14-slim-trixie@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
  # The script runs one check at a time, so a runner's speed on one core decides its
  # time and its CPU count does not: on 24 October 2026 it took 1,136 s on server2 in
  # this image with 8 CPUs, linix's limit, and 1,135 s with 2, GitLab's small hosted
  # runner's. linix has taken 1.4 to more than 1.6 times server2's time for the same
  # script (1,060 s against 776 s on 21 October; killed at 20 minutes in pipelines
  # 2969966488 and 2983075001 on 21 and 23 October, where server2 took 764 s in the
  # second), and GitLab's small runner, which a branch's or a merge request's
  # pipeline outside the protected refs takes, about 1.6 times: on 19 October it took
  # 1,173 s, 1.58 times, in its one whole run, which failed a check, and at least
  # 1.62 times in the two it killed at 20 minutes, after 1,206 s and 1,202 s, where
  # server2 had taken 743 s for the master the three merge requests were made on.
  # At 1.6 times 1,136 s that is about 30 minutes; 45 leave half as much again
  # for the checks each batch adds (docs/ContinuousIntegration.md, "How long each
  # job takes").
  timeout: 45 minutes
  rules:
    - !reference [.not-a-fuzz-pipeline, rules]
  before_script:
    # git for the two "is the committed file still what this writes" steps below.
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git > /dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - |
      failed=""
      check() {
        echo ""
        echo "\$ $*"
        if "$@"; then
          :
        else
          failed="$failed
        $*"
        fi
      }
      # The file as committed, or the difference and a failure.
      unchanged() {
        if git diff --quiet -- "$@"; then
          return 0
        fi
        git --no-pager diff --stat -- "$@"
        git --no-pager diff -- "$@" > /tmp/unchanged.diff || true
        head -n 80 /tmp/unchanged.diff
        echo "Out of date: run the script named above and commit what it writes."
        return 1
      }
      deck_parity() {
        python3 build/check-deck-parity.py > /dev/null && unchanged hmailserver/docs/DeckParity.md
      }
      portal_languages() {
        python3 build/generate-portal-languages.py && unchanged hmailserver/source/Server/Common/Util/PortalLanguagesData.cpp
      }

      for script in build/check-*.py; do
        case "$script" in
          # Needs the manifests make-package-manifests.ps1 renders from a released
          # installer, and checks that installer's URL on the release host.
          build/check-package-manifests.py) continue ;;
          # Need node: the harnesses job runs them.
          build/check-deck-script.py|build/check-portal-script.py) continue ;;
          # Rewrites hmailserver/docs/DeckParity.md: deck_parity below.
          build/check-deck-parity.py) continue ;;
          # hmctl's half alone, below; this image has no pwsh, and cli-powershell
          # (.gitlab/ci/cli-packages.yml) runs the PowerShell module's half.
          build/check-cli.py) continue ;;
          # Asks every pinned image's registry: the image-pins job's, in Renovate's
          # schedule's pipeline. Its self-test, which asks only the loopback, is below.
          build/check-image-pins.py) continue ;;
        esac
        check python3 "$script"
      done
      # hmctl against a recorded server: what it sends and what it prints.
      check python3 build/check-cli.py --python

      # The negative controls: each breaks its rules in a copy and proves the check
      # still reports it, so a check that has stopped seeing the source fails too.
      for name in address-parsing authz-choke-point binary-manifest blowfish-constants changelog channels citation cli-packages collection-iteration com-error-info com-shared-copies \
                  db-settings-coverage elevated-verbs help-map idl-case localisation mnemonics mysql-charset osv-ignores password-choice-sites release-chain \
                  package-texts roadmap2 role-choke-point sbom-inputs source-literals source-tarball spacing; do
        check python3 "build/check-$name.py" --self-test
      done
      # The catalogues' untranslated rule against the values that shipped untranslated.
      check python3 build/check-catalogues.py --self-test
      # The newest "What changes on upgrade" list is numbered 1..n and every reference
      # inside its section names its item: a fold of two branches that each added items
      # leaves two with one number (6.3.6's two items 14). The fix is to run the script
      # without --check and read what it says.
      check python3 build/renumber-upgrade-items.py --self-test
      check python3 build/renumber-upgrade-items.py --check
      # Each compiled release file's own SBOM (build/asset-sbom.py), against a tree, a
      # dpkg and an rpm held in memory.
      check python3 build/asset-sbom.py --self-test
      # The update feed's generator, against canned answers: no network, one loopback
      # socket, and the compiled feed addresses read out of UpdateChecker.cpp.
      check python3 build/generate-update-feed.py --self-test
      # The release's collect and publish steps, against a registry and a releases API in
      # memory: the links they make are the ones the feed takes.
      check python3 build/ci/release-chain.py --self-test
      # hmctl's PyPI package and its publish step, against a PyPI and a feed in memory.
      check python3 build/ci/cli-packages.py --self-test
      # The sign-off check and the landing script, against repositories and a GitLab API
      # they make for themselves.
      check python3 build/sign-off.py --self-test
      check python3 build/land-via-mr.py --self-test
      # The release's security gate and the change's, against canned reports, exceptions files and
      # repositories it makes for itself; and the source scans' findings against their baselines and
      # an exceptions file, and the rewrite of a baseline that never grows.
      check python3 build/ci/security-gate.py --self-test
      check python3 build/ci/security-findings.py --self-test
      # The change's dependency check, against OSV exports and repositories it makes for itself.
      check python3 build/ci/mr-dependency-check.py --self-test
      # The dependency scan's severities, VEX matching and version readers, offline, and the tree's VEX document and pins.
      check python3 build/ci/dependency-scan.py --self-test
      # The Scorecard result's publication on the feed site, against a site it serves on the loopback.
      check python3 build/ci/scorecard-pages.py --self-test
      # The checks of a pipeline a switch sends jobs to GitLab's hosted runners in: the switches,
      # the credentials and the compute minutes, against answers in memory and a GitLab API it
      # serves on the loopback, and the switches' defaults in this tree's .gitlab-ci.yml.
      check python3 build/ci/hosted-runners.py --self-test
      # The release channels' publishers, against a feed, a release, a registry and their tools in memory.
      for s in release-files registry-mirror aur-publish ppa-upload copr-build obs-publish snap-upload fake-sigstore; do
        check python3 "build/ci/channels/$s.py" --self-test
      done
      # The secret scan the hooks and the landing run, without a scanner: what it
      # reads, what it asks the scanner, and that it refuses when there is none.
      check python3 build/scan-secrets.py --self-test
      # The image pins' check, against a registry it serves on the loopback: what it
      # reads, how it asks, and what a gone or unanswered pin makes of the exit code.
      check python3 build/check-image-pins.py --self-test
      # .gitleaksignore's directory-form lines held to the tree's files, over fixtures: a
      # line an edit moved, a finding no line names, a rule it has no pattern for. The
      # loop above runs it over the tree.
      check python3 build/check-gitleaksignore.py --self-test
      # Token-Permissions against CI files made to pass it and made to break it: a
      # protected-ref clause inside an OR, rules it could misread, a template's token.
      check python3 build/ci/repo-hygiene.py --self-test
      # The webmail's timing tool (Performance.md), against a REST listener it serves on the
      # loopback: a 429 waited out and in no time, an ended session signed in again, and a
      # search cut short recorded while the run goes on.
      check python3 build/perf/webmail-timing.py --self-test

      # Generated source is what its generator writes now.
      check python3 build/add-license-headers.py --check
      for name in help-pages portal-page portal-smime portal-openpgp settings-defaults profiles idna-tables html-references auth-matrix; do
        check python3 "build/generate-$name.py" --check
      done
      # The web authorisation matrix's reading of the route parser and of Authorize_, broken
      # in memory, so that a generator which has stopped seeing the source fails too.
      check python3 build/generate-auth-matrix.py --self-test
      check portal_languages
      check deck_parity

      # The Linux version stamps against Version.h.
      check bash build/check-linux-version-stamp.sh

      # And nothing above rewrote anything else.
      check unchanged .

      echo ""
      if [ -n "$failed" ]; then
        echo "Failed:$failed"
        exit 1
      fi
      echo "Every check passed."

harnesses:
  stage: check
  image: node:24-trixie-slim@sha256:8ec5d7557396cfe32d21c3f9c13072355ceab22b584578ca4bb28af31120cffe
  timeout: 20 minutes
  rules:
    - !reference [.not-a-fuzz-pipeline, rules]
  before_script:
    # python3 starts the two page harnesses, openssl is the other side of the S/MIME
    # check, and gpg the other side of the OpenPGP one (without it that check runs
    # its committed fixtures only and says which half it skipped).
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends python3 openssl gnupg > /dev/null
  script:
    - node --version
    - python3 build/check-deck-script.py
    - python3 build/check-portal-script.py
    - node build/check-portal-smime.js
    - node build/check-portal-openpgp.js

sign-off:
  stage: check
  image: python:3.14-slim-trixie@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
  timeout: 10 minutes
  variables:
    GIT_DEPTH: "0"
  # Every commit that reaches master carries its author's Developer Certificate of
  # Origin sign-off, the maintainers' included (CONTRIBUTING.md, "Sign-off"). A
  # change reaches master through a merge request: a fork's or a branch of this
  # project's runs this job in the merge request's pipeline, and a batch* branch's
  # runs none (the workflow rules), so its own branch pipeline, which stands for the
  # merge request, runs it here. build/sign-off.py is the check, and
  # build/land-via-mr.py asks it the same question before it pushes a batch.
  # For a batch* branch the range is what the branch adds to master, less what the
  # project's own v* tags hold: a released commit cannot take a trailer without
  # being rewritten, and until 26 September 2026 the maintainers' commits carried
  # none. A fork's tags are the fork's, so a merge request's range exempts nothing.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^batch/ && $CI_COMMIT_REF_PROTECTED == "true"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git > /dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        python3 build/sign-off.py "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
      else
        git fetch --quiet --force origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH" "+refs/tags/v*:refs/tags/v*"
        set --
        for tag in $(git tag -l 'v*'); do
          set -- "$@" --exempt "refs/tags/$tag"
        done
        python3 build/sign-off.py "refs/remotes/origin/$CI_DEFAULT_BRANCH" "$CI_COMMIT_SHA" "$@"
      fi

# ---------------------------------------------------------------- the update feed
#
# https://updates.progressiverobot.com, the release feed installed servers read
# (docs/UpdateFeed.md): GitLab Pages from this project, a job named pages whose
# public/ artifact GitLab deploys. build/generate-update-feed.py renders it from the
# project's releases and package registry through the public API, with no token and
# nothing from the commit but the script, so any run publishes what the releases say
# at that moment. It runs for a push to the default branch, for a v* tag, and for a
# pipeline schedule on the default branch (the update feed's, "update feed"), which is
# what picks up a release made or edited after its tag's pipeline ran; a schedule's
# pipeline runs this job alone, the checks and the own runners' jobs each skipping a
# pipeline whose source is a schedule (docs/ContinuousIntegration.md, "The update
# feed", says how the schedule is made). Never for a merge request: a fork's code
# must not publish the feed. On linix's tag, like the checks (default:).
#
# In a v* tag's pipeline it waits for release-publish, so that the release is in the
# feed it renders, and package-repos, which needs it, deploys the site from the tag's
# own pipeline: GitLab deploys Pages from whichever pipeline's job succeeds, whatever
# its ref, once that pipeline's commit is its ref's newest (Gitlab::Pages::
# DeploymentValidations, read 29 September 2026), and a tag's commit always is. The
# need is optional because release-publish is in a v* tag's pipeline alone: on the
# default branch and in a schedule's pipeline pages runs at once, as it always has.
# Until 6.3.6 a job update-feed after release-publish triggered a pipeline on the
# default branch instead, and GitLab drops a multi-project trigger into the project
# that runs it (invalid_bridge_trigger, "downstream pipeline trigger definition is
# invalid": Ci::CreateDownstreamPipelineService); 6.3.5's tag pipeline failed on it,
# and its feed was deployed by a master pipeline started by hand.
# build/check-release-chain.py holds this.
pages:
  stage: release
  image: python:3.14-slim-trixie@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
  needs:
    - job: release-publish
      artifacts: false
      optional: true
  timeout: 15 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    # Not the five schedules that each run another job alone: the fuzz schedule's,
    # the coverage schedule's, Renovate's, the forge export's and the history's secret scan. package-repos
    # takes these rules (!reference [pages, rules]), so it refuses them too.
    - if: $CI_PIPELINE_SOURCE == "schedule" && ($CI_PIPELINE_SCHEDULE_DESCRIPTION == "fuzz" || $CI_PIPELINE_SCHEDULE_DESCRIPTION == "coverage" || $CI_PIPELINE_SCHEDULE_DESCRIPTION == "renovate" || $CI_PIPELINE_SCHEDULE_DESCRIPTION == "export" || $CI_PIPELINE_SCHEDULE_DESCRIPTION == "security")
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/ && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - python3 build/generate-update-feed.py --self-test
    - python3 build/generate-update-feed.py --output public
    - python3 build/generate-update-feed.py --serve-check public
  artifacts:
    expire_in: 1 week
    paths:
      - public

# ---------------------------------------------------------------- the project's own runners
#
# linix, server2 and s1-linux, a Linux VM on server1 (tags linux, docker, linix, and
# kvm on server2), linix's second entry linix-systemd (tag linix-systemd), bench150
# (tags windows, bench, bench150) and S1-WINBENCH (tags windows, bench-s1vm), a
# Windows Server VM on server1 that takes windows-gate-s1vm,
# are project runners registered ref_protected with run_untagged off, and a job
# reaches one only by its tag - every job of the CI files does, one that names none by
# default:'s [$HM_RUNNER]. These rules keep a job that names one of them out of any
# pipeline that is not for a protected ref, and out of every merge request pipeline
# whatever its source; the jobs that take default:'s tags, the workflow sends to
# GitLab's hosted runner there. A job of a class (variables:, HM_RUNNER_BUILD and the
# rest) takes these rules too: its switch can send it to GitLab's runners, in a
# pipeline of a protected ref alone, and it stays out of every other one, as on linix.
# A scheduled pipeline runs the one job its description names (linux-fuzz and renovate
# here, with rules of their own): it must not start the gates.
#
# Nor does a push that changes documentation alone: the jobs here run when the push
# changes any file but a Markdown file at the root of the tree or under a top-level
# directory whose name begins with a dot (.gitlab/'s issue and merge request templates,
# .github/'s pull request template). Every other Markdown file counts as code:
# hmailserver/docs/*.md is compiled into the server (HelpPagesData.cpp) and read by the
# suites, and the READMEs further down are read by tests and packaging. GitLab matches
# the paths with Ruby's File.fnmatch (FNM_PATHNAME, FNM_DOTMATCH, FNM_EXTGLOB), which
# has no "all but": so the first three patterns name every file whose name does not
# end in ".md" but two, "d" and "md", too short for them, which the next two name;
# and the last every .md below a directory whose name does not begin with a dot.
# build/check-release-chain.py holds the patterns to that, file by file, and
# build/land-via-mr.py's documents_only to them.
# A branch's first push, a tag and a pipeline started by hand count every file as
# changed, so they run everything.
.own-runners:
  rules:
    # A scheduled pipeline (linux-fuzz's, linux-coverage's, renovate's, the feed's) and a
    # downstream one (source "pipeline", which nothing of this project starts) run no job here.
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_REF_PROTECTED == "true"
      changes:
        paths: &not-docs-only
          - "**/*[!d]"
          - "**/*[!m]d"
          - "**/*[!.]md"
          - "**/d"
          - "**/md"
          - "[!.]*/**/*.md"

# The Linux jobs run in an image built ON linix from build/ci/linux.Dockerfile and pushed
# to the project's registry (build/ci/build-linux-image.sh --push), which each runner with
# the tag linix pulls by the digest below: its tag is made from the Dockerfile's own hash,
# build/check-ci-image.py holds the line below to it, and its --job step stops a job
# started in an image named any other way (docs/ContinuousIntegration.md, "The image").
# The tag is HM_RUNNER_BUILD's, linix unless the switch sends the class to GitLab's
# runners, which pull the image from the project's registry by the same digest; a job
# that extends this and needs a machine of the project's names [linix] itself
# (linux-fuzz, linux-coverage, db-matrix, release-verify, release-rehearsal-verify),
# and linux-suite names HM_RUNNER_SUITE.
.linix:
  extends: .own-runners
  tags: [$HM_RUNNER_BUILD]
  image:
    name: registry.gitlab.com/hmailserver/hmailserver/ci-linux:26.04-68dd5409068c@sha256:952745b5eb6348251e03128f5adc0db14e3101355044d8af686f6ad0598203f5
    pull_policy: [if-not-present, always]
  before_script:
    - python3 build/check-ci-image.py --job

# Started at once rather than after the checks: the runner is otherwise idle, and
# the suite waits for it.
linux-build:
  extends: .linix
  stage: build
  # Built from the source tarball alone, as a distribution builds it (docs/SourceTarball.md).
  needs: [source-tarball]
  timeout: 1 hour
  variables:
    HM_SOURCE_TARBALL: source-tarball
  script:
    - bash build/ci/linux-build.sh
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - linux-build/

linux-suite:
  extends: .linix
  # The suites' class: linix, or GitLab's runners when HM_RUNNER_SUITE says so
  # (variables:). It took 135 to 146 minutes on every runner of the project's in
  # October 2026, on linix's six CPUs as on server2's 28: it waits on its fixtures'
  # timeouts, not on the CPU (docs/ContinuousIntegration.md, "GitLab's hosted runners
  # beside the project's").
  tags: [$HM_RUNNER_SUITE]
  stage: test
  needs: [linux-build, source-tarball]
  # The runners' maximum. The suite took 2 h 7 min in the first pipeline, on 26
  # September 2026, and the 29 fixtures linked that day add about 20 minutes: under
  # three hours, but with too little to spare for a suite that grows every batch.
  # GitLab's hosted runners stop every job at three hours, after_script and all.
  timeout: 4 hours
  # A later push does not cut the suite off half-way (default:, above).
  interruptible: false
  # One whole suite at a time on linix, this one or alpine-suite's
  # (.gitlab/ci/alpine.yml): the runner takes more than one job, and two suites side
  # by side would share its CPUs for hours, which the suite's timed fixtures feel. The
  # lane is HM_LANE_SUITE's, linix-suite unless the class is on GitLab's runners, where
  # each suite has a machine, and a lane, of its own.
  resource_group: $HM_LANE_SUITE
  services:
    # PostgreSQL 18, by digest: the one every job here that needs PostgreSQL runs against.
    - name: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
      alias: postgres
      pull_policy: [if-not-present, always]
      variables:
        POSTGRES_USER: hmailserver
        POSTGRES_PASSWORD: hmtest
        POSTGRES_DB: hmtest
  variables:
    HM_PG_HOST: postgres
    HM_SOURCE_TARBALL: source-tarball
    # The script is stopped ten minutes before the job's timeout, so that after_script
    # still runs: GitLab runs no after_script for a job that reached its own timeout.
    RUNNER_SCRIPT_TIMEOUT: 3h50m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 5m
  script:
    - bash build/ci/linux-suite.sh
  after_script:
    # Perhaps in a new container, with the checkout (the tree is in it for that reason):
    # the server's logs into the artifacts and the test tree removed, whether the run
    # passed, failed, ran out of time or was cancelled.
    - bash build/ci/linux-suite.sh collect
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - linux-suite/
    reports:
      junit: linux-suite/junit.xml

# The database matrix, started by hand: the linux-build server against MySQL 8.4,
# MariaDB 11.8 or PostgreSQL 17 in the test lab on linix (build/lab/, docs/TestLab.md)
# instead of the PostgreSQL 18 service linux-suite runs on - the database-sensitive
# fixtures by default, HM_SUITE_FILTER=all for the whole suite. Set HM_LAB_DB (mysql,
# mariadb or postgresql) when starting it. The database has to be up in the lab first
# (bash build/lab/lab.sh up <db> on linix: the lab's databases start on demand), and
# HM_LAB_DB_PASSWORD is a protected, masked CI/CD variable of the project holding the
# lab's HMLAB_DB_PASSWORD, scoped to the environment test-lab, which this job alone
# names, so that no other job of a protected ref's pipeline is given it - one on
# GitLab's runners among them. The job's container reaches the lab on linix's own
# address and the port the lab publishes (10310 mysql, 10311 mariadb, 10312
# postgresql): it runs on linix, whatever HM_RUNNER_BUILD says.
db-matrix:
  extends: .linix
  tags: [linix]
  stage: test
  needs: [linux-build]
  timeout: 3 hours
  environment:
    name: test-lab
    action: access
  # .own-runners' rules, started by hand: the same paths, or a docs-only push would
  # have this job without the linux-build it needs.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_REF_PROTECTED == "true"
      changes:
        paths: *not-docs-only
      when: manual
      allow_failure: true
  variables:
    HM_LAB_DB: mariadb
    HM_LAB_DB_HOST: 192.168.11.154
    HM_LAB_DB_NAME: hmlab_ci
    HM_SUITE_FILTER: db
  script:
    - bash build/lab/db-suite.sh run
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - db-matrix/
    reports:
      junit: db-matrix/junit.xml

# Before every job on bench150 or S1-WINBENCH fetches or checks anything out: what a
# cancelled job left running in this job's directory is stopped. A job cancelled
# mid-build (pipeline #11, 2897966924, on 30 September 2026) left cl.exe and
# mspdbsrv.exe running in the runner's checkout, holding a precompiled header open, and
# the next job's checkout of the same directory failed on it until they were killed by
# hand. GitLab stops a cancelled job's own process tree, but mspdbsrv detaches by design
# and a compiler started by MSBuild's tracker can outlive its parent.
#
# What is stopped: a process of the runner's own account (LocalSystem), named in the
# list below - the compilers and their servers, MSBuild and its tracker, the .NET build
# server and test host, Inno Setup's compiler - whose working directory is this job's
# CI_PROJECT_DIR or under it, or whose command line names it. Nothing else: not another
# account's process (the maintainer's split gate over SSH), not this shell or the runner
# that started it, not a process in another job's directory, and never hMailServer,
# which is not in the list: the gate's service runs from the bench's own checkout,
# C:\bench\hmailserver, outside the runner's builds directory. The working directory is
# read from the process itself (its PEB, 64- or 32-bit), since Windows offers it nowhere
# else; a process it cannot be read from is judged by its command line alone. Each one
# stopped is named in the log with why; a failure here is reported and the job goes on,
# since the checkout itself is then the check. Taken by each job on either bench as
# hooks: !reference [.bench150-leftovers, hooks] (docs/ContinuousIntegration.md,
# "bench150").
.bench150-leftovers:
  hooks:
    pre_get_sources_script:
      - |
        & {
          try {
            $names = 'cl', 'link', 'lib', 'mspdbsrv', 'midl', 'rc', 'cvtres', 'mt', 'vctip', 'MSBuild', 'Tracker',
                     'VBCSCompiler', 'csc', 'dotnet', 'testhost', 'ISCC'
            $dir = [IO.Path]::GetFullPath(($env:CI_PROJECT_DIR -replace '/', '\')).TrimEnd('\')
            $me = [Security.Principal.WindowsIdentity]::GetCurrent().Name
            if (-not ('HmBench150Leftovers' -as [type])) {
              Add-Type -TypeDefinition @'
        using System;
        using System.Runtime.InteropServices;
        using System.Text;
        public static class HmBench150Leftovers {
            [StructLayout(LayoutKind.Sequential)]
            struct BasicInformation { public IntPtr ExitStatus; public IntPtr Peb; public IntPtr Affinity; public IntPtr Priority; public IntPtr Pid; public IntPtr ParentPid; }
            [DllImport("ntdll.dll")] static extern int NtQueryInformationProcess(IntPtr process, int kind, ref BasicInformation info, int size, out int written);
            [DllImport("ntdll.dll")] static extern int NtQueryInformationProcess(IntPtr process, int kind, out IntPtr info, int size, out int written);
            [DllImport("kernel32.dll", SetLastError = true)] static extern IntPtr OpenProcess(int access, bool inherit, int pid);
            [DllImport("kernel32.dll", SetLastError = true)] static extern bool ReadProcessMemory(IntPtr process, IntPtr address, byte[] buffer, IntPtr size, out IntPtr read);
            [DllImport("kernel32.dll", SetLastError = true)] static extern bool IsWow64Process(IntPtr process, out bool wow64);
            [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr handle);
            static byte[] Read(IntPtr process, long address, int size) {
                byte[] buffer = new byte[size];
                IntPtr read;
                if (size <= 0 || !ReadProcessMemory(process, new IntPtr(address), buffer, new IntPtr(size), out read) || read.ToInt64() != size) return null;
                return buffer;
            }
            // The process's current directory: RTL_USER_PROCESS_PARAMETERS.CurrentDirectory.DosPath,
            // through the 32-bit PEB for a WOW64 process; null when it cannot be read.
            public static string CurrentDirectory(int pid) {
                IntPtr process = OpenProcess(0x0410, false, pid); // PROCESS_QUERY_INFORMATION | PROCESS_VM_READ
                if (process == IntPtr.Zero) return null;
                try {
                    bool wow64;
                    if (!IsWow64Process(process, out wow64)) return null;
                    int written;
                    if (wow64) {
                        IntPtr peb32;
                        if (NtQueryInformationProcess(process, 26, out peb32, IntPtr.Size, out written) != 0 || peb32 == IntPtr.Zero) return null;
                        byte[] parameters = Read(process, peb32.ToInt64() + 0x10, 4);
                        if (parameters == null) return null;
                        byte[] path = Read(process, BitConverter.ToUInt32(parameters, 0) + 0x24L, 8);
                        if (path == null) return null;
                        byte[] text = Read(process, BitConverter.ToUInt32(path, 4), BitConverter.ToUInt16(path, 0));
                        return text == null ? null : Encoding.Unicode.GetString(text);
                    } else {
                        BasicInformation info = new BasicInformation();
                        if (NtQueryInformationProcess(process, 0, ref info, Marshal.SizeOf(info), out written) != 0 || info.Peb == IntPtr.Zero) return null;
                        byte[] parameters = Read(process, info.Peb.ToInt64() + 0x20, 8);
                        if (parameters == null) return null;
                        byte[] path = Read(process, BitConverter.ToInt64(parameters, 0) + 0x38, 16);
                        if (path == null) return null;
                        byte[] text = Read(process, BitConverter.ToInt64(path, 8), BitConverter.ToUInt16(path, 0));
                        return text == null ? null : Encoding.Unicode.GetString(text);
                    }
                } finally {
                    CloseHandle(process);
                }
            }
        }
        '@
            }
            # This shell and every process above it - the runner - are never stopped.
            $keep = @{}
            $up = Get-CimInstance Win32_Process -Filter "ProcessId=$PID"
            while ($up -and -not $keep.ContainsKey([int]$up.ProcessId)) {
              $keep[[int]$up.ProcessId] = $true
              $up = Get-CimInstance Win32_Process -Filter "ProcessId=$($up.ParentProcessId)" -ErrorAction SilentlyContinue
            }
            $named = '(?i)(^|[\s"''=])(' + [regex]::Escape($dir) + '|' + [regex]::Escape(($dir -replace '\\', '/')) + ')($|[\\/\s"''])'
            $stopped = @()
            foreach ($process in @(Get-CimInstance Win32_Process)) {
              $id = [int]$process.ProcessId
              if ($keep.ContainsKey($id) -or $names -notcontains [IO.Path]::GetFileNameWithoutExtension([string]$process.Name)) { continue }
              $owner = Invoke-CimMethod -InputObject $process -MethodName GetOwner -ErrorAction SilentlyContinue
              if (-not $owner -or $owner.ReturnValue -ne 0 -or "$($owner.Domain)\$($owner.User)" -ne $me) { continue }
              $cwd = [HmBench150Leftovers]::CurrentDirectory($id)
              $cwdPath = if ($cwd) { ($cwd -replace '/', '\').TrimEnd('\') } else { '' }
              $why = $null
              if ($cwdPath -and ($cwdPath -eq $dir -or $cwdPath.StartsWith($dir + '\', [StringComparison]::OrdinalIgnoreCase))) {
                $why = "working in $cwdPath"
              } elseif ([string]$process.CommandLine -match $named) {
                $why = "its command line names $dir"
              }
              if (-not $why) { continue }
              "Stopping $($process.Name) (process $id, started $($process.CreationDate)), left by an earlier job: $why."
              Stop-Process -Id $id -Force -ErrorAction SilentlyContinue
              $stopped += $id
            }
            if ($stopped.Count) {
              Wait-Process -Id $stopped -Timeout 30 -ErrorAction SilentlyContinue
              $left = @($stopped | Where-Object { Get-Process -Id $_ -ErrorAction SilentlyContinue })
              if ($left.Count) { "WARNING: still running after 30 seconds: process $($left -join ', ')." }
              else { "Stopped $($stopped.Count) process(es) an earlier job left in $dir." }
            } else {
              "No compiler, MSBuild node or test host of $me left running in $dir."
            }
          } catch {
            "WARNING: the check for what an earlier job left running in $env:CI_PROJECT_DIR did not run: $($_.Exception.Message)"
          }
        }

# The Windows suite - this job's half of it, below - in the second bench's own
# checkout, C:\bench\hmailserver, because the bench's hMailServer service is registered
# from that path: GIT_STRATEGY none, and the commit is fetched into that checkout from
# GitLab. The gate scripts are this commit's, taken out of the object store (git
# archive) before the checkout is touched, so that the gate lock is held - by this
# commit's own gate-lock.ps1 - before anything in the bench's working tree changes. The
# lock is released by the script, and again by after_script for a job that was
# cancelled (GitLab 17.0 and later run after_script then) or ran out of time
# (RUNNER_SCRIPT_TIMEOUT below).
#
# HM_GATE_WHERE splits the suite between two benches, run at the same time: this job,
# on bench150, runs every test outside the six namespaces windows-gate-s1vm names
# (class!~), and windows-gate-s1vm, on S1-WINBENCH, those six (class=~), with the same
# pattern, so that together they run every test once, and a namespace added later - or
# a fixture outside RegressionTests, as ServerFreeTests is - runs here rather than
# nowhere (build/check-release-chain.py holds the two to that). Empty, it is the whole
# suite in one run.
#
# A bench busy for HM_GATE_LOCK_WAIT_MINUTES (the maintainer's split gate, or another
# pipeline's) ends the job with exit 10, which is allowed to fail: the pipeline shows a
# warning, not a failure, and the commit is gated again by retrying the job. Not for a
# v* tag: a release must not go on without its gate, so there a busy bench is exit 13,
# a failure like any other. The lock's other refusals are 13 everywhere.
windows-gate:
  extends: .own-runners
  stage: test
  tags: [bench150]
  hooks: !reference [.bench150-leftovers, hooks]
  needs: []
  timeout: 4 hours
  # A later push does not cut the suite off half-way, nor leave the bench mid-build.
  interruptible: false
  allow_failure:
    exit_codes: [10]
  variables:
    GIT_STRATEGY: none
    HM_BENCH_DIR: 'C:\bench\hmailserver'
    HM_GATE_REPOSITORY: https://gitlab.com/hmailserver/hmailserver.git
    HM_GATE_WHERE: 'class!~/^RegressionTests\.(Security|Infrastructure|SMTP|AntiVirus|SSL|ExternalAccounts)\./'
    HM_GATE_LOCK: 'C:\bench\gate.lock'
    HM_GATE_LOCK_WAIT_MINUTES: "90"
    # No prompt for a credential, ever: under LocalSystem there is nobody to answer it.
    GIT_TERMINAL_PROMPT: "0"
    GCM_INTERACTIVE: "Never"
    # No MSBuild worker left running as LocalSystem after the job.
    MSBUILDDISABLENODEREUSE: "1"
    # Ten minutes before the job's timeout the script is stopped and after_script
    # still runs, to release the lock; at the job's own timeout it would not.
    RUNNER_SCRIPT_TIMEOUT: 3h50m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 5m
  script:
    - |
      $sha = $env:CI_COMMIT_SHA
      $bench = $env:HM_BENCH_DIR
      $holder = "gitlab-pipeline-$($env:CI_PIPELINE_ID)-job-$($env:CI_JOB_ID)"
      # The scripts below are started with the PowerShell running this, by its path:
      # LocalSystem has the machine PATH only.
      $shell = (Get-Process -Id $PID).Path
      "== $($env:CI_JOB_NAME) of $sha in $bench as $([Security.Principal.WindowsIdentity]::GetCurrent().Name), under $shell"
      # GIT_STRATEGY none cleans nothing: an earlier job's scripts go first, so that
      # nothing below, and no after_script, runs another commit's.
      Remove-Item -Recurse -Force gate, gate.zip -ErrorAction SilentlyContinue
      # The commit's objects into the bench's checkout. A fetch writes under .git only
      # and changes no file of the working tree, so it may run before the lock is ours.
      git -C $bench -c credential.helper= -c gc.auto=0 fetch --quiet --no-tags $env:HM_GATE_REPOSITORY $sha
      if ($LASTEXITCODE -ne 0) {
        $ref = if ($env:CI_COMMIT_TAG) { "refs/tags/$($env:CI_COMMIT_TAG)" } else { "refs/heads/$($env:CI_COMMIT_BRANCH)" }
        "fetching $sha by its id was refused; fetching $ref"
        git -C $bench -c credential.helper= -c gc.auto=0 fetch --quiet --no-tags $env:HM_GATE_REPOSITORY $ref
      }
      git -C $bench cat-file -e "$sha^{commit}"
      if ($LASTEXITCODE -ne 0) { "FETCH FAILED: $sha is not in $bench after a fetch from $($env:HM_GATE_REPOSITORY) - no gate"; exit 11 }
      git -C $bench archive --format=zip -o "$env:CI_PROJECT_DIR\gate.zip" $sha build/ci
      if ($LASTEXITCODE -ne 0) { "$sha has no build/ci - no gate"; exit 12 }
      Expand-Archive gate.zip -DestinationPath gate
      $ci = "$env:CI_PROJECT_DIR\gate\build\ci"
      & $shell -NoProfile -ExecutionPolicy Bypass -File "$ci\gate-lock.ps1" -Take -Holder $holder -Path $env:HM_GATE_LOCK -WaitMinutes $env:HM_GATE_LOCK_WAIT_MINUTES
      $taken = $LASTEXITCODE
      # 1 is gate-lock.ps1's "another holder kept it": a busy bench, a warning (above).
      if ($taken -eq 1 -and -not $env:CI_COMMIT_TAG) { "the bench is busy - no gate this time; retry the job to gate $sha"; exit 10 }
      if ($taken -ne 0) { "the gate lock is not ours (gate-lock.ps1 exit $taken) - no gate"; exit 13 }
      $code = 4
      try {
        & $shell -NoProfile -ExecutionPolicy Bypass -File "$ci\windows-gate.ps1" -Commit $sha -BenchDir $bench -ResultsDirectory "$env:CI_PROJECT_DIR\gate-results"
        $code = $LASTEXITCODE
      } finally {
        & $shell -NoProfile -ExecutionPolicy Bypass -File "$ci\gate-lock.ps1" -Release -Holder $holder -Path $env:HM_GATE_LOCK
      }
      exit $code
  after_script:
    - |
      $holder = "gitlab-pipeline-$($env:CI_PIPELINE_ID)-job-$($env:CI_JOB_ID)"
      $lock = "$env:CI_PROJECT_DIR\gate\build\ci\gate-lock.ps1"
      if (Test-Path $lock) {
        & (Get-Process -Id $PID).Path -NoProfile -ExecutionPolicy Bypass -File $lock -Release -Holder $holder -Path $env:HM_GATE_LOCK
        # A job cancelled mid-build leaves the service stopped. Started again only when
        # the lock was still this job's (exit 0): after a normal end the script has
        # released it already (5, none), and another holder's (4) may have stopped the
        # service on purpose.
        if ($LASTEXITCODE -eq 0 -and (Get-Service hMailServer -ErrorAction SilentlyContinue).Status -ne 'Running') {
          Start-Service hMailServer -ErrorAction SilentlyContinue
          "the hMailServer service was stopped; now $((Get-Service hMailServer).Status)"
        }
      }
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - gate-results/
    reports:
      junit: gate-results/junit.xml

# The other half of the Windows suite, on S1-WINBENCH, the Windows Server VM on server1
# (runner 57373183, tags windows and bench-s1vm; docs/ContinuousIntegration.md,
# "S1-WINBENCH"): windows-gate in every other respect, in that bench's own checkout,
# C:\bench\hmailserver, under that bench's own lock, C:\bench\gate.lock there, so that
# the two halves run at the same time. extends: replaces tags: and merges variables:;
# hooks: and interruptible: are said again because build/check-release-chain.py reads
# them from the job's own text. With S1-WINBENCH offline or paused the job waits for
# it, and GitLab fails it once it has waited an hour with no runner online to take it
# (stuck_pending_no_matching_runners, which no exit code allows): the pipeline fails,
# and windows-installer and release, which need it, never start. A busy bench is exit
# 10 here as in windows-gate.
windows-gate-s1vm:
  extends: windows-gate
  tags: [bench-s1vm]
  hooks: !reference [.bench150-leftovers, hooks]
  interruptible: false
  variables:
    HM_GATE_WHERE: 'class=~/^RegressionTests\.(Security|Infrastructure|SMTP|AntiVirus|SSL|ExternalAccounts)\./'

# ---------------------------------------------------------------- ported from GitHub Actions
#
# What the old GitHub workflows ran beside the builds and the suites, each job in a
# block of its own. The workflows left the tree on 26 September 2026 (they are in
# the history, at v6.3.3 for instance); docs/ContinuousIntegration.md, "From GitHub
# Actions to GitLab CI", has the table of old job to new. Nothing here downloads
# from GitHub: each job says where its tools come from.

# style.yml's editorconfig job. editorconfig-checker publishes its binaries on GitHub
# releases alone, and its npm and PyPI packages fetch them from there when installed,
# so it comes from Alpine's community repository, which builds it from source: 3.0.3
# (the old job pinned 3.11.3). That release looks for no configuration file of this
# name by itself, hence -config.
editorconfig:
  stage: check
  image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  timeout: 10 minutes
  rules:
    - !reference [.not-a-fuzz-pipeline, rules]
  before_script:
    - apk add --no-cache -q editorconfig-checker
  script:
    - ec -version
    - ec -config .editorconfig-checker.json -no-color
    # The negative control: a tab in a C++ file fails it, or it has stopped looking.
    - |
      printf 'int f()\n{\n\treturn 0;\n}\n' > editorconfig-negative-control.cpp
      if ec -config .editorconfig-checker.json -no-color editorconfig-negative-control.cpp > /dev/null; then
        echo "editorconfig-checker passed a C++ file indented with a tab: it is not checking."
        exit 1
      fi
      rm -f editorconfig-negative-control.cpp
      echo "Every file holds to .editorconfig, and a file that does not is refused."

# packaging.yml's chart-and-compose job: the Helm chart linted and rendered with the
# values a real install needs, and the Compose file resolved by Compose itself. Both
# tools are Alpine's packages (community/helm, community/docker-cli-compose); neither
# needs a Docker daemon for this. As before, it runs when what it checks has changed.
chart-and-compose:
  stage: check
  image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  timeout: 10 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - changes:
        - hmailserver/source/Server/platform/packaging/helm/**/*
        - hmailserver/source/Server/platform/packaging/docker/docker-compose.yml
        - build/ci/helm-repo.py
        - build/ci/helm-chart-package.sh
        - .gitlab/ci/helm-chart.yml
        - .gitlab-ci.yml
  before_script:
    - apk add --no-cache -q helm docker-cli-compose python3 py3-yaml
  script:
    - helm version --short
    - docker compose version
    - helm lint hmailserver/source/Server/platform/packaging/helm/hmailserver
    - |
      chart=hmailserver/source/Server/platform/packaging/helm/hmailserver
      helm template mail "$chart" --set database.host=db --set database.password=dbpw \
        --set administrator.password=adminpw --set rest.tlsSecretName=mail-tls > rendered.yaml
      for kind in StatefulSet Service Secret; do
        grep -q "kind: $kind" rendered.yaml || { echo "the chart rendered no $kind"; exit 1; }
      done
      grep -q HM_REST_CERTIFICATE_FILE rendered.yaml || { echo "the chart does not hand the server its REST certificate"; exit 1; }
      # With no database.port the chart passes no HM_DB_PORT, and the entrypoint takes
      # the type's own port, 3306 for MySQL: a chart that passed 5432 whatever the type
      # had a server told MySQL dial MariaDB on PostgreSQL's port. One given is passed on.
      helm template mail "$chart" --set database.type=MySQL --set database.host=db \
        --set database.password=x --set administrator.password=y > mysql.yaml
      if grep -q HM_DB_PORT mysql.yaml; then
        echo "the chart passed a database port that its values did not name"; exit 1
      fi
      helm template mail "$chart" --set database.type=MySQL --set database.host=db \
        --set database.port=3307 --set database.password=x --set administrator.password=y > mysql-port.yaml
      # || true: no HM_DB_PORT at all leaves mysql-port.txt empty, and the next line
      # says so, where grep's exit 1 would have ended the job without a word.
      grep -A1 'name: HM_DB_PORT' mysql-port.yaml > mysql-port.txt || true
      grep -q 'value: "3307"' mysql-port.txt || { echo "the chart did not pass database.port on"; exit 1; }
      # Without a database host the chart must refuse, not render a broken server.
      if helm template mail "$chart" --set database.password=x --set administrator.password=y > /dev/null 2>&1; then
        echo "the chart rendered without database.host"; exit 1
      fi
      # An existing Secret leaves the chart's own out. Rendered to a file and searched
      # there: helm piped into grep -q dies of SIGPIPE, still writing, once grep has its
      # match, and pipefail then makes the if false - the check passed exactly when the
      # chart wrote the Secret. A render that fails now fails the job.
      helm template mail "$chart" --set database.host=db --set existingSecret=mine > existing-secret.yaml
      if grep -q 'kind: Secret' existing-secret.yaml; then
        echo "the chart wrote a Secret beside existingSecret"; exit 1
      fi
      # The StatefulSet read as YAML, not grepped, so that a line in the wrong place
      # cannot pass for the right one:
      # - The pod runs as the image's own user and group by number, 999 (the
      #   Dockerfile pins them): the image names its user, and a named user cannot be
      #   held to runAsNonRoot, so the charts of 6.3.6 and 6.3.7 stopped at
      #   CreateContainerConfigError on every cluster. It does so too with values
      #   that name no user or group, which are what helm upgrade --reuse-values
      #   takes from those charts (reused.yaml), and a number the values give is kept.
      # - Kubernetes copies nothing of the image's into a new volume: a first
      #   container puts the image's hMailServer.ini on the empty config volume,
      #   which would hide it, and makes the three folders of the data volume, the
      #   server's temp among them. It mounts those two volumes where its command
      #   writes, and the server mounts them where it reads.
      # - The server's container gives the image's entrypoint its arguments and no
      #   command of its own, which would take the entrypoint's place: nothing would
      #   write [Database], create the database or set the administrator password.
      #   Its arguments secure the new installation before the server's first start,
      #   as the packaged service's first start does: STARTTLS on 25 and a certificate.
      helm template mail "$chart" --set database.host=db --set database.password=x \
        --set administrator.password=y --set podSecurityContext.runAsUser=null \
        --set podSecurityContext.runAsGroup=null --set podSecurityContext.fsGroup=1000 > reused.yaml
      python3 - rendered.yaml reused.yaml <<'EOF' || exit 1
      import sys

      import yaml

      COPY = "[ -e /config/hMailServer.ini ] || cp /etc/hmailserver/hMailServer.ini /config/hMailServer.ini"
      FOLDERS = "mkdir -p -m 0750 /data/temp /data/events /data/database"
      SERVER = ("hmailserver --config /etc/hmailserver/hMailServer.ini --apply-new-install-defaults --if-marked; "
                "exec hmailserver --config /etc/hmailserver/hMailServer.ini --foreground")


      def fail(message):
          print(message)
          sys.exit(1)


      def pod(path):
          with open(path, encoding="utf-8") as handle:
              sets = [d for d in yaml.safe_load_all(handle) if d and d.get("kind") == "StatefulSet"]
          if len(sets) != 1:
              fail("%s holds %d StatefulSets, not one" % (path, len(sets)))
          return sets[0]["spec"]["template"]["spec"]


      spec = pod(sys.argv[1])
      context = spec.get("securityContext") or {}
      for key in ("runAsUser", "runAsGroup", "fsGroup"):
          if context.get(key) != 999:
              fail("the pod's securityContext has no %s: 999, the image's own user and group" % key)
      reused = pod(sys.argv[2]).get("securityContext") or {}
      if reused.get("runAsUser") != 999 or reused.get("runAsGroup") != 999:
          fail("with values that name no user or group, as helm upgrade --reuse-values takes from the charts"
               " of 6.3.6 and 6.3.7, the pod does not run as 999:999")
      if reused.get("fsGroup") != 1000:
          fail("the pod does not keep the fsGroup the values give")
      inits = spec.get("initContainers") or []
      containers = spec.get("containers") or []
      for container in inits + containers:
          if (container.get("securityContext") or {}).get("runAsNonRoot") is not True:
              fail("the container named %s is not held to runAsNonRoot" % container.get("name"))
      if not inits:
          fail("the chart has no init container to fill the new volumes")
      if len(inits) != 1:
          fail("the chart has %d init containers, where one fills the new volumes" % len(inits))
      command = inits[0].get("command") or []
      steps = command[2].split("; ") if len(command) == 3 and command[:2] == ["sh", "-c"] else []
      if COPY not in steps:
          fail("the init container does not put the image's hMailServer.ini on an empty config volume")
      if FOLDERS not in steps:
          fail("the init container does not make the data volume's temp, events and database folders")
      if steps != ["set -e", COPY, FOLDERS] or "args" in inits[0]:
          fail("the init container's command is not set -e, the copy and the folders, in that order, and nothing else")
      mounts = sorted((m.get("name"), m.get("mountPath")) for m in inits[0].get("volumeMounts") or [])
      if mounts != [("config", "/config"), ("data", "/data")]:
          fail("the init container does not mount the config volume at /config and the data volume at /data alone")
      servers = [c for c in containers if c.get("name") == "hmailserver"]
      if len(servers) != 1:
          fail("the pod has %d containers named hmailserver, not one" % len(servers))
      server = servers[0]
      if "command" in server:
          fail("the server's container has a command, which takes the image's entrypoint's place")
      if server.get("args") != ["bash", "-c", SERVER]:
          fail("the chart does not secure the new installation before the server starts")
      mounts = {(m.get("name"), m.get("mountPath")) for m in server.get("volumeMounts") or []}
      if not {("config", "/etc/hmailserver"), ("data", "/var/lib/hmailserver")} <= mounts:
          fail("the server does not mount the config volume at /etc/hmailserver and the data volume at"
               " /var/lib/hmailserver, which the init container filled")
      EOF
      echo "The chart lints, renders what a real install needs, and refuses what it must."
    # In a subshell: a job's script lines share one shell, and the next line runs
    # from the checkout's root (batch42's pipeline 2894275689 looked for
    # build/ci/helm-repo.py under packaging/docker).
    - |
      (
        cd hmailserver/source/Server/platform/packaging/docker
        mkdir -p secrets certs
        printf '%s' x > secrets/db_password
        printf '%s' y > secrets/admin_password
        docker compose config --quiet
        # As resolved: the new installation secured before the server's first start,
        # and the REST listener given the certificate that start makes, so that
        # docker compose up answers with STARTTLS on 25 and over TLS on 8045 with no
        # certificate made by hand (a key made on the host was 0600 and its owner's,
        # which the image's user, 999, could not read).
        # Read as JSON: Compose writes a long command across two lines of YAML.
        docker compose config --format json > resolved.json
        python3 -c 'import json, sys; s = json.load(open("resolved.json"))["services"]["hmailserver"]; sys.exit(s.get("command") != ["bash", "-c", sys.argv[1]])' \
          'hmailserver --config /etc/hmailserver/hMailServer.ini --apply-new-install-defaults --if-marked; exec hmailserver --config /etc/hmailserver/hMailServer.ini --foreground' \
          || { echo "the Compose file does not secure the new installation before the server starts"; exit 1; }
        python3 -c 'import json, sys; sys.exit(json.load(open("resolved.json"))["services"]["hmailserver"].get("entrypoint") is not None)' \
          || { echo "the Compose file gives the server an entrypoint, which takes the image's entrypoint's place"; exit 1; }
        python3 -c 'import json, sys; e = json.load(open("resolved.json"))["services"]["hmailserver"]["environment"]; sys.exit(e.get("HM_REST_CERTIFICATE_FILE") != sys.argv[1] + "certificate.pem" or e.get("HM_REST_PRIVATE_KEY_FILE") != sys.argv[1] + "key.pem")' \
          /var/lib/hmailserver/Certificates/self-signed- \
          || { echo "the Compose file's REST listener is not given the certificate the first start makes"; exit 1; }
        rm -f resolved.json
      )
      echo "The Compose file resolves, secures the new installation and gives the REST listener its certificate."
    # The Helm repository's writer, which package-repos runs on master: a break is seen here first.
    - python3 build/ci/helm-repo.py --self-test

# packaging.yml's update-helper job: the live update's Linux apply step,
# hmailserver-update, run under dash against fakes for every outcome it can write
# (build/test-hmailserver-update.sh), and the three units read by systemd-analyze.
# systemd is Ubuntu's package; dash is the image's /bin/sh. And the container's
# entrypoint writing [Database] from HM_DB_* against a stub server
# (build/test-docker-entrypoint.sh): a value hMailServer.ini would not give back
# refused, any other written byte for byte.
update-helper:
  stage: check
  image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
  timeout: 10 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - changes:
        - hmailserver/source/Server/platform/packaging/hmailserver-update
        - hmailserver/source/Server/platform/packaging/hmailserver-update.path
        - hmailserver/source/Server/platform/packaging/hmailserver-update.service
        - hmailserver/source/Server/platform/packaging/hmailserver.service
        - build/test-hmailserver-update.sh
        - hmailserver/source/Server/platform/packaging/docker/docker-entrypoint.sh
        - build/test-docker-entrypoint.sh
        - hmailserver/source/Server/platform/packaging/autoban-hook
        - build/test-autoban-hook.sh
        - .gitlab-ci.yml
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends systemd > /dev/null
  script:
    - ls -l /bin/sh
    - bash build/test-hmailserver-update.sh
    - bash build/test-docker-entrypoint.sh
    - bash build/test-autoban-hook.sh
    # The only thing systemd-analyze objects to in a checkout is the two executables
    # the package would have installed; they are tolerated by name and nothing else is.
    # A runner's checkout is made under umask 0000 - the docker executor's default on
    # linix, server2 and s1-linux, as on GitLab's hosted runners - so every file is
    # world-writable, which systemd-analyze reports; the package installs the units
    # 0644 (CMake's install(FILES) default), so the checkout's copies are given that
    # mode first.
    - |
      cd hmailserver/source/Server/platform/packaging
      chmod 0644 hmailserver.service hmailserver-update.path hmailserver-update.service
      for unit in hmailserver.service hmailserver-update.path hmailserver-update.service; do
        out="$(systemd-analyze verify --recursive-errors=no "./$unit" 2>&1 || true)"
        problems="$(printf '%s\n' "$out" | grep -v -E 'Command /usr/(bin/hmailserver|lib/hmailserver/hmailserver-update) is not executable' | grep -v '^$' || true)"
        if [ -n "$problems" ]; then
          echo "$unit did not verify:"
          printf '%s\n' "$problems"
          exit 1
        fi
        echo "$unit: ok"
      done

# package-managers.yml's templates job: the winget manifests and the Chocolatey
# package render from their templates, every token is one the renderer knows, and the
# three winget manifests agree - checked offline, as the old job checked a change: the
# winget schemas' aka.ms aliases lead to GitHub, which build/check-package-manifests.py
# refuses to download from, and a release is what has a real hash. Rendering, checking and submitting for a release (the manifests job) is
# the release-chain row's. pwsh is the one in Microsoft's .NET SDK image; PyYAML and
# jsonschema are Ubuntu's packages.
package-templates:
  stage: check
  image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:0d99ebf1ccad15037b5c98c9fe8979d6b8dbac23812feae2277a0b277b5c5ffa
  timeout: 10 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - changes:
        - hmailserver/installation/winget/**/*
        - hmailserver/installation/chocolatey/**/*
        - build/make-package-manifests.ps1
        - build/check-package-manifests.py
        - .gitlab-ci.yml
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 python3-yaml python3-jsonschema > /dev/null
  script:
    - pwsh -NoProfile -File build/make-package-manifests.ps1 -Check
    - pwsh -NoProfile -File build/make-package-manifests.ps1 -Version 9.9.9 -ReleaseDate 2026-01-01 -Sha256 AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA -OutputDirectory /tmp/manifests
    - python3 build/check-package-manifests.py /tmp/manifests --offline --release-date 2026-01-01

# roadmap.yml: Roadmap.md's counts are what its tick boxes say (build/check-roadmap.ps1),
# when either changes. pwsh is the one in Microsoft's .NET SDK image.
roadmap:
  stage: check
  image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:0d99ebf1ccad15037b5c98c9fe8979d6b8dbac23812feae2277a0b277b5c5ffa
  timeout: 5 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - changes:
        - Roadmap.md
        - build/check-roadmap.ps1
        - .gitlab-ci.yml
  script:
    - pwsh -NoProfile -File build/check-roadmap.ps1

# linux-build.yml's cross job: every core translation unit compiled for AArch64 on
# x86-64 (build/ci/linux-cross.sh). The cross GCC is the CI image's, from Ubuntu.
linux-cross:
  extends: .linix
  stage: test
  needs: []
  timeout: 1 hour
  script:
    - bash build/ci/linux-cross.sh
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - linux-cross/

# The test programs built with AddressSanitizer (build/ci/linux-sanitize.sh):
# cmake -DHM_SANITIZE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo, the snmp-tests and
# workqueue-teardown-tests targets, run with ASAN_OPTIONS=abort_on_error=1. It passes,
# saying so, on a tree whose CMake build has no HM_SANITIZE yet; the SNMP row adds it.
linux-sanitize:
  extends: .linix
  stage: test
  needs: []
  timeout: 1 hour 30 minutes
  script:
    - bash build/ci/linux-sanitize.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - linux-sanitize/

# linux-build.yml's db-upgrade job, once per backend: a 6029 database holding orphaned
# rows upgrades to this build's schema with the server linux-build made
# (build/ci/linux-db-upgrade.sh, build/db-upgrade-gate.sh). The same PostgreSQL as the
# suite, and the MariaDB the old job pinned, both by digest from Docker Hub.
.linux-db-upgrade:
  extends: .linix
  stage: test
  needs: [linux-build]
  timeout: 20 minutes

linux-db-upgrade-pgsql:
  extends: .linux-db-upgrade
  services:
    - name: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
      alias: postgres
      pull_policy: [if-not-present, always]
      variables:
        POSTGRES_USER: hmailserver
        POSTGRES_PASSWORD: hmtest
        POSTGRES_DB: postgres
  script:
    - bash build/ci/linux-db-upgrade.sh pgsql

linux-db-upgrade-mysql:
  extends: .linux-db-upgrade
  services:
    # root with no password: the service is reachable from this job's container
    # alone, and no password is written here (repo-hygiene, Token-Permissions).
    # build/ci/linux-db-upgrade.sh logs in as root with none.
    - name: mariadb:13@sha256:2fd6d83be13d6f95119fe7823c4a445a771d973ce15a4f4621e3c14898f9f1ab
      alias: mariadb
      pull_policy: [if-not-present, always]
      variables:
        MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
  script:
    - bash build/ci/linux-db-upgrade.sh mysql

# linux-build.yml's package-install job: the .deb and the .rpm the packaging step of
# linux-build made, each installed in a clean distribution container - the job's own
# image - and held to what a working installation needs; the .deb is then configured,
# started as its unit starts it and asked for the Control Deck
# (build/ci/linux-package-install.sh, which says what a container cannot prove). The
# images are the distributions' own: Ubuntu's from Docker Hub, Fedora's from
# registry.fedoraproject.org.
linux-package-deb:
  extends: .own-runners
  stage: test
  tags: [$HM_RUNNER_BUILD]
  image:
    name: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    pull_policy: [if-not-present, always]
  needs: [linux-build]
  timeout: 20 minutes
  services:
    - name: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
      alias: postgres
      pull_policy: [if-not-present, always]
      variables:
        POSTGRES_USER: hmailserver
        POSTGRES_PASSWORD: hmtest
        POSTGRES_DB: hmpackage
  script:
    - bash build/ci/linux-package-install.sh deb

linux-package-rpm:
  extends: .own-runners
  stage: test
  tags: [$HM_RUNNER_BUILD]
  image:
    name: registry.fedoraproject.org/fedora:44@sha256:2cdfedd312a3c92e0d9932ee18d9d2dd80b00fa0bb4ebdaa86736195b5eaa974
    pull_policy: [if-not-present, always]
  needs: [linux-build]
  timeout: 10 minutes
  script:
    - bash build/ci/linux-package-install.sh rpm

# linux-build.yml's image job, the build half: the container image for linux/amd64
# built from the .deb with kaniko - no Docker daemon, no socket, no privilege - and
# inspected, not pushed (build/ci/linux-image.sh). linux-image-arm64
# (.gitlab/ci/container-image.yml) builds the linux/arm64 one; a v* tag's image jobs
# there push both under one index. kaniko is Google's image on gcr.io, pinned by
# digest; its debug variant carries the busybox shell a job needs.
linux-image:
  extends: .own-runners
  stage: test
  tags: [$HM_RUNNER_BUILD]
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    entrypoint: [""]
    pull_policy: [if-not-present, always]
  needs: [linux-build]
  timeout: 30 minutes
  script:
    - sh build/ci/linux-image.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - linux-image/

# sbom.yml, less the upload: the SPDX and CycloneDX SBOMs of this tree, with the native
# dependencies Syft cannot see merged in and checked for (build/ci/linux-sbom.sh), kept
# as the job's artifact. Syft and pwsh are the CI image's. Attaching them to a release
# is the release-chain row's.
linux-sbom:
  extends: .linix
  stage: test
  needs: []
  timeout: 15 minutes
  script:
    - bash build/ci/linux-sbom.sh
  artifacts:
    expire_in: 90 days
    paths:
      - sbom/

# Is the Linux build reproducible? linux-build's server, .deb and .rpm - the x86-64 files
# a v* tag's release ships (its AArch64 .deb and .rpm, the package jobs', are built once
# and not compared) - made a second time from the same commit, in the same image, by the same
# script, from a copy of the tree at another path, in another build directory, started
# under another umask and in another time zone, and compared (build/ci/linux-repro.sh).
# The binary, the .deb and the .rpm must be byte for byte identical, or the job fails and
# its report says where they differ. A release waits for it. docs/ReproducibleBuilds.md.
linux-repro:
  extends: .linix
  stage: test
  needs:
    - job: linux-build
      artifacts: true
  timeout: 1 hour
  script:
    - bash build/ci/linux-repro.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - linux-repro/

# ci.yml's control-panel and tools jobs and style.yml's dotnet-format job: the .NET
# half built with warnings as errors, published, tested and held to dotnet format
# (build/ci/windows-dotnet.ps1), in the runner's own checkout of the commit - not the
# bench's, whose service this never touches. It takes the bench's gate lock
# around its work all the same: a build beside a running suite perturbs the suite, and
# the maintainer's split gate runs one over SSH outside GitLab. The .NET SDK, Visual
# Studio's Build Tools (MIDL) and the .NET Framework SDK (TlbImp) are the bench's own,
# from Microsoft; the packages come from nuget.org, held to the lock files. A bench
# still busy after HM_GATE_LOCK_WAIT_MINUTES is exit 10, a warning, as in windows-gate
# (read that job for why, and why not for a v* tag).
windows-dotnet:
  extends: .own-runners
  stage: test
  tags: [bench150]
  hooks: !reference [.bench150-leftovers, hooks]
  needs: []
  timeout: 4 hours
  allow_failure:
    exit_codes: [10]
  variables:
    HM_GATE_LOCK: 'C:\bench\gate.lock'
    HM_GATE_LOCK_WAIT_MINUTES: "200"
    GIT_TERMINAL_PROMPT: "0"
    GCM_INTERACTIVE: "Never"
    MSBUILDDISABLENODEREUSE: "1"
    RUNNER_SCRIPT_TIMEOUT: 3h50m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 5m
  script:
    - |
      $holder = "gitlab-pipeline-$($env:CI_PIPELINE_ID)-job-$($env:CI_JOB_ID)"
      $shell = (Get-Process -Id $PID).Path
      & $shell -NoProfile -ExecutionPolicy Bypass -File build\ci\gate-lock.ps1 -Take -Holder $holder -Path $env:HM_GATE_LOCK -WaitMinutes $env:HM_GATE_LOCK_WAIT_MINUTES
      $taken = $LASTEXITCODE
      if ($taken -eq 1 -and -not $env:CI_COMMIT_TAG) { "the bench is busy - nothing built this time; retry the job"; exit 10 }
      if ($taken -ne 0) { "the gate lock is not ours (gate-lock.ps1 exit $taken) - nothing built"; exit 13 }
      $code = 4
      try {
        & $shell -NoProfile -ExecutionPolicy Bypass -File build\ci\windows-dotnet.ps1 -ResultsDirectory "$env:CI_PROJECT_DIR\dotnet-results"
        $code = $LASTEXITCODE
      } finally {
        & $shell -NoProfile -ExecutionPolicy Bypass -File build\ci\gate-lock.ps1 -Release -Holder $holder -Path $env:HM_GATE_LOCK
      }
      exit $code
  after_script:
    - |
      $holder = "gitlab-pipeline-$($env:CI_PIPELINE_ID)-job-$($env:CI_JOB_ID)"
      if (Test-Path build\ci\gate-lock.ps1) {
        & (Get-Process -Id $PID).Path -NoProfile -ExecutionPolicy Bypass -File build\ci\gate-lock.ps1 -Release -Holder $holder -Path $env:HM_GATE_LOCK
      }
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dotnet-results/

# fuzz-nightly.yml, on linix: the three MIME harnesses built with clang++ and libFuzzer,
# every kept input and reproducer replayed, then each fuzzed for HM_FUZZ_MINUTES on the
# corpus the earlier nights grew, which the runner's cache carries from night to night
# (build/ci/linux-fuzz.sh). It runs in the pipeline of the schedule whose description
# is "fuzz" - docs/ContinuousIntegration.md tells the owner how to create it - and
# nowhere else, and a newer push does not cancel it. The time box is here, not in the
# schedule, which carries no variable: a longer or shorter night is a commit.
#
# Its artifact is fuzz-results/, each harness's log and, on a finding, the input that
# found it, kept whether the job passed or not. Developers and above only: an input
# that crashes the MIME parser may be a working exploit against every server that has
# not been fixed yet, and the project's jobs are public.
linux-fuzz:
  extends: .linix
  tags: [linix]
  stage: test
  needs: []
  timeout: 2 hours
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "fuzz" && $CI_COMMIT_REF_PROTECTED == "true"
  variables:
    HM_FUZZ_MINUTES: "20"
    HM_FUZZ_JOBS: "2"
  cache:
    key: linux-fuzz-corpus
    paths:
      - fuzz/corpus/
    when: always
  script:
    - bash build/ci/linux-fuzz.sh
  artifacts:
    when: always
    expire_in: 30 days
    access: developer
    paths:
      - fuzz-results/

# The native server's coverage (build/ci/linux-coverage.sh): the server and its tester
# programs built with clang's source-based coverage, the testers run, then the whole of
# LinuxRegressionTests against that server on the same PostgreSQL linux-suite uses, and
# llvm-cov's line, region and branch figures. It runs in the pipeline of the schedule
# whose description is "coverage" - weekly, schedule 4509741
# (docs/ContinuousIntegration.md, "The coverage schedule") - and nowhere else. The
# figure is a floor for the server as a whole: the Linux suite links fewer fixtures
# than the Windows one runs, and the Linux build has no COM layer (the Windows line
# figure is build/coverage-windows.ps1's). A failed test does not fail this job -
# linux-suite is the pass or fail truth, on the uninstrumented build - but a suite
# that did not run to its end (no TRX), no counters, no report, or a converter that
# fails its self-test or refuses the Cobertura report, once the figure is in the log,
# does. GitLab reads the line figure from the log (coverage:, below, summary.txt's
# "lines:" line) for the job's and the pipeline's coverage and the project's coverage
# history (Analyze, Repository analytics); the Cobertura report
# (build/ci/coverage-cobertura.py, from the export that figure is read from) marks a
# merge request's diff only when the job is in that merge request's head pipeline,
# which these rules never make it. The converter's self-test runs in the script's
# report step, after the figure, so that a converter that fails it in this image
# costs the report and not the figure, and in coverage-cobertura (below) whenever the
# converter changes, so that a change that breaks it is refused before it lands.
linux-coverage:
  extends: .linix
  tags: [linix]
  stage: test
  needs: []
  timeout: 4 hours
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "coverage" && $CI_COMMIT_REF_PROTECTED == "true"
  services:
    - name: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
      alias: postgres
      pull_policy: [if-not-present, always]
      variables:
        POSTGRES_USER: hmailserver
        POSTGRES_PASSWORD: hmtest
        POSTGRES_DB: hmtest
  variables:
    HM_PG_HOST: postgres
    HM_COV_DIR: $CI_PROJECT_DIR/linux-coverage
    RUNNER_SCRIPT_TIMEOUT: 3h50m
  script:
    - bash build/ci/linux-coverage.sh
  coverage: '/lines: +[\d,]+ of [\d,]+ \((\d+\.\d+)%\)/'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - linux-coverage/summary.txt
      - linux-coverage/report.txt
      - linux-coverage/report-with-vendored.txt
      - linux-coverage/coverage.json
      - linux-coverage/lcov.info
      - linux-coverage/cobertura*.xml
      - linux-coverage/*.log
      - linux-coverage/suite/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: linux-coverage/cobertura*.xml

# The Cobertura converter linux-coverage runs (build/ci/coverage-cobertura.py): its
# self-test, against samples it writes for itself with Python's own library alone,
# when it or this file changes, as the path-bound checks above run. linux-coverage
# runs only in the coverage schedule's pipeline, so that without this a change that
# broke the converter would be seen first on the Sunday its report is lost. A job of
# its own rather than a line of checkers, which took 13 and 16 of the 20 minutes it then
# had in pipelines 2983075001 and 2984129087 on 23 and 24 October 2026.
coverage-cobertura:
  stage: check
  image: python:3.14-slim-trixie@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
  timeout: 5 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - changes:
        - build/ci/coverage-cobertura.py
        - .gitlab-ci.yml
  script:
    - python3 build/ci/coverage-cobertura.py --self-test

# ---------------------------------------------------------------- security scanning
#
# What replaced the three GitHub workflows that stopped with the account on 18
# September 2026: CodeQL (the GitHub workflow codeql.yml) by static-analysis and
# semgrep, dependency review and Dependabot's alerts (dependency-review.yml) by
# dependency-scan, OpenSSF Scorecard (scorecard.yml) by repo-hygiene. They run on
# linix, for a protected ref only (.own-runners), and download nothing from GitHub:
# each job's script says where each of its tools comes from, and every image is
# pinned by digest (or is the CI image, by its Dockerfile's hash).
#
# dependency-scan, dependency-scan-verdict, ci-image-packages and repo-hygiene are
# allow_failure while their findings are triaged; static-analysis and semgrep are not
# (since 6.3.6, once both had passed over batch42: docs/ContinuousIntegration.md,
# "Security scanning"). Each publishes GitLab's own report format (SAST, dependency
# scanning) and a JUnit report: GitLab stores the first, and takes it into the
# vulnerability report from a job that succeeded alone, and shows the second in the
# pipeline's Tests tab. The two source scans hold their findings to a committed
# baseline, so they fail on a NEW finding only, and on a scan with a hole.
# dependency-scan passes whatever its scans find, and fails only when one could not
# run, so that GitLab takes its findings; dependency-scan-verdict, after it, fails on a
# finding as dependency-scan itself used to.
#
# For a v* tag the release job needs static-analysis, semgrep and dependency-scan
# (and GitLab's semgrep-sast) with their artifacts, and refuses while one of them did
# not finish or found something SECURITY.md's policy counts that no baseline and no
# exception in .gitlab/security-exceptions.yml accepts (build/ci/security-gate.py).
# allow_failure on dependency-scan-verdict keeps a dependency finding from stopping a
# push's pipeline; it does not let one into a release.
#
# In the test stage with needs: [] - beside the builds, not after the checks: linix
# takes up to three jobs at once, and the Windows gate on bench150 is longer than
# everything linix runs, these jobs included.
#
# When they run: .own-runners' refusals, and its paths, but on a protected batch*
# branch compared with master (compare_to: refs/heads/master) rather than with the
# push before: GitLab then reads the files changed from where the branch leaves master
# to its tip (the merge base, Ci::Pipeline#modified_paths_since), so a push of
# documentation alone on top of code a batch already carries still runs the scans, and
# judges the whole batch, not its last push; a batch that changes documentation alone
# from master runs none. compare_to also diffs a branch's first push, a pipeline
# started by hand or through the API, where rules:changes alone counts every file as
# changed. master and a v* tag keep .own-runners' own comparison (a tag counts every
# file). The suites keep their trimming by push.
.scans-on-the-whole-change:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH =~ /^batch/
      changes:
        paths: *not-docs-only
        compare_to: refs/heads/master
    # A batch that changes documentation alone from master: no scan, whatever its last
    # push compared with the one before.
    - if: $CI_COMMIT_BRANCH =~ /^batch/
      when: never
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_REF_PROTECTED == "true"
      changes:
        paths: *not-docs-only

static-analysis:
  extends: .linix
  rules:
    - !reference [.scans-on-the-whole-change, rules]
  stage: test
  needs: []
  # Two hours: it fails the pipeline now, and runs beside the builds. It took 44
  # minutes in batch42's pipeline 2897966924, and 72 on linix on 2 October 2026 beside
  # other work, clang-tidy 67 of them (docs/ContinuousIntegration.md, "How long each
  # job takes").
  timeout: 120 minutes
  script:
    - bash build/ci/static-analysis.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - security/static-analysis/
    reports:
      # One file: GitLab takes one per report type ("only one file can be sent as
      # raw", the first pipeline). Each tool's own is among the paths above.
      sast: security/static-analysis/gl-sast-report.json
      junit: security/static-analysis/junit.xml

semgrep:
  extends: .own-runners
  rules:
    - !reference [.scans-on-the-whole-change, rules]
  tags: [$HM_RUNNER_BUILD]
  image:
    name: python:3.14-slim-trixie@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
    pull_policy: [if-not-present, always]
  stage: test
  needs: []
  timeout: 30 minutes
  script:
    - bash build/ci/semgrep.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - security/semgrep/
    reports:
      sast: security/semgrep/gl-sast-semgrep.json
      junit: security/semgrep/junit.xml

# The CI image's package database, for dependency-scan: Trivy runs in its own image
# and cannot open this one (a job has no Docker socket, on purpose), so the files it
# reads to know what is installed - Ubuntu's release files and dpkg status, and the
# .NET SDK's deps.json - are copied out of the image as an artifact, 1.4 MB. GitLab
# unpacks that artifact into the scan's checkout over the tree, and would pass the scan a
# dotenv report of this job's as variables: build/check-release-chain.py holds this job
# to its keys and to these files alone, with no report (verdict_problems).
ci-image-packages:
  extends: .linix
  rules:
    - !reference [.scans-on-the-whole-change, rules]
  stage: test
  needs: []
  timeout: 10 minutes
  allow_failure: true
  script:
    - rm -rf ci-image-packages
    - mkdir -p ci-image-packages/etc ci-image-packages/var/lib/dpkg
    # Trivy knows Ubuntu by lsb-release; with os-release alone it reports no OS.
    - cp -L /etc/os-release /etc/lsb-release ci-image-packages/etc/
    - cp /var/lib/dpkg/status ci-image-packages/var/lib/dpkg/status
    - find /usr/share/dotnet -name '*.deps.json' -exec cp --parents {} ci-image-packages/ \;
    - echo "$(grep -c '^Package:' ci-image-packages/var/lib/dpkg/status) dpkg packages, $(find ci-image-packages/usr -name '*.deps.json' | wc -l) deps.json files"
  artifacts:
    expire_in: 1 day
    paths:
      - ci-image-packages/

dependency-scan:
  extends: .own-runners
  rules:
    - !reference [.scans-on-the-whole-change, rules]
  tags: [$HM_RUNNER_BUILD]
  image:
    name: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    entrypoint: [""]
    pull_policy: [if-not-present, always]
  stage: test
  needs: [ci-image-packages]
  timeout: 30 minutes
  allow_failure: true
  before_script:
    # Python for the script, from Alpine's own repository.
    - apk add --no-cache --quiet python3
  # Ends 0 whenever its scans ran, whatever they found, and 2 when one could not run:
  # GitLab takes a job's security report into the vulnerability report only when the
  # job succeeded, and filed master's scan of 14 October 2026 (pipeline 2947545170),
  # which ended 1 on a High with a fixed version while allowed to fail, as JOB_FAILED
  # with none of its findings, which emptied the report's dependency side. The verdict
  # is security/dependency-scan/verdict.json, for dependency-scan-verdict (below).
  script:
    - python3 build/ci/dependency-scan.py
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - security/dependency-scan/
    reports:
      # One file: GitLab takes one per report type ("only one file can be sent as
      # raw", the first pipeline). Each scanner's own is among the paths above.
      dependency_scanning: security/dependency-scan/gl-dependency-scanning.json
      junit: security/dependency-scan/junit.xml

# dependency-scan's verdict, apart from its report: the finding's warning. It reads the
# verdict.json dependency-scan wrote and fails as that job used to, allowed to fail as
# it is, so that a pipeline with a finding still reads "passed with warnings" and marks
# a job of the dependency scan's failed: exit 1 when a Critical or High vulnerability
# with a fixed version, or another failure of a target, was found; exit 2 when a scan
# could not run, or no verdict of this pipeline's came (build/ci/dependency-scan.py,
# VERDICT). dependency-scan's rules, so that it is made in each pipeline that job is
# made in and in no other: a pipeline whose job needs one it lacks is not created. On
# linix whatever the switches say: it reads a file, and spends no minute.
# build/check-release-chain.py holds it to all of this, and both jobs to the keys they
# have and no other and to what a template, default:, a rule or another CI file - read
# with this one, since it includes none but those of .gitlab/ci/ - may add to them,
# with no blank line inside either (verdict_problems). The release needs
# dependency-scan and not this: build/ci/security-gate.py reads the reports themselves.
# After a retry of dependency-scan by hand, retry this job too: GitLab runs a finished
# job that needs a retried one again only when it was skipped, and this one says so when
# it fails.
dependency-scan-verdict:
  extends: .own-runners
  rules:
    - !reference [.scans-on-the-whole-change, rules]
  tags: [linix]
  image:
    name: python:3.14-slim-trixie@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
    pull_policy: [if-not-present, always]
  stage: test
  needs: [dependency-scan]
  timeout: 5 minutes
  allow_failure: true
  script:
    - python3 build/ci/dependency-scan.py --verdict

repo-hygiene:
  extends: .own-runners
  tags: [$HM_RUNNER_BUILD]
  image:
    name: python:3.14-slim-trixie@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
    pull_policy: [if-not-present, always]
  stage: test
  needs: []
  timeout: 10 minutes
  allow_failure: true
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    # git and ssh-keygen verify the release tags' SSH signatures; from Debian.
    - apt-get update -qq
    - apt-get install -y -qq -o Acquire::Retries=3 --no-install-recommends git openssh-client ca-certificates > /dev/null
  script:
    - python3 build/ci/repo-hygiene.py
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - security/repo-hygiene/
    reports:
      junit: security/repo-hygiene/junit.xml

# Dependency updates by the project's own bot (docs/ContinuousIntegration.md,
# "Dependency updates"): Renovate, from Docker Hub by digest, on linix, in a scheduled
# pipeline and in nothing else. It reads renovate.json from the default branch, opens
# and updates its merge requests on GitLab with RENOVATE_TOKEN, and keeps its dashboard
# issue current. The owner creates the three things it needs once: the token, the
# masked and protected CI variable RENOVATE_TOKEN that holds it, scoped to the
# environment renovate, which this job alone names, and a pipeline schedule for master
# whose description is "renovate", with no variable (the project refuses a schedule's
# variables; .not-a-fuzz-pipeline says why). A protected variable reaches a protected
# ref only, and the rules ask for one; the scope keeps it from every other job of such
# a pipeline, those a switch sends to GitLab's runners among them (variables:).
#
# Nothing it downloads comes from GitHub. The advisories behind renovate.json's
# osvVulnerabilityAlerts are built from OSV's own export on Google Cloud Storage by
# build/ci/osv-offline-db.py, instead of the GitHub release Renovate's OSV package
# fetches by default. The .NET SDK it installs to rewrite the NuGet lock files does not
# come from GitHub either: the dry run of 25 September 2026 installed it with every
# GitHub host unreachable.
renovate:
  stage: check
  tags: [linix]
  image:
    name: renovate/renovate:44.115.13@sha256:0c04185c9e7ea5284da22ea0b2a2c88dcd3687badd8feb6c71691659b380df9b
    pull_policy: [if-not-present, always]
  needs: []
  timeout: 1 hour
  # A push to master while it runs does not stop it halfway through its branches.
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "renovate" && $CI_COMMIT_REF_PROTECTED == "true"
  # The token's scope: a job that names no environment is not given it.
  environment:
    name: renovate
    action: access
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    # renovate.json is on the default branch: no onboarding merge request, and a
    # repository without the file is left alone.
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    RENOVATE_BINARY_SOURCE: install
    OSV_OFFLINE_DISABLE_DOWNLOAD: "true"
    OSV_OFFLINE_ROOT_DIR: /tmp/osv-offline
    LOG_LEVEL: info
    RENOVATE_LOG_FILE: $CI_PROJECT_DIR/renovate-log.ndjson
    RENOVATE_LOG_FILE_LEVEL: debug
  script:
    - python3 build/ci/osv-offline-db.py "$OSV_OFFLINE_ROOT_DIR" NuGet
    - renovate
  artifacts:
    when: always
    expire_in: 7 days
    # The debug log names every dependency and branch; the project's members read it.
    access: developer
    paths:
      - renovate-log.ndjson

# Every image the CI files and the build scripts name by digest, asked of its registry
# without credentials, as a runner asks it (build/check-image-pins.py): GitLab's
# registry stops serving a digest of its analyzers within days of their tags moving on,
# and a job whose image is gone fails at its pull, whatever it was for, and only when it
# runs - container_scanning's of 5 October 2026 answered 404 on 10 October, in a job a
# release tag's pipeline alone runs. Daily, in the pipeline of Renovate's schedule, the
# one about the pins, beside renovate and needing nothing of it: a pin gone fails the
# pipeline, named with every file and line that names it (exit 1), which is never
# retried. A registry that could not be asked, three times, is exit 2, which is tried
# again twice, as are GitLab's own failures the gates are retried on (.gate-retry,
# .gitlab/ci/gitlab-security.yml). It needs the network, so it is not one of the
# checkers, which run its self-test alone. Python's own library alone, in checkers'
# image; .no-github keeps GitHub's hosts out, which no pin may name.
image-pins:
  extends: .no-github
  stage: check
  image: python:3.14-slim-trixie@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
  needs: []
  timeout: 15 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "renovate" && $CI_COMMIT_REF_PROTECTED == "true"
  retry:
    max: 2
    when: !reference [.gate-retry, retry, when]
    exit_codes: [2]
  script:
    - python3 build/check-image-pins.py --self-test
    - python3 build/check-image-pins.py

# ---------------------------------------------------------------- the release
#
# The Roadmap2 row "The release chain off a single forge": a protected v* tag's
# pipeline, once its gates have passed, makes the release (docs/ContinuousIntegration.md,
# "The release"; RELEASE.md has the runbook). In order:
#
#   windows-installer     automatic, after both halves of the Windows suite, windows-gate
#                         and windows-gate-s1vm: the x64 installer, unsigned, in bench150's
#                         checkout under its gate lock (the ARM64 one is
#                         windows-packages-arm64's, .gitlab/ci/packages-windows.yml);
#   release               started by hand, after every gate: nothing is signed or sent
#                         anywhere until a maintainer says so. It checks the tag (an
#                         annotated tag signed by a key in .gitlab/allowed_signers),
#                         Version.h against the tag, the cosign pin and the Azure
#                         settings, and collects the files a release carries, each
#                         package with its own SBOM;
#   release-authenticode  bench150: the two installers and the PowerShell module signed
#                         with Authenticode;
#   release-sbom          linix's tag: each signed installer's own SBOM;
#   release-sign          linix's tag: every file signed with Sigstore;
#   release-verify        linix: every bundle checked with this commit's own server;
#   release-publish       started by hand - after the installer smoke test of the signed
#                         installer, run from the VMware host - uploads and creates the
#                         release;
#   pages, package-repos  then, in this pipeline, the update feed with the release in it,
#                         and the site deployed (pages, above, needs release-publish).
#
# The signing happens in this, the tag's own top-level pipeline, because Fulcio names
# the certificate after the ID token's ci_config_ref_uri, which a child or downstream
# pipeline's token does not carry; and .gitlab-ci.yml keeps its name, which is in the
# identity every server built after 6.3.3 trusts (SigstoreVerifier.cpp). No job here
# holds a secret: Azure takes the job's ID token through a federated credential,
# Sigstore takes another, and the upload is the job's own CI_JOB_TOKEN.
# build/check-release-chain.py holds these jobs to that shape.
.release-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v/ && $CI_COMMIT_REF_PROTECTED == "true"

# The installer is built where the gate built and tested the same commit: the bench's
# own checkout, which holds the libraries a clean clone lacks, under the bench's gate
# lock, fetched and handed its scripts the way windows-gate is (read that job for why).
# Inno Setup 6 must be installed for the machine on bench150; the script stops, saying
# so, where it is not.
windows-installer:
  stage: release
  tags: [bench150]
  hooks: !reference [.bench150-leftovers, hooks]
  # build-inputs-authenticode (.gitlab/ci/packages-windows.yml): the third-party files
  # this build places, held to the signatures the manifest records first.
  needs: [windows-gate, windows-gate-s1vm, build-inputs-authenticode]
  timeout: 2 hours
  interruptible: false
  rules:
    - !reference [.release-rules, rules]
  variables:
    GIT_STRATEGY: none
    HM_BENCH_DIR: 'C:\bench\hmailserver'
    HM_GATE_REPOSITORY: https://gitlab.com/hmailserver/hmailserver.git
    HM_GATE_LOCK: 'C:\bench\gate.lock'
    HM_GATE_LOCK_WAIT_MINUTES: "90"
    GIT_TERMINAL_PROMPT: "0"
    GCM_INTERACTIVE: "Never"
    MSBUILDDISABLENODEREUSE: "1"
    RUNNER_SCRIPT_TIMEOUT: 1h50m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 5m
  script:
    - |
      $sha = $env:CI_COMMIT_SHA
      $bench = $env:HM_BENCH_DIR
      $holder = "gitlab-pipeline-$($env:CI_PIPELINE_ID)-job-$($env:CI_JOB_ID)"
      $shell = (Get-Process -Id $PID).Path
      Remove-Item -Recurse -Force gate, gate.zip, release-windows -ErrorAction SilentlyContinue
      git -C $bench -c credential.helper= -c gc.auto=0 fetch --quiet --no-tags $env:HM_GATE_REPOSITORY "refs/tags/$($env:CI_COMMIT_TAG)"
      git -C $bench cat-file -e "$sha^{commit}"
      if ($LASTEXITCODE -ne 0) { "FETCH FAILED: $sha is not in $bench after a fetch of $($env:CI_COMMIT_TAG)"; exit 11 }
      git -C $bench archive --format=zip -o "$env:CI_PROJECT_DIR\gate.zip" $sha build/ci
      if ($LASTEXITCODE -ne 0) { "$sha has no build/ci"; exit 12 }
      Expand-Archive gate.zip -DestinationPath gate
      $ci = "$env:CI_PROJECT_DIR\gate\build\ci"
      & $shell -NoProfile -ExecutionPolicy Bypass -File "$ci\gate-lock.ps1" -Take -Holder $holder -Path $env:HM_GATE_LOCK -WaitMinutes $env:HM_GATE_LOCK_WAIT_MINUTES
      if ($LASTEXITCODE -ne 0) { "the gate lock is not ours - no installer"; exit 10 }
      $code = 3
      try {
        & $shell -NoProfile -ExecutionPolicy Bypass -File "$ci\windows-installer.ps1" -Commit $sha -Tag $env:CI_COMMIT_TAG -BenchDir $bench -OutDir "$env:CI_PROJECT_DIR\release-windows"
        $code = $LASTEXITCODE
      } finally {
        & $shell -NoProfile -ExecutionPolicy Bypass -File "$ci\gate-lock.ps1" -Release -Holder $holder -Path $env:HM_GATE_LOCK
      }
      exit $code
  after_script:
    - |
      $holder = "gitlab-pipeline-$($env:CI_PIPELINE_ID)-job-$($env:CI_JOB_ID)"
      $lock = "$env:CI_PROJECT_DIR\gate\build\ci\gate-lock.ps1"
      if (Test-Path $lock) {
        & (Get-Process -Id $PID).Path -NoProfile -ExecutionPolicy Bypass -File $lock -Release -Holder $holder -Path $env:HM_GATE_LOCK
        if ($LASTEXITCODE -eq 0 -and (Get-Service hMailServer -ErrorAction SilentlyContinue).Status -ne 'Running') {
          Start-Service hMailServer -ErrorAction SilentlyContinue
        }
      }
  artifacts:
    expire_in: 30 days
    paths:
      - release-windows/

# The go-ahead, and the manifest of what is released. Nothing before it signs or sends
# anything; nothing after it starts until it has passed. Its needs are every job of this
# file that can fail a tag's pipeline - a manual job can be started as soon as its own
# needs have finished, so a gate left out here could be released past - every job whose
# files the release carries, and the four security scans whose reports it reads; only
# those thirteen bring their artifacts. Of the package jobs of .gitlab/ci/packages-*.yml
# it needs the two whose generic files the release carries, with their SBOM, install
# and start jobs - the last starting the server from each, in an AArch64 container
# beside PostgreSQL (build/ci/linux-package-install.sh) - and release-packages
# (.gitlab/ci/release-packages.yml), which needs every other
# package build and its install job, both AppImages and their tests, the source of the
# libraries linked into the AppImages' runtime (appimage-runtime-sources), the source of
# the libraries they carry in usr/lib (appimage-bundled-sources) and the source
# tarball, and gathers them, each but the two sources files with an SBOM: a job may need
# fifty jobs at most on GitLab.com. helm-chart-package makes the chart, and
# linux-image-arm64 (.gitlab/ci/container-image.yml) builds the linux/arm64 image
# beside linux-image's linux/amd64 one. dependency-scan is allow_failure, and
# static-analysis and semgrep fail only on a new finding, so none of them stops the
# pipeline on a known one: release-chain.py collect
# reads their reports (build/ci/security-gate.py) and refuses while a scan did
# not finish, or found something SECURITY.md's policy counts that is in no baseline and
# not accepted in .gitlab/security-exceptions.yml. semgrep-sast is GitLab's, in
# .gitlab/ci/gitlab-security.yml, which runs it for a v* tag for this. Not waited for:
# ci-image-packages (dependency-scan waits for it), dependency-scan-verdict (it waits
# for dependency-scan, and fails on its finding) and repo-hygiene, which are
# allow_failure, and the manual db-matrix and installer-smoke. The five path-bound
# checks run for every tag (a tag counts every file as changed) and are optional needs
# only so that a pipeline without one is still created; the scans are not optional, so a
# tag's pipeline without one of them is not created at all. build/check-release-chain.py
# fails when a job of this file that can fail, a scan, a job that makes, describes,
# installs or starts an AArch64 package the release carries, release-packages,
# helm-chart-package or linux-image-arm64 is missing here, and when one of them, or
# any job release-packages waits for, may fail or waits for a press in a tag's
# pipeline.
release:
  stage: release
  image: python:3.14-slim-trixie@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
  needs:
    - job: checkers
      artifacts: false
    - job: harnesses
      artifacts: false
    - job: editorconfig
      artifacts: false
    - job: chart-and-compose
      artifacts: false
      optional: true
    - job: update-helper
      artifacts: false
      optional: true
    - job: package-templates
      artifacts: false
      optional: true
    - job: roadmap
      artifacts: false
      optional: true
    - job: coverage-cobertura
      artifacts: false
      optional: true
    - job: linux-suite
      artifacts: false
    - job: linux-cross
      artifacts: false
    - job: linux-sanitize
      artifacts: false
    - job: linux-db-upgrade-pgsql
      artifacts: false
    - job: linux-db-upgrade-mysql
      artifacts: false
    - job: linux-package-deb
      artifacts: false
    - job: linux-package-rpm
      artifacts: false
    - job: linux-image
      artifacts: false
    - job: linux-image-arm64
      artifacts: false
    - job: linux-repro
      artifacts: false
    - job: windows-gate
      artifacts: false
    - job: windows-gate-s1vm
      artifacts: false
    - job: windows-dotnet
      artifacts: false
    - job: linux-build
      artifacts: true
    - job: linux-sbom
      artifacts: true
    - job: windows-installer
      artifacts: true
    # The ARM64 installer, hMailServer-<v>-arm64.exe, with the SHA256SUMS its job wrote.
    - job: windows-packages-arm64
      artifacts: true
    - job: deb-ubuntu26.04-arm64
      artifacts: true
    - job: deb-ubuntu26.04-arm64-sbom
      artifacts: true
    - job: deb-ubuntu26.04-arm64-install
      artifacts: false
    - job: deb-ubuntu26.04-arm64-start
      artifacts: false
    - job: rpm-fedora44-aarch64
      artifacts: true
    - job: rpm-fedora44-aarch64-sbom
      artifacts: true
    - job: rpm-fedora44-aarch64-install
      artifacts: false
    - job: rpm-fedora44-aarch64-start
      artifacts: false
    - job: release-packages
      artifacts: true
    - job: helm-chart-package
      artifacts: true
    - job: static-analysis
      artifacts: true
    - job: semgrep
      artifacts: true
    - job: dependency-scan
      artifacts: true
    - job: semgrep-sast
      artifacts: true
  timeout: 30 minutes
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v/ && $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
      allow_failure: false
  before_script:
    # git and ssh-keygen verify the tag's SSH signature; from Debian.
    - apt-get update -qq
    - apt-get install -y -qq -o Acquire::Retries=3 --no-install-recommends git openssh-client ca-certificates > /dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - python3 build/ci/release-chain.py collect --out release-assets
    # The server release-verify checks the bundles with, kept for as long as the files:
    # linux-build's own artifact expires in three days. And the component lists
    # release-sbom makes the two installers' SBOMs from, as linux-sbom wrote them.
    - mkdir -p release-tools && cp linux-build/hmailserver linux-build/build-info.txt sbom/native-dependencies-arm64.json sbom/native-dependencies-x64.json release-tools/
  artifacts:
    expire_in: 30 days
    paths:
      - release-assets/
      - release-tools/

# Authenticode, before Sigstore: it changes the installers' and the PowerShell module's
# bytes, and cosign signs the bytes that ship. Three calls, the x64 installer's, the
# ARM64 one's and the module's (its manifest and script, which release collected from the
# tree, unsigned: build/ci/release-chain.py, MODULE_FILES), each into its own folder,
# since windows-authenticode.ps1 empties the one it is given; the job exits with the
# first call's code that is not 0, and makes each call only when the one before it
# signed. The job's ID token, audience api://AzureADTokenExchange, is what Entra
# ID exchanges for the signing service's token through the federated credential the
# owner creates (RELEASE.md, "Authenticode"); there is no client secret. It stops,
# naming what is missing, while a setting or the plugin is absent, and sends nothing.
release-authenticode:
  stage: release
  tags: [bench150]
  hooks: !reference [.bench150-leftovers, hooks]
  needs:
    - job: release
      artifacts: true
  timeout: 30 minutes
  interruptible: false
  rules:
    - !reference [.release-rules, rules]
  id_tokens:
    AZURE_ID_TOKEN:
      aud: api://AzureADTokenExchange
  variables:
    GIT_TERMINAL_PROMPT: "0"
    GCM_INTERACTIVE: "Never"
  script:
    - |
      $version = $env:CI_COMMIT_TAG.Substring(1)
      & (Get-Process -Id $PID).Path -NoProfile -ExecutionPolicy Bypass -File build\ci\windows-authenticode.ps1 -Installer "release-assets\hMailServer-$version-x64.exe" -OutDir release-authenticode
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & (Get-Process -Id $PID).Path -NoProfile -ExecutionPolicy Bypass -File build\ci\windows-authenticode.ps1 -Installer "release-assets\hMailServer-$version-arm64.exe" -OutDir release-authenticode-arm64
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & (Get-Process -Id $PID).Path -NoProfile -ExecutionPolicy Bypass -File build\ci\windows-authenticode.ps1 -Module release-assets -OutDir release-authenticode-module
      exit $LASTEXITCODE
  artifacts:
    expire_in: 30 days
    paths:
      - release-authenticode/
      - release-authenticode-arm64/
      - release-authenticode-module/

# Each installer's own software bill of materials, made from the bytes Authenticode
# signed, before Sigstore signs it with every other file: each compiled file a release
# carries goes out with <file>.cdx.json beside it (OpenSSF Baseline OSPS-QA-02.02; the
# .deb's and the .rpm's are made in linux-build, where dpkg knows what they were built
# against). build/asset-sbom.py, from linux-sbom's component lists, x64 and ARM64 (kept
# in release's release-tools/), the tools' lock files and each installer script's
# [Files]; SECURITY.md, "Software bills of materials", says how a user checks one.
release-sbom:
  stage: release
  image: python:3.14-slim-trixie@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
  needs:
    - job: release
      artifacts: true
    - job: release-authenticode
      artifacts: true
  timeout: 10 minutes
  interruptible: false
  rules:
    - !reference [.release-rules, rules]
  script:
    - python3 build/ci/release-chain.py sbom --out release-sbom
  artifacts:
    expire_in: 90 days
    paths:
      - release-sbom/

# Sigstore, keyless, on linix's tag (default:), in cosign's own image pinned by digest
# (HM_COSIGN_IMAGE, above): nothing from GitHub. On the project's runners Fulcio's
# certificate says the runner was self-hosted (its Runner Environment extension,
# 1.3.6.1.4.1.57264.1.11), which no verifier of the project's reads, and the tag's
# ID token is on linix, server2 or s1-linux while the job runs
# (docs/ContinuousIntegration.md, "Every job on the project's own runners"). The
# certificate names
# https://gitlab.com/hmailserver/hmailserver//.gitlab-ci.yml@refs/tags/<tag>, the group's
# path the project has been at since 29 September 2026; 6.3.5's named the first one,
# https://gitlab.com/Progressiverobot/hmailserver//...
release-sign:
  stage: release
  image:
    name: $HM_COSIGN_IMAGE
    entrypoint: [""]
  needs:
    - job: release
      artifacts: true
    - job: release-authenticode
      artifacts: true
    - job: release-sbom
      artifacts: true
  timeout: 30 minutes
  interruptible: false
  rules:
    - !reference [.release-rules, rules]
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    COSIGN_YES: "true"
  script:
    - sh build/ci/release-sign.sh
  artifacts:
    expire_in: 90 days
    paths:
      - release-signed/

# Every bundle, checked with the verifier every server built after 6.3.3 runs: the
# hmailserver linux-build made from this commit (kept in release's artifact),
# --verify-update. It also makes the provenance's DSSE envelope, from release-sign's
# bundle, again alone as one line of JSON, release-signed/hmailserver-<version>.intoto.jsonl
# (build/ci/release-chain.py provenance-line), which needs Python and so is not made in
# cosign's image, and holds it to the bundle byte for byte; its artifact carries that
# one file of release-signed/ to release-publish, beside release-sign's.
release-verify:
  extends: .linix
  tags: [linix]
  stage: release
  needs:
    - job: release
      artifacts: true
    - job: release-sign
      artifacts: true
  timeout: 15 minutes
  interruptible: false
  rules:
    - !reference [.release-rules, rules]
  script:
    - bash build/ci/release-verify.sh
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - release-verified/
      - release-signed/*.intoto.jsonl

# Published by hand, once the signed installer (release-sign's artifact) has passed the
# installer smoke test from the VMware host. The files go to the generic package
# hmailserver/<version>, then the release is created with a link per file named after
# it, as build/generate-update-feed.py and every server require; the job's own
# CI_JOB_TOKEN does both. A release that exists already is refused.
release-publish:
  stage: release
  image: python:3.14-slim-trixie@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
  needs:
    - job: release-sign
      artifacts: true
    - job: release-verify
      artifacts: true
  timeout: 30 minutes
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v/ && $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
      allow_failure: false
  script:
    - python3 build/ci/release-chain.py publish --assets release-signed --verification release-verified/verification.md

# The feed, now that the release exists, is this pipeline's own pages and package-repos,
# which wait for release-publish (pages, above) - not a pipeline triggered on master,
# which GitLab refuses to a trigger job of the same project.

# The installer smoke test: the Windows installer installed, upgraded and uninstalled on
# a throwaway VM reverted to a clean snapshot before and after. The VM runs in VMware
# Workstation on the maintainer's laptop, which is not a runner, and reverting it takes
# vmrun on that host. Until a runner there exists, a batch* branch and a v* tag end with
# a button that says where the test is run from (docs/ContinuousIntegration.md, "The
# installer smoke test"). For a release it is run on the signed installer in
# release-sign's artifact, before release-publish is started.
installer-smoke:
  stage: release
  image: python:3.14-slim-trixie@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_TAG =~ /^v/ || $CI_COMMIT_BRANCH =~ /^batch/)
      when: manual
      allow_failure: true
  script:
    - echo "The installer smoke test runs from the VMware host with build/ci/installer-smoke-run.sh, not on a runner, until a runner on that host exists (docs/ContinuousIntegration.md, 'The installer smoke test')."
    - exit 1
