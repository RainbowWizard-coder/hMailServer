#
# The copyright and licence of every file of the tree that cannot carry them itself,
# as the REUSE Specification 3.3 (https://reuse.software/spec-3.3/) reads this file;
# CONTRIBUTING.md, "Code style and licence headers", says how the tree marks licences
# and how to mark a new file, and the reuse job of .gitlab-ci.yml runs reuse lint over
# the tree in every pipeline (build/ci/reuse-lint.sh). Every licence named here or in a
# file's header has its text in LICENSES/, and LICENSES/ holds no other.
#
# A file's own header comes first: the source files carry the project's header
# (build/add-license-headers.py writes it and --check holds it), and a table here
# with the default precedence, "closest", gives a file only what it does not say
# itself - its licence when it names its holders without one, its holders when it
# names a licence without them. "aggregate" adds a table's licence and holders to
# what a file says - the project's sources that hold third parties' code or data
# under the third party's licence - and "override" stands in for a file whose text
# names licences and holders that are not its own (a changelog, a copyright file),
# which reuse then does not read.
#
# The tables go from the general to the particular, and when several match a file
# the LAST one is the one used (the specification's rule): the project's files
# first, then the third parties' trees and files under their own licences, then the
# files that need more than one. A table names files, or directories and kinds of
# file the fork made, never the whole tree: a file that matches none and says
# nothing itself fails reuse lint, so a new source file without the header, or a new
# file without one in a directory of the original's, is refused, as the job's
# negative controls show. A path that matches no file is passed over.
#
# The holders: Martin Knafve, whose hMailServer this is a fork of, for every file
# that comes from it, with the fork's maintainers beside him, and the maintainers
# alone for what they made in 2026 (debian/copyright's "Files: *", one paragraph for
# the whole tree, names both for every file). The original's files are listed one by
# one, in the two tables the generator below writes from the original's own tags
# (build/generate-reuse-original.py; its docstring says how), with the files the fork
# moved or copied out of them and without those it made anew at their paths: the
# fork's header replaced Martin Knafve's notice in them in 2026, so their own text no
# longer names him, and these tables do. A table further down that names one of the
# original's files takes their place for it and names him too, and the reuse job
# refuses a record of one of them that does not.

version = 1

# ------------------------------------------------------------------ the project's
# >>> build/generate-reuse-original.py writes what follows, to the line that ends it.
# The original hMailServer's files, from build/reuse-original-paths.txt: every file
# of the tree at a path the original's tags hMailServer-5.7.0-b2788, -b2843 and
# -b3013 hold, or that the fork's first commit, fe45f43c3, took over from the
# original's history before them, letter case aside, and every file the fork moved,
# split or copied out of one of them (the generator's DERIVED) - but for the files
# the fork made itself at one of those paths (its FORK_MADE) and the third parties'
# files among them, which their own tables below give their holders. Martin Knafve
# is a holder of each (from 2005, the year of the original's earliest notices, to
# 2026, that of 5.7.0), beside what the file says itself (precedence aggregate):
# the first table is the files that carry the project's header, which names the
# maintainers, and the second those that carry none, which names the maintainers
# beside him, as debian/copyright's "Files: *" does. A table further down that
# names one of these files takes the place of these for it, and names him too;
# build/ci/reuse-lint.sh refuses a record of one of them without him.
