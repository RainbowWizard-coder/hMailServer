# Scott McMaster (smcmaste@hotmail.com) 10/10/2004" and his warranty disclaimer -
# from his CodeProject article "Automatic Runtime Tab Order Management for Windows
# Forms" (article 8406, 2004). The original kept it (it is in 5.7.0 builds 2788,
