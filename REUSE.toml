# knowledge base by Silvio Iaccarino, of 6 November 2002. What it keeps of the
# article, as the original and the fork changed it, is code as well as declarations:
# the SERVICE_STATUS record and the HANDLE type; the service constants of access
# rights, service types, start types, controls and states (the SERVICE_* ones and
# SC_MANAGER_ALL_ACCESS); the declarations of the five advapi32.dll functions
# OpenSCManager, OpenService, ControlService, QueryServiceStatus and
# CloseServiceHandle; the article's functions OpenServiceManager,
# IsServiceInstalled, StopService and IsServiceRunning, with the article's two
# messages; and IsServiceStopped, which the original made from IsServiceRunning by
# testing for SERVICE_STOPPED. The article states no licence for them, so that part
# of the file is LicenseRef-No-Licence-Stated: the project grants no licence for it
# and claims no right in it. Silvio Iaccarino is named beside Martin Knafve and the
# maintainers, whose the rest of the file is, under the project's licence. The source
# tarball, and so the Debian source package, leaves the file out, as it does every
# other script of the Windows installer (build/source-exclusions.txt).
[[annotations]]
path = "hmailserver/installation/hMailServerInnoExtension.iss"
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2005-2026 Martin Knafve / hMailServer.com",
    "2026 Christopher Holloway / Progressive Robot Ltd",
    "2002 Silvio Iaccarino",
]
SPDX-License-Identifier = "AGPL-3.0-or-later AND LicenseRef-No-Licence-Stated"

