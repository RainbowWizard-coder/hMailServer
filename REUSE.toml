#
# The copyright and licence of every file of the tree that cannot carry them itself,
# as the REUSE Specification 3.3 (https://reuse.software/spec-3.3/) reads this file;
# CONTRIBUTING.md, "Code style and licence headers", says how the tree marks licences
# and how to mark a new file, and the reuse job of .gitlab-ci.yml runs reuse lint over
# the tree in every pipeline (build/ci/reuse-lint.sh). Every licence named here or in a
# file's header has its text in LICENSES/, and LICENSES/ holds no other.
#
# A file's own header comes first: the source files carry the project's header
# (build/add-license-headers.py writes it and --check holds it), and a table here
# with the default precedence, "closest", gives a file only what it does not say
# itself - its licence when it names its holders without one, its holders when it
# names a licence without them. "aggregate" adds a table's licence and holders to
# what a file says - the project's sources that hold third parties' code or data
# under the third party's licence - and "override" stands in for a file whose text
# names licences and holders that are not its own (a changelog, a copyright file),
# which reuse then does not read.
#
# The tables go from the general to the particular, and when several match a file
# the LAST one is the one used (the specification's rule): the project's files
# first, then the third parties' trees and files under their own licences, then the
# files that need more than one. A table names directories and kinds of file, never
# the whole tree: a file that matches none and says nothing itself fails reuse lint,
# so a new source file without the header is refused, as the job's negative control
# shows. A path that matches no file is passed over.
#
# The holders, as debian/copyright's "Files: *" names them: Martin Knafve, whose
# hMailServer this is a fork of, and the fork's maintainers beside him, for the files
# that come from it - those the original's tree holds at the same path (its tags
# hMailServer-5.7.0-b2788 and -b3013), or that the fork's first commit, fe45f43c3,
# took over from it - and the maintainers alone for what they made in 2026.

version = 1

