# Icons of the fork's own pages drawn after Feather's, Cole Bemis's icon set, under
# the MIT licence (hmailserver/docs/Licenses/License - Feather icons.txt carries its
# notice and says how they were compared with Feather 4.29.2). The webmail's sprite
# in Portal.html, and the same page as PortalPageData.cpp embeds it, which the
# server compiles in, is drawn after Feather's icons. Of its 56 symbols, eleven
# follow a Feather icon's own drawing, some with their numbers rounded, some moved,
# resized or drawn in about the centre: i-gear after "settings", i-pen after
# "edit-3", i-print after "printer", i-inbox after "inbox", i-file after "file",
# i-draft after "file-text", i-clip after "paperclip", i-signout after "log-in",
# i-popout after "external-link", i-bell-off after "bell-off" and i-expand after
# "maximize-2". i-close, i-plus and the four chevrons are Feather's "x", "plus" and
# chevrons as they are. Others are near Feather's icon of the same subject, as it is
# or drawn in about the centre by up to 15 per cent, as i-file is near its "file":
# among them i-search, i-star, i-folder, i-trash, i-warn, i-calendar, i-chat and
# i-storage. The Control Deck's page draws its eye after
# Feather's "eye", laid into a box of 16 units; its other icons are plain circles
# and rectangles with a few straight strokes. The two with the project's header
# name Feather's holder and licence beside it, and the Control Deck's page, which
# has none, his beside the maintainers'.
# No other icon set's holder is named. A set other than Feather would be named where
# a symbol took from it more than simple shapes: plain figures - straight strokes, a
# circle or a half circle, a box with square or rounded corners - laid out as line
# icons of one subject on the 24-unit grid lay them (three bars for a menu, a circle
# with two hands for a clock, a box with a V for a letter, a circle with a slash, a
# head over a half circle, a lid over a box, a cross, a plus, a chevron); an outline
# drawn of curves, as a gear's, a pen's, a paperclip's or a bell's is, is not one.
# That line decides only which set beyond Feather is named, not which symbols are
# counted after Feather's, of which i-signout, i-popout and i-expand are simple
# shapes. What the sprite has of other sets is simple shapes: i-menu, i-clock,
# i-mail and i-empty are point for point Tabler Icons' "menu-2", "clock-hour-4" and
# "mail"; i-archive has the lid, the box and the bar of Tabler's "archive" where it
# has them, its lid square and its box's corners of radius 1 for Tabler's 2; i-junk
# is Humbleicons' "ban", its circle and its stroke from 5.5 to 18.5; i-person has the
# half circle of Lucide's "user-round" for its body and the head of Iconoir's
# "user"; i-mail-open is near Lucide's "mail-open", which Feather does not have;
# i-last is Lucide's "chevron-last"; i-close, i-plus and the chevrons are Lucide's
# and Tabler's as well as Feather's; and i-popout's box and diagonal fall where
# Tabler's "external-link" has them, its strokes in Feather's order.
[[annotations]]
path = [
    "hmailserver/source/Server/Common/Util/Portal.html",
    "hmailserver/source/Server/Common/Util/PortalPageData.cpp",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2013-2023 Cole Bemis"
SPDX-License-Identifier = "MIT"

