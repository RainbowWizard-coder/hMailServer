# registration scripts of the COM classes it added (each named, since the original's
# own are beside them), and the projects, lock files and installer scripts it added;
# and, each named, the files it made anew at a path of the original's, which the
# generator's FORK_MADE leaves out of the tables above: the installer's wizard
