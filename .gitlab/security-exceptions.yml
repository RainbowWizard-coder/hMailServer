  - scan: semgrep-sast
    finding: 05f8290789cd4d5ddc5d
    what: 'memcpy of the libFuzzer input into the NUL-terminated parse buffer in hm_fuzz::ParseBuffer''s constructor'
    reason: 'Fuzz-harness code: ParseBuffer''s constructor sizes storage_, a std::vector<char>, to size + 1 and copies exactly size bytes from libFuzzer''s buffer of that length, only when size > 0. The terminator goes into the extra element, and libFuzzer''s max_len keeps size + 1 from wrapping.'
    reviewed-by: Progressiverobot
    reviewed: 2026-09-26
    expires: 2027-09-25

  # hmailserver/source/Server/Common/Application/EnvironmentSettings.cpp
  - scan: semgrep-sast
    finding: 973f383007943dc4228c
    what: 'wcslen walk over the GetEnvironmentStringsW block in EnvironmentSettings::ReadProcessEnvironment (Windows)'
    reason: 'The block comes from GetEnvironmentStringsW, null-checked, which the OS guarantees is a run of NUL-terminated strings ending in an extra NUL. Each wcslen in ReadProcessEnvironment stops at its entry''s own terminator, and the loop stops at the final empty string.'
    reviewed-by: Progressiverobot
    reviewed: 2026-09-26
    expires: 2027-09-25

