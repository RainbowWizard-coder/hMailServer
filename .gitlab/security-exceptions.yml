#
# The security findings declared not exploitable, each read and accepted by the owner.
# Every gate that holds a finding reads this file as the branch a change targets has
# it, not as the change has it (one case apart, below):
#
#   semgrep-sast-gate    every change (build/ci/security-gate.py --merge-request), the
#                        change's base's copy: a Critical or High semgrep-sast finding;
#   mr-dependency-check  every change (build/ci/mr-dependency-check.py), the base's
#                        copy: a Critical or High advisory against a version it adds;
#   static-analysis,     a batch's, master's and a tag's pipeline
#   semgrep              (build/ci/security-findings.py --exceptions), master's copy: a
#                        finding not in build/ci/<job>-baseline.txt;
#   release              a v* tag (build/ci/release-chain.py collect, then
#                        build/ci/security-gate.py), master's copy: all four scans, as
#                        below, and the hand runbook the same.
#
# The release holds on every finding its policy counts that is neither in a scan's
# baseline nor accepted here:
#
#   static-analysis, semgrep   a finding not in build/ci/<job>-baseline.txt;
#   semgrep-sast               a finding of severity Critical or High;
#   dependency-scan            a Critical or High vulnerability with a fixed version
#                              that .gitlab/hmailserver.openvex.json does not dismiss.
#
# SECURITY.md, "Vulnerability management policy", says why those, and "Declaring a
# finding not exploitable" what an entry here means. A dependency that does not affect
# the project at all belongs in the VEX document; anything else is fixed, or is
# declared here as not exploitable as the code stands - a false positive is one such
# case - with the reason written down and a date to look again. A fix that waits
# upstream is no reason: an exploitable finding is not declared here, it holds, and is
# fixed or its component replaced under SECURITY.md's thresholds.
#
# One entry per finding:
#
#   - scan: semgrep-sast               static-analysis, semgrep, semgrep-sast or dependency-scan
#     finding: 0123456789abcdef0123    the fingerprint the gate prints; for dependency-scan
#                                      the advisory's id (CVE-..., GHSA-..., OSV-...)
#     package: zlib                    dependency-scan only: the package the advisory is against
#     what: 'strcpy in Foo.cpp'        what it is, for the reader of this file
#     reason: 'why it is not exploitable here: the check, size or bound that holds'
#     reviewed-by: Progressiverobot    the GitLab username of the maintainer who read it
#     reviewed: 2026-09-26             the day it was read
#     expires: 2027-03-26              at most a year later; after it the finding holds
#                                      changes and releases again until it is read again
#
# The reviewer is the owner, who owns this file (.gitlab/CODEOWNERS) and merges every
# change; an entry read with an AI's help under his delegation says so, in the entry or
# in the comment that heads its group.
#
# The file is a strict subset of YAML, read without a YAML library: comments, the
# "exceptions:" key, and flat entries of one-line "key: value" pairs, a value quoted
# with single quotes when it has a colon, a hash or a quote in it. The gate refuses
# anything else, and build/check-release-chain.py holds the file to it on every
# pipeline. An entry lands on master before the change that needs it, in a change of
# its own: every gate reads the copy of the branch the change targets. The one
# exception is a change that re-pins semgrep-sast's analyzer, which answers for the
# whole tree and whose own copy may accept a finding in a file it does not touch. The
# release job reads master's copy, never the tagged tree's, as it reads master's
# allow-list: an exception that reaches master after the tag, by a merge request of its
# own, counts when the release job is retried.
#
# The file holds 491 entries: 223 of semgrep-sast, 264 of static-analysis and 4 of
# semgrep, in nine groups, each headed by a comment that says how it was read. 290 of
# them expire on 26 and 27 March 2027, the rest from 25 September 2027. On 6 October
# 2026 it held 500, in the first seven groups; the eighth, of four, was added on 13
# October 2026, and on 14 and 15 October thirteen semgrep-sast entries that no longer
# matched any finding were taken out - three of the fourth group's (the eighth group's
# comment says which), nine of the first's (below) and one of the fifth's (its comment).
# The ninth, of two, was added on 17 October 2026, and on 18 October the two entries
# whose findings it replaced, one of the first group's and one of the eighth's, were
# taken out (the ninth group's comment says which).
# The groups, in the file's order:
#
#   - 159 entries: 157 of the 169 semgrep-sast findings judged not exploitable on 26
#     September 2026 (below), and two of 28 September 2026 for UpdateChecker.cpp's
#     getenv, one of static-analysis and one of semgrep-sast;
#   - 2 semgrep-sast findings in the webmail's Portal.js, read on 27 September 2026;
#   - 10 semgrep-sast findings in the AppImage runtime, read on 27 September 2026;
#   - 278 findings of the 6.3.4 release scan - 263 static-analysis, 4 semgrep and 11
#     semgrep-sast - read on 26 September 2026;
#   - 21 semgrep-sast findings read on 2 October 2026 and 6 read on 3 October 2026,
#     each against 6.3.6's code;
#   - 10 semgrep-sast findings in 6.3.6's new code, read on 5 October 2026;
#   - 3 semgrep-sast findings in batch47's Control Panel code, read on 13 October 2026;
#   - 2 semgrep-sast findings in batch48's Control Panel code, read on 16 October 2026.
#
# The 169 findings of GitLab's semgrep analyzer (semgrep-sast) that began the first
# group, run on linix over master at 40c7d3e0c, were judged not exploitable. Each was
# read on 26 September 2026 by two AI review agents, the second trying to refute the
# first, under the owner's delegation, and not line by line by the owner, so their
# reviewed-by names the owner, who delegated the reading, not a reader. Each names the
# specific reason it is safe: the check, the size or the constant that holds, and the
# function it is in. The fingerprints are the gate's own, made from that report; batch40
# moved some of the flagged lines and changed none of them until sast-fix, folded after,
# changed six accepted ones: MySQLInterface.cpp's LoadLibrary, Utilities.cpp's two
# memcpy, the password dialog's help link (formEnterPassword.cs), the Control Panel's
# elevated command line (FeatureSettingsView.xaml.cs, /d added) and UtilityViews.cs's
# explorer.exe. Where the analyzer still flags one of those, it has a new fingerprint
# and holds the release until it is read again. Their six entries matched nothing from
# then on, and were taken out on 15 October 2026 with three more of the group's whose
# lines had gone: AboutView.cs's second ShellExecute of a hyperlink's address, of which
# the About page's rewrite of 10 October 2026 (bda80a377) left one; DnssecResolver.cpp's
# copy of a name server's address in the Windows arm of its lookup, which b42-secfix-net2
# rewrote (6feb74de7); and UpdateChecker.cpp's system() asking rpm whether it owns the
# package, which 7f3e622ff made a run of ProcessLauncher. HelpPane.OpenWiki_'s
# ShellExecute of the wiki page's address, whose line batch48 rewrote, was taken out
# on 18 October 2026 (the ninth group's comment).
#
# The seven High findings judged real have no entry: each was fixed instead, in the
# tree 6.3.4 is released from (batch40's fold of the branch sast-fix, 26 September
# 2026): the crash-dump helper loads System32's dbghelp.dll alone
# (hMailServer.Minidump.cpp); the Control Panel's service restart runs System32's
# cmd.exe and net.exe by their full paths, in System32 (TryRestartService);
# DBSetupQuick hands DBUpdater the password in HM_ADMIN_PASSWORD, on no command line
# (UpgradeDatabase, two findings); the XMLite parser stops at the end of a truncated
# backup index (_SetString) and keeps an entity reference without its ';' as written
# (Ref2Entity); and the MimeTester check reads one array (TestFindStringEdgeCases).
# A fixed line the analyzer still flags has a new fingerprint, or keeps one never
# accepted here, and holds the release until it is read again. Four of the seven
# were fixed around a flagged line that did not change - XMLite.cpp's memcpy in
# _SetString and _tcslen in Ref2Entity, TryRestartService's Process.Start and
# UpgradeDatabase's Process.Start - so where the analyzer flags them by that text
# they keep the fingerprints this file does not accept. No semgrep-sast scan had
# been run over the fixed tree when this was written.
