  # build/scan-secrets.py
  - scan: semgrep
    finding: 88902ff8399da6639dd9
    what: work_directory() makes the directory the container mounts as /work 0777, inside a 0700 mkdtemp directory of its own
    reason: 'The image''s user, whoever it is, writes gitleaks'' report into /work, so /work is 0777; work_directory() makes it with os.mkdir inside tempfile.mkdtemp''s directory, which mkdtemp creates 0700 and owned by the invoking user, so no other local account can traverse to it to read the ignore file or the staged-lines stream, plant a symlink where run_docker() opens them, or put a report of its own in place of gitleaks''. Docker mounts /work by its path, which the daemon resolves itself, and run_docker() removes the private directory in its finally. remote_script() does the same on the ssh host: /work under mktemp -d, removed by the EXIT trap, and only /work is chmod 0777. The self-test holds both: the modes 0700 and 0777 on a POSIX host and the order of the steps in the ssh script. This was a real defect for 6.3.4, when the mkdtemp directory itself was 0777; batch41 fixed it (a Docker scan on linix and one over ssh from the laptop both ran to their reports), and the flagged line kept its text and so its fingerprint.'
    reviewed-by: Progressiverobot
    reviewed: 2026-09-27
    expires: 2027-03-26
