    reason: 'In run_ssh(), subprocess.run gets an argv list with no local shell. The host (line 288) and key path (line 295) come only from the invoking user''s own environment, which neither git (the hooks) nor the repository sets, and whoever sets them can already set PATH for that user, so no boundary is crossed. In the script piped to ''sh -s'', remote_script() single-quotes every docker argument with '' escaped as ''"''"'' (line 266), container_script quotes every gitleaks argument the same way (line 209) and strips quotes from the tip in the echo text (line 214), and the ignore text and staged stream arrive as base64 inside heredocs with quoted delimiters, which base64 output cannot contain.'
