#
# The security findings a release may go out with, each read and accepted by a
# maintainer. build/ci/security-gate.py reads this file in the release job (build/ci/
# release-chain.py collect) and in the hand runbook, and holds the release on every
# finding its policy counts that is neither in a scan's baseline nor accepted here:
#
#   static-analysis, semgrep   a finding not in build/ci/<job>-baseline.txt;
#   semgrep-sast               a finding of severity Critical or High;
#   dependency-scan            a Critical or High vulnerability with a fixed version
#                              that .gitlab/hmailserver.openvex.json does not dismiss.
#
# SECURITY.md, "Vulnerability management policy", says why those. A finding that does
# not affect the project at all belongs in the VEX document (a dependency) or is fixed;
# this file is for a finding accepted for a time: not exploitable as the code stands,
# or waiting on an upstream fix, with the reason written down and a date to look again.
#
# One entry per finding:
#
#   - scan: semgrep-sast               static-analysis, semgrep, semgrep-sast or dependency-scan
#     finding: 0123456789abcdef0123    the fingerprint the gate prints; for dependency-scan
#                                      the advisory's id (CVE-..., GHSA-..., OSV-...)
#     package: zlib                    dependency-scan only: the package the advisory is against
#     what: 'strcpy in Foo.cpp'        what it is, for the reader of this file
#     reason: 'why it is accepted: why it is not exploitable here, or what it waits on'
#     reviewed-by: Progressiverobot    the GitLab username of the maintainer who read it
#     reviewed: 2026-09-26             the day it was read
#     expires: 2027-03-26              at most a year later; after it the finding holds the
#                                      release again until it is read again
#
# The file is a strict subset of YAML, read without a YAML library: comments, the
# "exceptions:" key, and flat entries of one-line "key: value" pairs, a value quoted
# with single quotes when it has a colon, a hash or a quote in it. The gate refuses
# anything else, and build/check-release-chain.py holds the file to it on every
# pipeline. A change to this file is the owner's to accept (.gitlab/CODEOWNERS). The
# release job reads master's copy, never the tagged tree's, as it reads master's
# allow-list: an exception the owner adds on master after the tag counts when the
# release job is retried.
#
# The entries below are the 169 findings of GitLab's semgrep analyzer (semgrep-sast),
# run on linix over master at 40c7d3e0c, that were judged not exploitable. Each was
# read on 26 September 2026 by two AI review agents, the second trying to refute the
# first, under the owner's delegation, and not line by line by the owner, so their
# reviewed-by names the owner, who delegated the reading, not a reader. Each names
# the specific reason it is safe: the check, the size or the constant that holds, and
# the function it is in. The fingerprints are the gate's own, made from that report;
# batch40 moved some of the flagged lines and changed none of them until sast-fix,
# folded after, changed six accepted ones: MySQLInterface.cpp's LoadLibrary,
# Utilities.cpp's two memcpy, the password dialog's help link
# (formEnterPassword.cs), the Control Panel's elevated command line
# (FeatureSettingsView.xaml.cs, /d added) and UtilityViews.cs's explorer.exe. Where
# the analyzer still flags one of those, it has a new fingerprint and holds the
# release until it is read again.
#
# The seven High findings judged real have no entry: each was fixed instead, in the
# tree 6.3.4 is released from (batch40's fold of the branch sast-fix, 26 September
# 2026): the crash-dump helper loads System32's dbghelp.dll alone
# (hMailServer.Minidump.cpp); the Control Panel's service restart runs System32's
# cmd.exe and net.exe by their full paths, in System32 (TryRestartService);
# DBSetupQuick hands DBUpdater the password in HM_ADMIN_PASSWORD, on no command line
# (UpgradeDatabase, two findings); the XMLite parser stops at the end of a truncated
# backup index (_SetString) and keeps an entity reference without its ';' as written
# (Ref2Entity); and the MimeTester check reads one array (TestFindStringEdgeCases).
# A fixed line the analyzer still flags has a new fingerprint, or keeps one never
# accepted here, and holds the release until it is read again. Four of the seven
# were fixed around a flagged line that did not change - XMLite.cpp's memcpy in
# _SetString and _tcslen in Ref2Entity, TryRestartService's Process.Start and
# UpgradeDatabase's Process.Start - so where the analyzer flags them by that text
# they keep the fingerprints this file does not accept. No semgrep-sast scan had
# been run over the fixed tree when this was written.
exceptions:

  # fuzz/harness/fuzz_mime_common.h
  - scan: semgrep-sast
    finding: 05f8290789cd4d5ddc5d
    what: 'memcpy of the libFuzzer input into the NUL-terminated parse buffer in hm_fuzz::ParseBuffer''s constructor'
    reason: 'Fuzz-harness code: ParseBuffer''s constructor sizes storage_, a std::vector<char>, to size + 1 and copies exactly size bytes from libFuzzer''s buffer of that length, only when size > 0. The terminator goes into the extra element, and libFuzzer''s max_len keeps size + 1 from wrapping.'
    reviewed-by: Progressiverobot
    reviewed: 2026-09-26
    expires: 2027-09-25

  # hmailserver/source/Server/Common/Application/EnvironmentSettings.cpp
  - scan: semgrep-sast
    finding: 973f383007943dc4228c
    what: 'wcslen walk over the GetEnvironmentStringsW block in EnvironmentSettings::ReadProcessEnvironment (Windows)'
    reason: 'The block comes from GetEnvironmentStringsW, null-checked, which the OS guarantees is a run of NUL-terminated strings ending in an extra NUL. Each wcslen in ReadProcessEnvironment stops at its entry''s own terminator, and the loop stops at the final empty string.'
    reviewed-by: Progressiverobot
    reviewed: 2026-09-26
    expires: 2027-09-25

  # hmailserver/source/Server/Common/LDAP/LdapClient.cpp
  - scan: semgrep-sast
    finding: 7a893b908ed6285dbef5
    what: strlen in the single-argument FromUtf8_ overload that converts OpenLDAP-returned C strings to String
    reason: 'POSIX (OpenLDAP) only: this FromUtf8_ overload runs strlen after a null check, and every caller passes a string OpenLDAP allocated and terminated itself (the diagnostic message from ldap_get_option or ldap_parse_result, ldap_err2string, ldap_get_dn). Attribute values, which are length-delimited berval data, go through the two-argument overload with bv_len, never through strlen.'
    reviewed-by: Progressiverobot
    reviewed: 2026-09-26
    expires: 2027-09-25

