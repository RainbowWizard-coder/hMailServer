    reason: 'Reached only when the execl of /usr/bin/fusermount3 on the line before failed (line 548), in the same unmount (not root, or root''s umount2 failed): execlp finds fusermount3 on PATH, as libfuse does, with the same constant arguments and -- before the mkdtemp mount point, and no shell. The runtime has only the privileges of whoever runs it, so PATH chooses only among programs that user could run anyway.'
