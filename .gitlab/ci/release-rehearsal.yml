# The release, rehearsed: included from .gitlab-ci.yml (docs/ContinuousIntegration.md,
# "The release rehearsal"). On a protected batch* branch, whose pipeline builds and
# tests everything a tag's does, the release chain runs as far as it can without the
# tag, and publishes nothing:
#
#   release-rehearsal         GitLab's shared runners: build/ci/release-chain.py collect
#                             --rehearse gathers every file a release carries under the
#                             names it carries them and holds each to its build's sums
#                             and its SBOM, as collect does for a tag - the version is
#                             Version.h's, and the x64 installer windows-packages-x64's,
#                             built under its commit-stamped name, since windows-installer
#                             runs for a v* tag alone - then counts what GitLab and Pages
#                             would take of it; then sbom --rehearse makes the installer's
#                             SBOM and the provenance's statement.
#   release-rehearsal-sign    the shared runners, in cosign's image (HM_COSIGN_IMAGE): every
#                             file signed with Sigstore, its .sigstore.json copy made, and
#                             the provenance attested, each checked with cosign
#                             (build/ci/release-sign.sh --rehearse). The certificate names
#                             this branch, refs/heads/<branch>.
#   release-rehearsal-verify  linix: every bundle read by the server's own verifier, which
#                             must refuse each at the identity - servers trust v* tags
#                             alone, so a rehearsal's bundles install nowhere - and every
#                             SBOM, copy and the provenance held to the files
#                             (build/ci/release-verify.sh --rehearse).
#
# What it cannot rehearse: the tag's own checks (an annotated tag on master signed by
# the owner's key), the security gate, which reads scans a tag's pipeline runs, the
# registry, and Authenticode, which needs the credential the owner makes for one tag.
# What it publishes: nothing. No job here uses the job token GitLab gives every job, for
# the package registry, the Releases API or anything else, or runs publish
# (build/ci/release-chain.py refuses --rehearse with it); the one ID token is
# Sigstore's, and the entries it writes to Sigstore's public log name the branch.
# build/check-release-chain.py holds all of that.
#
# When: a protected batch* branch's pipeline, in exactly the pipelines .own-runners
# makes the package and Linux jobs in (a push that changes documentation alone makes
# none); never a tag's, never master's, never a merge request's.
.release-rehearsal-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG || $CI_COMMIT_BRANCH !~ /^batch/ || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - !reference [.own-runners, rules]

release-rehearsal:
  stage: release
  # The release job's image, by the same digest: Python and nothing else is needed.
  image: python:3.14-slim-trixie@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
  needs:
    - job: linux-build
      artifacts: true
    - job: linux-sbom
      artifacts: true
    - job: deb-ubuntu26.04-arm64
      artifacts: true
    - job: deb-ubuntu26.04-arm64-sbom
      artifacts: true
    - job: rpm-fedora44-aarch64
      artifacts: true
    - job: rpm-fedora44-aarch64-sbom
      artifacts: true
    - job: release-packages
      artifacts: true
    - job: helm-chart-package
      artifacts: true
    - job: windows-packages-x64
      artifacts: true
  timeout: 20 minutes
  rules:
    - !reference [.release-rehearsal-rules, rules]
  script:
    - python3 build/ci/release-chain.py collect --rehearse --out release-assets
    - mkdir -p release-tools && cp linux-build/hmailserver linux-build/build-info.txt sbom/native-dependencies-x64.json release-tools/
    - python3 build/ci/release-chain.py sbom --rehearse --out release-sbom
  artifacts:
    expire_in: 7 days
    paths:
      - release-assets/
      - release-tools/
      - release-sbom/

release-rehearsal-sign:
  stage: release
  image:
    name: $HM_COSIGN_IMAGE
    entrypoint: [""]
  needs:
    - job: release-rehearsal
      artifacts: true
  timeout: 30 minutes
  rules:
    - !reference [.release-rehearsal-rules, rules]
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    COSIGN_YES: "true"
  script:
    - sh build/ci/release-sign.sh --rehearse
  artifacts:
    expire_in: 7 days
    paths:
      - release-signed/

release-rehearsal-verify:
  extends: .linix
  stage: release
  needs:
    - job: release-rehearsal
      artifacts: true
    - job: release-rehearsal-sign
      artifacts: true
  timeout: 15 minutes
  rules:
    - !reference [.release-rehearsal-rules, rules]
  script:
    - bash build/ci/release-verify.sh --rehearse
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - release-verified/
