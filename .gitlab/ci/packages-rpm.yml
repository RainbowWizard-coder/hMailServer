# ------------------------------------------------------------------ templates
# The refusal first, because the by-hand rule after it comes before
# .own-runners' own; then a v* tag and a batch* branch fall through to
# .own-runners, which makes the job for a protected ref.
.rpm-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - if: $CI_COMMIT_TAG !~ /^v/ && $CI_COMMIT_BRANCH !~ /^batch/ && $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
      allow_failure: true
    - !reference [.own-runners, rules]

# The install jobs are never manual themselves: each needs its build, so it waits
# for it, and starts once the build has passed. With the build's rules (manual)
# it would wait for a second press of its own. Where .own-runners makes an
# install job it makes its build too (the build's by-hand rule makes one in more
# pipelines, never in fewer), so no install job needs a build the pipeline lacks.
.rpm-install-rules:
  rules:
    - !reference [.own-runners, rules]

.rpm-build:
  stage: build
  tags: [linix]
  needs: []
  timeout: 1 hour
  # One package build at a time on linix, across pipelines and across the
  # package files that name this group (packages-deb.yml does): each runs six
  # compilers at once, and linux-build and linux-suite need the machine too.
  resource_group: linix-package-build
  rules:
    - !reference [.rpm-rules, rules]
  variables:
    HM_BUILD_JOBS: "6"
  script:
    - bash build/ci/packages/rpm-build.sh "$HM_RPM_TARGET" "$HM_RPM_ARCH"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - packages-rpm/

# The Boost tarball of the targets that build Boost (el10, el9, leap16,
# tumbleweed), kept in linix's runner cache under its SHA-256 - rpm-build.sh's
# pin, which fetch-boost.sh holds the cached copy to as it holds a downloaded
# one - so that a job whose cache holds it downloads nothing. On 28 and
# 29 September 2026 some of archives.boost.io's addresses refused linix's
# connections for 21 s, and three openSUSE builds of one pipeline failed on it.
# One key for every such job: the tarball is the same for each target and
# architecture. A new pin is a new key, so an old tarball is never offered.
.rpm-boost-tarball:
  cache:
    key: boost-tarball-c4a3b310ddd2472416e091067166b0713be97c63f38c212c484ada022fd296ce
    paths:
      - .cache/boost-tarball/

# Its needs are the build of the same release and architecture, with its artifacts.
.rpm-install:
  stage: test
  tags: [linix]
  timeout: 30 minutes
  rules:
    - !reference [.rpm-install-rules, rules]
  script:
    - bash build/ci/packages/rpm-install-test.sh "$HM_RPM_TARGET" "$HM_RPM_ARCH"

# ------------------------------------------------------------------ Fedora 44: and the generic aarch64 name
# rpm-fedora44-aarch64 also leaves hmailserver-<v>-1.aarch64.rpm, the name
# installed servers' update checker asks for, from the same build. The generic
# x86_64 name, hmailserver-<v>-1.x86_64.rpm, stays linux-build's, which
# linux-package-rpm installs on Fedora 44 (docs/PackagesRpm.md, "The generic
# names").
rpm-fedora44-x86_64:
  extends: [.rpm-build, .rpm-image-fedora44-x86_64]
  variables: {HM_RPM_TARGET: fedora44, HM_RPM_ARCH: x86_64}

rpm-fedora44-aarch64:
  extends: [.rpm-build, .rpm-image-fedora44-x86_64]
  variables: {HM_RPM_TARGET: fedora44, HM_RPM_ARCH: aarch64}

rpm-fedora44-x86_64-install:
  extends: [.rpm-install, .rpm-image-fedora44-x86_64]
  needs: [rpm-fedora44-x86_64]
  variables: {HM_RPM_TARGET: fedora44, HM_RPM_ARCH: x86_64}

rpm-fedora44-aarch64-install:
  extends: [.rpm-install, .rpm-image-fedora44-aarch64]
  needs: [rpm-fedora44-aarch64]
  variables: {HM_RPM_TARGET: fedora44, HM_RPM_ARCH: aarch64}

# The release carries generic/hmailserver-<v>-1.aarch64.rpm, from 6.3.6, with its
# own SBOM beside it (SECURITY.md, "Software bills of materials"). The build's
# container has neither PowerShell nor Python, so the build records what the
# aarch64 sysroot held (built-against/) and this job makes
# hmailserver-<v>-1.aarch64.rpm.cdx.json from that in the CI image, as linux-build
# makes the x86_64 package's (build/ci/packages/package-sbom.sh). The release job
# needs the build, this job and the install job, and collects the package, its
# sums and this SBOM (build/ci/release-chain.py, sources()). Its rules are the
# install jobs': it follows its build.
rpm-fedora44-aarch64-sbom:
  extends: .linix
  stage: test
  needs:
    - job: rpm-fedora44-aarch64
      artifacts: true
  timeout: 10 minutes
  rules:
    - !reference [.rpm-install-rules, rules]
  script:
    - bash build/ci/packages/package-sbom.sh packages-rpm/fedora44-aarch64/generic/hmailserver-*-1.aarch64.rpm packages-rpm/fedora44-aarch64/built-against
  artifacts:
    expire_in: 14 days
    paths:
      - packages-rpm/fedora44-aarch64/generic/*.cdx.json

