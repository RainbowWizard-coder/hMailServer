# The RPM packages for Fedora, RHEL and openSUSE, x86_64 and aarch64, one per
# distribution release and architecture, each built with that release's own
# compiler and libraries so that its Requires name the sonames that release
# ships, and then installed in a clean container of it (docs/PackagesRpm.md
# says what each makes, and what has run). Included by .gitlab-ci.yml.
#
#   rpm-<target>-<arch>           linix: build/ci/packages/rpm-build.sh in the
#                                 release's own x86_64 container; aarch64 is
#                                 cross-compiled there with the release's clang
#                                 and lld against a sysroot of the same release's
#                                 aarch64 packages
#   rpm-<target>-<arch>-install   linix: build/ci/packages/rpm-install-test.sh in
#                                 a clean container of that release and
#                                 architecture, whose dnf or zypper resolves every
#                                 Requires; the aarch64 one runs under qemu-user,
#                                 through the qemu-aarch64 binfmt handler of
#                                 linix's kernel
#   rpm-fedora44-aarch64-sbom     linix, in the CI image: the SBOM of the one
#                                 package here a release carries, the generic
#                                 aarch64 one (build/ci/packages/package-sbom.sh)
#
# The release collects generic/hmailserver-<v>-1.aarch64.rpm from 6.3.6 with its
# SBOM, and release waits for rpm-fedora44-aarch64, its install job and its SBOM
# job. The release carries the other packages here from 6.3.6: release-packages
# (.gitlab/ci/release-packages.yml) needs each build and its install job and
# gathers them with an SBOM each.
#
#   target      image                                      package
#   fedora44    registry.fedoraproject.org/fedora:44       hmailserver-<v>-1.fc44.<arch>.rpm, and for
#                                                          aarch64 generic/hmailserver-<v>-1.aarch64.rpm
#   fedora43    registry.fedoraproject.org/fedora:43       hmailserver-<v>-1.fc43.<arch>.rpm
#   el10        registry.access.redhat.com/ubi10/ubi       hmailserver-<v>-1.el10.<arch>.rpm
#   el9         registry.access.redhat.com/ubi9/ubi        hmailserver-<v>-1.el9.<arch>.rpm
#   leap16      registry.opensuse.org/opensuse/leap:16.0   hmailserver-<v>-1.suse.lp160.<arch>.rpm
#   tumbleweed  registry.opensuse.org/opensuse/tumbleweed  hmailserver-<v>-1.suse.tw.<arch>.rpm
#
# When: every v* tag and batch* branch, at once; on any other protected branch
# (master) by hand - a build is started with its play button, and its install
# job follows it. Never for a merge request or an unprotected ref: these run on
# the project's own runner (.own-runners in .gitlab-ci.yml says why), and never
# in a scheduled, fuzz or feed pipeline. A tag's and a batch's builds, and every
# install job, are made by .own-runners' own rules, taken by !reference, so they
# refuse what every job on the project's runners refuses and follow any change
# made to that. The by-hand rule for the other branches is this file's, and it
# comes after a refusal of its own; like every rule that makes a job, it asks for
# a protected ref itself, so that a check reading one rule at a time
# (build/ci/repo-hygiene.py's Token-Permissions, once it reads included files)
# sees at once that an unprotected ref gets no job. On this tree
# packages-deb.yml's rules make the same jobs at the same times, so that the
# package files behave as one.
#
# The images are the distributions' own, pinned by the digest of each
# architecture's own manifest rather than the multi-architecture index, so that
# the x86_64 and the aarch64 image are two references in the runner's image
# store and if-not-present can never hand an aarch64 job the x86_64 image it
# already holds under the same name (or the reverse). Nothing here is fetched
# from GitHub: the packages come from each distribution's repositories, and
# Boost's release tarball from the job's cache, archives.boost.io or
# SourceForge's copy of it, checked by its SHA-256 (rpm-build.sh,
# fetch-boost.sh).

