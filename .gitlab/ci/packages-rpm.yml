# Read from each registry on 26 September 2026: the tag's index, then the
# linux/amd64 and linux/arm64 manifests it lists.
#   fedora:44   index sha256:72de8cab9539c06d525c73867d5b46b4390a7c71e441a7d99506dd47cd4f7b75
#   fedora:43   index sha256:9d9dd6da1cbd0dfbba26f854fcabd4d16d27df4a4386c2ccd8b58b7cafe28e96
#   ubi10/ubi   index sha256:223f8b83bcaa1159416724627ff2fadbfd2444653756b0c00d9dae1eacccbfbc
#   ubi9/ubi    index sha256:a4b9ec09b1e790a53ef25b7777c539976abe519248264298e5194dcbceac8c31
#   leap:16.0   index sha256:5bc9e1242fc2c92dbbcaf4db5e2eadad062c4c0434550c53822201f18799d55a
#   tumbleweed  index sha256:f1c043e88b3b54cb88ad07a07b462d7635be945add678d732429c67f12754f7e
.rpm-image-fedora44-x86_64:
