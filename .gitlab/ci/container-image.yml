# The release's container image, published and signed: included from .gitlab-ci.yml,
# whose release jobs this follows (docs/ContinuousIntegration.md, "The container
# image"). For a protected v* tag's pipeline, once the release is published:
#
#   container-image       linix: the image of packaging/docker/Dockerfile built with
#                         kaniko from the .deb release-sign signed and release-verify
#                         checked, inspected as linux-image inspects it, and pushed to
#                         the project's container registry as :<version>, and for a
#                         release without a suffix as :<major>.<minor> and :latest
#                         too - a pre-release (v6.3.5-rc1) never moves those two
#                         (build/ci/linux-image.sh with HM_IMAGE_PUSH=1);
#   container-image-sign  GitLab's shared runners, in cosign's own image
#                         (HM_COSIGN_IMAGE): the image signed by its digest with
#                         Sigstore, keylessly, as the same pipeline identity the
#                         release's files carry, and verified
#                         (build/ci/container-image-sign.sh);
#   container_scanning    GitLab's shared runners: GitLab's own Container Scanning
#                         template, free on every tier, over the pushed image by
#                         digest. A finding does not fail the pipeline (the template
#                         makes it allow_failure); its report is the job's artifact,
#                         for members with the Developer role or above, since the
#                         vulnerability report is GitLab Ultimate.
#
# Why after release-publish, and not only after release-verify: :latest is what the
# Compose file and the Helm chart pull, and it must not name a release that was never
# published - the installer smoke test before release-publish can still stop one.
#
# Nothing here holds a secret. The push and the signature's upload use the job's own
# registry credentials (CI_REGISTRY_USER and CI_REGISTRY_PASSWORD, which the job token
# has for this project alone), and Sigstore takes the job's ID token. The signing is in
# the tag's own top-level pipeline, as release-sign's is, for the same reason: Fulcio
# names the certificate after the token's ci_config_ref_uri, which is .gitlab-ci.yml's
# for a job of an included file too.
#
# The Container Scanning analyzer is pinned by digest, as the other scans' images are:
# registry.gitlab.com's security-products/container-scanning:8 as it was on
# 26 September 2026. kaniko's image is linux-image's, by reference, so that one digest
# serves both jobs.

include:
  - template: Jobs/Container-Scanning.gitlab-ci.yml

container-image:
  stage: release
  tags: [linix]
  image: !reference [linux-image, image]
  needs:
    - job: release-sign
      artifacts: true
    - job: release-verify
      artifacts: false
    - job: release-publish
      artifacts: false
  timeout: 30 minutes
  interruptible: false
  rules:
    - !reference [.release-rules, rules]
  variables:
    HM_IMAGE_PUSH: "1"
    HM_IMAGE_DEB_DIR: release-signed
    HM_OUT_DIR: container-image
  script:
    - sh build/ci/linux-image.sh
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - container-image/
    reports:
      dotenv: container-image/image.env

container-image-sign:
  stage: release
  image:
    name: $HM_COSIGN_IMAGE
    entrypoint: [""]
  needs:
    - job: container-image
      artifacts: true
  timeout: 15 minutes
  interruptible: false
  rules:
    - !reference [.release-rules, rules]
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    COSIGN_YES: "true"
  script:
    - sh build/ci/container-image-sign.sh
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - container-image-signed/

# The template's job, held to the release's rules and handed the image by digest:
# CS_IMAGE comes from container-image's dotenv report, which the template's
# `dependencies: []` would keep from it, so dependencies names that job.
container_scanning:
  image: registry.gitlab.com/security-products/container-scanning:8@sha256:f258339ca472221b6d5b155a4876c8b66766ac7a5e7e7eac0c44dee651877f63
  stage: release
  needs:
    - job: container-image
      artifacts: true
  dependencies: [container-image]
  timeout: 30 minutes
  rules:
    - if: $CONTAINER_SCANNING_DISABLED == 'true' || $CONTAINER_SCANNING_DISABLED == '1'
      when: never
    - !reference [.release-rules, rules]
