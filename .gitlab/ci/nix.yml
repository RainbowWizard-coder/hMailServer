# The project's Nix flake, built and tested: included from .gitlab-ci.yml
# (hmailserver/docs/Nix.md; Roadmap3, "A Nix flake of the project's own").
#
#   nix   server2 (tags linix and kvm): build/ci/nix.sh in Docker Hub's nixos/nix - flake.lock held to
#         releases.nixos.org, every output evaluated for x86_64-linux and
#         aarch64-linux, nix build .#hmailserver (the server with nixpkgs'
#         libraries, its --version and every tester program in checkPhase), then
#         the NixOS test (nix/test.nix: services.hmailserver against PostgreSQL,
#         SMTP and IMAP asked for their greetings) where it can run.
#
# Where the NixOS test runs: a NixOS test boots a QEMU machine, which wants KVM,
# and linix and s1-linux, virtual machines themselves, have no nested KVM (no /dev/kvm,
# no vmx or svm flag, 29 September 2026): under QEMU's TCG on linix the test's
# PostgreSQL timed out at boot and failed the job on 13 October 2026 (job 17129125235,
# 54 minutes; 121 in master's pipeline the same day), where server2 passed it in about
# 20. So the job asks for the tag kvm beside linix, which server2 alone carries - the
# owner gives runner 57072507 the tag, and its machine has /dev/kvm - and it never goes
# to GitLab's hosted runners, whatever the switches say (.gitlab-ci.yml, variables:).
# Where server2's runner passes the device into the job (devices = ["/dev/kvm"] in its
# config.toml), build/ci/nix.sh opens it to Nix's build users and the test runs with
# KVM; until then it runs there under TCG (HM_NIXOS_TEST_TCG below), which server2's
# CPUs carry in minutes.
#
# The image is the one the scorecard job pins, nixos/nix 2.35.2 by the digest of its
# index (.gitlab/ci/scorecard.yml), which trusts cache.nixos.org-1 and substitutes
# nixpkgs' builds from cache.nixos.org alone. .no-github keeps GitHub out of the job:
# the image has no /etc/nsswitch.conf, so without it curl and nix would ask DNS
# before the runner's entries (.gitlab/ci/no-github.yml); and the flake registry,
# which names GitHub, is off (NIX_CONFIG below). nixpkgs itself is NixOS's release
# tarball from releases.nixos.org, pinned in flake.lock, which build/ci/nix.sh holds
# to that.
#
# When it runs: for a push to master or a batch* branch that changes more than
# documentation (.own-runners' rules), and never for a v* tag - a check, not a gate
# of the release, which release does not need - nor for a merge request or a
# schedule. It waits in linix-package-build-rpm, the name the .rpm builds' lane of the
# package builds ($HM_LANE_PACKAGES-rpm) has on the project's runners, with the aarch64
# .rpm builds, which stay there too, so that it builds while none of them does and the
# package builds' three lanes keep up to three builds at once on the project's
# machines (.gitlab-ci.yml, variables:). Not the lane of the source builds, which
# Alpine's package ends: alpine-suite waits for that package, and the lane is kept
# the shortest so that it is built well before linux-suite ends
# (docs/ContinuousIntegration.md, "The lanes").

nix:
  extends: .no-github
  stage: build
  tags: [linix, kvm]
  image:
    name: nixos/nix:2.35.2@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c
    pull_policy: [if-not-present, always]
  needs: []
  timeout: 3 hours
  resource_group: linix-package-build-rpm
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BRANCH !~ /^batch/
      when: never
    - !reference [.own-runners, rules]
  variables:
    HM_OUT_DIR: nix-results
    HM_NIXOS_TEST_TCG: "1"
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      flake-registry =
      cores = 4
      max-jobs = 2
  script:
    - bash build/ci/nix.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - nix-results/
