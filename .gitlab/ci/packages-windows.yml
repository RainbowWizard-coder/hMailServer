# The Windows installers, x64 and ARM64, built by the pipeline of every protected ref
# - master, a batch* branch, a v* tag - on bench150, and kept as the job's artifact,
# unsigned (hmailserver/docs/PackagesWindows.md). Included by .gitlab-ci.yml, whose
# .own-runners rules these jobs take: never for a merge request, a scheduled
# pipeline or a downstream pipeline. Both count: a failed build fails the pipeline.
#
#   windows-packages-x64    the x64 server, tools, Control Panel and installer,
#                           hMailServer-<version>-<commit>-x64.exe, on a branch only;
#                           a release rehearsal on a batch* branch collects it. Never
#                           in a v* tag's pipeline: a release's x64 installer is
#                           windows-installer's (.gitlab-ci.yml), built in the bench's
#                           checkout of the gated commit, and a second x64 build
#                           there would cost the release pipeline another build
#                           under the gate lock for bytes nothing carries (the
#                           maintainers' decision, 1 October 2026: Roadmap3, "The x64
#                           installer made and signed by the pipeline");
#   windows-packages-arm64  the same for Windows on ARM, -arm64.exe, with the ARM64
#                           libraries built once into a cache on the bench, and
#                           libpq's build tools fetched once beside them. It stops
#                           first, naming what is missing and the Visual Studio
#                           Installer command that mends it, while the bench's ARM64
#                           toolchain is not whole. A v* tag's release collects its
#                           installer (build/ci/release-chain.py), and so does a
#                           rehearsal. In batch41's pipeline 2887115157 it stopped at
#                           that check on a report of the check's own fault; run by
#                           hand as LocalSystem on bench150 on 29 September 2026, the
#                           whole job passed (PackagesWindows.md, "What was run by
#                           hand on bench150");
#   build-inputs-authenticode
#                           first, for both and for windows-installer: the
#                           third-party files they place from the build inputs,
#                           each held to its pinned SHA-256 and to the Authenticode
#                           signature the manifest records (below).
#
# Both build in the runner's own checkout of the commit, as windows-dotnet does, not in
# the bench's checkout that windows-gate tests and whose hMailServer service runs from
# it: they touch nothing it runs. They take the bench's gate lock around the build all
# the same (build/ci/gate-lock.ps1): a build beside a running suite perturbs the suite,
# and the maintainer's split gate runs one over SSH outside GitLab.
#
# They come AFTER the bench's other jobs, not beside them. windows-gate and
# windows-installer wait only 90 minutes for the lock, and GitLab hands a runner its
# pending jobs oldest first: started with the pipeline (stage build, needs []) these
# jobs would take the lock first, and an x64 build (about an hour) followed by an
# ARM64 one would leave the gate - or on a tag the release's installer - giving up
# with exit 10. So they need windows-gate and windows-dotnet, and on a v* tag
# windows-installer (optional: it is in a tag's pipeline only), which is why they sit
# in the release stage: a job can need a job of its own or an earlier stage only. On a
# v* tag the release job needs windows-packages-arm64, whose installer it collects, so a
# maintainer can start release once windows-installer and the ARM64 build are done (the
# x64 build took about six minutes in batch41's pipeline 2887115157, and the ARM64 one,
# with its libraries cached, about as long: PackagesWindows.md); a tag has no
# windows-packages-x64. release-authenticode, on bench150 too, comes after release and
# so after both.
#
# The x64 libraries are the bench's own (C:\Dev\hMailLibs, as windows-gate's); the
# ARM64 ones live in C:\bench\hMailLibs-arm64, apart from them.
#
# Nothing here downloads from GitHub: the third-party files come from this project's
# package registry on GitLab and 7-zip.org, the .NET runtime from Microsoft, the NuGet
# packages from nuget.org, Boost from archives.boost.io and PostgreSQL from
# ftp.postgresql.org, each held to its pin. OpenSSL publishes its release archive on
# GitHub only; libraries\build-openssl.ps1 takes the same bytes from Debian's archive
# (openssl_4.0.3.orig.tar.gz has the pinned SHA-256). libpq's build tools that are not
# on the runner's PATH come from nuget.org (Python), PyPI (Meson, Ninja) and
# SourceForge (winflexbison), each held to the SHA-256 libraries\get-libpq-tools.ps1
# pins. bench150's hosts file sends github.com and its download hosts to 0.0.0.0, so
# that anything that reaches for GitHub fails by name (docs/ContinuousIntegration.md,
# "bench150").

# The Authenticode record of every third-party file the installers carry from a build
# input (hmailserver/docs/third-party-binaries.json), checked before any build of the
# pipeline uses one (build/ci/build-inputs-authenticode.ps1): each input - the
# build-inputs-<n> release's files in the package registry, 7-Zip's archive from
# 7-zip.org - downloaded afresh and held to its SHA-256, each file taken from it held to
# its own, and to the signature the manifest records: Valid, by the signer recorded,
# with a timestamp (the SQL Server Compact runtime, Microsoft's), or none. Then
# build/ci/authenticode-selftest.ps1: that check, and the step of
# build/ci/windows-authenticode.ps1 that holds release-authenticode's signatures to the
# pin, each refusing what it must, tested on the machine that signs.
# Get-AuthenticodeSignature is Windows' own, so this runs on bench150, protected refs
# alone (.own-runners); it needs no secret, and takes no gate lock, since it touches
# neither the bench's checkout nor its service. Every job that builds an installer from
# these inputs needs it: windows-packages-x64 and windows-packages-arm64 here, and
# windows-installer for a v* tag (.gitlab-ci.yml).
build-inputs-authenticode:
  extends: .own-runners
  stage: build
  tags: [bench150]
  hooks: !reference [.bench150-leftovers, hooks]
  needs: []
  timeout: 30 minutes
  variables:
    # No prompt for a credential, ever: under LocalSystem there is nobody to answer it.
    GIT_TERMINAL_PROMPT: "0"
    GCM_INTERACTIVE: "Never"
  script:
    - |
      # Started with the PowerShell running this, by its path: LocalSystem has the
      # machine PATH only.
      $shell = (Get-Process -Id $PID).Path
      & $shell -NoProfile -ExecutionPolicy Bypass -File build\ci\build-inputs-authenticode.ps1
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & $shell -NoProfile -ExecutionPolicy Bypass -File build\ci\authenticode-selftest.ps1
      exit $LASTEXITCODE

.windows-packages:
  extends: .own-runners
  stage: release
  tags: [bench150]
  hooks: !reference [.bench150-leftovers, hooks]
  needs:
    - job: build-inputs-authenticode
      artifacts: false
    - job: windows-gate
      artifacts: false
    - job: windows-dotnet
      artifacts: false
    - job: windows-installer
      artifacts: false
      optional: true
  # Four hours, the runners' own maximum_timeout (docs/ContinuousIntegration.md): a
  # longer timeout: is cut down to it, and gate-lock.ps1 takes over a lock older than
  # five hours on the grounds that no job runs longer. The wait for the lock counts
  # towards it: up to 90 minutes (the split gate, or another pipeline's bench job),
  # then the build - under six minutes for x64 in batch41's pipelines 2886955494 and
  # 2887115157, and for ARM64 the first time its libraries and libpq's tools as well
  # (PackagesWindows.md, "What was run by hand on bench150", has the times).
  timeout: 4 hours
  variables:
    HM_GATE_LOCK: 'C:\bench\gate.lock'
    HM_GATE_LOCK_WAIT_MINUTES: "90"
    # No prompt for a credential, ever: under LocalSystem there is nobody to answer it.
    GIT_TERMINAL_PROMPT: "0"
    GCM_INTERACTIVE: "Never"
    # No MSBuild worker left running as LocalSystem after the job.
    MSBUILDDISABLENODEREUSE: "1"
    # The runner's clean keeps the two .NET Desktop Runtime installers (60 MB each):
    # build/get-dotnet-runtime.ps1 holds a kept one to its SHA-512 pin and replaces it
    # when it is not the pinned file.
    GIT_CLEAN_FLAGS: -ffdx -e hmailserver/installation/DotNet/ -e hmailserver/installation/ARM64/DotNet/
    # Ten minutes before the job's timeout the script is stopped and after_script
    # still runs, to release the lock; at the job's own timeout it would not.
    RUNNER_SCRIPT_TIMEOUT: 3h50m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 5m
  script:
    - |
      $holder = "gitlab-pipeline-$($env:CI_PIPELINE_ID)-job-$($env:CI_JOB_ID)"
      # Started with the PowerShell running this, by its path: LocalSystem has the
      # machine PATH only.
      $shell = (Get-Process -Id $PID).Path
      & $shell -NoProfile -ExecutionPolicy Bypass -File build\ci\gate-lock.ps1 -Take -Holder $holder -Path $env:HM_GATE_LOCK -WaitMinutes $env:HM_GATE_LOCK_WAIT_MINUTES
      if ($LASTEXITCODE -ne 0) { "the gate lock is not ours - nothing built"; exit 10 }
      $code = 3
      try {
        & $shell -NoProfile -ExecutionPolicy Bypass -File build\ci\packages\windows-packages.ps1 -Platform $env:HM_PACKAGE_PLATFORM -OutDir "$env:CI_PROJECT_DIR\packages-windows\$env:HM_PACKAGE_FOLDER" -LibsDir $env:HM_PACKAGE_LIBS
        $code = $LASTEXITCODE
      } finally {
        & $shell -NoProfile -ExecutionPolicy Bypass -File build\ci\gate-lock.ps1 -Release -Holder $holder -Path $env:HM_GATE_LOCK
      }
      exit $code
  after_script:
    - |
      $holder = "gitlab-pipeline-$($env:CI_PIPELINE_ID)-job-$($env:CI_JOB_ID)"
      if (Test-Path build\ci\gate-lock.ps1) {
        & (Get-Process -Id $PID).Path -NoProfile -ExecutionPolicy Bypass -File build\ci\gate-lock.ps1 -Release -Holder $holder -Path $env:HM_GATE_LOCK
      }
  artifacts:
    when: always
    # About 100 MB an installer (each carries its .NET Desktop Runtime): a week, and
    # GitLab keeps the newest successful pipeline's artifacts of each ref besides.
    expire_in: 7 days
    paths:
      - packages-windows/
      - logs/
      - libraries/build-*-arm64.log

# Not allowed to fail, not even with exit 2, the script's exit at its third step when
# Inno Setup 6 is missing: that allowance was made while bench150 had no Inno Setup for
# the machine. It has had one since 26 September 2026 (docs/ContinuousIntegration.md,
# "bench150"), and this job passed with it in pipeline 2887115157.
#
# Not for a v* tag (above): its refusal first, then .own-runners' rules, which make
# the job for a protected branch as .windows-packages' would.
windows-packages-x64:
  extends: .windows-packages
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.own-runners, rules]
  variables:
    HM_PACKAGE_PLATFORM: x64
    HM_PACKAGE_FOLDER: x64
    HM_PACKAGE_LIBS: 'C:\Dev\hMailLibs'

# Not allowed to fail: a broken ARM64 build fails the pipeline as a broken x64 build
# does, and a v* tag's release collects this job's installer (build/ci/release-chain.py),
# which build/check-release-chain.py holds it to. The whole job passed by hand as
# LocalSystem on bench150 on 29 September 2026 (hmailserver/docs/PackagesWindows.md).
#
# After windows-packages-x64 as well, on a branch: side by side, whichever took the
# lock second would wait for the other's whole build, and the ARM64 job's first run
# (its libraries too) may take longer than the 90 minutes the x64 job waits. Optional,
# since a v* tag's pipeline has no windows-packages-x64; there this job follows
# windows-installer instead, for the same reason.
windows-packages-arm64:
  extends: .windows-packages
  needs:
    - job: windows-gate
      artifacts: false
    - job: windows-dotnet
      artifacts: false
    - job: windows-installer
      artifacts: false
      optional: true
    - job: windows-packages-x64
      artifacts: false
      optional: true
  variables:
    HM_PACKAGE_PLATFORM: ARM64
    HM_PACKAGE_FOLDER: arm64
    HM_PACKAGE_LIBS: 'C:\bench\hMailLibs-arm64'
