# The live update off, and aware of where it runs (docs/LiveUpdateKinds.md):
# linux-build's server started as a snap and as a container, and a second build
# with -DHM_LIVE_UPDATE=OFF, each asked what its update check says; and that the
# OFF build's `cmake --install` leaves no hmailserver-update and no units
# (build/ci/linux-live-update.sh, build/test-install-kind.sh). On linix beside
# the suite, against the same PostgreSQL. A check only: never on a tag, whose
# tree has passed it in the branch's pipeline.
linux-live-update:
  extends: .linix
  stage: test
  needs: [linux-build]
  timeout: 1 hour
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.own-runners, rules]
  services:
    - name: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
      alias: postgres
      pull_policy: if-not-present
      variables:
        POSTGRES_USER: hmailserver
        POSTGRES_PASSWORD: hmtest
        POSTGRES_DB: hmtest
  variables:
    HM_PG_HOST: postgres
    HM_PG_DATABASE: hmtest
  script:
    - bash build/ci/linux-live-update.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - linux-live-update/
