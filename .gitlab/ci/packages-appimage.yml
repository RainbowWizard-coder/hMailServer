# The AppImages, x86_64 and aarch64, included from .gitlab-ci.yml. No tool from
# GitHub: the AppImage runtime is the project's own (platform/packaging/appimage/
# runtime.c), linked statically from Alpine's packages, and build-appimage.sh packs
# the AppDir with ldd, patchelf and mksquashfs from Ubuntu's archive
# (hmailserver/docs/PackagesAppImage.md says why, and what each job has been run).
#
#   appimage-runtime-x86_64, appimage-runtime-aarch64
#       linix, alpine: the runtime, proved on an AppImage of its own, and a record
#       of every library file linked into it with its Alpine package, version and
#       aports commit (build/ci/packages/appimage-runtime.sh)
#   appimage-runtime-sources
#       linix, alpine: the source of every library the two runtimes link, exactly
#       as Alpine built it, as the release file
#       hmailserver-<version>-appimage-runtime-sources.tar.gz, and each library's
#       licence files for the AppImages (build/ci/packages/appimage-runtime-sources.sh)
#   appimage-aarch64-compile
#       linix, ubuntu:24.04 amd64: the aarch64 server cross-compiled against
#       Ubuntu 24.04's arm64 libraries (build/ci/packages/appimage-cross.sh)
#   appimage-x86_64, appimage-aarch64
#       linix, ubuntu:24.04: the server built (x86_64) or taken from the compile
#       job (aarch64), packed as hMailServer-<version>-<arch>.AppImage - the name
#       the update checker and the update feed look for - and run; beside it what
#       it was built against and what it bundles, for its SBOM
#       (build/ci/packages/appimage-build.sh)
#   appimage-test-x86_64, appimage-test-aarch64
#       linix, fedora:44: the AppImage run on a distribution it was not built on,
#       with nothing the build installed (build/ci/packages/appimage-test.sh)
#
# The aarch64 runtime, packing and test jobs run in arm64 containers on linix,
# which is x86-64, under qemu-user: the image's platform is named below, and the
# host must have qemu-user registered with binfmt_misc for aarch64
# (docs/PackagesAppImage.md, "What the owner must do").
#
# The release carries both AppImages from 6.3.6, each with its SBOM
# (build/asset-sbom.py --kind appimage, from built-against-<arch>/, which the build
# records), a line in the sums, a bundle and its .sigstore.json copy: the
# release-packages job (.gitlab/ci/release-packages.yml) needs appimage-<arch> and
# appimage-test-<arch> and gathers them, and release needs it. The runtime is the
# project's own, which the maintainers accepted on work item 36 (28 September 2026).
# With them goes the source of the libraries linked into the runtime,
# hmailserver-<version>-appimage-runtime-sources.tar.gz, with its line in the sums, a
# bundle and its .sigstore.json copy, and no SBOM, being source: the LGPL-2.1 of
# libfuse3 and the GPL of lzo ask for it (docs/PackagesAppImage.md, "Licences").
# release-packages needs appimage-runtime-sources and gathers it, and each AppImage
# job needs it for the libraries' licence files, which the image carries.
#
# When: on a protected v* tag and a batch* branch, every job at once, as part of the
# release and of its rehearsal (.gitlab/ci/release-rehearsal.yml); on any other
# protected ref (master) the runtime and compile jobs wait to be started by hand
# and the rest follow them - the two builds add half an hour to linix's queue. Never
# for a merge request or an unprotected ref: these run on the project's own runner,
# which takes protected refs only. A tag's and a batch's jobs, and every job that
# follows another, are made by .own-runners' own rules (.gitlab-ci.yml), taken by
# !reference; the by-hand rule for master comes after a refusal of its own and asks
# for a protected ref itself, so that build/ci/repo-hygiene.py's Token-Permissions,
# which reads one rule at a time, sees that an unprotected ref gets no job. These are
# packages-deb.yml's and packages-rpm.yml's rules, so that the package files behave
# as one.
#
# Every image is pinned by the digest of its manifest for the one platform the job
# runs, not by the multi-platform index: the runner's pull policy is if-not-present,
# and a per-platform digest cannot be satisfied by the other platform's copy
# already in linix's image store.

.appimage-start-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - if: $CI_COMMIT_TAG !~ /^v/ && $CI_COMMIT_BRANCH !~ /^batch/ && $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
      allow_failure: true
    - !reference [.own-runners, rules]

.appimage-follow-rules:
  rules:
    - !reference [.own-runners, rules]

.appimage:
  extends: .own-runners
  tags: [linix]

# ---------------------------------------------------------------- the runtime

appimage-runtime-x86_64:
  extends: [.appimage, .appimage-start-rules]
  stage: build
  needs: []
  image:
    # alpine:3.24, linux/amd64
    name: alpine:3.24@sha256:d56c381f961d307a21b3ca004cf1e3910f106644aefb1f43e654c8a56c4fd395
    pull_policy: if-not-present
    docker:
      platform: linux/amd64
  timeout: 15 minutes
  script:
    - sh build/ci/packages/appimage-runtime.sh
  artifacts:
    expire_in: 30 days
    paths:
      - appimage/

appimage-runtime-aarch64:
  extends: [.appimage, .appimage-start-rules]
  stage: build
  needs: []
  image:
    # alpine:3.24, linux/arm64/v8, under qemu-user on linix
    name: alpine:3.24@sha256:260479a1cfaf304c4c20da7f8405d3ce313513dcd534bb743257bdd2fe0f3e2d
    pull_policy: if-not-present
    docker:
      platform: linux/arm64
  timeout: 45 minutes
  script:
    - sh build/ci/packages/appimage-runtime.sh
  artifacts:
    expire_in: 30 days
    paths:
      - appimage/

# ---------------------------------------------------------------- the runtime's sources

# From the two runtime jobs' records of what they linked (runtime-<arch>-linked.txt):
# each library's aports directory at the commit its package records, fetched from
# Alpine's GitLab by the commit's id, and the upstream archives its APKBUILD lists,
# fetched from Alpine's distfiles mirror, each held to the SHA-512 the APKBUILD gives
# it; packed reproducibly, then made again from nothing in another directory, under
# another umask, and compared byte for byte. .no-github keeps GitHub out of the job
# itself: several of these APKBUILDs name a GitHub release as their source, and the
# script never fetches what an APKBUILD names, only the mirror's copy of it. Leaves
# appimage-runtime-sources/: the tarball, SHA256SUMS.txt naming it, and
# licenses-<arch>/, each library's licence files for that architecture's AppImage.
appimage-runtime-sources:
  extends: [.appimage, .appimage-follow-rules, .no-github]
  stage: build
  needs: [appimage-runtime-x86_64, appimage-runtime-aarch64]
  image:
    # alpine:3.24, linux/amd64: appimage-runtime-x86_64's
    name: alpine:3.24@sha256:d56c381f961d307a21b3ca004cf1e3910f106644aefb1f43e654c8a56c4fd395
    pull_policy: if-not-present
    docker:
      platform: linux/amd64
  timeout: 20 minutes
  script:
    - sh build/ci/packages/appimage-runtime-sources.sh pack appimage/runtime-x86_64-linked.txt appimage/runtime-aarch64-linked.txt
    - (umask 0077 && HM_OUT_DIR=/tmp/runtime-sources-again sh build/ci/packages/appimage-runtime-sources.sh pack appimage/runtime-x86_64-linked.txt appimage/runtime-aarch64-linked.txt > /tmp/runtime-sources-again.log 2>&1) || { tail -n 40 /tmp/runtime-sources-again.log; exit 1; }
    - |
      first=$(sha256sum appimage-runtime-sources/hmailserver-*-appimage-runtime-sources.tar.gz | cut -d' ' -f1)
      second=$(sha256sum /tmp/runtime-sources-again/hmailserver-*-appimage-runtime-sources.tar.gz | cut -d' ' -f1)
      echo "first  $first"
      echo "second $second"
      if [ "$first" != "$second" ]; then
        echo "The same records made two different tarballs."
        exit 1
      fi
  artifacts:
    expire_in: 30 days
    paths:
      - appimage-runtime-sources/

# ---------------------------------------------------------------- the AppImages

appimage-x86_64:
  extends: [.appimage, .appimage-follow-rules]
  stage: build
  needs: [appimage-runtime-x86_64, appimage-runtime-sources]
  image:
    # ubuntu:24.04, linux/amd64
    name: ubuntu:24.04@sha256:496754492fb28b4d3049432f2ca787449331e23fb14f0dd3fffea86bf5a93eb4
    pull_policy: if-not-present
    docker:
      platform: linux/amd64
  timeout: 1 hour
  script:
    - bash build/ci/packages/appimage-build.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - appimage/

# The aarch64 server is cross-compiled on x86-64, against Ubuntu 24.04's own arm64
# libraries (build/ci/packages/appimage-cross.sh): natively under qemu-user it would
# take hours. Only the packing, which runs ldd and so needs the target's own loader,
# is done in an arm64 container under qemu-user, and takes minutes.
appimage-aarch64-compile:
  extends: [.appimage, .appimage-start-rules]
  stage: build
  needs: []
  image:
    # ubuntu:24.04, linux/amd64
    name: ubuntu:24.04@sha256:496754492fb28b4d3049432f2ca787449331e23fb14f0dd3fffea86bf5a93eb4
    pull_policy: if-not-present
    docker:
      platform: linux/amd64
  timeout: 1 hour
  script:
    - bash build/ci/packages/appimage-cross.sh
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - appimage/

appimage-aarch64:
  extends: [.appimage, .appimage-follow-rules]
  stage: build
  needs: [appimage-runtime-aarch64, appimage-aarch64-compile, appimage-runtime-sources]
  image:
    # ubuntu:24.04, linux/arm64/v8, under qemu-user on linix
    name: ubuntu:24.04@sha256:11dc1ccb427f0464a2369e645454c272bb0baece7357c892ba69d313b3a332cf
    pull_policy: if-not-present
    docker:
      platform: linux/arm64
  timeout: 1 hour
  variables:
    HM_PREBUILT: appimage/hmailserver-aarch64
  script:
    - bash build/ci/packages/appimage-build.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - appimage/

# ---------------------------------------------------------------- on another distribution

appimage-test-x86_64:
  extends: [.appimage, .appimage-follow-rules]
  stage: test
  needs: [appimage-x86_64]
  image:
    # registry.fedoraproject.org/fedora:44, linux/amd64
    name: registry.fedoraproject.org/fedora:44@sha256:0ee3afdf450deaeb3bddd66e74ae78a2c6804820b2658d52a04fe6f79cc5a703
    pull_policy: if-not-present
    docker:
      platform: linux/amd64
  timeout: 15 minutes
  script:
    - bash build/ci/packages/appimage-test.sh appimage/hMailServer-*-x86_64.AppImage

appimage-test-aarch64:
  extends: [.appimage, .appimage-follow-rules]
  stage: test
  needs: [appimage-aarch64]
  image:
    # registry.fedoraproject.org/fedora:44, linux/arm64, under qemu-user on linix
    name: registry.fedoraproject.org/fedora:44@sha256:c61b46d9d6a76b37a765368fb78149e220bccf14019605846cb8558e983dc131
    pull_policy: if-not-present
    docker:
      platform: linux/arm64
  timeout: 30 minutes
  script:
    - bash build/ci/packages/appimage-test.sh appimage/hMailServer-*-aarch64.AppImage
