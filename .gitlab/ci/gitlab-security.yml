# GitLab's own security scanners, from the templates GitLab publishes, on the
# project's own runners: included from .gitlab-ci.yml.
#
# What they add to the scans .gitlab-ci.yml already runs (static-analysis, semgrep,
# dependency-scan and repo-hygiene, on linix, for a protected ref only):
#
#   semgrep-sast      GitLab's Semgrep analyzer with GitLab's own rules. It reads the
#                     C and C++ of the server as well as the C#, Python and JavaScript
#                     (GitLab 18.6 and later), where the semgrep job leaves the C++ to
#                     cppcheck and clang-tidy and uses Semgrep's registry packs; and it
#                     runs on every change - a merge request, which no job on linix
#                     ever does, and a protected batch* branch. Not what lies under a
#                     directory named build, dist, vendor or node_modules, at any
#                     depth, which the analyzer's own ignore template leaves out: the
#                     scripts under build/ are read by the semgrep job alone, on a batch.
#   secret_detection  GitLab's secrets analyzer over the commits a pipeline brings: a
#                     key, token or password committed by mistake. Nothing on linix
#                     looks for one.
#
# Not included, and why:
#
#   Dependency-Scanning   its jobs run only where GITLAB_FEATURES names
#                         dependency_scanning, which is GitLab Ultimate; on the Free tier
#                         the template creates no job. dependency-scan (Trivy and OSV,
#                         on linix) covers the lock files and the CI image.
#   Container-Scanning    not here: it scans an image in a registry, and the only one
#                         this project pushes is a release's, so it is included with
#                         the jobs that push that image, for a v* tag
#                         (.gitlab/ci/container-image.yml).
#   GitLab Advanced SAST  Ultimate only: its jobs never start on the Free tier.
#
# On the Free tier each job leaves its report as an artifact that project members
# with the Developer role or above can download (artifacts:access in the templates);
# the merge request widget, the pipeline's Security tab and the vulnerability report
# are GitLab Ultimate. A finding does not fail semgrep-sast: the analyzer writes it to
# the report and succeeds. It holds a release instead: for a v* tag the
# release job needs semgrep-sast's report and refuses while it has a finding of
# severity Critical or High that .gitlab/security-exceptions.yml does not accept, or
# is missing (build/ci/security-gate.py; SECURITY.md, "Before a release"). And it
# holds every change: in a merge request's pipeline, and in a protected batch* branch's
# pipeline, which is the one GitLab holds that branch's merge request to, the
# semgrep-sast-gate job (.gitlab/ci/mr-checks.yml) reads the same report by the same
# rule, for the files the change touches from its base and with the exceptions as the
# base has them, and fails the pipeline, which a merge request needs to land (OpenSSF
# Baseline OSPS-VM-06.02). semgrep-sast is not allow_failure, where the template makes
# it so: a scan that fails, or an image that cannot be pulled, fails the pipeline
# itself, and no report but the one the job wrote reaches the gate - it removes any it
# finds before the analyzer runs, and the gate refuses a report the analyzer did not
# write, one older than the pipeline, and a tree that commits one. No variable
# switches semgrep-sast off: GitLab's template skips it when SAST_DISABLED is set, and
# a project variable must not take a blocking gate away unseen, so its rules here do
# not read it. Nor does a CI file's variable narrow it unseen: it sets
# SAST_SEMGREP_EXCLUDED_PATHS itself, and a change that narrows what it reads (an
# exclusion, its options) lands alone, as a declaration (build/ci/security-gate.py,
# scope_narrowings); a .semgrepignore and a custom ruleset are refused outright
# (build/check-release-chain.py). A project variable, which only the owner can set,
# stands above a job's own (SECURITY.md, "What the gates cannot hold").
# secret_detection is not allow_failure: a secret found fails the
# job and the pipeline. The template's job cannot do that by itself - the analyzer
# exits 0 whatever it finds, and the template adds allow_failure: true, which would
# hide the failure anyway - so the job below runs the analyzer and then reads its
# report. What was read and is not a secret (test keys, the armour lines the key
# parsers are tested with, AWS's documented example key) is named in .gitleaksignore
# at the root, which gitleaks reads from the checkout.
#
# When they run: in a merge request's pipeline and in a pipeline for the default
# branch; semgrep-sast in a protected batch* branch's pipeline too, whose
# semgrep-sast-gate reads its report, and for a protected v* tag, whose release job
# reads it (no pipeline of master's need have scanned the tagged commit: a landing's
# may be cancelled, and a push made with ci.skip runs none). Never in the fuzz
# schedule's, Renovate's or the update feed's pipeline, which each run their one job
# (.not-a-fuzz-pipeline in .gitlab-ci.yml);
# secret_detection not for a tag, whose commits the pushes to master and the landing's
# own scan (build/scan-secrets.py) have read.
# And secret_detection alone in the pipeline of a schedule on master whose description
# is "security": there it scans the whole history (SECRET_DETECTION_HISTORIC_SCAN),
# not only the commits a push brings. That is the one-time scan of the history
# imported from GitHub: the owner makes the schedule, runs it once from its Run
# button, and deactivates it until the next time (docs/ContinuousIntegration.md,
# "Security scanning"). A schedule and not a variable, because the project refuses pipeline
# variables and a schedule's; a schedule and not a manual job, because a manual job
# would sit in every pipeline on master, and would need a pipeline to be started in
# anyway.
#
# Where they run: on default:'s tags, [$HM_RUNNER] (.gitlab-ci.yml) - linix or
# server2, by the tag linix, in a pipeline for a protected ref that is not a merge
# request's, and GitLab's hosted runner in a merge request's, whose code reaches no
# machine of the project's. Until 9 October 2026 they carried no tag and ran on
# GitLab's shared runners, whose compute minutes then ran out.
#
# The analyzer images are pinned by digest, as the other scans' images in
# .gitlab-ci.yml are, rather than taken by the moving major tag the templates
# name: registry.gitlab.com's security-products/semgrep:6 as it was on 5 October 2026,
# and security-products/secrets:7 as it was on 9 October. GitLab's registry does not
# keep serving a digest these tags have moved on from: the ones taken on 26 September
# 2026 answered "manifest unknown" on 5 October, and v6.3.6's first tag pipeline could
# not start semgrep-sast, whose report the release job needs; the secrets digest taken
# on 5 October answered the same by 7 October, and secret_detection failed in master's
# pipelines of 7 and 9 October before it ran. The new semgrep digest is the same
# analyzer, 6.26.1 with Semgrep 1.174.0, rebuilt; the new secrets one the same 7.40.0,
# rebuilt on 9 October: in its linux/amd64 image the analyzer, gitleaks 8.30.1 and
# GitLab's rules 0.25.1 are byte for byte the ones before, Alpine's zlib 1.3.2-r1 where
# it had r0, and over master's whole history the two found the same findings.
# So neither image is GitLab's registry's, but a copy of that digest in the project's
# own registry, digest preserved (build/ci/mirror-semgrep.sh and
# build/ci/mirror-secrets.sh, which say why the analyzers' licences allow it):
# registry.gitlab.com/hmailserver/hmailserver/mirror/semgrep and mirror/secrets, each
# tagged with the analyzer's version and the digest's first twelve hex digits, named
# here by the same digest GitLab's own index has, so the bytes are GitLab's. GitLab
# rebuilding an analyzer no longer stops a gate - semgrep-sast holds every change
# through semgrep-sast-gate, and secret_detection fails master's pipeline and a merge
# request's on a finding - nor the landing's secret scan, which takes secret_detection's
# image (build/scan-secrets.py). Renovate does not look up the project's own registry
# (renovate.json), so a new digest of either is taken by hand: the script with the
# tag, and the line it prints here, before a release tag. A new major version of
# either is a change to the tag here.
# The registry also has a semgrep:7 (7.0.0, 13 May 2026), which Renovate offers as
# the next major version. It is not one: GitLab released it for GitLab 19.0 and
# withdrew it the next day (the analyzer's merge requests !723 and !724), has no v7
# tag in the analyzer's repository, and kept releasing 6, which its own template still
# names; 7.0.0 carries Semgrep 1.145.0 and rules 2.9.1, where 6.26.1 carries 1.174.0
# and 2.10.1. Over batch42 (ae37d209d), run as this job runs on linix on 1 October
# 2026, the two found the same 316 findings, rule, file and line alike.
#
# Security/SAST.gitlab-ci.yml and Security/Secret-Detection.gitlab-ci.yml, the names
# GitLab's older documentation gives, are one-line files that include these two.

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

.gitlab-security-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# What GitLab may fail a gate's job for that is no answer of the job's own: a runner or
# the scheduler that failed, a registry or the network that could not be reached, a job
# left pending while runners were free, or one that stopped reporting. Each is tried
# twice more. Not runner_configuration_error, which a digest the registry no longer
# serves gives, and a retry cannot mend. The reasons GitLab 19 split
# stuck_or_timeout_failure into are named rather than that one, which GitLab.com warns
# of since 19.1. semgrep-sast-gate and mr-dependency-check (.gitlab/ci/mr-checks.yml)
# take the same, and their script's exit 2 too.
.gate-retry:
  retry:
    max: 2
    when:
      - runner_system_failure
      - runner_external_dependency_failure
      - runner_interrupted
      - scheduler_failure
      - api_failure
      - stuck_pending_with_matching_runners
      - no_updates_running

semgrep-sast:
  image:
    name: registry.gitlab.com/hmailserver/hmailserver/mirror/semgrep:6.26.1-b98bc4dd3949@sha256:b98bc4dd3949f8d7e2dbe6d45fbb2b016145245c98f3a5c238666b7f27cb6321
  needs: []
  timeout: 30 minutes
  retry: !reference [.gate-retry, retry]
  # Not allow_failure, as the template makes it: a scan that fails, or an image that
  # cannot be pulled, fails the pipeline, and semgrep-sast-gate, which needs it, does not
  # run on a report the job did not write.
  allow_failure: false
  variables:
    # What build/ci/semgrepignore leaves out of the semgrep job: the tests and their
    # fixtures, the vendored third-party sources and the scans' own output. And the
    # three tables of string literals the generators write for the binary (build/
    # generate-portal-page.py, generate-help-pages.py and generate-portal-languages.py),
    # which hold no code: the webmail's scripts they carry are read as files of their
    # own, and the rest is Markdown and translations. Each entry is held to the root - a
    # leading slash, or one before its last character - since one with no slash leaves
    # out a directory of that name at any depth, in Semgrep's --exclude and in GitLab's
    # filter of the report alike: "tests" would leave out a/b/tests/c.cpp. The Debian
    # package's autopkgtests are named where they are. GitLab's analyzer leaves out
    # build/, dist/, vendor/ and node_modules/ at any depth besides, by its own template
    # (SECURITY.md, "What no gate reads").
    SAST_EXCLUDED_PATHS: "/spec, /test, /tests, /tmp, hmailserver/test, hmailserver/source/Tools/ControlPanel.Tests, hmailserver/source/Tools/ImportTool.Tests, hmailserver/source/Tools/DBSetup.Tests, hmailserver/source/Server/platform/packaging/debian-src/debian/tests, build/deck-script-test.js, build/portal-script-test.js, /libraries, hmailserver/source/Server/quickjs, hmailserver/source/Server/zlib, /security, hmailserver/source/Server/Common/Util/PortalPageData.cpp, hmailserver/source/Server/Common/Util/HelpPagesData.cpp, hmailserver/source/Server/Common/Util/PortalLanguagesData.cpp"
    # The analyzer passes this list to Semgrep as --exclude too; set here, so that no CI
    # file's value for every job reaches the scan.
    SAST_SEMGREP_EXCLUDED_PATHS: ""
    # No file too large to read, and two minutes for a rule on a file. Semgrep leaves
    # out every file over 1,000,000 bytes, saying so only as a count in its log, and
    # the checkout's CRLF puts the REST server's RestApiServer.cpp over it (1,009,471
    # bytes in batch41): from batch41 on, no report of this job had read it. 0 turns
    # the limit off. And with the analyzer's own limit a rule gave up on the webmail's
    # Portal.js (800 KB) three times, after which Semgrep skips the whole file: no
    # report had read that either (.gitlab/security-exceptions.yml, the two entries for
    # it). Measured on linix on 27 September 2026 over batch41, pinned to two CPUs as a
    # shared runner had: the job took 84 s and read neither; with these two options it
    # took 332 s, no rule gave up, and it read both. The analyzer passes on only
    # --max-memory, --max-target-bytes and --timeout, and skips any other with a
    # warning.
    SAST_SCANNER_ALLOWED_CLI_OPTS: "--max-target-bytes=0 --timeout=120"
  # No SAST_DISABLED rule (the header says why).
  rules:
    - !reference [.gitlab-security-rules, rules]
    # And for a protected batch* branch, whose own pipeline is the one GitLab holds its
    # merge request to: semgrep-sast-gate reads the report there, against master.
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ /^batch/ && $CI_COMMIT_REF_PROTECTED == "true"
    # And for a release tag, whose release job reads the report before anything is
    # signed (build/ci/security-gate.py): no pipeline on master need have scanned the
    # tagged commit, since a landing's may be cancelled and a push with ci.skip runs none.
    - if: $CI_COMMIT_TAG =~ /^v/ && $CI_COMMIT_REF_PROTECTED == "true"
  # The analyzer writes its report and Semgrep's SARIF into the checkout; neither may come
  # from a commit (the gate refuses one that carries them, build/ci/security-gate.py),
  # and any left there goes before the analyzer runs, so that what the job keeps is what
  # it wrote.
  script:
    - rm -f gl-sast-report.json semgrep.sarif
    - /analyzer run
  # The report as a plain file too: a later job's needs bring a job's artifacts:paths,
  # not its reports, and the release job reads it. Whatever the scan found. And Semgrep's
  # SARIF, whose notifications say which files a rule gave up on, which
  # semgrep-sast-gate reads.
  artifacts:
    when: always
    paths:
      - gl-sast-report.json
      - semgrep.sarif

secret_detection:
  # GitLab's analyzer as the project's registry holds it (the header says why), on one
  # line: build/scan-secrets.py reads its gitleaks from this line.
  image: registry.gitlab.com/hmailserver/hmailserver/mirror/secrets:7.40.0-1f54871d97a7@sha256:1f54871d97a7d1ab311495408eb12e5217ef0633db115a27ca51f381f2fbe641
  needs: []
  # The whole history took under a minute on linix (2,214 commits, 720 MB of diffs);
  # the runner's fetch of it is the rest.
  timeout: 30 minutes
  # A finding fails the pipeline (above); the template's allow_failure: true would
  # show it as a warning.
  allow_failure: false
  rules:
    - if: $SECRET_DETECTION_DISABLED == 'true' || $SECRET_DETECTION_DISABLED == '1'
      when: never
    # The one-time scan of the whole history: the schedule on master described "security".
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "security" && $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        SECRET_DETECTION_HISTORIC_SCAN: "true"
    - !reference [.gitlab-security-rules, rules]
  script:
    - /analyzer run
    # The analyzer exits 0 whatever it found: the report says. Its JSON is written on
    # one line, and an empty "vulnerabilities" list is a clean scan.
    - |
      report=gl-secret-detection-report.json
      if [ ! -s "$report" ]; then
        echo "The analyzer wrote no $report: nothing was scanned."
        exit 1
      fi
      if grep -Eq '"vulnerabilities" *: *\[ *\]' "$report"; then
        echo "Secret detection found nothing that .gitleaksignore does not name."
        exit 0
      fi
      found=$(grep -o '"category" *: *"secret_detection"' "$report" | wc -l)
      echo "Secret detection found $found possible secret(s); the report is this job's artifact, for Developers and above. By file:"
      grep -o '"file" *: *"[^"]*"' "$report" | sed 's/^"file" *: *//' | sort | uniq -c
      echo "Revoke a real secret where it was issued (SECURITY.md); name one that is not a secret in .gitleaksignore, which says how."
      exit 1
