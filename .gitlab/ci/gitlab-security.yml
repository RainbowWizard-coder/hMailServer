# GitLab's own security scanners, from the templates GitLab publishes, on GitLab's
# shared runners: included from .gitlab-ci.yml.
#
# What they add to the scans .gitlab-ci.yml already runs (static-analysis, semgrep,
# dependency-scan and repo-hygiene, on linix, for a protected ref only):
#
#   semgrep-sast      GitLab's Semgrep analyzer with GitLab's own rules. It reads the
#                     C and C++ of the server as well as the C#, Python and JavaScript
#                     (GitLab 18.6 and later), where the semgrep job leaves the C++ to
#                     cppcheck and clang-tidy and uses Semgrep's registry packs; and it
#                     runs on a merge request, which no job on linix ever does.
#   secret_detection  GitLab's secrets analyzer over the commits a pipeline brings: a
#                     key, token or password committed by mistake. Nothing on linix
#                     looks for one.
#
# Not included, and why:
#
#   Dependency-Scanning   its jobs run only where GITLAB_FEATURES names
#                         dependency_scanning, which is GitLab Ultimate; on the Free tier
#                         the template creates no job. dependency-scan (Trivy and OSV,
#                         on linix) covers the lock files and the CI image.
#   Container-Scanning    not here: it scans an image in a registry, and the only one
#                         this project pushes is a release's, so it is included with
#                         the jobs that push that image, for a v* tag
#                         (.gitlab/ci/container-image.yml).
#   GitLab Advanced SAST  Ultimate only: its jobs never start on the Free tier.
#
# On the Free tier each job leaves its report as an artifact that project members
# with the Developer role or above can download (artifacts:access in the templates);
# the merge request widget, the pipeline's Security tab and the vulnerability report
# are GitLab Ultimate. semgrep-sast is allow_failure, as the template makes it: a
# finding does not fail a pipeline. It holds a release instead: for a v* tag the
# release job needs semgrep-sast's report and refuses while it has a finding of
# severity Critical or High that .gitlab/security-exceptions.yml does not accept, or
# is missing (build/ci/security-gate.py; SECURITY.md, "Before a release"). secret_detection is not: a secret found fails the
# job and the pipeline. The template's job cannot do that by itself - the analyzer
# exits 0 whatever it finds, and the template adds allow_failure: true, which would
# hide the failure anyway - so the job below runs the analyzer and then reads its
# report. What was read and is not a secret (test keys, the armour lines the key
# parsers are tested with, AWS's documented example key) is named in .gitleaksignore
# at the root, which gitleaks reads from the checkout.
#
# When they run: in a merge request's pipeline and in a pipeline for the default
# branch, and semgrep-sast for a protected v* tag too, whose release job reads its
# report (master is pushed with ci.skip, so master's pipeline may never have scanned
# the tagged commit). Never in the fuzz schedule's, Renovate's or the update feed's
# pipeline, which each run their one job (.not-a-fuzz-pipeline in .gitlab-ci.yml);
# secret_detection not for a tag, whose commits the pushes to master and the landing's
# own scan (build/scan-secrets.py) have read.
# And secret_detection alone in the pipeline of a schedule on master whose description
# is "security": there it scans the whole history (SECRET_DETECTION_HISTORIC_SCAN),
# not only the commits a push brings. That is the one-time scan of the history
# imported from GitHub: the owner makes the schedule, runs it once from its Run
# button, and deactivates it until the next time (docs/ContinuousIntegration.md,
# "Security scanning"). A schedule and not a variable, because the project refuses pipeline
# variables and a schedule's; a schedule and not a manual job, because a manual job
# would sit in every pipeline on master, where pushes land with ci.skip, and would
# need a pipeline to be started in anyway.
#
# Where they run: GitLab's shared runners, never linix or bench150. Those two are
# registered with run_untagged off and take only a job tagged for them, and these
# jobs carry no tag.
#
# The analyzer images are pinned by digest, as the other scans' images in
# .gitlab-ci.yml are, rather than taken by the moving major tag the templates
# name: registry.gitlab.com's security-products/semgrep:6 and
# security-products/secrets:7 as they were on 26 September 2026. Renovate's gitlabci manager reads this file through the include
# and proposes a new digest; a new major version is a change to the tag here.
#
# Security/SAST.gitlab-ci.yml and Security/Secret-Detection.gitlab-ci.yml, the names
# GitLab's older documentation gives, are one-line files that include these two.

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

.gitlab-security-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

semgrep-sast:
  image:
    name: registry.gitlab.com/security-products/semgrep:6@sha256:84b751f34142359eedc8c1a785f869862c94910109725cb0003cac8a70d14407
  needs: []
  timeout: 30 minutes
  variables:
    # What build/ci/semgrepignore leaves out of the semgrep job: the tests and their
    # fixtures, the vendored third-party sources and the scans' own output.
    SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, hmailserver/test, hmailserver/source/Tools/ControlPanel.Tests, hmailserver/source/Tools/ImportTool.Tests, build/deck-script-test.js, build/portal-script-test.js, libraries, hmailserver/source/Server/quickjs, hmailserver/source/Server/zlib, security"
  rules:
    - if: $SAST_DISABLED == 'true' || $SAST_DISABLED == '1'
      when: never
    - !reference [.gitlab-security-rules, rules]
    # And for a release tag, whose release job reads the report before anything is
    # signed (build/ci/security-gate.py): master's pipelines are pushed with ci.skip,
    # so no pipeline on master may have scanned the tagged commit.
    - if: $CI_COMMIT_TAG =~ /^v/ && $CI_COMMIT_REF_PROTECTED == "true"
  # The report as a plain file too: a later job's needs bring a job's artifacts:paths,
  # not its reports, and the release job reads it. Whatever the scan found.
  artifacts:
    when: always
    paths:
      - gl-sast-report.json

secret_detection:
  image: registry.gitlab.com/security-products/secrets:7@sha256:77ac5c87f73b709cad2e4bfb2b255caba7e63fb3c832314b3fb88aaa3c129af7
  needs: []
  # The whole history took under a minute on linix (2,214 commits, 720 MB of diffs);
  # a shared runner's fetch of it is the rest.
  timeout: 30 minutes
  # A finding fails the pipeline (above); the template's allow_failure: true would
  # show it as a warning.
  allow_failure: false
  rules:
    - if: $SECRET_DETECTION_DISABLED == 'true' || $SECRET_DETECTION_DISABLED == '1'
      when: never
    # The one-time scan of the whole history: the schedule on master described "security".
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "security" && $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        SECRET_DETECTION_HISTORIC_SCAN: "true"
    - !reference [.gitlab-security-rules, rules]
  script:
    - /analyzer run
    # The analyzer exits 0 whatever it found: the report says. Its JSON is written on
    # one line, and an empty "vulnerabilities" list is a clean scan.
    - |
      report=gl-secret-detection-report.json
      if [ ! -s "$report" ]; then
        echo "The analyzer wrote no $report: nothing was scanned."
        exit 1
      fi
      if grep -Eq '"vulnerabilities" *: *\[ *\]' "$report"; then
        echo "Secret detection found nothing that .gitleaksignore does not name."
        exit 0
      fi
      found=$(grep -o '"category" *: *"secret_detection"' "$report" | wc -l)
      echo "Secret detection found $found possible secret(s); the report is this job's artifact, for Developers and above. By file:"
      grep -o '"file" *: *"[^"]*"' "$report" | sed 's/^"file" *: *//' | sort | uniq -c
      echo "Revoke a real secret where it was issued (SECURITY.md); name one that is not a secret in .gitleaksignore, which says how."
      exit 1
