# The two change gates: what every change must pass before it lands, beyond the checks
# every pipeline runs. Included from .gitlab-ci.yml (docs/ContinuousIntegration.md,
# "Merge request checks").
#
#   semgrep-sast-gate     GitLab's semgrep-sast (.gitlab/ci/gitlab-security.yml) finds;
#                         this holds the change on a Critical or High finding in a file
#                         it changes that .gitlab/security-exceptions.yml, as the
#                         change's base has it, does not accept - the release's rule, on
#                         the change (build/ci/security-gate.py --merge-request auto;
#                         OpenSSF Baseline OSPS-VM-06.02). semgrep-sast itself stays
#                         allow_failure, as GitLab's template makes it: a scan that did
#                         not finish leaves no report, which holds the change here.
#   mr-dependency-check   every NuGet and PyPI version the change adds, looked up in
#                         OSV's own export of its ecosystem's advisories, and every
#                         native or vendored library version it pins, asked of OSV by
#                         its upstream tag; held on a Critical or High advisory that
#                         neither the base's exceptions nor the base's VEX document
#                         (.gitlab/hmailserver.openvex.json) accepts
#                         (build/ci/mr-dependency-check.py --base auto; OpenSSF
#                         Baseline OSPS-VM-05.03).
#
# And, with no job here: the checkers job of .gitlab-ci.yml runs every build/check-*.py
# in a merge request's pipeline too, build/check-binary-manifest.py among them, which
# fails on a committed binary that hmailserver/docs/third-party-binaries.json does not
# list at its SHA-256 (Roadmap3, "Every committed binary checked in CI").
#
# When they run: on every change, in the pipeline GitLab holds its merge request to.
# That is a merge request's own pipeline - from a fork, from Renovate or from any
# unprotected branch of the project - or, for a maintainer's protected batch* branch,
# whose merge request runs no pipeline of its own (the workflow rules of
# .gitlab-ci.yml), the branch's pipeline: not a schedule's and not a downstream one's,
# which run their one job. Neither is allow_failure, and neither has a rules:changes
# list: mr-dependency-check reads every change and returns at once when it adds no
# version and moves no pin, so no kind of file can slip past a list of triggers.
# No variable switches either off: GitLab's template skips semgrep-sast when
# SAST_DISABLED is set, and the rules of none of the three read it.
#
# The base: build/ci/security-gate.py's change_base, which both take as "auto". In a
# merge request's pipeline it is CI_MERGE_REQUEST_DIFF_BASE_SHA, the target branch
# where the merge request left it; in a batch* branch's pipeline, master fetched by
# name (git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master) and
# git merge-base HEAD with it. The exceptions file and the VEX document are read as
# that base has them, never as the change does, so no change accepts its own finding.
#
# What happens when an input cannot be read: each script exits 2 - the base not found,
# master not fetched, OSV's export or api.osv.dev not answering, a lock file or a pin
# it cannot read - and the job is tried again, twice (retry: exit_codes [2], GitLab
# 17.5 and later). A hold is exit 1, which is not retried; nor is a self-test that
# fails. apt-get's exit 100, when Debian's mirrors cannot be reached for git, is
# retried too, and so is a failure of GitLab's own (.gate-retry,
# .gitlab/ci/gitlab-security.yml).
#
# Where they run: GitLab's shared runners, in Docker Hub's python:3.14-slim-trixie
# pinned by digest, the image the checkers job runs in. They carry no tag, so neither
# of the project's own runners takes them, and they need no secret: they read the
# checkout, semgrep-sast's report, master from the project itself, and for the
# dependency check OSV's export on Google Cloud Storage and api.osv.dev. A protected
# branch's pipeline still hands the project's protected variables to every job in it,
# these two among them. Each keeps GitHub out of the job itself (.no-github,
# .gitlab/ci/no-github.yml), since a shared runner's configuration is GitLab's.
#
# Why the history (GIT_DEPTH 0): both compare the change's head with its base, and
# change_base refuses a shallow clone, where a boundary could hide where the branch
# leaves master - the sign-off job clones the same way for the same reason.

.mr-check:
  image: python:3.14-slim-trixie@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
  timeout: 20 minutes
  variables:
    GIT_DEPTH: "0"
  retry:
    max: 2
    when: !reference [.gate-retry, retry, when]
    exit_codes:
      - 2
      - 100
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "pipeline" && $CI_COMMIT_BRANCH =~ /^batch/ && $CI_COMMIT_REF_PROTECTED == "true"
  before_script:
    - !reference [.no-github, before_script]
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git > /dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

# In the test stage, which is semgrep-sast's (the SAST template's): a job cannot need
# one of a later stage. Its rules are .mr-check's, which make it in exactly the
# pipelines semgrep-sast's rules make that job in: a needs of a job a pipeline does not
# have would keep the pipeline from being created.
semgrep-sast-gate:
  extends: .mr-check
  stage: test
  needs:
    - job: semgrep-sast
      artifacts: true
  script:
    - python3 build/ci/security-gate.py --self-test
    - python3 build/ci/security-gate.py --merge-request auto

mr-dependency-check:
  extends: .mr-check
  stage: check
  needs: []
  script:
    - python3 build/ci/mr-dependency-check.py --self-test
    - python3 build/ci/mr-dependency-check.py --base auto
