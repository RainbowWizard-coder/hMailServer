  variables: {HM_DEB_DISTRO: debian13, HM_DEB_ARCH: amd64}

deb-debian13-arm64-install:
  extends: [.deb-install-arm64, .deb-image-debian13-arm64]
  needs: [deb-debian13-arm64]
  variables: {HM_DEB_DISTRO: debian13, HM_DEB_ARCH: arm64}

# ------------------------------------------------------------------ Ubuntu 24.04 (noble)
deb-ubuntu24.04-amd64:
  extends: [.deb-build, .deb-image-ubuntu24.04-amd64]
  variables: {HM_DEB_DISTRO: ubuntu24.04, HM_DEB_ARCH: amd64}

deb-ubuntu24.04-arm64:
  extends: [.deb-build, .deb-image-ubuntu24.04-amd64]
  variables: {HM_DEB_DISTRO: ubuntu24.04, HM_DEB_ARCH: arm64}

deb-ubuntu24.04-amd64-install:
  extends: [.deb-install, .deb-image-ubuntu24.04-amd64]
  needs: [deb-ubuntu24.04-amd64]
  variables: {HM_DEB_DISTRO: ubuntu24.04, HM_DEB_ARCH: amd64}

deb-ubuntu24.04-arm64-install:
  extends: [.deb-install-arm64, .deb-image-ubuntu24.04-arm64]
  needs: [deb-ubuntu24.04-arm64]
  variables: {HM_DEB_DISTRO: ubuntu24.04, HM_DEB_ARCH: arm64}

# ------------------------------------------------------------------ Ubuntu 26.04: the generic arm64 name
# hmailserver_<v>_arm64.deb, the name installed arm64 servers' update checker
# asks for. There is no amd64 job here: hmailserver_<v>_amd64.deb is linux-build's
# (clang, in the CI image, which is this same Ubuntu 26.04): the file the release
# collects with linux-build's SHA256SUMS.txt (release-chain.py, sources()), and the
# one linux-package-deb installs and starts. A second job making that name would
# leave the release two files to choose from (docs/PackagesDeb.md, "The names").
# The amd64 image is still the one the arm64 package is cross-compiled in.
deb-ubuntu26.04-arm64:
  extends: [.deb-build, .deb-image-ubuntu26.04-amd64]
  variables: {HM_DEB_DISTRO: ubuntu26.04, HM_DEB_ARCH: arm64}

deb-ubuntu26.04-arm64-install:
  extends: [.deb-install-arm64, .deb-image-ubuntu26.04-arm64]
  needs: [deb-ubuntu26.04-arm64]
  variables: {HM_DEB_DISTRO: ubuntu26.04, HM_DEB_ARCH: arm64}

# The release carries hmailserver_<v>_arm64.deb, from 6.3.6, and every compiled
# file it carries goes out with its own SBOM beside it (SECURITY.md, "Software
# bills of materials"). The build's container has neither PowerShell nor Python,
# so the build records what it was built against (built-against/) and this job
# makes hmailserver_<v>_arm64.deb.cdx.json from that in the CI image, as
# linux-build makes the amd64 package's (build/ci/packages/package-sbom.sh). The
# release job needs the build, this job and the install job, and collects the
# package, its sums and this SBOM (build/ci/release-chain.py, sources()). Its
# rules are the install jobs': it follows its build.
deb-ubuntu26.04-arm64-sbom:
  extends: .linix
  stage: test
  needs:
    - job: deb-ubuntu26.04-arm64
      artifacts: true
  timeout: 10 minutes
  rules:
    - !reference [.deb-install-rules, rules]
  script:
    - bash build/ci/packages/package-sbom.sh packages-deb/ubuntu26.04-arm64/hmailserver_*_arm64.deb packages-deb/ubuntu26.04-arm64/built-against
  artifacts:
    expire_in: 14 days
    paths:
      - packages-deb/ubuntu26.04-arm64/*.cdx.json
