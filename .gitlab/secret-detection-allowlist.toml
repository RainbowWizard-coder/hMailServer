# The global allowlist both secret scans read in place of GitLab's own: the secret_detection
# job (.gitlab/ci/gitlab-security.yml) and build/scan-secrets.py, the git hooks' and the
# landing's scan, each take GitLab's rules from the analyzer's image (/gitleaks.toml) up to
# their [[allowlists]] table, and this table after them (build/ci/secret-detection-rules.sh).
# It is GitLab's table but for two entries, which left out every path under a directory
# named build, bin, obj, target or packages: neither scan read this tree's build/ (the CI
# scripts, the git hooks, the lab, the fixtures and their builders) or snap/local/bin/ until
# 10 October 2026 - 368 files then. node_modules and bower_components, which shared an entry
# with packages, stay out, as GitLab has them (docs/ContinuousIntegration.md, "What the
# secret scans read").
#
# GitLab's table this replaces - from its [[allowlists]] line to the end of /gitleaks.toml,
# secret-detection-rules 0.25.1 in the analyzer 7.40.0 - hashes to the value on the line
# below, and both scans refuse to run when the image's does not: a new rules version that
# changes what GitLab leaves out is read, and this table and the line brought up to date,
# before either scan takes it. Only the line's form is read: "replaces sha256:" and the hash.
#
# replaces sha256:1005c12cb351a097bb87027a653a6a7052a2dfd0dda8cf6ee4e7b06ae92648e6
#
# A change here changes what neither scan reads: it is the owner's, as .gitleaksignore is
# (.gitlab/CODEOWNERS), and the landing's scan prints the lines a batch changes here.
#
# The paths are GitLab's (gitlab-org/security-products/secret-detection/
# secret-detection-rules), under its MIT Expat licence:
#
#   Copyright (c) 2011-present GitLab B.V.
#
#   Permission is hereby granted, free of charge, to any person obtaining a copy
#   of this software and associated documentation files (the "Software"), to deal
#   in the Software without restriction, including without limitation the rights
#   to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
#   copies of the Software, and to permit persons to whom the Software is
#   furnished to do so, subject to the following conditions:
#
#   The above copyright notice and this permission notice shall be included in all
#   copies or substantial portions of the Software.
#
#   THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
#   IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
#   FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
#   AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
#   LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
#   OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
#   SOFTWARE.

[[allowlists]]
description = "global allow lists: GitLab's, but for the build, bin, obj, target and packages directories"
paths = [
    # Configuration Files
    '''gitleaks\.toml|verification-metadata\.xml|Database\.refactorlog|\.editorconfig|\.gitattributes''',

    # Media Files (more specific patterns)
    '''(?i)\.(?:bmp|gif|svg|jpe?g|png|tiff?|webp|ico|heic|eot|[ot]tf|woff2?|docx?|xlsx?|pptx?|pdf|exe|gltf|mp[34]|wav|flac|aac|ogg|avi|mp4|mkv|mov|wmv|flv|webm|zip|rar|7z|tar|gz|bz2|xz|dmg|iso)$''',

    # Visual Studio specific files (more precise)
    '''\.(?:socket|vsidx|suo|wsuo|dll|pdb)$''',

    # Lock Files
    '''(?:^|/)(?:deno\.lock|npm-shrinkwrap\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|(?:Pipfile|poetry)\.lock|gradle\.lockfile|Cargo\.lock|composer\.lock)$''',

    # Go Language Dependencies (more specific)
    '''go\.(?:mod|sum|work(?:\.sum)?)$|(?:^|/)vendor/(?:modules\.txt|(?:github\.com|golang\.org|google\.golang\.org|gopkg\.in|istio\.io|k8s\.io|sigs\.k8s\.io)(?:/.+)?)$''',

    # Ruby gems (more specific than just .gem)
    '''(?:^|/)\.bundle/|(?:^|/)gems/.*\.gem$|(?:^|/)specifications/.*\.gemspec$''',

    # Build Tool Wrappers
    '''(?:^|/)(?:gradlew(?:\.bat)?|mvnw(?:\.cmd)?|\.mvn/wrapper/MavenWrapperDownloader\.java)$''',

    # Package Manager and Build Tool Vendored Artifacts
    # These directories contain auto-generated/downloaded tool artifacts
    # (compiled binaries, wrapper JARs, cached distributions), not hand-authored
    # code, so secrets found here are virtually always false positives.
    '''(?:^|/)\.yarn(?:/.*)?$''',
    '''(?:^|/)\.gradle(?:/.*)?$''',
    '''(?:^|/)\.mvn(?:/.*)?$''',

    # Dependency Directories (more specific)
    '''(?:^|/)(?:node_modules|bower_components)(?:/.*)?$''',
    '''(?:^|/)vendor/(?:bundle|ruby|composer)(?:/.*)?$''',
    '''(?:^|/)__pycache__(?:/.*)?$|\.py[co]$''',
    '''(?:^|/)\.(?:pytest_cache|mypy_cache|tox)(?:/.*)?$''',

    # Python Virtual Environments (more specific)
    '''(?:^|/)(?:venv|virtualenv|\.venv|env)/(?:lib|lib64|include|bin|Scripts)(?:/.*)?$''',
    '''(?:^|/)(?:lib(?:64)?/python[23](?:\.\d\d?)+|python[23](?:\.\d\d?)+/(?:lib|Lib)(?:64)?)(?:/.*)?$''',
    '''(?:^|/)[a-zA-Z0-9_.-]+-[0-9.]+\.dist-info(?:/.*)?$''',

    # Generated and Compiled Assets (more specific)
    '''(?:^|/)(?:angular|bootstrap|jquery(?:-ui)?|plotly|swagger-ui)(?:-[0-9.]+)?(?:\.min)?\.js(?:\.map)?$''',
    '''\.(?:min\.(js|css)|bundle\.(js|css)|map)$''',
    '''\.(?:class|o|obj|jar|war|ear)$''',

    # Cache and Temporary Directories (more specific to avoid false positives)
    '''(?:^|/)\.(?:cache|coverage|pytest_cache|mypy_cache|tox)(?:/.*)?$''',
    '''(?:^|/)(?:htmlcov|coverage|_build|_site|docs/_build)(?:/.*)?$''',

    # Version Control and IDE Files
    '''(?:^|/)\.(?:git|svn|hg|bzr|vscode|idea|eclipse|vs)(?:/.*)?$''',
    '''(?:^|/)\.DS_Store$|(?:^|/)Thumbs\.db$'''
]
