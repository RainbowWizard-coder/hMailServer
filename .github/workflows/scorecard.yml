# OpenSSF Scorecard over the project's copy on GitHub, its second home since 18
# October 2026: the result goes to scorecard.dev, which the README's
# Scorecard badge shows, and to the repository's code scanning. It and codeql.yml,
# GitHub's CodeQL over the same copy, are the two workflows of the project's that
# GitHub Actions runs. It builds, tests, signs and publishes nothing of a release - GitLab's pipelines do that, and nowhere else -
# and nothing it makes reaches a build. The repository's Actions settings allow
# GitHub's own actions and ossf/scorecard-action alone, each pinned by a full
# commit, as every action below is, with its version beside it. GitLab runs
# Scorecard over the canonical project itself, weekly (.gitlab/ci/scorecard.yml);
# hmailserver/docs/ContinuousIntegration.md, "OpenSSF Scorecard", says why the two
# scores may differ.

name: OpenSSF Scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: "30 4 * * 1"
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # The SARIF upload to code scanning.
      security-events: write
      # Publishing the result to scorecard.dev, which takes it with GitHub's OIDC token.
      id-token: write
      actions: read
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the result as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload the result to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
