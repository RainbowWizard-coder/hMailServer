# GitHub's CodeQL over the project's copy on GitHub, as the repository's default
# setup ran it from 18 October 2026: the same four languages (C and C++, C#,
# JavaScript and TypeScript, Python), each with no build (build-mode none), the
# default query suite, the CodeQL bundle that github/codeql-action's release below
# brings, and the categories /language:<language>, so that the alerts the default
# setup raised carry over to this workflow's analyses. It runs on each push to
# master, on a pull request to master, weekly and by hand. It replaces the default
# setup because OpenSSF Scorecard's SAST check counts CodeQL from a workflow under
# .github/workflows that runs github/codeql-action/analyze, or from the check runs
# of merged pull requests, of which the copy has none, and never from the default
# setup, which has no workflow file; GitHub takes no analysis from a workflow while
# the default setup is on, so the default setup is switched off when this workflow
# reaches master. It builds, tests, signs and publishes nothing - it uploads its
# results to the repository's code scanning and nothing else, keeps no artifact,
# and nothing it makes reaches a release. GitLab's pipelines remain where the
# project is built, tested, signed and published, and where its own static analysis
# runs (hmailserver/docs/ContinuousIntegration.md). Every action below is pinned by
# a full commit, with its version beside it, as the repository's Actions settings
# require.

name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "41 3 * * 3"
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # The upload of the results to code scanning.
      security-events: write
      # The workflow run's details, which the upload reads.
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: none
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyse
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
