# Allstar's Repository Administrators policy: the repository has an administrator,
# and exactly one: the account it belongs to (GOVERNANCE.md, "Maintainers"). An
# account's repository has no teams, so no team may be an administrator. See
# allstar.yaml.

optConfig:
  optIn: true
action: log
ownerlessAllowed: false
userAdminsAllowed: true
maxNumberUserAdmins: 1
teamAdminsAllowed: false
