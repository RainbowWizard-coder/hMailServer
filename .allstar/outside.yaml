# Allstar's Outside Collaborators policy: no collaborator from outside holds push or
# administrator access. The copy has one collaborator, the account it belongs to,
# its only administrator (GOVERNANCE.md, "Maintainers"). See allstar.yaml.

optConfig:
  optIn: true
action: log
pushAllowed: false
adminAllowed: false
