# Allstar's Binary Artifacts policy: OpenSSF Scorecard's Binary-Artifacts check over
# the repository. No binary is tracked (Scorecard gives the copy 10, and
# build/ci/repo-hygiene.py's Binary-Artifacts check holds the tree to it), so no path
# is exempted (ignorePaths). See allstar.yaml.

optConfig:
  optIn: true
action: log
